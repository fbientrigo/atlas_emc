# Alma 9 (CERN) uses local repositories at the http://linuxsoft.cern.ch distribution service
# variables defined in /etc/dnf/vars

[baseos]
name=AlmaLinux $releasever - BaseOS
baseurl=http://linuxsoft.cern.ch/cern/alma/9/BaseOS/$basearch/os
gpgcheck=0
enabled=1

[appstream]
name=AlmaLinux $releasever - AppStream
baseurl=http://linuxsoft.cern.ch/cern/alma/9/AppStream/$basearch/os
gpgcheck=0
enabled=1

[cern]
name=AlmaLinux $releasever - CERN
baseurl=http://linuxsoft.cern.ch/cern/alma/9/CERN/$basearch
gpgcheck=0
enabled=1
priority=5

[extras]
name=AlmaLinux $releasever - Extras
baseurl=http://linuxsoft.cern.ch/cern/alma/9/extras/$basearch/os
gpgcheck=0
enabled=1

[ha]
name=AlmaLinux $releasever - HighAvailability
baseurl=http://linuxsoft.cern.ch/cern/alma/9/HighAvailability/$basearch/os
gpgcheck=0
enabled=0

[rt]
name=AlmaLinux $releasever - RealTime
baseurl=http://linuxsoft.cern.ch/cern/alma/9/RT/$basearch/os
gpgcheck=0
enabled=0

[resilientstorage]
name=AlmaLinux $releasever - ResilientStorage
baseurl=http://linuxsoft.cern.ch/cern/alma/9/ResilientStorage/$basearch/os
gpgcheck=0
enabled=0


###

[epel]
name=Extra Packages for Enterprise Linux $releasever - $basearch
baseurl=http://linuxsoft.cern.ch/epel/9/Everything/$basearch
enabled=1
gpgcheck=0

[locmap-qa]
name=locmap [qa]
baseurl=http://linuxsoft.cern.ch/internal/repos/potd9-qa/$basearch/os
enabled=0
gpgcheck=0

[locmap]
name=locmap [stable]
baseurl=http://linuxsoft.cern.ch/internal/repos/potd9-stable/$basearch/os
enabled=1
gpgcheck=0

[openafs]
name=openafs-$releasever
baseurl=http://linuxsoft.cern.ch/cern/alma/9/openafs/$basearch
gpgcheck=0
enabled=1

