name: Publicar guía EMP / lpGBT

on:
  push:
    branches: [main]
    paths:
      - 'docs/recuperacion/**'
      - '.github/workflows/guia-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/recuperacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/recuperacion/package-lock.json
      - name: Dependencias fijadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Construir cuaderno y Mermaid local
        run: npm run build
      - name: Comprobar enlaces y diagramas
        run: npm test
      - name: Comprobar recolector sin hardware
        run: python3 -m unittest discover -s diagnostico -p 'test_*.py'
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto de sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/recuperacion/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
