name: Publicar guía EMP / lpGBT
on:
  push:
    branches: [docs/clean]
    paths:
      - docs/recuperacion/**
      - .github/workflows/guia-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guia-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/recuperacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/recuperacion/package-lock.json
      - name: Dependencias fijadas
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Construir cuaderno y Mermaid local
        run: npm run build
      - name: Comprobar enlaces y diagramas
        run: npm test
      - name: Comprobar recolector sin hardware
        run: python3 -m unittest discover -s diagnostico -p 'test_*.py'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/recuperacion/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
