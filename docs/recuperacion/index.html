 sus rutas, rangos y SHA-256 en \u003ccode>evidencias.json\u003c/code>. También se revisaron \u003ccode>ic_top.vhd\u003c/code>, \u003ccode>ic_rx.vhd\u003c/code>, \u003ccode>ic_rx_fifo.vhd\u003c/code> y el package del controlador IC en el mismo baseline c02a33b. Los hashes son de los archivos locales revisados y los enlaces apuntan a ese commit. Que el sistema volviera a funcionar al reiniciar lo contó el usuario el 24-10-2026; es un testimonio, no una prueba actual.\u003c/p>\n\u003cp>La documentación de Linux UIO, /proc y GNU timeout solo respalda conceptos del sistema operativo, no el firmware. Los enlaces están en el documento 10. No se revisó hardware real ni se compiló o simuló el diseño completo.\u003c/p>\n"}]},{"id":"09_USO_LOCAL","file":"09_USO_LOCAL.md","title":"Usar la web sin conexión","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Usar la web sin conexión\n\nLa web se publica con `.github/workflows/guia-pages.yml` desde `main` y está en [GitHub Pages](https://fbientrigo.github.io/atlas_emc/). Si dudas de si un cambio ya salió, mira el resultado en Actions.\n\nPara usarla sin red, copia la carpeta `_site` entera: `index.html`, `assets/mermaid.js`, `diagnostico/` y `emp-capture.tar.gz`. Abre `index.html` en el navegador. Todo funciona sin servicios externos, salvo los enlaces a GitHub. Si copias solo el HTML, verás textos y herramientas pero no los diagramas, porque necesitan `assets/mermaid.js`.\n\n","html":"\u003ch1 id=\"usar-la-web-sin-conexión\">Usar la web sin conexión\u003c/h1>\n\u003cp>La web se publica con \u003ccode>.github/workflows/guia-pages.yml\u003c/code> desde \u003ccode>main\u003c/code> y está en \u003ca href=\"https://fbientrigo.github.io/atlas_emc/\">GitHub Pages\u003c/a>. Si dudas de si un cambio ya salió, mira el resultado en Actions.\u003c/p>\n\u003cp>Para usarla sin red, copia la carpeta \u003ccode>_site\u003c/code> entera: \u003ccode>index.html\u003c/code>, \u003ccode>assets/mermaid.js\u003c/code>, \u003ccode>diagnostico/\u003c/code> y \u003ccode>emp-capture.tar.gz\u003c/code>. Abre \u003ccode>index.html\u003c/code> en el navegador. Todo funciona sin servicios externos, salvo los enlaces a GitHub. Si copias solo el HTML, verás textos y herramientas pero no los diagramas, porque necesitan \u003ccode>assets/mermaid.js\u003c/code>.\u003c/p>\n"},{"title":"Las cuatro secciones","anchor":"las-cuatro-secciones","text":"## Las cuatro secciones\n\n| Sección | Para qué |\n|---|---|\n| OPERAR | Leer, guardar el CSV, mapa UIO y herramientas. |\n| ENTENDER | Guía resumida con diagramas. El mapa de once componentes se abre desde la búsqueda o desde las relaciones. |\n| INVESTIGAR | Diagnóstico del bloqueo, procedimientos F0/F1 y comparación de capturas. |\n| APRENDER | Seis temas, las pruebas anteriores y los contraejemplos. |\n\nLa búsqueda acepta tareas, funciones, registros y señales. La tecla `/` lleva al buscador. Cada resultado abre una sección o un extracto con líneas numeradas. En los documentos puedes abrir y cerrar secciones, descargar el Markdown e imprimir. Copiar un bloque de código no lo ejecuta.\n\n","html":"\u003ch2 id=\"las-cuatro-secciones\">Las cuatro secciones\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Sección\u003c/th>\n\u003cth>Para qué\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>OPERAR\u003c/td>\n\u003ctd>Leer, guardar el CSV, mapa UIO y herramientas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ENTENDER\u003c/td>\n\u003ctd>Guía resumida con diagramas. El mapa de once componentes se abre desde la búsqueda o desde las relaciones.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>INVESTIGAR\u003c/td>\n\u003ctd>Diagnóstico del bloqueo, procedimientos F0/F1 y comparación de capturas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>APRENDER\u003c/td>\n\u003ctd>Seis temas, las pruebas anteriores y los contraejemplos.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>La búsqueda acepta tareas, funciones, registros y señales. La tecla \u003ccode>/\u003c/code> lleva al buscador. Cada resultado abre una sección o un extracto con líneas numeradas. En los documentos puedes abrir y cerrar secciones, descargar el Markdown e imprimir. Copiar un bloque de código no lo ejecuta.\u003c/p>\n"},{"title":"Comparar capturas","anchor":"comparar-capturas","text":"## Comparar capturas\n\nPega una salida de `emp read` o `tgc_readuplink_cli` en cada lado. Se reconocen `magic`, `data_group_0` a `data_group_8`, `data_header` y `clk_thresh`, seguidos de espacio o dos puntos y un hexadecimal `0x` de hasta ocho dígitos. Las líneas de log se ignoran. Se rechazan etiquetas repetidas, grupos fuera de rango y valores inválidos. Si falta un registro aparece como ausente; nunca se rellena con cero.\n\nEl resultado muestra A, B, el XOR y qué bits cambiaron. Avisa si cambió magic o threshold y si la comparación es parcial. Solo compara valores: no dice si las muestras son nuevas, coherentes, íntegras o del FE. Los archivos se leen en el navegador, hasta 200 kB, y no se suben ni se guardan.\n\n","html":"\u003ch2 id=\"comparar-capturas\">Comparar capturas\u003c/h2>\n\u003cp>Pega una salida de \u003ccode>emp read\u003c/code> o \u003ccode>tgc_readuplink_cli\u003c/code> en cada lado. Se reconocen \u003ccode>magic\u003c/code>, \u003ccode>data_group_0\u003c/code> a \u003ccode>data_group_8\u003c/code>, \u003ccode>data_header\u003c/code> y \u003ccode>clk_thresh\u003c/code>, seguidos de espacio o dos puntos y un hexadecimal \u003ccode>0x\u003c/code> de hasta ocho dígitos. Las líneas de log se ignoran. Se rechazan etiquetas repetidas, grupos fuera de rango y valores inválidos. Si falta un registro aparece como ausente; nunca se rellena con cero.\u003c/p>\n\u003cp>El resultado muestra A, B, el XOR y qué bits cambiaron. Avisa si cambió magic o threshold y si la comparación es parcial. Solo compara valores: no dice si las muestras son nuevas, coherentes, íntegras o del FE. Los archivos se leen en el navegador, hasta 200 kB, y no se suben ni se guardan.\u003c/p>\n"},{"title":"Diagnóstico y notas de sesión","anchor":"diagnóstico-y-notas-de-sesión","text":"## Diagnóstico y notas de sesión\n\nEl diagnóstico sugiere la próxima prueba a partir de lo que marques. Si no lo miraste, deja \"No lo miré\"; así no inventas datos. No da probabilidades ni confirma causas.\n\nLas notas viven en memoria. Solo \"Guardar en este navegador\" usa el almacenamiento local, y con `file://` depende del navegador. Exportar deja una copia aparte. Marcar casillas no valida el hardware ni autoriza comandos. Las capturas del comparador no entran en las notas.\n\nAl exportar se abre una ventana con el texto, un enlace de descarga y un botón de copiar. Si el navegador bloquea la descarga, copia el texto a mano. En HTTP o `file://` la copia automática puede fallar; entonces el botón selecciona el texto. En las pruebas no se pudo comprobar la descarga automática, pero sí que el informe se genera y se ve.\n\n","html":"\u003ch2 id=\"diagnóstico-y-notas-de-sesión\">Diagnóstico y notas de sesión\u003c/h2>\n\u003cp>El diagnóstico sugiere la próxima prueba a partir de lo que marques. Si no lo miraste, deja &quot;No lo miré&quot;; así no inventas datos. No da probabilidades ni confirma causas.\u003c/p>\n\u003cp>Las notas viven en memoria. Solo &quot;Guardar en este navegador&quot; usa el almacenamiento local, y con \u003ccode>file://\u003c/code> depende del navegador. Exportar deja una copia aparte. Marcar casillas no valida el hardware ni autoriza comandos. Las capturas del comparador no entran en las notas.\u003c/p>\n\u003cp>Al exportar se abre una ventana con el texto, un enlace de descarga y un botón de copiar. Si el navegador bloquea la descarga, copia el texto a mano. En HTTP o \u003ccode>file://\u003c/code> la copia automática puede fallar; entonces el botón selecciona el texto. En las pruebas no se pudo comprobar la descarga automática, pero sí que el informe se genera y se ve.\u003c/p>\n"},{"title":"Mantenimiento","anchor":"mantenimiento","text":"## Mantenimiento\n\nLa fuente son los Markdown y `evidencias.json`. La vista está en `web/`. El generador junta documentos y extractos en el HTML, y `empaquetar_pages.mjs` añade Mermaid, el script de diagnóstico y el paquete de captura a `_site`. El respaldo y el resto del repositorio no se publican.\n\nNecesitas Node 22, `tar` y las dependencias fijadas en `package-lock.json`. Desde `docs/recuperacion`:\n\n```bash\nnpm ci --ignore-scripts --no-audit --no-fund\nnpm run build\nnpm test\npython3 -m unittest discover -s diagnostico -p 'test_*.py'\n```\n\nAbre `_site/index.html` o sirve esa carpeta con cualquier servidor local. `npm test` revisa enlaces, la lógica de comparación y la sintaxis de los diagramas. Actions corre esas pruebas antes de publicar con `actions/deploy-pages`. La primera vez, Pages tiene que estar configurado como GitHub Actions y el entorno `github-pages` tiene que permitir desplegar desde `main`.\n\nLa guía resumida y los documentos largos salen de los mismos Markdown, así que edita los `.md`, no el HTML generado. `mermaid.js` se construye en el workflow y no está en Git. Si cambias dependencias, actualiza el lockfile y vuelve a correr las pruebas.\n","html":"\u003ch2 id=\"mantenimiento\">Mantenimiento\u003c/h2>\n\u003cp>La fuente son los Markdown y \u003ccode>evidencias.json\u003c/code>. La vista está en \u003ccode>web/\u003c/code>. El generador junta documentos y extractos en el HTML, y \u003ccode>empaquetar_pages.mjs\u003c/code> añade Mermaid, el script de diagnóstico y el paquete de captura a \u003ccode>_site\u003c/code>. El respaldo y el resto del repositorio no se publican.\u003c/p>\n\u003cp>Necesitas Node 22, \u003ccode>tar\u003c/code> y las dependencias fijadas en \u003ccode>package-lock.json\u003c/code>. Desde \u003ccode>docs/recuperacion\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode>npm ci --ignore-scripts --no-audit --no-fund\nnpm run build\nnpm test\npython3 -m unittest discover -s diagnostico -p 'test_*.py'\u003c/code>\u003c/pre>\n\u003cp>Abre \u003ccode>_site/index.html\u003c/code> o sirve esa carpeta con cualquier servidor local. \u003ccode>npm test\u003c/code> revisa enlaces, la lógica de comparación y la sintaxis de los diagramas. Actions corre esas pruebas antes de publicar con \u003ccode>actions/deploy-pages\u003c/code>. La primera vez, Pages tiene que estar configurado como GitHub Actions y el entorno \u003ccode>github-pages\u003c/code> tiene que permitir desplegar desde \u003ccode>main\u003c/code>.\u003c/p>\n\u003cp>La guía resumida y los documentos largos salen de los mismos Markdown, así que edita los \u003ccode>.md\u003c/code>, no el HTML generado. \u003ccode>mermaid.js\u003c/code> se construye en el workflow y no está en Git. Si cambias dependencias, actualiza el lockfile y vuelve a correr las pruebas.\u003c/p>\n"}]},{"id":"10_BLOQUEO_LECTURAS","file":"10_BLOQUEO_LECTURAS.md","title":"Lecturas congeladas: qué sabemos y cómo localizar el fallo","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Lecturas congeladas: qué sabemos y cómo localizar el fallo\n\nTodavía no sabemos por qué se bloqueaban las lecturas. Sí sabemos lo suficiente para separar varios mecanismos y para no reiniciar sin guardar antes el estado del fallo. Lo primero es distinguir dos fallos diferentes: un comando que no termina, y un comando que termina pero muestra siempre la misma muestra.\n\nDesde el 25-10-2026 hay un [script con los procedimientos S0–S4](12_SCRIPT_DIAGNOSTICO.md). Hace el inventario y guarda la evidencia; las lecturas esperan a que se confirme la compatibilidad. No reinicia ni recupera nada.\n\nEl 24-10-2026 el usuario confirmó que el sistema funcionaba un rato, dejaba de actualizar valores y volvía a funcionar al reiniciar. La nota `1028-1031-Testing.md`, líneas 93–96, cuenta lo mismo. Es una observación escrita, sin captura de señales y sin decir qué se reiniciaba. No sabemos qué ejecutable era ni si se colgaba el proceso, Linux o solo los valores.\n\n","html":"\u003ch1 id=\"lecturas-congeladas-qué-sabemos-y-cómo-localizar-el-fallo\">Lecturas congeladas: qué sabemos y cómo localizar el fallo\u003c/h1>\n\u003cp>Todavía no sabemos por qué se bloqueaban las lecturas. Sí sabemos lo suficiente para separar varios mecanismos y para no reiniciar sin guardar antes el estado del fallo. Lo primero es distinguir dos fallos diferentes: un comando que no termina, y un comando que termina pero muestra siempre la misma muestra.\u003c/p>\n\u003cp>Desde el 25-10-2026 hay un \u003ca href=\"12_SCRIPT_DIAGNOSTICO.md\">script con los procedimientos S0–S4\u003c/a>. Hace el inventario y guarda la evidencia; las lecturas esperan a que se confirme la compatibilidad. No reinicia ni recupera nada.\u003c/p>\n\u003cp>El 24-10-2026 el usuario confirmó que el sistema funcionaba un rato, dejaba de actualizar valores y volvía a funcionar al reiniciar. La nota \u003ccode>1028-1031-Testing.md\u003c/code>, líneas 93–96, cuenta lo mismo. Es una observación escrita, sin captura de señales y sin decir qué se reiniciaba. No sabemos qué ejecutable era ni si se colgaba el proceso, Linux o solo los valores.\u003c/p>\n"},{"title":"1. Separar el síntoma antes de buscar la causa","anchor":"1-separar-el-síntoma-antes-de-buscar-la-causa","text":"## 1. Separar el síntoma antes de buscar la causa\n\n| Qué ves durante el fallo | Qué puedes concluir | Qué no puedes concluir |\n|---|---|---|\n| Cada ejecución imprime todas las líneas y vuelve al prompt | Esa ejecución terminó sus accesos e imprimió | Que el capturador reciba eventos nuevos, que el dato sea del FE o que las nueve palabras sean coherentes |\n| No vuelve al prompt, pero otra terminal funciona | Linux sigue atendiendo | Que lo bloqueado sea MMIO; puede ser una espera, un bucle, `sudo` o la salida a la terminal |\n| No responde ninguna sesión | El problema es más amplio, o es de comunicación | Que venga del capturador; hay que separar red, CPU, kernel y alimentación con la consola que haya |\n| Solo falla `lpGbtRegister` y el lector de payload validado sigue bien | La ruta de control IC merece mirarse aparte | Que el uplink entero esté muerto |\n| Solo deja de imprimir `read_lpgbt10.sh` | No cambió el byte bajo, falló un acceso o se detuvo la ejecución | Que no cambien los 32 bits u otros grupos: el script solo mira `& 0xff` |\n\nSi la CLI termina una y otra vez, es poco probable que AXI esté sin responder en esas mismas lecturas. Puede haber un capturador congelado detrás de un slave AXI que responde bien. Y un reset global toca tantas piezas que no dice cuál fallaba.\n\n","html":"\u003ch2 id=\"1-separar-el-síntoma-antes-de-buscar-la-causa\">1. Separar el síntoma antes de buscar la causa\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qué ves durante el fallo\u003c/th>\n\u003cth>Qué puedes concluir\u003c/th>\n\u003cth>Qué no puedes concluir\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Cada ejecución imprime todas las líneas y vuelve al prompt\u003c/td>\n\u003ctd>Esa ejecución terminó sus accesos e imprimió\u003c/td>\n\u003ctd>Que el capturador reciba eventos nuevos, que el dato sea del FE o que las nueve palabras sean coherentes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>No vuelve al prompt, pero otra terminal funciona\u003c/td>\n\u003ctd>Linux sigue atendiendo\u003c/td>\n\u003ctd>Que lo bloqueado sea MMIO; puede ser una espera, un bucle, \u003ccode>sudo\u003c/code> o la salida a la terminal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>No responde ninguna sesión\u003c/td>\n\u003ctd>El problema es más amplio, o es de comunicación\u003c/td>\n\u003ctd>Que venga del capturador; hay que separar red, CPU, kernel y alimentación con la consola que haya\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Solo falla \u003ccode>lpGbtRegister\u003c/code> y el lector de payload validado sigue bien\u003c/td>\n\u003ctd>La ruta de control IC merece mirarse aparte\u003c/td>\n\u003ctd>Que el uplink entero esté muerto\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Solo deja de imprimir \u003ccode>read_lpgbt10.sh\u003c/code>\u003c/td>\n\u003ctd>No cambió el byte bajo, falló un acceso o se detuvo la ejecución\u003c/td>\n\u003ctd>Que no cambien los 32 bits u otros grupos: el script solo mira \u003ccode>&amp; 0xff\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Si la CLI termina una y otra vez, es poco probable que AXI esté sin responder en esas mismas lecturas. Puede haber un capturador congelado detrás de un slave AXI que responde bien. Y un reset global toca tantas piezas que no dice cuál fallaba.\u003c/p>\n"},{"title":"2. Hipótesis priorizadas por prueba discriminante","anchor":"2-hipótesis-priorizadas-por-prueba-discriminante","text":"## 2. Hipótesis priorizadas por prueba discriminante\n\nEl orden es por utilidad para investigar, no por probabilidad.\n\n| ID | Mecanismo | Qué hay y hasta dónde llega | Cómo comprobarlo o descartarlo |\n|---|---|---|---|\n| H1 | Captura sin trigger nuevo, contador o enable detenido, o FSM sin rearme | INFERIDO. La nota 1028–1031 (L66–67) liga la captura a una señal interna de envío y a contar relojes. Falta el RTL del capturador de nueve grupos. | Si `UserData` cambia y la señal de actualización del registro no, el problema está en el capturador. Si el registro se actualiza con cada evento documentado, H1 pierde peso. Consigue el RTL y la build antes de programar triggers. |\n| H2 | La forma de mostrar o de detectar cambios engaña | Comprobado en el código. `read_lpgbt10.sh` (L5–15) solo espera cambios del byte bajo. `watch_devmem.sh` oculta stderr (L22) y no duerme (L25). El sweep convierte una salida vacía en cero. | Compara la salida completa, el código de salida y stderr del lector validado, con el mismo estímulo. Si cambian bits altos, no está «todo congelado». No lances una segunda lectura si la primera está bloqueada. |\n| H3 | Se pierde reloj, alineación o avance en el uplink o el CDC | INFERIDO. El RTL depende de relojes, strobes y reset. Los bits de estado no cuentan muestras. | Captura a la vez `uplinkStrobe320`, `lpgbtfpga_uplinkData_320`, `lpgbtfpga_uplinkData_40`, relojes, reset y registro final, si hay instrumentación. Si el camino avanza hasta el registro, el problema está en cómo se muestra. |\n| H4 | AXI sin respuesta, slave en reset o mapa equivocado | INFERIDO. El mapa del BD y el de los scripts no encajan, y `libuio` no comprueba la respuesta antes de acceder. | Si el lector no termina, hay que mirar bus y CPU: `ARVALID/ARREADY` y `RVALID/RREADY` separan la dirección aceptada de la respuesta. Hace falta un ILA ya existente o una build futura autorizada. Un `Bus error` no se parece a un dato repetido. |\n| H5 | El control IC se queda atrapado en el software | Comprobado en el código, en ciertas condiciones. Hay dos bucles sin límite en `LpGbtUioFunctions.cpp`, y puede que ni se llegue a `waitIntr`. | Solo aplica si el comando que falló usa `LpGbtSw`. Mira en qué bucle está y el estado de IRQ y FIFO. La CLI de payload no llama a esas funciones. |\n| H6 | La FSM de `eLink_Interface_v1` se queda retenida o el protocolo de lectura queda a medias | El mecanismo está en una fuente; no sabemos si está montada. Leer tiene efectos y hay un estado que el reset no reinicia. | Primero demuestra que esa entidad o su lógica están en la build. Si el capturador es otro y no comparte esa FSM, H6 no es la causa. |\n| H7 | El FE o la fuente seleccionada dejan de producir el estímulo | DESCONOCIDO. No hay configuración en uso, reloj del FE ni método de estímulo aprobado. | A/B/A externo con medida eléctrica y la configuración en uso. Que cambie un generador interno no prueba que el FE funcione. |\n\n","html":"\u003ch2 id=\"2-hipótesis-priorizadas-por-prueba-discriminante\">2. Hipótesis priorizadas por prueba discriminante\u003c/h2>\n\u003cp>El orden es por utilidad para investigar, no por probabilidad.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Mecanismo\u003c/th>\n\u003cth>Qué hay y hasta dónde llega\u003c/th>\n\u003cth>Cómo comprobarlo o descartarlo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>H1\u003c/td>\n\u003ctd>Captura sin trigger nuevo, contador o enable detenido, o FSM sin rearme\u003c/td>\n\u003ctd>INFERIDO. La nota 1028–1031 (L66–67) liga la captura a una señal interna de envío y a contar relojes. Falta el RTL del capturador de nueve grupos.\u003c/td>\n\u003ctd>Si \u003ccode>UserData\u003c/code> cambia y la señal de actualización del registro no, el problema está en el capturador. Si el registro se actualiza con cada evento documentado, H1 pierde peso. Consigue el RTL y la build antes de programar triggers.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H2\u003c/td>\n\u003ctd>La forma de mostrar o de detectar cambios engaña\u003c/td>\n\u003ctd>Comprobado en el código. \u003ccode>read_lpgbt10.sh\u003c/code> (L5–15) solo espera cambios del byte bajo. \u003ccode>watch_devmem.sh\u003c/code> oculta stderr (L22) y no duerme (L25). El sweep convierte una salida vacía en cero.\u003c/td>\n\u003ctd>Compara la salida completa, el código de salida y stderr del lector validado, con el mismo estímulo. Si cambian bits altos, no está «todo congelado». No lances una segunda lectura si la primera está bloqueada.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H3\u003c/td>\n\u003ctd>Se pierde reloj, alineación o avance en el uplink o el CDC\u003c/td>\n\u003ctd>INFERIDO. El RTL depende de relojes, strobes y reset. Los bits de estado no cuentan muestras.\u003c/td>\n\u003ctd>Captura a la vez \u003ccode>uplinkStrobe320\u003c/code>, \u003ccode>lpgbtfpga_uplinkData_320\u003c/code>, \u003ccode>lpgbtfpga_uplinkData_40\u003c/code>, relojes, reset y registro final, si hay instrumentación. Si el camino avanza hasta el registro, el problema está en cómo se muestra.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H4\u003c/td>\n\u003ctd>AXI sin respuesta, slave en reset o mapa equivocado\u003c/td>\n\u003ctd>INFERIDO. El mapa del BD y el de los scripts no encajan, y \u003ccode>libuio\u003c/code> no comprueba la respuesta antes de acceder.\u003c/td>\n\u003ctd>Si el lector no termina, hay que mirar bus y CPU: \u003ccode>ARVALID/ARREADY\u003c/code> y \u003ccode>RVALID/RREADY\u003c/code> separan la dirección aceptada de la respuesta. Hace falta un ILA ya existente o una build futura autorizada. Un \u003ccode>Bus error\u003c/code> no se parece a un dato repetido.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H5\u003c/td>\n\u003ctd>El control IC se queda atrapado en el software\u003c/td>\n\u003ctd>Comprobado en el código, en ciertas condiciones. Hay dos bucles sin límite en \u003ccode>LpGbtUioFunctions.cpp\u003c/code>, y puede que ni se llegue a \u003ccode>waitIntr\u003c/code>.\u003c/td>\n\u003ctd>Solo aplica si el comando que falló usa \u003ccode>LpGbtSw\u003c/code>. Mira en qué bucle está y el estado de IRQ y FIFO. La CLI de payload no llama a esas funciones.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H6\u003c/td>\n\u003ctd>La FSM de \u003ccode>eLink_Interface_v1\u003c/code> se queda retenida o el protocolo de lectura queda a medias\u003c/td>\n\u003ctd>El mecanismo está en una fuente; no sabemos si está montada. Leer tiene efectos y hay un estado que el reset no reinicia.\u003c/td>\n\u003ctd>Primero demuestra que esa entidad o su lógica están en la build. Si el capturador es otro y no comparte esa FSM, H6 no es la causa.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H7\u003c/td>\n\u003ctd>El FE o la fuente seleccionada dejan de producir el estímulo\u003c/td>\n\u003ctd>DESCONOCIDO. No hay configuración en uso, reloj del FE ni método de estímulo aprobado.\u003c/td>\n\u003ctd>A/B/A externo con medida eléctrica y la configuración en uso. Que cambie un generador interno no prueba que el FE funcione.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"3. Hallazgos nuevos en RTL y software","anchor":"3-hallazgos-nuevos-en-rtl-y-software","text":"## 3. Hallazgos nuevos en RTL y software\n\n### F1. `ready` retenido no es un latido de recepción\n\nComprobado en el código (R07, R09). En `cdc_rx.vhd` L178–191, `ready_b_o` baja durante `reset_a_strobe_sync` y sube tras un `strobe_a_r`. No hay nada que lo baje solo porque dejen de llegar strobes, y con el reloj A parado ese proceso tampoco corre. La captura intermedia sigue un contador de fase, no cada strobe válido. El módulo necesita relojes relacionados por un factor entero (L36–39); no es una FIFO asíncrona cualquiera.\n\nPero el wrapper hace `cdc_uplink_reset \u003c= not uplinkReady_s`, así que si el core pierde su ready, el CDC se resetea. Por eso no se puede decir que `ready` se quede siempre en 1 al perder el enlace. El caso que sí vale es «no llegan strobes y no hay reset»; hay que ver si eso puede pasar con la build y los relojes reales. Además, `fwMonitor` ni siquiera muestra `cdc_rx_ready`: su `RX locked` es la cabecera.\n\nEn la práctica, un bit de estado en 1 no libra de culpa a la cadena de captura. Registra a la vez el progreso y los datos, no solo niveles.\n\n### F2. `eLink_Interface_v1` puede retener estado y leer tiene efectos\n\nComprobado en el código (R08). Esta entidad no está en el BD recuperado, así que esto no prueba nada sobre el capturador `tgc_readUplink_regs` de nueve grupos.\n\n- La FSM sale de `idle` cuando se escribe en el downlink (L268–272). No recibe de forma continua por su cuenta.\n- En `waiting_resp`, la respuesta se da por válida con `or rx_out`, sin mirar `ulFIFO_empty_s` (L278–293). Un payload de ceros no cuenta como respuesta. Qué devuelve `dout` con la FIFO vacía depende de la IP concreta; no lo damos por información nueva.\n- Leer cada grupo borra su valor y su bit de `regStatus` (L295–318). Si se salta un grupo, esa condición no se completa, aunque hay una salida alternativa con otra escritura downlink (L319–324). No es un bloqueo inevitable ni necesariamente permanente.\n- El reset limpia `regStatus`, `intr`, `TX_WrEN` y `tx_in`, pero no pone `fsm_state \u003c= idle` (L259–265). El `:= idle` de la declaración no se aplica en cada reset. Si estaba en `waiting_resp`, un reset por ese puerto no la devuelve a `idle`.\n- La escritura en RX usa `dlFIFO_full_s`, que es el flag de la FIFO TX (L243–246), no el de RX. Y `check_bit` se evalúa con el valor del ciclo anterior porque es una señal VHDL. Hay que confirmar si era intencional.\n- `rd_en => '1'` en RX (L355–368) vacía la FIFO todo el rato, mientras la FSM guarda una sola respuesta. No garantiza una captura por evento ni que no se pierdan datos.\n\nUna reconfiguración completa puede arreglar un estado que un reset parcial no arregla. Eso encaja con algunos «reiniciar lo arregla», pero hay que probar que la entidad está montada y qué se reinicia. No se recomienda escribir un ACK: `ctrlACK_s` está en el mapa pero no se usa en las transiciones.\n\n### F3. Un timeout IC no limita la operación completa\n\nComprobado en el código (B06, B10). `readRegister()` limpia la IRQ, la habilita, manda `0x10004`, espera la IRQ y vacía la FIFO. `clearIntr()` (L221–230) puede repetirse para siempre si el flag no se limpia. `readICRxFifo()` (L109–125) repite hasta que se active `empty` y va llenando un vector sin límite. Cada vuelta hace MMIO, así que si el estado no avanza puede comerse CPU y memoria. `waitIntr(...,1)` no corta ninguno de esos dos bucles.\n\nAdemás, una respuesta corta lleva a leer `readValues[6]` sin comprobar la longitud. Eso es comportamiento indefinido, no un error bien informado. El timeout lanza una excepción, así que no se puede decir que el programa siga siempre después.\n\nLo importante: la CLI de payload lee los registros directamente y no espera IRQ. Nada de esto justifica añadirle polling de IRQ. Un `read()` sobre `/dev/uioN` espera una interrupción; no lee el payload mapeado [K1].\n\n### F4. El watchdog de la FSM IC tiene la prioridad mal puesta\n\nComprobado en el código (R10). En `reading_FIFO` de `emp_lpgbt.vhd` (L731–768), el contador se decrementa antes del `if`. Si `status_empty_flag='1'`, siempre entra en la primera rama y nunca llega al `elsif lpgbt_resp_timeout = 0`. Con la FIFO siempre vacía, llegar a cero no lleva a `finish`, y la siguiente resta se sale del rango `0 to 100000000`. Un simulador que compruebe rangos debería avisar. Sin los informes y la simulación de esa build no podemos decir qué hace el circuito sintetizado.\n\nEsto pesa menos de lo que parece. El control `0x10004` que usa `LpGbtSw` deja en cero el bit 4 (`single_write_read`), según `emp_lpgbt_ic_clerk_regs_pkg.vhd` L94–100. Eso elige la ruta gestionada por el PS, no esta FSM de operación única. Así que este defecto no explica las llamadas a `readRegister()` recuperadas, ni tampoco el payload del FE.\n\n### F5. La idea de que la FIFO IC se va llenando no se sostiene\n\n`ic_rx_fifo.vhd` avanza los punteros sin dar la vuelta ni controlar si está llena (L96–108), pero `ic_top.vhd` (L206–217) resetea RX cada vez que empieza una lectura o escritura. Comprobado en el código (R11). Por eso no se puede decir que «se llena después de muchas transacciones correctas». Quedan por mirar la longitud máxima de una transacción, el CDC de los punteros y el tráfico anómalo, pero eso es otra investigación.\n\n### F6. Un nombre de reset engañoso, sin inversión demostrada\n\nEl puerto del core se llama `uplinkRst_n_i`, pero el código modificado hace directamente `rst_pattsearch_s \u003c= uplinkRst_n_i` (L263), y el wrapper le pasa `reset_general` por esa cadena. Comprobado en el código (R09, R10). El nombre heredado no basta para decir que la polaridad está invertida ni para proponer un parche. Sigue la señal hasta donde se usa.\n\n","html":"\u003ch2 id=\"3-hallazgos-nuevos-en-rtl-y-software\">3. Hallazgos nuevos en RTL y software\u003c/h2>\n\u003ch3 id=\"f1-ready-retenido-no-es-un-latido-de-recepción\">F1. \u003ccode>ready\u003c/code> retenido no es un latido de recepción\u003c/h3>\n\u003cp>Comprobado en el código (R07, R09). En \u003ccode>cdc_rx.vhd\u003c/code> L178–191, \u003ccode>ready_b_o\u003c/code> baja durante \u003ccode>reset_a_strobe_sync\u003c/code> y sube tras un \u003ccode>strobe_a_r\u003c/code>. No hay nada que lo baje solo porque dejen de llegar strobes, y con el reloj A parado ese proceso tampoco corre. La captura intermedia sigue un contador de fase, no cada strobe válido. El módulo necesita relojes relacionados por un factor entero (L36–39); no es una FIFO asíncrona cualquiera.\u003c/p>\n\u003cp>Pero el wrapper hace \u003ccode>cdc_uplink_reset &lt;= not uplinkReady_s\u003c/code>, así que si el core pierde su ready, el CDC se resetea. Por eso no se puede decir que \u003ccode>ready\u003c/code> se quede siempre en 1 al perder el enlace. El caso que sí vale es «no llegan strobes y no hay reset»; hay que ver si eso puede pasar con la build y los relojes reales. Además, \u003ccode>fwMonitor\u003c/code> ni siquiera muestra \u003ccode>cdc_rx_ready\u003c/code>: su \u003ccode>RX locked\u003c/code> es la cabecera.\u003c/p>\n\u003cp>En la práctica, un bit de estado en 1 no libra de culpa a la cadena de captura. Registra a la vez el progreso y los datos, no solo niveles.\u003c/p>\n\u003ch3 id=\"f2-elink_interface_v1-puede-retener-estado-y-leer-tiene-efectos\">F2. \u003ccode>eLink_Interface_v1\u003c/code> puede retener estado y leer tiene efectos\u003c/h3>\n\u003cp>Comprobado en el código (R08). Esta entidad no está en el BD recuperado, así que esto no prueba nada sobre el capturador \u003ccode>tgc_readUplink_regs\u003c/code> de nueve grupos.\u003c/p>\n\u003cul>\n\u003cli>La FSM sale de \u003ccode>idle\u003c/code> cuando se escribe en el downlink (L268–272). No recibe de forma continua por su cuenta.\u003c/li>\n\u003cli>En \u003ccode>waiting_resp\u003c/code>, la respuesta se da por válida con \u003ccode>or rx_out\u003c/code>, sin mirar \u003ccode>ulFIFO_empty_s\u003c/code> (L278–293). Un payload de ceros no cuenta como respuesta. Qué devuelve \u003ccode>dout\u003c/code> con la FIFO vacía depende de la IP concreta; no lo damos por información nueva.\u003c/li>\n\u003cli>Leer cada grupo borra su valor y su bit de \u003ccode>regStatus\u003c/code> (L295–318). Si se salta un grupo, esa condición no se completa, aunque hay una salida alternativa con otra escritura downlink (L319–324). No es un bloqueo inevitable ni necesariamente permanente.\u003c/li>\n\u003cli>El reset limpia \u003ccode>regStatus\u003c/code>, \u003ccode>intr\u003c/code>, \u003ccode>TX_WrEN\u003c/code> y \u003ccode>tx_in\u003c/code>, pero no pone \u003ccode>fsm_state &lt;= idle\u003c/code> (L259–265). El \u003ccode>:= idle\u003c/code> de la declaración no se aplica en cada reset. Si estaba en \u003ccode>waiting_resp\u003c/code>, un reset por ese puerto no la devuelve a \u003ccode>idle\u003c/code>.\u003c/li>\n\u003cli>La escritura en RX usa \u003ccode>dlFIFO_full_s\u003c/code>, que es el flag de la FIFO TX (L243–246), no el de RX. Y \u003ccode>check_bit\u003c/code> se evalúa con el valor del ciclo anterior porque es una señal VHDL. Hay que confirmar si era intencional.\u003c/li>\n\u003cli>\u003ccode>rd_en =&gt; &#39;1&#39;\u003c/code> en RX (L355–368) vacía la FIFO todo el rato, mientras la FSM guarda una sola respuesta. No garantiza una captura por evento ni que no se pierdan datos.\u003c/li>\n\u003c/ul>\n\u003cp>Una reconfiguración completa puede arreglar un estado que un reset parcial no arregla. Eso encaja con algunos «reiniciar lo arregla», pero hay que probar que la entidad está montada y qué se reinicia. No se recomienda escribir un ACK: \u003ccode>ctrlACK_s\u003c/code> está en el mapa pero no se usa en las transiciones.\u003c/p>\n\u003ch3 id=\"f3-un-timeout-ic-no-limita-la-operación-completa\">F3. Un timeout IC no limita la operación completa\u003c/h3>\n\u003cp>Comprobado en el código (B06, B10). \u003ccode>readRegister()\u003c/code> limpia la IRQ, la habilita, manda \u003ccode>0x10004\u003c/code>, espera la IRQ y vacía la FIFO. \u003ccode>clearIntr()\u003c/code> (L221–230) puede repetirse para siempre si el flag no se limpia. \u003ccode>readICRxFifo()\u003c/code> (L109–125) repite hasta que se active \u003ccode>empty\u003c/code> y va llenando un vector sin límite. Cada vuelta hace MMIO, así que si el estado no avanza puede comerse CPU y memoria. \u003ccode>waitIntr(...,1)\u003c/code> no corta ninguno de esos dos bucles.\u003c/p>\n\u003cp>Además, una respuesta corta lleva a leer \u003ccode>readValues[6]\u003c/code> sin comprobar la longitud. Eso es comportamiento indefinido, no un error bien informado. El timeout lanza una excepción, así que no se puede decir que el programa siga siempre después.\u003c/p>\n\u003cp>Lo importante: la CLI de payload lee los registros directamente y no espera IRQ. Nada de esto justifica añadirle polling de IRQ. Un \u003ccode>read()\u003c/code> sobre \u003ccode>/dev/uioN\u003c/code> espera una interrupción; no lee el payload mapeado [K1].\u003c/p>\n\u003ch3 id=\"f4-el-watchdog-de-la-fsm-ic-tiene-la-prioridad-mal-puesta\">F4. El watchdog de la FSM IC tiene la prioridad mal puesta\u003c/h3>\n\u003cp>Comprobado en el código (R10). En \u003ccode>reading_FIFO\u003c/code> de \u003ccode>emp_lpgbt.vhd\u003c/code> (L731–768), el contador se decrementa antes del \u003ccode>if\u003c/code>. Si \u003ccode>status_empty_flag=&#39;1&#39;\u003c/code>, siempre entra en la primera rama y nunca llega al \u003ccode>elsif lpgbt_resp_timeout = 0\u003c/code>. Con la FIFO siempre vacía, llegar a cero no lleva a \u003ccode>finish\u003c/code>, y la siguiente resta se sale del rango \u003ccode>0 to 100000000\u003c/code>. Un simulador que compruebe rangos debería avisar. Sin los informes y la simulación de esa build no podemos decir qué hace el circuito sintetizado.\u003c/p>\n\u003cp>Esto pesa menos de lo que parece. El control \u003ccode>0x10004\u003c/code> que usa \u003ccode>LpGbtSw\u003c/code> deja en cero el bit 4 (\u003ccode>single_write_read\u003c/code>), según \u003ccode>emp_lpgbt_ic_clerk_regs_pkg.vhd\u003c/code> L94–100. Eso elige la ruta gestionada por el PS, no esta FSM de operación única. Así que este defecto no explica las llamadas a \u003ccode>readRegister()\u003c/code> recuperadas, ni tampoco el payload del FE.\u003c/p>\n\u003ch3 id=\"f5-la-idea-de-que-la-fifo-ic-se-va-llenando-no-se-sostiene\">F5. La idea de que la FIFO IC se va llenando no se sostiene\u003c/h3>\n\u003cp>\u003ccode>ic_rx_fifo.vhd\u003c/code> avanza los punteros sin dar la vuelta ni controlar si está llena (L96–108), pero \u003ccode>ic_top.vhd\u003c/code> (L206–217) resetea RX cada vez que empieza una lectura o escritura. Comprobado en el código (R11). Por eso no se puede decir que «se llena después de muchas transacciones correctas». Quedan por mirar la longitud máxima de una transacción, el CDC de los punteros y el tráfico anómalo, pero eso es otra investigación.\u003c/p>\n\u003ch3 id=\"f6-un-nombre-de-reset-engañoso-sin-inversión-demostrada\">F6. Un nombre de reset engañoso, sin inversión demostrada\u003c/h3>\n\u003cp>El puerto del core se llama \u003ccode>uplinkRst_n_i\u003c/code>, pero el código modificado hace directamente \u003ccode>rst_pattsearch_s &lt;= uplinkRst_n_i\u003c/code> (L263), y el wrapper le pasa \u003ccode>reset_general\u003c/code> por esa cadena. Comprobado en el código (R09, R10). El nombre heredado no basta para decir que la polaridad está invertida ni para proponer un parche. Sigue la señal hasta donde se usa.\u003c/p>\n"},{"title":"4. F0: guardar el fallo sin tocar MMIO","anchor":"4-f0-guardar-el-fallo-sin-tocar-mmio","text":"## 4. F0: guardar el fallo sin tocar MMIO\n\nObjetivo: ver qué se congeló y guardar la evidencia antes de cualquier reinicio.\n\nNecesitas una sesión Linux que todavía responda. No abras más herramientas de hardware si hay otra atascada. Estos comandos son una propuesta para diagnosticar, no comandos del experimento original. Si fallan por permisos o porque no existen, guarda el error.\n\n```bash\n# Terminal de diagnóstico; no ejecuta devmem ni abre /dev/uioN.\ndate -u '+%Y-%m-%dT%H:%M:%SZ'\ncat /proc/uptime\nuname -a\nps -eo pid,ppid,stat,etime,time,wchan:24,comm\n# Si ps no soporta estas opciones, usar: ps\n```\n\nElige a mano el PID del proceso que ya estaba corriendo; no lo deduzcas de `uioN`:\n\n```bash\nprintf 'PID del proceso detenido: '\nread -r pid\ncase \"$pid\" in\n  ''|*[!0-9]*) printf 'PID no válido\\n' ;;\n  *)\n    for f in status wchan syscall; do\n      printf '\\n--- /proc/%s/%s ---\\n' \"$pid\" \"$f\"\n      cat \"/proc/$pid/$f\"\n    done\n    readlink \"/proc/$pid/exe\"\n    ;;\nesac\n# Si está permitido; no cambiar permisos del sistema para obtenerlo:\ndmesg | tail -n 100\n```\n\nLeen el estado del kernel, los procesos, el ejecutable y los mensajes, sin tocar registros del dispositivo. `/proc/PID/syscall` puede fallar por permisos o decir `running`; no traduce el PC a una línea de código ni prueba que haya MMIO. Un estado `D` o un `wchan` concreto son pistas, no un diagnóstico de AXI [K2].\n\nDeberías obtener la hora, el uptime y el estado del proceso que falló. Si el proceso ya terminó, guarda su salida completa, stderr y el código de salida, sin repetirlo para provocar el fallo otra vez.\n\nSi Linux no responde, usa la consola que tenga el ingeniero para mirar, sin forzar un reset desde esta guía. Si tampoco hay acceso, anota el último momento en que respondía y qué dejó de responder.\n\nLos logs pueden tener identificadores internos; revísalos antes de compartirlos. Mirar consume algo de CPU y puede cambiar un poco los tiempos. No se escribe nada en el hardware.\n\nDespués: si el comando terminó con datos repetidos, sigue con F1. Si no terminó, estudia el ejecutable, el bucle o el acceso antes de volver a leer. `timeout` no protege el hardware: manda señales al proceso y no asegura que una transacción del interconnect termine o se corte [K3].\n\nOjo: un programa que no imprime puede estar esperando entrada o salida, no a la FPGA. Que no haya texto no significa que un acceso esté bloqueado. `strace` no ve cada lectura `volatile` como syscall y además cambia los tiempos, así que no es la primera prueba.\n\n","html":"\u003ch2 id=\"4-f0-guardar-el-fallo-sin-tocar-mmio\">4. F0: guardar el fallo sin tocar MMIO\u003c/h2>\n\u003cp>Objetivo: ver qué se congeló y guardar la evidencia antes de cualquier reinicio.\u003c/p>\n\u003cp>Necesitas una sesión Linux que todavía responda. No abras más herramientas de hardware si hay otra atascada. Estos comandos son una propuesta para diagnosticar, no comandos del experimento original. Si fallan por permisos o porque no existen, guarda el error.\u003c/p>\n\u003cpre>\u003ccode># Terminal de diagnóstico; no ejecuta devmem ni abre /dev/uioN.\ndate -u '+%Y-%m-%dT%H:%M:%SZ'\ncat /proc/uptime\nuname -a\nps -eo pid,ppid,stat,etime,time,wchan:24,comm\n# Si ps no soporta estas opciones, usar: ps\u003c/code>\u003c/pre>\n\u003cp>Elige a mano el PID del proceso que ya estaba corriendo; no lo deduzcas de \u003ccode>uioN\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode>printf 'PID del proceso detenido: '\nread -r pid\ncase \"$pid\" in\n  ''|*[!0-9]*) printf 'PID no válido\\n' ;;\n  *)\n    for f in status wchan syscall; do\n      printf '\\n--- /proc/%s/%s ---\\n' \"$pid\" \"$f\"\n      cat \"/proc/$pid/$f\"\n    done\n    readlink \"/proc/$pid/exe\"\n    ;;\nesac\n# Si está permitido; no cambiar permisos del sistema para obtenerlo:\ndmesg | tail -n 100\u003c/code>\u003c/pre>\n\u003cp>Leen el estado del kernel, los procesos, el ejecutable y los mensajes, sin tocar registros del dispositivo. \u003ccode>/proc/PID/syscall\u003c/code> puede fallar por permisos o decir \u003ccode>running\u003c/code>; no traduce el PC a una línea de código ni prueba que haya MMIO. Un estado \u003ccode>D\u003c/code> o un \u003ccode>wchan\u003c/code> concreto son pistas, no un diagnóstico de AXI [K2].\u003c/p>\n\u003cp>Deberías obtener la hora, el uptime y el estado del proceso que falló. Si el proceso ya terminó, guarda su salida completa, stderr y el código de salida, sin repetirlo para provocar el fallo otra vez.\u003c/p>\n\u003cp>Si Linux no responde, usa la consola que tenga el ingeniero para mirar, sin forzar un reset desde esta guía. Si tampoco hay acceso, anota el último momento en que respondía y qué dejó de responder.\u003c/p>\n\u003cp>Los logs pueden tener identificadores internos; revísalos antes de compartirlos. Mirar consume algo de CPU y puede cambiar un poco los tiempos. No se escribe nada en el hardware.\u003c/p>\n\u003cp>Después: si el comando terminó con datos repetidos, sigue con F1. Si no terminó, estudia el ejecutable, el bucle o el acceso antes de volver a leer. \u003ccode>timeout\u003c/code> no protege el hardware: manda señales al proceso y no asegura que una transacción del interconnect termine o se corte [K3].\u003c/p>\n\u003cp>Ojo: un programa que no imprime puede estar esperando entrada o salida, no a la FPGA. Que no haya texto no significa que un acceso esté bloqueado. \u003ccode>strace\u003c/code> no ve cada lectura \u003ccode>volatile\u003c/code> como syscall y además cambia los tiempos, así que no es la primera prueba.\u003c/p>\n"},{"title":"5. F1: comprobar si se repite, sin confundirlo con que no hay datos","anchor":"5-f1-comprobar-si-se-repite-sin-confundirlo-con-que-no-hay-datos","text":"## 5. F1: comprobar si se repite, sin confundirlo con que no hay datos\n\nObjetivo: comparar dos lecturas completas junto con el estímulo anotado.\n\nNecesitas todas las condiciones de [P0, etapa C](00_GUIA_CAMPO.md#etapa-c-leer-los-datos-expuestos-por-la-fpga): mapa y efectos confirmados, lecturas autorizadas y ningún proceso de hardware bloqueado. Un solo operador y un solo lector. `LECTOR` tiene que ser la ruta absoluta del ejecutable identificado, no el nombre de otro binario.\n\n```bash\n# Propuesta de envoltorio de registro; LECTOR se fija con la ruta validada en A2.\n# Ejecutar desde un directorio nuevo de la sesión para no sobrescribir evidencia.\ndate -u '+ANTES %Y-%m-%dT%H:%M:%SZ'\n\"$LECTOR\" > muestra_A.out 2> muestra_A.err\nrc=$?\nprintf 'RC=%s\\n' \"$rc\"\ndate -u '+DESPUES %Y-%m-%dT%H:%M:%SZ'\ncat muestra_A.out\ncat muestra_A.err\n```\n\nCorre el lector una vez, separa la salida normal de los errores y anota si vuelve. Si no vuelve, para aquí y no lances la muestra B. Si el ejecutable y lo que hace son los confirmados en P0, no debería cambiar registros, aunque una lectura con efectos sigue siendo un riesgo.\n\nDeberías ver `data_group_0` a `data_group_8`, `data_header`, `clk_thresh` y `magic`, o lo que imprima el ejecutable validado. Después de un estímulo externo documentado, repite con los nombres `muestra_B.*` sin pisar A. Compara con el comparador de la web o con `diff -u muestra_A.out muestra_B.out`.\n\nSi solo cambian bits altos, eso explica que un script que mira el byte bajo no viera nada. Nueve palabras iguales pueden ser muestras nuevas idénticas: sin contador ni trigger comprobable no prueban un bloqueo. Palabras distintas tampoco prueban coherencia ni que vengan del FE. Una línea que falta es una lectura incompleta, no un cero.\n\nEs MMIO con condiciones, y dos lectores a la vez pueden comerse datos o estorbarse. Las horas son del software, no del frame. No barras `clk_thresh`, no escribas patrones internos y no recargues firmware para esta comparación.\n\nSi A y B no siguen un cambio externo comprobado, pide una captura simultánea en el paso `UserData`→capturador. Si el FE no tiene un estímulo aprobado, el resultado queda sin decidir.\n\nOjo: confirma que el patrón llegó de verdad al e-link y que no sigues viendo un loopback. Comparar textos no resuelve eso.\n\n","html":"\u003ch2 id=\"5-f1-comprobar-si-se-repite-sin-confundirlo-con-que-no-hay-datos\">5. F1: comprobar si se repite, sin confundirlo con que no hay datos\u003c/h2>\n\u003cp>Objetivo: comparar dos lecturas completas junto con el estímulo anotado.\u003c/p>\n\u003cp>Necesitas todas las condiciones de \u003ca href=\"00_GUIA_CAMPO.md#etapa-c-leer-los-datos-expuestos-por-la-fpga\">P0, etapa C\u003c/a>: mapa y efectos confirmados, lecturas autorizadas y ningún proceso de hardware bloqueado. Un solo operador y un solo lector. \u003ccode>LECTOR\u003c/code> tiene que ser la ruta absoluta del ejecutable identificado, no el nombre de otro binario.\u003c/p>\n\u003cpre>\u003ccode># Propuesta de envoltorio de registro; LECTOR se fija con la ruta validada en A2.\n# Ejecutar desde un directorio nuevo de la sesión para no sobrescribir evidencia.\ndate -u '+ANTES %Y-%m-%dT%H:%M:%SZ'\n\"$LECTOR\" &gt; muestra_A.out 2&gt; muestra_A.err\nrc=$?\nprintf 'RC=%s\\n' \"$rc\"\ndate -u '+DESPUES %Y-%m-%dT%H:%M:%SZ'\ncat muestra_A.out\ncat muestra_A.err\u003c/code>\u003c/pre>\n\u003cp>Corre el lector una vez, separa la salida normal de los errores y anota si vuelve. Si no vuelve, para aquí y no lances la muestra B. Si el ejecutable y lo que hace son los confirmados en P0, no debería cambiar registros, aunque una lectura con efectos sigue siendo un riesgo.\u003c/p>\n\u003cp>Deberías ver \u003ccode>data_group_0\u003c/code> a \u003ccode>data_group_8\u003c/code>, \u003ccode>data_header\u003c/code>, \u003ccode>clk_thresh\u003c/code> y \u003ccode>magic\u003c/code>, o lo que imprima el ejecutable validado. Después de un estímulo externo documentado, repite con los nombres \u003ccode>muestra_B.*\u003c/code> sin pisar A. Compara con el comparador de la web o con \u003ccode>diff -u muestra_A.out muestra_B.out\u003c/code>.\u003c/p>\n\u003cp>Si solo cambian bits altos, eso explica que un script que mira el byte bajo no viera nada. Nueve palabras iguales pueden ser muestras nuevas idénticas: sin contador ni trigger comprobable no prueban un bloqueo. Palabras distintas tampoco prueban coherencia ni que vengan del FE. Una línea que falta es una lectura incompleta, no un cero.\u003c/p>\n\u003cp>Es MMIO con condiciones, y dos lectores a la vez pueden comerse datos o estorbarse. Las horas son del software, no del frame. No barras \u003ccode>clk_thresh\u003c/code>, no escribas patrones internos y no recargues firmware para esta comparación.\u003c/p>\n\u003cp>Si A y B no siguen un cambio externo comprobado, pide una captura simultánea en el paso \u003ccode>UserData\u003c/code>→capturador. Si el FE no tiene un estímulo aprobado, el resultado queda sin decidir.\u003c/p>\n\u003cp>Ojo: confirma que el patrón llegó de verdad al e-link y que no sigues viendo un loopback. Comparar textos no resuelve eso.\u003c/p>\n"},{"title":"6. Qué guardar antes de una recuperación autorizada","anchor":"6-qué-guardar-antes-de-una-recuperación-autorizada","text":"## 6. Qué guardar antes de una recuperación autorizada\n\nAnota qué significa exactamente «reiniciar»: un proceso nuevo, reset del capturador, de `emp_lpgbt` o del MGT, reconfigurar el PL, reiniciar el PS o cortar la alimentación. No es lo mismo. No hagas una ronda de resets a ver qué pasa.\n\nGuarda: build, DTBO y ELF con sus hashes; configuración del FE y del lpGBT; tiempo desde el arranque y número de transacciones; la última lectura buena y la primera mala; salida y retorno de la aplicación; las observaciones del enlace hechas con las condiciones ya validadas; y qué se reinició exactamente. Si se puede, repite el ensayo al menos tres veces con la misma configuración. No hay tiempos suficientes para hablar de un overflow periódico.\n\nSi la build tiene un ILA, pide capturar `uplinkStrobe320`, `lpgbtfpga_uplinkData_320`, `lpgbtfpga_uplinkData_40`, `cdc_rx_ready`, el reset y el enable del capturador y sus señales de actualización, junto con AXI AR/R. Comprueba los nombres en esa build. Un ILA nuevo es otra build y necesita autorización; aquí no se creó ni se cargó ninguno.\n\n","html":"\u003ch2 id=\"6-qué-guardar-antes-de-una-recuperación-autorizada\">6. Qué guardar antes de una recuperación autorizada\u003c/h2>\n\u003cp>Anota qué significa exactamente «reiniciar»: un proceso nuevo, reset del capturador, de \u003ccode>emp_lpgbt\u003c/code> o del MGT, reconfigurar el PL, reiniciar el PS o cortar la alimentación. No es lo mismo. No hagas una ronda de resets a ver qué pasa.\u003c/p>\n\u003cp>Guarda: build, DTBO y ELF con sus hashes; configuración del FE y del lpGBT; tiempo desde el arranque y número de transacciones; la última lectura buena y la primera mala; salida y retorno de la aplicación; las observaciones del enlace hechas con las condiciones ya validadas; y qué se reinició exactamente. Si se puede, repite el ensayo al menos tres veces con la misma configuración. No hay tiempos suficientes para hablar de un overflow periódico.\u003c/p>\n\u003cp>Si la build tiene un ILA, pide capturar \u003ccode>uplinkStrobe320\u003c/code>, \u003ccode>lpgbtfpga_uplinkData_320\u003c/code>, \u003ccode>lpgbtfpga_uplinkData_40\u003c/code>, \u003ccode>cdc_rx_ready\u003c/code>, el reset y el enable del capturador y sus señales de actualización, junto con AXI AR/R. Comprueba los nombres en esa build. Un ILA nuevo es otra build y necesita autorización; aquí no se creó ni se cargó ninguno.\u003c/p>\n"},{"title":"7. Evidencia reproducible y límites","anchor":"7-evidencia-reproducible-y-límites","text":"## 7. Evidencia reproducible y límites\n\n`analisis/contraejemplos.py` reproduce en Python trozos de transiciones sacados del RTL, con condiciones de partida puestas a propósito: ready sin strobe, reset que no cambia la FSM, lectura parcial y prioridad del watchdog. No compila ni simula el VHDL completo, no tiene tiempos físicos y no prueba la causa original. La salida esperada está en `analisis/resultado_contraejemplos.json`.\n\nLas fuentes del repositorio están fijadas en `c02a33b645dc70fb4076add25b78c5246589676e`. Los extractos numerados R07–R12 y B10–B11 están en la web y en `evidencias.json`. No se corrigió ni el firmware ni las herramientas originales.\n\nReferencias del sistema operativo, consultadas el 24-10-2026:\n\n- [K1, Linux UIO HOWTO](https://docs.kernel.org/driver-api/uio-howto.html): diferencia entre mmap, eventos IRQ y atributos sysfs.\n- [K2, Linux /proc](https://docs.kernel.org/filesystems/proc.html): estado de los procesos y lo que se puede ver.\n- [K3, GNU timeout](https://www.gnu.org/software/coreutils/manual/html_node/timeout-invocation.html): corta con señales; no es un watchdog de AXI.\n","html":"\u003ch2 id=\"7-evidencia-reproducible-y-límites\">7. Evidencia reproducible y límites\u003c/h2>\n\u003cp>\u003ccode>analisis/contraejemplos.py\u003c/code> reproduce en Python trozos de transiciones sacados del RTL, con condiciones de partida puestas a propósito: ready sin strobe, reset que no cambia la FSM, lectura parcial y prioridad del watchdog. No compila ni simula el VHDL completo, no tiene tiempos físicos y no prueba la causa original. La salida esperada está en \u003ccode>analisis/resultado_contraejemplos.json\u003c/code>.\u003c/p>\n\u003cp>Las fuentes del repositorio están fijadas en \u003ccode>c02a33b645dc70fb4076add25b78c5246589676e\u003c/code>. Los extractos numerados R07–R12 y B10–B11 están en la web y en \u003ccode>evidencias.json\u003c/code>. No se corrigió ni el firmware ni las herramientas originales.\u003c/p>\n\u003cp>Referencias del sistema operativo, consultadas el 24-10-2026:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"https://docs.kernel.org/driver-api/uio-howto.html\">K1, Linux UIO HOWTO\u003c/a>: diferencia entre mmap, eventos IRQ y atributos sysfs.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.kernel.org/filesystems/proc.html\">K2, Linux /proc\u003c/a>: estado de los procesos y lo que se puede ver.\u003c/li>\n\u003cli>\u003ca href=\"https://www.gnu.org/software/coreutils/manual/html_node/timeout-invocation.html\">K3, GNU timeout\u003c/a>: corta con señales; no es un watchdog de AXI.\u003c/li>\n\u003c/ul>\n"}]},{"id":"11_COMPATIBILIDAD","file":"11_COMPATIBILIDAD.md","title":"Compatibilidad, y fallos que parecen el mismo","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Compatibilidad, y fallos que parecen el mismo\n\nNo hay una versión que valga para todas las fuentes. Para saber si una herramienta sirve hay que seguir una cadena: firmware → diseño e IP → Device Tree → mapa UIO → API de registros → ejecutable y biblioteca. Que coincida un nombre o que una lectura dé distinto de cero no completa la cadena.\n\n","html":"\u003ch1 id=\"compatibilidad-y-fallos-que-parecen-el-mismo\">Compatibilidad, y fallos que parecen el mismo\u003c/h1>\n\u003cp>No hay una versión que valga para todas las fuentes. Para saber si una herramienta sirve hay que seguir una cadena: firmware → diseño e IP → Device Tree → mapa UIO → API de registros → ejecutable y biblioteca. Que coincida un nombre o que una lectura dé distinto de cero no completa la cadena.\u003c/p>\n"},{"title":"Cuándo se puede usar una herramienta","anchor":"cuándo-se-puede-usar-una-herramienta","text":"## Cuándo se puede usar una herramienta\n\n| Qué tiene que coincidir | Dónde no coincide | Qué pasa si se mezcla | Qué falta comprobar |\n|---|---|---|---|\n| Direcciones físicas | En el BD, `0xA00D0000` y `0xA00E0000` son interrupt controllers; en los scripts, generador y lector | Se lee o escribe otro periférico, falla el bus o salen valores creíbles sin sentido | Address Editor más el bitstream y el DTBO cargados; no sacarlo de un script viejo |\n| Lector de payload | Backup: nueve grupos, header y threshold. `output_tgc_readuplink_1002`: un grupo y un setter | Offsets de otra IP; no hay forma automática de pasar de una clase a otra | Tabla del RTL cargado, hash del ELF y receta de compilación |\n| Interfaz e-link | `eLink_Interface_v1`: siete grupos de 32 bits que se borran al leerlos. Captura del backup: nueve grupos, RTL desconocido | Leer de más puede borrar datos o dejar el protocolo a medias | Qué entidad está integrada, en qué orden y con qué protocolo; no usar la CLI de nueve grupos porque el nombre se parezca |\n| Control del chip | `emp_lpgbt_N` usa control, FIFO, IRQ y registro remoto. `tgc_readUplink_regs` da muestras | Tomar un dato IC por payload, o usar una dirección del chip como offset AXI | Instancia, puertos, mapa y la herramienta que corresponde |\n| Canales | BD recuperado: 12 instancias. Monitor: 13 posiciones | Leer un campo sin canal o asignar mal la fibra | Build, cableado y UIO de esa sesión |\n| Máscaras | Plantilla antigua `(1 \u003c\u003c bitWidth) - 1`; las versiones corregidas usan guardas o ULL distintas | Extracción o escritura erróneas; comportamiento indefinido con desplazamientos inválidos | La fuente con la que se compiló el ELF, anchura y offset. No todo `Bus error` es culpa de la máscara |\n| Selección de datos | Serializer en loopback, PRBS, cable de retorno o FE real | La lectura parece funcionar pero el origen no está probado | Configuración en uso y A/B/A externo |\n| Reset | Inicializar al configurar, reset de lógica y reset del MGT no son lo mismo | Recuperación parcial, estado que se conserva o cambios de fase | Qué abarcaba exactamente la acción que antes lo recuperaba |\n\n","html":"\u003ch2 id=\"cuándo-se-puede-usar-una-herramienta\">Cuándo se puede usar una herramienta\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qué tiene que coincidir\u003c/th>\n\u003cth>Dónde no coincide\u003c/th>\n\u003cth>Qué pasa si se mezcla\u003c/th>\n\u003cth>Qué falta comprobar\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Direcciones físicas\u003c/td>\n\u003ctd>En el BD, \u003ccode>0xA00D0000\u003c/code> y \u003ccode>0xA00E0000\u003c/code> son interrupt controllers; en los scripts, generador y lector\u003c/td>\n\u003ctd>Se lee o escribe otro periférico, falla el bus o salen valores creíbles sin sentido\u003c/td>\n\u003ctd>Address Editor más el bitstream y el DTBO cargados; no sacarlo de un script viejo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lector de payload\u003c/td>\n\u003ctd>Backup: nueve grupos, header y threshold. \u003ccode>output_tgc_readuplink_1002\u003c/code>: un grupo y un setter\u003c/td>\n\u003ctd>Offsets de otra IP; no hay forma automática de pasar de una clase a otra\u003c/td>\n\u003ctd>Tabla del RTL cargado, hash del ELF y receta de compilación\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Interfaz e-link\u003c/td>\n\u003ctd>\u003ccode>eLink_Interface_v1\u003c/code>: siete grupos de 32 bits que se borran al leerlos. Captura del backup: nueve grupos, RTL desconocido\u003c/td>\n\u003ctd>Leer de más puede borrar datos o dejar el protocolo a medias\u003c/td>\n\u003ctd>Qué entidad está integrada, en qué orden y con qué protocolo; no usar la CLI de nueve grupos porque el nombre se parezca\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Control del chip\u003c/td>\n\u003ctd>\u003ccode>emp_lpgbt_N\u003c/code> usa control, FIFO, IRQ y registro remoto. \u003ccode>tgc_readUplink_regs\u003c/code> da muestras\u003c/td>\n\u003ctd>Tomar un dato IC por payload, o usar una dirección del chip como offset AXI\u003c/td>\n\u003ctd>Instancia, puertos, mapa y la herramienta que corresponde\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Canales\u003c/td>\n\u003ctd>BD recuperado: 12 instancias. Monitor: 13 posiciones\u003c/td>\n\u003ctd>Leer un campo sin canal o asignar mal la fibra\u003c/td>\n\u003ctd>Build, cableado y UIO de esa sesión\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Máscaras\u003c/td>\n\u003ctd>Plantilla antigua \u003ccode>(1 &lt;&lt; bitWidth) - 1\u003c/code>; las versiones corregidas usan guardas o ULL distintas\u003c/td>\n\u003ctd>Extracción o escritura erróneas; comportamiento indefinido con desplazamientos inválidos\u003c/td>\n\u003ctd>La fuente con la que se compiló el ELF, anchura y offset. No todo \u003ccode>Bus error\u003c/code> es culpa de la máscara\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Selección de datos\u003c/td>\n\u003ctd>Serializer en loopback, PRBS, cable de retorno o FE real\u003c/td>\n\u003ctd>La lectura parece funcionar pero el origen no está probado\u003c/td>\n\u003ctd>Configuración en uso y A/B/A externo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reset\u003c/td>\n\u003ctd>Inicializar al configurar, reset de lógica y reset del MGT no son lo mismo\u003c/td>\n\u003ctd>Recuperación parcial, estado que se conserva o cambios de fase\u003c/td>\n\u003ctd>Qué abarcaba exactamente la acción que antes lo recuperaba\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Cuatro fallos que no hay que mezclar","anchor":"cuatro-fallos-que-no-hay-que-mezclar","text":"## Cuatro fallos que no hay que mezclar\n\n1. Valor equivocado: el acceso vuelve, pero el packing, el canal o la máscara no corresponden.\n2. Muestra vieja: el bus devuelve lo que quedó guardado; quizá el hardware no recibió un trigger nuevo.\n3. Espera del software: el programa repite una condición o espera un evento, y Linux puede seguir funcionando.\n4. Transacción sin terminar: la CPU no consigue completar un acceso o el sistema deja de avanzar. Para decir esto hace falta evidencia del bus o de la CPU, no solo una terminal quieta.\n\nEl diagnóstico completo y sus comandos están en [Lecturas congeladas](10_BLOQUEO_LECTURAS.md). Usa la web para anotar cuál de estos fallos viste; lo que sugiere el diagnóstico es una pista, no una causa confirmada.\n\n","html":"\u003ch2 id=\"cuatro-fallos-que-no-hay-que-mezclar\">Cuatro fallos que no hay que mezclar\u003c/h2>\n\u003col>\n\u003cli>Valor equivocado: el acceso vuelve, pero el packing, el canal o la máscara no corresponden.\u003c/li>\n\u003cli>Muestra vieja: el bus devuelve lo que quedó guardado; quizá el hardware no recibió un trigger nuevo.\u003c/li>\n\u003cli>Espera del software: el programa repite una condición o espera un evento, y Linux puede seguir funcionando.\u003c/li>\n\u003cli>Transacción sin terminar: la CPU no consigue completar un acceso o el sistema deja de avanzar. Para decir esto hace falta evidencia del bus o de la CPU, no solo una terminal quieta.\u003c/li>\n\u003c/ol>\n\u003cp>El diagnóstico completo y sus comandos están en \u003ca href=\"10_BLOQUEO_LECTURAS.md\">Lecturas congeladas\u003c/a>. Usa la web para anotar cuál de estos fallos viste; lo que sugiere el diagnóstico es una pista, no una causa confirmada.\u003c/p>\n"},{"title":"Qué cambió al revisar los problemas","anchor":"qué-cambió-al-revisar-los-problemas","text":"## Qué cambió al revisar los problemas\n\n### El script puede ocultar el movimiento\n\nEn `read_lpgbt10.sh`, `0x000000AA` y `0x123400AA` quedan iguales después de `& 0xff`. Es un ejemplo inventado, no datos de una sesión, pero alcanza para ver que el silencio del script no prueba que los registros no cambien.\n\n### El script puede romper el protocolo de otra interfaz\n\n`watch_devmem.sh` se salta `+0x18` e incluye `+0x28`. Con el mapa de nueve grupos, eso deja fuera un grupo y mete el header. Si se usara con una interfaz que borra al leer, además habría que saber qué lectura confirma la recepción. Eso no prueba que esa omisión causara el bloqueo: no está demostrado que `eLink_Interface_v1` sea el capturador cargado, y sus offsets no se pueden trasplantar.\n\n### Un fallo de generación no es un fallo del interconnect\n\nUna máscara C++ mal hecha es un error real. Pero si `devmem` y el programa C++ fallaran en la misma dirección validada, la máscara del wrapper no explicaría los dos. Y al revés: arreglar la máscara no prueba que el mapa o el firmware estén bien.\n\n### El nombre de una señal no dice su polaridad\n\n`uplinkRst_n_i` parece activo en bajo por el nombre, pero el código modificado lo usa tal cual como reset de la búsqueda de cabecera. Sigue las asignaciones. Cambiarlo por intuición podría meter un fallo nuevo.\n\n","html":"\u003ch2 id=\"qué-cambió-al-revisar-los-problemas\">Qué cambió al revisar los problemas\u003c/h2>\n\u003ch3 id=\"el-script-puede-ocultar-el-movimiento\">El script puede ocultar el movimiento\u003c/h3>\n\u003cp>En \u003ccode>read_lpgbt10.sh\u003c/code>, \u003ccode>0x000000AA\u003c/code> y \u003ccode>0x123400AA\u003c/code> quedan iguales después de \u003ccode>&amp; 0xff\u003c/code>. Es un ejemplo inventado, no datos de una sesión, pero alcanza para ver que el silencio del script no prueba que los registros no cambien.\u003c/p>\n\u003ch3 id=\"el-script-puede-romper-el-protocolo-de-otra-interfaz\">El script puede romper el protocolo de otra interfaz\u003c/h3>\n\u003cp>\u003ccode>watch_devmem.sh\u003c/code> se salta \u003ccode>+0x18\u003c/code> e incluye \u003ccode>+0x28\u003c/code>. Con el mapa de nueve grupos, eso deja fuera un grupo y mete el header. Si se usara con una interfaz que borra al leer, además habría que saber qué lectura confirma la recepción. Eso no prueba que esa omisión causara el bloqueo: no está demostrado que \u003ccode>eLink_Interface_v1\u003c/code> sea el capturador cargado, y sus offsets no se pueden trasplantar.\u003c/p>\n\u003ch3 id=\"un-fallo-de-generación-no-es-un-fallo-del-interconnect\">Un fallo de generación no es un fallo del interconnect\u003c/h3>\n\u003cp>Una máscara C++ mal hecha es un error real. Pero si \u003ccode>devmem\u003c/code> y el programa C++ fallaran en la misma dirección validada, la máscara del wrapper no explicaría los dos. Y al revés: arreglar la máscara no prueba que el mapa o el firmware estén bien.\u003c/p>\n\u003ch3 id=\"el-nombre-de-una-señal-no-dice-su-polaridad\">El nombre de una señal no dice su polaridad\u003c/h3>\n\u003cp>\u003ccode>uplinkRst_n_i\u003c/code> parece activo en bajo por el nombre, pero el código modificado lo usa tal cual como reset de la búsqueda de cabecera. Sigue las asignaciones. Cambiarlo por intuición podría meter un fallo nuevo.\u003c/p>\n"},{"title":"Comprobar la coherencia antes de MMIO","anchor":"comprobar-la-coherencia-antes-de-mmio","text":"## Comprobar la coherencia antes de MMIO\n\nEl objetivo es cerrar el contrato sin explorar a ciegas. Necesitas los artefactos y la salida del inventario A1/A2. En esta fase usa solo los comandos de inventario de [P0](00_GUIA_CAMPO.md); no existe un comando que certifique todo de una vez.\n\nHaz una tabla con nombres, bases, tamaños y offsets de la sesión. Lo que buscas es que cada fila una el ELF con la IP de esa build. Si algo no coincide, el acceso sigue pendiente. Cuidado: un Device Tree viejo puede describir justo lo que esperas sin corresponder al PL cargado. Lo siguiente es pedir la build y el DTBO, o el RTL que falta, no probar direcciones vecinas.\n\n","html":"\u003ch2 id=\"comprobar-la-coherencia-antes-de-mmio\">Comprobar la coherencia antes de MMIO\u003c/h2>\n\u003cp>El objetivo es cerrar el contrato sin explorar a ciegas. Necesitas los artefactos y la salida del inventario A1/A2. En esta fase usa solo los comandos de inventario de \u003ca href=\"00_GUIA_CAMPO.md\">P0\u003c/a>; no existe un comando que certifique todo de una vez.\u003c/p>\n\u003cp>Haz una tabla con nombres, bases, tamaños y offsets de la sesión. Lo que buscas es que cada fila una el ELF con la IP de esa build. Si algo no coincide, el acceso sigue pendiente. Cuidado: un Device Tree viejo puede describir justo lo que esperas sin corresponder al PL cargado. Lo siguiente es pedir la build y el DTBO, o el RTL que falta, no probar direcciones vecinas.\u003c/p>\n"},{"title":"Mejoras que salen de esta revisión","anchor":"mejoras-que-salen-de-esta-revisión","text":"## Mejoras que salen de esta revisión\n\nSin implementar todavía: un ID o versión de ABI; un contador de capturas y un snapshot comprobable; timeouts globales en las operaciones IC; límites y validación de las respuestas; reset explícito de la FSM; validar el payload sin depender de su valor; comprobar automáticamente los mapas generados; y pruebas de recuperación. Tiene sentido priorizarlas solo cuando se encuentre la build real. Ver [Evolución futura](05_EVOLUCION_FUTURA.md).\n","html":"\u003ch2 id=\"mejoras-que-salen-de-esta-revisión\">Mejoras que salen de esta revisión\u003c/h2>\n\u003cp>Sin implementar todavía: un ID o versión de ABI; un contador de capturas y un snapshot comprobable; timeouts globales en las operaciones IC; límites y validación de las respuestas; reset explícito de la FSM; validar el payload sin depender de su valor; comprobar automáticamente los mapas generados; y pruebas de recuperación. Tiene sentido priorizarlas solo cuando se encuentre la build real. Ver \u003ca href=\"05_EVOLUCION_FUTURA.md\">Evolución futura\u003c/a>.\u003c/p>\n"}]},{"id":"12_SCRIPT_DIAGNOSTICO","file":"12_SCRIPT_DIAGNOSTICO.md","title":"Script de diagnóstico: guardar el bloqueo y separar sus causas","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Script de diagnóstico: guardar el bloqueo y separar sus causas\n\nEste script es del 25-10-2026. Pasa sus pruebas locales, pero no se ha probado en la Trenz. `diagnostico/atlas_diagnostico.py` acompaña a las herramientas que ya existen. Por sí mismo no hace MMIO, no escribe registros, no programa el lpGBT, no cambia el estímulo y no reinicia nada. En modo `capturar` sí ejecuta la CLI existente, que lee el hardware y puede tener efectos si el mapa no corresponde.\n\nLa pregunta que intenta responder es qué dejó de avanzar, cuándo y en qué condiciones. Sin señales de progreso visibles no puede encontrar una causa dentro de la FPGA. La causa del bloqueo original sigue sin conocerse.\n\n","html":"\u003ch1 id=\"script-de-diagnóstico-guardar-el-bloqueo-y-separar-sus-causas\">Script de diagnóstico: guardar el bloqueo y separar sus causas\u003c/h1>\n\u003cp>Este script es del 25-10-2026. Pasa sus pruebas locales, pero no se ha probado en la Trenz. \u003ccode>diagnostico/atlas_diagnostico.py\u003c/code> acompaña a las herramientas que ya existen. Por sí mismo no hace MMIO, no escribe registros, no programa el lpGBT, no cambia el estímulo y no reinicia nada. En modo \u003ccode>capturar\u003c/code> sí ejecuta la CLI existente, que lee el hardware y puede tener efectos si el mapa no corresponde.\u003c/p>\n\u003cp>La pregunta que intenta responder es qué dejó de avanzar, cuándo y en qué condiciones. Sin señales de progreso visibles no puede encontrar una causa dentro de la FPGA. La causa del bloqueo original sigue sin conocerse.\u003c/p>\n"},{"title":"1. Qué se puede aprender","anchor":"1-qué-se-puede-aprender","text":"## 1. Qué se puede aprender\n\n| Qué guarda | Qué ayuda a responder | Límite |\n|---|---|---|\n| El intento antes de lanzar la CLI, y el resultado y la duración después | ¿Terminó el comando o quedó un intento sin resultado? | Si se cuelga Linux, puede que no se guarde todo ni se sepa en qué instrucción paró |\n| stdout, stderr, código de salida y estado del proceso al fallar | ¿Fue un valor repetido, un error, una señal o una espera? | Un timeout no prueba un fallo de AXI; el buffering puede esconder lo que se imprimió justo antes |\n| Los nueve grupos completos, el XOR y los bits que cambian | ¿Parecía quieto solo porque se miraba el byte bajo? | Las nueve lecturas son independientes y no forman un snapshot |\n| `magic` y `clk_thresh` | ¿Cambió la identidad aparente o la configuración durante la prueba? | No sabemos qué `magic` esperar en la build cargada, y no es una identificación segura |\n| sysfs del UIO, hashes del lector y dependencias declaradas | ¿Estamos mezclando mapa, binario o biblioteca? | sysfs no prueba que el PL cargado tenga ese mapa, y el enlazado dinámico no se resuelve solo |\n| Hora UTC, tiempo monotónico, boot ID y notas del operador | ¿Cuánto pasó hasta el fallo y qué cambió antes? | La hora es la del software, no la de llegada del frame |\n| Estímulo A/B/A anotado a mano | ¿Los cambios siguen de forma repetible a una causa externa? | La correlación no prueba la ruta ni descarta un loopback |\n\nEl script distingue una muestra incompleta de un cero. Si el payload se repite, lo informa como repetición, no como «receptor congelado». No interpreta `data_header` como número de evento porque no se sabe qué significa.\n\n","html":"\u003ch2 id=\"1-qué-se-puede-aprender\">1. Qué se puede aprender\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qué guarda\u003c/th>\n\u003cth>Qué ayuda a responder\u003c/th>\n\u003cth>Límite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>El intento antes de lanzar la CLI, y el resultado y la duración después\u003c/td>\n\u003ctd>¿Terminó el comando o quedó un intento sin resultado?\u003c/td>\n\u003ctd>Si se cuelga Linux, puede que no se guarde todo ni se sepa en qué instrucción paró\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>stdout, stderr, código de salida y estado del proceso al fallar\u003c/td>\n\u003ctd>¿Fue un valor repetido, un error, una señal o una espera?\u003c/td>\n\u003ctd>Un timeout no prueba un fallo de AXI; el buffering puede esconder lo que se imprimió justo antes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Los nueve grupos completos, el XOR y los bits que cambian\u003c/td>\n\u003ctd>¿Parecía quieto solo porque se miraba el byte bajo?\u003c/td>\n\u003ctd>Las nueve lecturas son independientes y no forman un snapshot\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>magic\u003c/code> y \u003ccode>clk_thresh\u003c/code>\u003c/td>\n\u003ctd>¿Cambió la identidad aparente o la configuración durante la prueba?\u003c/td>\n\u003ctd>No sabemos qué \u003ccode>magic\u003c/code> esperar en la build cargada, y no es una identificación segura\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sysfs del UIO, hashes del lector y dependencias declaradas\u003c/td>\n\u003ctd>¿Estamos mezclando mapa, binario o biblioteca?\u003c/td>\n\u003ctd>sysfs no prueba que el PL cargado tenga ese mapa, y el enlazado dinámico no se resuelve solo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hora UTC, tiempo monotónico, boot ID y notas del operador\u003c/td>\n\u003ctd>¿Cuánto pasó hasta el fallo y qué cambió antes?\u003c/td>\n\u003ctd>La hora es la del software, no la de llegada del frame\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Estímulo A/B/A anotado a mano\u003c/td>\n\u003ctd>¿Los cambios siguen de forma repetible a una causa externa?\u003c/td>\n\u003ctd>La correlación no prueba la ruta ni descarta un loopback\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>El script distingue una muestra incompleta de un cero. Si el payload se repite, lo informa como repetición, no como «receptor congelado». No interpreta \u003ccode>data_header\u003c/code> como número de evento porque no se sabe qué significa.\u003c/p>\n"},{"title":"2. Requisitos y alcance","anchor":"2-requisitos-y-alcance","text":"## 2. Requisitos y alcance\n\nLinux, Python 3.7 o más con su biblioteca estándar, y una carpeta local con espacio libre. No instala nada de Internet ni usa `sudo` por su cuenta. Comprueba primero:\n\n```bash\npython3 --version\n# Desde la raíz de la copia de atlas_emc:\ncd docs/recuperacion\npython3 diagnostico/atlas_diagnostico.py --help\n```\n\nEstos comandos son nuevos y se probaron en local. El `--help` es de nuestro script y no toca el hardware. No corras `tgc_readuplink_cli --help`: la CLI recuperada ignora las opciones y haría sus lecturas [B01].\n\nModos: `inventario`, `identidad`, `preparar`, `capturar`, `anotar` e `informe`. Solo `capturar` ejecuta un proceso de hardware. No hay un modo genérico para meter `devmem`, `lpGbtRegister`, un script de pruebas o un reset. El perfil sirve solo para la variante de nueve grupos de `tgc_readuplink_cli`.\n\nRiesgos que quedan: CPU, disco y sondeos pueden cambiar los tiempos, y una lectura con efectos puede borrar o cambiar datos. El timeout es del supervisor: no cancela de forma fiable una transacción AXI ni garantiza que desaparezca un proceso en estado no interrumpible. Si se cuelga todo el sistema, el script también puede pararse.\n\n","html":"\u003ch2 id=\"2-requisitos-y-alcance\">2. Requisitos y alcance\u003c/h2>\n\u003cp>Linux, Python 3.7 o más con su biblioteca estándar, y una carpeta local con espacio libre. No instala nada de Internet ni usa \u003ccode>sudo\u003c/code> por su cuenta. Comprueba primero:\u003c/p>\n\u003cpre>\u003ccode>python3 --version\n# Desde la raíz de la copia de atlas_emc:\ncd docs/recuperacion\npython3 diagnostico/atlas_diagnostico.py --help\u003c/code>\u003c/pre>\n\u003cp>Estos comandos son nuevos y se probaron en local. El \u003ccode>--help\u003c/code> es de nuestro script y no toca el hardware. No corras \u003ccode>tgc_readuplink_cli --help\u003c/code>: la CLI recuperada ignora las opciones y haría sus lecturas [B01].\u003c/p>\n\u003cp>Modos: \u003ccode>inventario\u003c/code>, \u003ccode>identidad\u003c/code>, \u003ccode>preparar\u003c/code>, \u003ccode>capturar\u003c/code>, \u003ccode>anotar\u003c/code> e \u003ccode>informe\u003c/code>. Solo \u003ccode>capturar\u003c/code> ejecuta un proceso de hardware. No hay un modo genérico para meter \u003ccode>devmem\u003c/code>, \u003ccode>lpGbtRegister\u003c/code>, un script de pruebas o un reset. El perfil sirve solo para la variante de nueve grupos de \u003ccode>tgc_readuplink_cli\u003c/code>.\u003c/p>\n\u003cp>Riesgos que quedan: CPU, disco y sondeos pueden cambiar los tiempos, y una lectura con efectos puede borrar o cambiar datos. El timeout es del supervisor: no cancela de forma fiable una transacción AXI ni garantiza que desaparezca un proceso en estado no interrumpible. Si se cuelga todo el sistema, el script también puede pararse.\u003c/p>\n"},{"title":"3. S0: inventario sin lecturas MMIO","anchor":"3-s0-inventario-sin-lecturas-mmio","text":"## 3. S0: inventario sin lecturas MMIO\n\nObjetivo: tener contexto y, si el fallo ya está pasando, guardar el estado del proceso antes de reiniciar.\n\nNecesitas que Linux responda y una carpeta donde escribir. No hace falta tener el mapa de la FPGA cerrado. No lances otra aplicación de hardware para este paso.\n\n```bash\npython3 diagnostico/atlas_diagnostico.py inventario --salida inventario_01.json\n```\n\nSi ya sabes la ruta absoluta del ejecutable, añade su identidad sin ejecutarlo:\n\n```bash\nprintf 'Ruta absoluta del tgc_readuplink_cli identificado: '\nread -r LECTOR\npython3 diagnostico/atlas_diagnostico.py inventario \\\n  --lector \"$LECTOR\" --salida inventario_lector_01.json\n```\n\nSi el programa original está atascado ahora, inspecciona su PID en vez de lanzar `capturar`:\n\n```bash\nprintf 'PID del proceso que ya está fallando: '\nread -r PID_FALLO\npython3 diagnostico/atlas_diagnostico.py inventario \\\n  --pid \"$PID_FALLO\" --salida inventario_fallo_01.json\n```\n\nLee archivos concretos de `/proc` y metadatos de `/sys/class/uio`, del Device Tree, del FPGA manager y de los overlays. Si le das un archivo, lee su cabecera ELF y su SHA-256. Busca posibles lectores por nombre, descriptores y mapeos. No abre `/dev/uioN` ni `/dev/mem`, y no ejecuta `lsuio`, `ldd`, scripts ni binarios de hardware. No guarda todo el entorno ni contraseñas, pero los mapas, las rutas y algunas variables `LD_*` pueden tener información interna.\n\nSale un JSON con los UIO y mapas disponibles, y con los errores de permisos o atributos que no existen. Un mapa vacío o un FPGA manager sin `firmware` no es un fallo del script ni prueba que el PL esté vacío. Estos metadatos no identifican el bitstream cargado.\n\n`possible_readers.candidates` es una pista: nombres cortados, permisos y carreras impiden garantizar que no haya otro lector. `unreadable_maps` dice qué no pudo mirar. El script no mata procesos de otros. Si no hay Python, usa F0 de [Lecturas congeladas](10_BLOQUEO_LECTURAS.md); no lo instales en mitad de un fallo si eso borra la evidencia.\n\nConsume algo de CPU y disco, puede quedarse corto y el archivo tiene datos internos. Después: si el proceso original no terminó, guarda el inventario y estudia por dónde va. Si la CLI está identificada pero faltan mapa y permisos, sigue con S1. No saltes directo a capturar.\n\n","html":"\u003ch2 id=\"3-s0-inventario-sin-lecturas-mmio\">3. S0: inventario sin lecturas MMIO\u003c/h2>\n\u003cp>Objetivo: tener contexto y, si el fallo ya está pasando, guardar el estado del proceso antes de reiniciar.\u003c/p>\n\u003cp>Necesitas que Linux responda y una carpeta donde escribir. No hace falta tener el mapa de la FPGA cerrado. No lances otra aplicación de hardware para este paso.\u003c/p>\n\u003cpre>\u003ccode>python3 diagnostico/atlas_diagnostico.py inventario --salida inventario_01.json\u003c/code>\u003c/pre>\n\u003cp>Si ya sabes la ruta absoluta del ejecutable, añade su identi
