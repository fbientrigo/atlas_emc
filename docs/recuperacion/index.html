ntrolador de la FPGA para mandar la transacción. Devuelve registros del chip, nunca el payload TGC.\u003c/p>\n\u003cp>Ejecutable: \u003ccode>~/LpGbtSw/build/Demonstrators/LpGbtRegister/lpGbtRegister\u003c/code>. Fuente: \u003ccode>~/LpGbtSw/Demonstrators/LpGbtRegister/lpGbtRegister.cpp\u003c/code>.\u003c/p>\n\u003cp>Sintaxis según el gitingest adjunto: \u003ccode>--address URI\u003c/code>, \u003ccode>--read REG\u003c/code>, \u003ccode>--write REG:VAL\u003c/code>. Compárala con la fuente y el ELF del equipo, y pasa siempre el canal, porque el de por defecto no es el nuestro.\u003c/p>\n\u003cpre>\u003ccode>printf 'URI IC confirmada, lpgbt-uio://emp_lpgbt_N: '\nread -r URI\nprintf 'Registro del chip elegido, en hexadecimal: '\nread -r REG\n~/LpGbtSw/build/Demonstrators/LpGbtRegister/lpGbtRegister \\\n  --address \"$URI\" --read \"$REG\" &gt; registro_01.out 2&gt; registro_01.err\u003c/code>\u003c/pre>\n\u003cp>Imprime la dirección y el byte en hexadecimal. Un registro del chip y un offset AXI son espacios distintos: no sumes la dirección de un registro lpGBT a A00E0000.\u003c/p>\n\u003cp>Ejemplo con el simulador, sin chip real:\u003c/p>\n\u003cpre>\u003ccode>~/LpGbtSw/build/Demonstrators/LpGbtRegister/lpGbtRegister \\\n  --address lpgbt-simulator://emp_lpgbt_9 --read 0x000\u003c/code>\u003c/pre>\n\u003cp>El backend tiene bucles sin límite en clearIntr y al vaciar la FIFO, y el timeout de IRQ no los corta. La build guardada usa mapas V1; confirma qué versión de chip hay.\u003c/p>\n"},{"title":"Configuración, ADC y GPIO","anchor":"configuración-adc-y-gpio","text":"## Configuración, ADC y GPIO\n\nFuentes en `~/LpGbtSw/Demonstrators/` y ejecutables en `~/LpGbtSw/build/Demonstrators/`. Las opciones salen del gitingest; compáralas con la versión instalada.\n\n| Programa | Qué hace |\n|---|---|\n| `LpGbtConfiguration/lpGbtConfiguration` | `--read` lee registros y crea un `.cnf` en la carpeta actual (hazlo en una carpeta nueva). `--write FILE` carga una configuración. |\n| `LpGbtAdc/lpGbtAdc` | `--frequency F --iterations N`. Cada iteración convierte los ocho canales ADC internos del lpGBT; el ADC del front-end es otro. |\n| `LpGbtGpio/lpGbtGpio` | `--pin 0…15 --read`; también `--write low/high` y `--direction input/output`. Confirma el pinout antes de cambiar niveles o dirección. |\n| `RegisterTranslator/registerTranslator` | Ejemplo y benchmark que traduce nombres a direcciones. En la fuente adjunta corre en local, sin hablar con el chip. |\n\nEjemplos sueltos, con URI y pin ya elegidos. Los tres primeros mueven el chip, así que no pegues el bloque entero como si fuera una inicialización:\n\n```bash\ncd ~/LpGbtSw/build/Demonstrators\n./LpGbtConfiguration/lpGbtConfiguration --address \"$URI\" --read\n./LpGbtAdc/lpGbtAdc --address \"$URI\" --frequency 1 --iterations 1\n./LpGbtGpio/lpGbtGpio --address \"$URI\" --pin \"$PIN\" --read\n# Carga de configuración, solo después de elegir el archivo:\n# ./LpGbtConfiguration/lpGbtConfiguration --address \"$URI\" --write CONFIG.cnf\n# Benchmark local de traducción en la fuente adjunta:\n# ./RegisterTranslator/registerTranslator --iterations 1\n```\n\nEn `0922-Conectando a LPGBT.md` hay lecturas con `emp_lpgbt_10`, firmware 0.2v y PiGBT. La nota `0919-PostReunionEMP_team.md` cuenta errores al usar el canal por defecto o al pasar la URI sin opción; usa `-a` o `--address`. Antes de copiar una configuración, mira de qué montaje era.\n\n","html":"\u003ch2 id=\"configuración-adc-y-gpio\">Configuración, ADC y GPIO\u003c/h2>\n\u003cp>Fuentes en \u003ccode>~/LpGbtSw/Demonstrators/\u003c/code> y ejecutables en \u003ccode>~/LpGbtSw/build/Demonstrators/\u003c/code>. Las opciones salen del gitingest; compáralas con la versión instalada.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Programa\u003c/th>\n\u003cth>Qué hace\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>LpGbtConfiguration/lpGbtConfiguration\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>--read\u003c/code> lee registros y crea un \u003ccode>.cnf\u003c/code> en la carpeta actual (hazlo en una carpeta nueva). \u003ccode>--write FILE\u003c/code> carga una configuración.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LpGbtAdc/lpGbtAdc\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>--frequency F --iterations N\u003c/code>. Cada iteración convierte los ocho canales ADC internos del lpGBT; el ADC del front-end es otro.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LpGbtGpio/lpGbtGpio\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>--pin 0…15 --read\u003c/code>; también \u003ccode>--write low/high\u003c/code> y \u003ccode>--direction input/output\u003c/code>. Confirma el pinout antes de cambiar niveles o dirección.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>RegisterTranslator/registerTranslator\u003c/code>\u003c/td>\n\u003ctd>Ejemplo y benchmark que traduce nombres a direcciones. En la fuente adjunta corre en local, sin hablar con el chip.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Ejemplos sueltos, con URI y pin ya elegidos. Los tres primeros mueven el chip, así que no pegues el bloque entero como si fuera una inicialización:\u003c/p>\n\u003cpre>\u003ccode>cd ~/LpGbtSw/build/Demonstrators\n./LpGbtConfiguration/lpGbtConfiguration --address \"$URI\" --read\n./LpGbtAdc/lpGbtAdc --address \"$URI\" --frequency 1 --iterations 1\n./LpGbtGpio/lpGbtGpio --address \"$URI\" --pin \"$PIN\" --read\n# Carga de configuración, solo después de elegir el archivo:\n# ./LpGbtConfiguration/lpGbtConfiguration --address \"$URI\" --write CONFIG.cnf\n# Benchmark local de traducción en la fuente adjunta:\n# ./RegisterTranslator/registerTranslator --iterations 1\u003c/code>\u003c/pre>\n\u003cp>En \u003ccode>0922-Conectando a LPGBT.md\u003c/code> hay lecturas con \u003ccode>emp_lpgbt_10\u003c/code>, firmware 0.2v y PiGBT. La nota \u003ccode>0919-PostReunionEMP_team.md\u003c/code> cuenta errores al usar el canal por defecto o al pasar la URI sin opción; usa \u003ccode>-a\u003c/code> o \u003ccode>--address\u003c/code>. Antes de copiar una configuración, mira de qué montaje era.\u003c/p>\n"},{"title":"clkProgrammer","anchor":"clkprogrammer","text":"## clkProgrammer\n\nEjecutable: `~/EMPToolsArtifacts/bin_TRENZ/clkProgrammer`; antes estaba instalado en `/usr/bin/clkProgrammer`. Fuente de la CLI: `~/emp-tools/empTools/si5345_i2c/main_si5345.cpp`; driver: `~/emp-tools/src/i2cDevices/si5345.cpp`.\n\n| Opción | Efecto |\n|---|---|\n| `-i`, `--read_mon_info` | Lee por I2C la revisión y los estados LOS, OOF, LOL y flags. |\n| `-c`, `--configure` | Programa la configuración Si5345 compilada dentro del ejecutable. |\n\nElige una sola acción. La fuente usa i2c-13 para TRENZ e i2c-1 para EMP, dirección 0x69. Comprueba el bus actual.\n\n```bash\n# Consultar la unidad no inicia el programador:\nsystemctl cat systemd-programclock.service\n# Consulta I2C activa: solo con bus y página comprobados.\n# sudo /usr/bin/clkProgrammer -i > reloj_01.out 2> reloj_01.err\n# Programación: solo con configuración y alcance aprobados.\n# sudo /usr/bin/clkProgrammer -c\n```\n\nOjo con la fuente: `writeRegister` selecciona página y `readRegister` no. El postámbulo termina en la página 0B, así que la lectura de estado puede salir mal si quedó otra página puesta. Además, una excepción capturada puede terminar con retorno 0; revisa los logs, no solo `$?`.\n\n","html":"\u003ch2 id=\"clkprogrammer\">clkProgrammer\u003c/h2>\n\u003cp>Ejecutable: \u003ccode>~/EMPToolsArtifacts/bin_TRENZ/clkProgrammer\u003c/code>; antes estaba instalado en \u003ccode>/usr/bin/clkProgrammer\u003c/code>. Fuente de la CLI: \u003ccode>~/emp-tools/empTools/si5345_i2c/main_si5345.cpp\u003c/code>; driver: \u003ccode>~/emp-tools/src/i2cDevices/si5345.cpp\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Opción\u003c/th>\n\u003cth>Efecto\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>-i\u003c/code>, \u003ccode>--read_mon_info\u003c/code>\u003c/td>\n\u003ctd>Lee por I2C la revisión y los estados LOS, OOF, LOL y flags.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>-c\u003c/code>, \u003ccode>--configure\u003c/code>\u003c/td>\n\u003ctd>Programa la configuración Si5345 compilada dentro del ejecutable.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Elige una sola acción. La fuente usa i2c-13 para TRENZ e i2c-1 para EMP, dirección 0x69. Comprueba el bus actual.\u003c/p>\n\u003cpre>\u003ccode># Consultar la unidad no inicia el programador:\nsystemctl cat systemd-programclock.service\n# Consulta I2C activa: solo con bus y página comprobados.\n# sudo /usr/bin/clkProgrammer -i &gt; reloj_01.out 2&gt; reloj_01.err\n# Programación: solo con configuración y alcance aprobados.\n# sudo /usr/bin/clkProgrammer -c\u003c/code>\u003c/pre>\n\u003cp>Ojo con la fuente: \u003ccode>writeRegister\u003c/code> selecciona página y \u003ccode>readRegister\u003c/code> no. El postámbulo termina en la página 0B, así que la lectura de estado puede salir mal si quedó otra página puesta. Además, una excepción capturada puede terminar con retorno 0; revisa los logs, no solo \u003ccode>$?\u003c/code>.\u003c/p>\n"},{"title":"Firmware y scripts","anchor":"firmware-y-scripts","text":"## Firmware y scripts\n\nDescripciones XSA: `~/epos/hw-description/`. BSP: `~/epos/epos-bsp/`. Cargador: `~/epos/etools/loadFirmare.sh` (sí, se escribe así). Copia en el repo: `atlas_emc/atlas_epos/etools/loadFirmare.sh`.\n\nPara listar archivos en la placa: `bash ~/epos/etools/loadFirmare.sh -l`. Usa `-l` y `-h`; en esta versión el `getopts` rechaza las opciones largas. Cargar quita el overlay anterior y no hay vuelta atrás automática.\n\nEn el repo hay tres parejas DTBO/bit.bin en `atlas_epos/etools/xsa-to-overlays/xsa-to-overlays/out_lpgbt_10_{cd,dd,direct}/`. Ponen PRBS en A00D y TGC en A00E. No sabemos qué relación tienen con `reading_1006.dtbo`.\n\n| Script en `~` | Qué conviene saber |\n|---|---|\n| `read_lpgbt10.sh` | Espera sin límite a que cambie el byte bajo, aunque el resto de la palabra ya esté cambiando. |\n| `watch_devmem.sh` | Se salta +0x18, incluye el header y oculta stderr. No lee los nueve grupos. |\n| `sweep_clock.sh` | Escribe clk_thresh; el Si5345 no lo toca. Un fallo de lectura puede salir como cero. |\n| `test_saturation.sh`, `1024/send_and_read.sh` | Escriben patrones en direcciones antiguas. A pesar del nombre, no miden tasa ni BER. |\n\n","html":"\u003ch2 id=\"firmware-y-scripts\">Firmware y scripts\u003c/h2>\n\u003cp>Descripciones XSA: \u003ccode>~/epos/hw-description/\u003c/code>. BSP: \u003ccode>~/epos/epos-bsp/\u003c/code>. Cargador: \u003ccode>~/epos/etools/loadFirmare.sh\u003c/code> (sí, se escribe así). Copia en el repo: \u003ccode>atlas_emc/atlas_epos/etools/loadFirmare.sh\u003c/code>.\u003c/p>\n\u003cp>Para listar archivos en la placa: \u003ccode>bash ~/epos/etools/loadFirmare.sh -l\u003c/code>. Usa \u003ccode>-l\u003c/code> y \u003ccode>-h\u003c/code>; en esta versión el \u003ccode>getopts\u003c/code> rechaza las opciones largas. Cargar quita el overlay anterior y no hay vuelta atrás automática.\u003c/p>\n\u003cp>En el repo hay tres parejas DTBO/bit.bin en \u003ccode>atlas_epos/etools/xsa-to-overlays/xsa-to-overlays/out_lpgbt_10_{cd,dd,direct}/\u003c/code>. Ponen PRBS en A00D y TGC en A00E. No sabemos qué relación tienen con \u003ccode>reading_1006.dtbo\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Script en \u003ccode>~\u003c/code>\u003c/th>\n\u003cth>Qué conviene saber\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>read_lpgbt10.sh\u003c/code>\u003c/td>\n\u003ctd>Espera sin límite a que cambie el byte bajo, aunque el resto de la palabra ya esté cambiando.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>watch_devmem.sh\u003c/code>\u003c/td>\n\u003ctd>Se salta +0x18, incluye el header y oculta stderr. No lee los nueve grupos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sweep_clock.sh\u003c/code>\u003c/td>\n\u003ctd>Escribe clk_thresh; el Si5345 no lo toca. Un fallo de lectura puede salir como cero.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>test_saturation.sh\u003c/code>, \u003ccode>1024/send_and_read.sh\u003c/code>\u003c/td>\n\u003ctd>Escriben patrones en direcciones antiguas. A pesar del nombre, no miden tasa ni BER.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Mapas y versiones","anchor":"mapas-y-versiones","text":"## Mapas y versiones\n\nEl [mapa UIO de noviembre](15_OPERAR_EMP.md#bancos-y-mapa) tiene trece bancos de lectura y el bloque CMB. Esta tabla resume las variantes anteriores. Sirve para comparar archivos, no para elegir qué leer:\n\n| Diseño | A00D0000 | A00E0000 |\n|---|---|---|\n| BD `emp_fw_TE0807`, Vivado 2023.2 | `axi_intc_1` | `axi_intc_2` |\n| XSA xV23 Trenz / EMP del home | Interfaz e-link | Sin MEMRANGE declarado allí |\n| Overlays `out_lpgbt_10_*` del repo | `Read_PRBS_regs` | `tgc_readUplink_regs` |\n\nPara el lector TGC de nueve grupos: magic `0x00`, grupo g en `0x04+4g`, header `0x28` y threshold `0x2C`. Sin el RTL del capturador cargado no sabemos el packing, el rearme, la retención ni la coherencia. Nueve palabras no son necesariamente una trama, y nada indica que threshold esté en Hz.\n\n","html":"\u003ch2 id=\"mapas-y-versiones\">Mapas y versiones\u003c/h2>\n\u003cp>El \u003ca href=\"15_OPERAR_EMP.md#bancos-y-mapa\">mapa UIO de noviembre\u003c/a> tiene trece bancos de lectura y el bloque CMB. Esta tabla resume las variantes anteriores. Sirve para comparar archivos, no para elegir qué leer:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Diseño\u003c/th>\n\u003cth>A00D0000\u003c/th>\n\u003cth>A00E0000\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>BD \u003ccode>emp_fw_TE0807\u003c/code>, Vivado 2023.2\u003c/td>\n\u003ctd>\u003ccode>axi_intc_1\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>axi_intc_2\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>XSA xV23 Trenz / EMP del home\u003c/td>\n\u003ctd>Interfaz e-link\u003c/td>\n\u003ctd>Sin MEMRANGE declarado allí\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Overlays \u003ccode>out_lpgbt_10_*\u003c/code> del repo\u003c/td>\n\u003ctd>\u003ccode>Read_PRBS_regs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>tgc_readUplink_regs\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Para el lector TGC de nueve grupos: magic \u003ccode>0x00\u003c/code>, grupo g en \u003ccode>0x04+4g\u003c/code>, header \u003ccode>0x28\u003c/code> y threshold \u003ccode>0x2C\u003c/code>. Sin el RTL del capturador cargado no sabemos el packing, el rearme, la retención ni la coherencia. Nueve palabras no son necesariamente una trama, y nada indica que threshold esté en Hz.\u003c/p>\n"},{"title":"Guardar una lectura","anchor":"guardar-una-lectura","text":"## Guardar una lectura\n\nPara guardar datos hoy, usa la [captura CSV con emp](15_OPERAR_EMP.md#guardar-una-captura). Lo de abajo usa la CLI anterior y guarda también stderr y el código de salida.\n\nEl supervisor está en `atlas_emc/docs/recuperacion/diagnostico/atlas_diagnostico.py`. Desde la raíz del repo en la placa:\n\n```bash\nDIAG=\"$PWD/docs/recuperacion/diagnostico/atlas_diagnostico.py\"\npython3 \"$DIAG\" inventario --lector ~/read_all_lpgbt/tgc_readuplink_cli \\\n  --salida inventario_01.json\npython3 \"$DIAG\" preparar --inventario inventario_01.json --salida plan_01.json\n```\n\nEsto solo mira archivos y metadatos. El plan sale bloqueado: hay que llenar las pruebas en `validation` y las bibliotecas en `libraries`. Revisa build y mapa, ELF y dependencias, efectos de la lectura, que haya un solo operador y quién responde por la operación. El script no comprueba eso por ti. [Detalle del plan](12_SCRIPT_DIAGNOSTICO.md#4-s1-plan-de-lectura-revisable).\n\nDespués de esa revisión, la captura sí toca el hardware:\n\n```bash\npython3 \"$DIAG\" capturar --plan plan_01.json --salida sesion_01 \\\n  --fase inicial --muestras 3 --intervalo 5 --timeout 3 --autorizar-lecturas\npython3 \"$DIAG\" informe --sesion sesion_01 --salida informe_01.md\n```\n\nGuarda toda la sesión, con errores y retornos. Un timeout no asegura que se corte una transacción AXI. No borres el lock para saltarte un fallo ni abras otro lector con un acceso pendiente. El informe se hace sin la placa. Para [comparar A y B](#comparar), carga los `.out` de fases conocidas, lejos de los cambios.\n\n","html":"\u003ch2 id=\"guardar-una-lectura\">Guardar una lectura\u003c/h2>\n\u003cp>Para guardar datos hoy, usa la \u003ca href=\"15_OPERAR_EMP.md#guardar-una-captura\">captura CSV con emp\u003c/a>. Lo de abajo usa la CLI anterior y guarda también stderr y el código de salida.\u003c/p>\n\u003cp>El supervisor está en \u003ccode>atlas_emc/docs/recuperacion/diagnostico/atlas_diagnostico.py\u003c/code>. Desde la raíz del repo en la placa:\u003c/p>\n\u003cpre>\u003ccode>DIAG=\"$PWD/docs/recuperacion/diagnostico/atlas_diagnostico.py\"\npython3 \"$DIAG\" inventario --lector ~/read_all_lpgbt/tgc_readuplink_cli \\\n  --salida inventario_01.json\npython3 \"$DIAG\" preparar --inventario inventario_01.json --salida plan_01.json\u003c/code>\u003c/pre>\n\u003cp>Esto solo mira archivos y metadatos. El plan sale bloqueado: hay que llenar las pruebas en \u003ccode>validation\u003c/code> y las bibliotecas en \u003ccode>libraries\u003c/code>. Revisa build y mapa, ELF y dependencias, efectos de la lectura, que haya un solo operador y quién responde por la operación. El script no comprueba eso por ti. \u003ca href=\"12_SCRIPT_DIAGNOSTICO.md#4-s1-plan-de-lectura-revisable\">Detalle del plan\u003c/a>.\u003c/p>\n\u003cp>Después de esa revisión, la captura sí toca el hardware:\u003c/p>\n\u003cpre>\u003ccode>python3 \"$DIAG\" capturar --plan plan_01.json --salida sesion_01 \\\n  --fase inicial --muestras 3 --intervalo 5 --timeout 3 --autorizar-lecturas\npython3 \"$DIAG\" informe --sesion sesion_01 --salida informe_01.md\u003c/code>\u003c/pre>\n\u003cp>Guarda toda la sesión, con errores y retornos. Un timeout no asegura que se corte una transacción AXI. No borres el lock para saltarte un fallo ni abras otro lector con un acceso pendiente. El informe se hace sin la placa. Para \u003ca href=\"#comparar\">comparar A y B\u003c/a>, carga los \u003ccode>.out\u003c/code> de fases conocidas, lejos de los cambios.\u003c/p>\n"},{"title":"Si los registros se quedan pegados","anchor":"si-los-registros-se-quedan-pegados","text":"## Si los registros se quedan pegados\n\n| Qué pasa | Qué mirar primero |\n|---|---|\n| El programa termina, pero devuelve lo mismo | Compara los 32 bits y cambia una señal conocida del FE. Puede ser un dato constante, uno retenido o el canal equivocado. |\n| El script sigue vivo y el byte bajo no cambia | Revisa el `& 0xff` y mira la palabra completa. |\n| No vuelve al prompt, pero Linux responde | Guarda PID, estado, wchan, mapeos y salida. No abras otro lector. |\n| Se atasca `lpGbtRegister` | Revisa la ruta IC y sus esperas. La CLI TGC no espera IRQ, así que esa causa no le aplica. |\n| UserData cambia pero AXI queda fijo | Revisa captura y rearme, si las dos cosas son del mismo canal y build. Para ver UserData hace falta instrumentación; la CLI no llega. |\n\nAntes del reset guarda la última lectura buena, la primera mala, firmware y mapa, configuración, estímulo, PID, sesión y lock, y los estados que tengas. Anota qué se reinició exactamente. Que vuelva a funcionar no prueba que fuera una FIFO: el arranque también puede reprogramar el reloj.\n\n","html":"\u003ch2 id=\"si-los-registros-se-quedan-pegados\">Si los registros se quedan pegados\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qué pasa\u003c/th>\n\u003cth>Qué mirar primero\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>El programa termina, pero devuelve lo mismo\u003c/td>\n\u003ctd>Compara los 32 bits y cambia una señal conocida del FE. Puede ser un dato constante, uno retenido o el canal equivocado.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>El script sigue vivo y el byte bajo no cambia\u003c/td>\n\u003ctd>Revisa el \u003ccode>&amp; 0xff\u003c/code> y mira la palabra completa.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>No vuelve al prompt, pero Linux responde\u003c/td>\n\u003ctd>Guarda PID, estado, wchan, mapeos y salida. No abras otro lector.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Se atasca \u003ccode>lpGbtRegister\u003c/code>\u003c/td>\n\u003ctd>Revisa la ruta IC y sus esperas. La CLI TGC no espera IRQ, así que esa causa no le aplica.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UserData cambia pero AXI queda fijo\u003c/td>\n\u003ctd>Revisa captura y rearme, si las dos cosas son del mismo canal y build. Para ver UserData hace falta instrumentación; la CLI no llega.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Antes del reset guarda la última lectura buena, la primera mala, firmware y mapa, configuración, estímulo, PID, sesión y lock, y los estados que tengas. Anota qué se reinició exactamente. Que vuelva a funcionar no prueba que fuera una FIFO: el arranque también puede reprogramar el reloj.\u003c/p>\n"},{"title":"Qué falta confirmar","anchor":"qué-falta-confirmar","text":"## Qué falta confirmar\n\n- Qué firmware está cargado y cómo se relacionan nombre, DTBO, bitstream y mapa.\n- Qué configuración PiGBT o `.cnf` se usó de verdad, y el canal y la fuente del Serializer.\n- Packing FE → e-link → grupos; trigger, rearme y efectos de la lectura.\n- Si el fallo original era un proceso bloqueado o valores repetidos.\n\nHay varias familias de mapas y varias copias de cada ejecutable. El estado actual del hardware sigue sin comprobar.\n","html":"\u003ch2 id=\"qué-falta-confirmar\">Qué falta confirmar\u003c/h2>\n\u003cul>\n\u003cli>Qué firmware está cargado y cómo se relacionan nombre, DTBO, bitstream y mapa.\u003c/li>\n\u003cli>Qué configuración PiGBT o \u003ccode>.cnf\u003c/code> se usó de verdad, y el canal y la fuente del Serializer.\u003c/li>\n\u003cli>Packing FE → e-link → grupos; trigger, rearme y efectos de la lectura.\u003c/li>\n\u003cli>Si el fallo original era un proceso bloqueado o valores repetidos.\u003c/li>\n\u003c/ul>\n\u003cp>Hay varias familias de mapas y varias copias de cada ejecutable. El estado actual del hardware sigue sin comprobar.\u003c/p>\n"}]},{"id":"15_OPERAR_EMP","file":"15_OPERAR_EMP.md","title":"Leer y guardar datos del EMP","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Leer y guardar datos del EMP\n\n","html":"\u003ch1 id=\"leer-y-guardar-datos-del-emp\">Leer y guardar datos del EMP\u003c/h1>\n"},{"title":"Leer en la Trenz","anchor":"leer-en-la-trenz","text":"## Leer en la Trenz\n\nCon el firmware cargado y `capture/` en el home de la Trenz:\n\n```bash\ncd ~/capture\nsudo ./emp doctor\nsudo ./emp read\nsudo ./emp watch --all --count 20 --interval-ms 100\n```\n\n`doctor` lista los UIO y hace ocho lecturas del banco elegido. `read` muestra una observación completa. `watch` muestra 20 observaciones, aunque se repitan. Corre los comandos de a uno para revisar cada salida.\n\nPara instalar la herramienta, descarga [emp-capture.tar.gz](https://fbientrigo.github.io/atlas_emc/emp-capture.tar.gz) y cópialo al home de la Trenz. Si ya tienes `~/capture`, extrae el paquete en otra carpeta para no perder tu configuración ni tus corridas. Necesita Python 3.7 o más y la `libuio.so` de la placa.\n\n```bash\ncd ~\ntar -xzf emp-capture.tar.gz\ncd capture\npython3 test_capture.py\n```\n\n","html":"\u003ch2 id=\"leer-en-la-trenz\">Leer en la Trenz\u003c/h2>\n\u003cp>Con el firmware cargado y \u003ccode>capture/\u003c/code> en el home de la Trenz:\u003c/p>\n\u003cpre>\u003ccode>cd ~/capture\nsudo ./emp doctor\nsudo ./emp read\nsudo ./emp watch --all --count 20 --interval-ms 100\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>doctor\u003c/code> lista los UIO y hace ocho lecturas del banco elegido. \u003ccode>read\u003c/code> muestra una observación completa. \u003ccode>watch\u003c/code> muestra 20 observaciones, aunque se repitan. Corre los comandos de a uno para revisar cada salida.\u003c/p>\n\u003cp>Para instalar la herramienta, descarga \u003ca href=\"https://fbientrigo.github.io/atlas_emc/emp-capture.tar.gz\">emp-capture.tar.gz\u003c/a> y cópialo al home de la Trenz. Si ya tienes \u003ccode>~/capture\u003c/code>, extrae el paquete en otra carpeta para no perder tu configuración ni tus corridas. Necesita Python 3.7 o más y la \u003ccode>libuio.so\u003c/code> de la placa.\u003c/p>\n\u003cpre>\u003ccode>cd ~\ntar -xzf emp-capture.tar.gz\ncd capture\npython3 test_capture.py\u003c/code>\u003c/pre>\n"},{"title":"Guardar una captura","anchor":"guardar-una-captura","text":"## Guardar una captura\n\nPrueba primero con una ráfaga corta. Cuando termine, usa el segundo `start` para dejar una corrida nocturna.\n\n```bash\ncd ~/capture\nsudo ./emp start --bursts 1 --count 1000 --interval-ms 1\n./emp status\n```\n\n```bash\nsudo ./emp start --delay-min 10 --bursts 96 --every-min 5 --count 10000 --interval-ms 1\n./emp status\n# Para terminar antes:\n# ./emp stop\n```\n\nLos datos quedan en `~/capture/runs/\u003ccorrida>/data.csv`. `./emp status` muestra la ruta completa y cuántas filas lleva. La corrida sigue aunque cierres SSH. `stop` conserva lo escrito, incluida la última ráfaga a medias.\n\nEl plan nocturno escribe 960.000 filas, unos 158 MiB, y dura cerca de 8 h 05 min si se cumple la cadencia pedida. Cada fila tiene las palabras crudas, el tiempo Unix en ns y lo que tardó la lectura. El intervalo real lo decide Linux. Como cada palabra se lee por separado, el CSV es un registro de sondeos MMIO.\n\n","html":"\u003ch2 id=\"guardar-una-captura\">Guardar una captura\u003c/h2>\n\u003cp>Prueba primero con una ráfaga corta. Cuando termine, usa el segundo \u003ccode>start\u003c/code> para dejar una corrida nocturna.\u003c/p>\n\u003cpre>\u003ccode>cd ~/capture\nsudo ./emp start --bursts 1 --count 1000 --interval-ms 1\n./emp status\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>sudo ./emp start --delay-min 10 --bursts 96 --every-min 5 --count 10000 --interval-ms 1\n./emp status\n# Para terminar antes:\n# ./emp stop\u003c/code>\u003c/pre>\n\u003cp>Los datos quedan en \u003ccode>~/capture/runs/&lt;corrida&gt;/data.csv\u003c/code>. \u003ccode>./emp status\u003c/code> muestra la ruta completa y cuántas filas lleva. La corrida sigue aunque cierres SSH. \u003ccode>stop\u003c/code> conserva lo escrito, incluida la última ráfaga a medias.\u003c/p>\n\u003cp>El plan nocturno escribe 960.000 filas, unos 158 MiB, y dura cerca de 8 h 05 min si se cumple la cadencia pedida. Cada fila tiene las palabras crudas, el tiempo Unix en ns y lo que tardó la lectura. El intervalo real lo decide Linux. Como cada palabra se lee por separado, el CSV es un registro de sondeos MMIO.\u003c/p>\n"},{"title":"Diagnosticar lo que ves","anchor":"diagnosticar-lo-que-ves","text":"## Diagnosticar lo que ves\n\n| Qué ves o qué quieres saber | Qué hacer |\n|---|---|\n| `watch` muestra una sola línea | Por defecto imprime la primera observación y después solo los cambios en `data_group_0…7`. Usa `watch --all --count 20 --interval-ms 100` para ver también `data_group_8` y las muestras repetidas. |\n| Guardar los cambios de 0…7 | `sudo ./emp watch \\| tee cambios.log`. Se corta con Ctrl+C. |\n| Comparar `data_group_0` leyendo la dirección física | `sudo ./raw.sh 0xA00E0004` con el mapa por defecto. Con un patrón estable, compáralo con `sudo ./emp read`. |\n| Saber qué bancos cambian | `sudo ./emp doctor --all` revisa todos los bancos. Para usar uno con `read`, `watch` o `start`, pon su nombre, base y offsets en un JSON y pásalo con `--config`. |\n| Saber si el chip responde por IC | `sudo ./emp doctor --probe 10`. Hace una transacción de control con IRQ, así que úsalo con el canal IC libre. |\n| Los grupos 0…7 siguen en cero | Aplica un patrón A/B/A conocido desde el front-end, lee el banco que siga ese estímulo y revisa el cableado en Vivado. |\n\nEn la Trenz, el 19 de noviembre de 2026, aparecieron 13 interfaces IC y 13 bancos de observación. En `tgc_readUplink_regs` (`0xA00E0000`), entre ocho lecturas solo cambió `data_group_8`. Los grupos 0…7, el header y magic dieron cero, y `raw.sh` también dio cero para el grupo 0. `clk_thresh` leyó `0xB0` en ese montaje.\n\nCon `doctor --probe all`, solo `emp_lpgbt_10` devolvió un byte comprobable: `0xAE` en `0x1D7`. Las otras 12 consultas terminaron en `waitIntr` con `rc=-6`. O sea, el enlace 10 responde por IC. Falta saber qué banco de datos le corresponde y si llegan datos del front-end; eso lo dice el estímulo A/B/A.\n\n[Comparar dos salidas de emp read](#comparar) · [Investigar registros pegados](10_BLOQUEO_LECTURAS.md)\n\n","html":"\u003ch2 id=\"diagnosticar-lo-que-ves\">Diagnosticar lo que ves\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qué ves o qué quieres saber\u003c/th>\n\u003cth>Qué hacer\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>watch\u003c/code> muestra una sola línea\u003c/td>\n\u003ctd>Por defecto imprime la primera observación y después solo los cambios en \u003ccode>data_group_0…7\u003c/code>. Usa \u003ccode>watch --all --count 20 --interval-ms 100\u003c/code> para ver también \u003ccode>data_group_8\u003c/code> y las muestras repetidas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Guardar los cambios de 0…7\u003c/td>\n\u003ctd>\u003ccode>sudo ./emp watch | tee cambios.log\u003c/code>. Se corta con Ctrl+C.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Comparar \u003ccode>data_group_0\u003c/code> leyendo la dirección física\u003c/td>\n\u003ctd>\u003ccode>sudo ./raw.sh 0xA00E0004\u003c/code> con el mapa por defecto. Con un patrón estable, compáralo con \u003ccode>sudo ./emp read\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saber qué bancos cambian\u003c/td>\n\u003ctd>\u003ccode>sudo ./emp doctor --all\u003c/code> revisa todos los bancos. Para usar uno con \u003ccode>read\u003c/code>, \u003ccode>watch\u003c/code> o \u003ccode>start\u003c/code>, pon su nombre, base y offsets en un JSON y pásalo con \u003ccode>--config\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Saber si el chip responde por IC\u003c/td>\n\u003ctd>\u003ccode>sudo ./emp doctor --probe 10\u003c/code>. Hace una transacción de control con IRQ, así que úsalo con el canal IC libre.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Los grupos 0…7 siguen en cero\u003c/td>\n\u003ctd>Aplica un patrón A/B/A conocido desde el front-end, lee el banco que siga ese estímulo y revisa el cableado en Vivado.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>En la Trenz, el 19 de noviembre de 2026, aparecieron 13 interfaces IC y 13 bancos de observación. En \u003ccode>tgc_readUplink_regs\u003c/code> (\u003ccode>0xA00E0000\u003c/code>), entre ocho lecturas solo cambió \u003ccode>data_group_8\u003c/code>. Los grupos 0…7, el header y magic dieron cero, y \u003ccode>raw.sh\u003c/code> también dio cero para el grupo 0. \u003ccode>clk_thresh\u003c/code> leyó \u003ccode>0xB0\u003c/code> en ese montaje.\u003c/p>\n\u003cp>Con \u003ccode>doctor --probe all\u003c/code>, solo \u003ccode>emp_lpgbt_10\u003c/code> devolvió un byte comprobable: \u003ccode>0xAE\u003c/code> en \u003ccode>0x1D7\u003c/code>. Las otras 12 consultas terminaron en \u003ccode>waitIntr\u003c/code> con \u003ccode>rc=-6\u003c/code>. O sea, el enlace 10 responde por IC. Falta saber qué banco de datos le corresponde y si llegan datos del front-end; eso lo dice el estímulo A/B/A.\u003c/p>\n\u003cp>\u003ca href=\"#comparar\">Comparar dos salidas de emp read\u003c/a> · \u003ca href=\"10_BLOQUEO_LECTURAS.md\">Investigar registros pegados\u003c/a>\u003c/p>\n"},{"title":"Bancos y mapa","anchor":"bancos-y-mapa","text":"## Bancos y mapa\n\n| Bloque | Nombre UIO | Base física |\n|---|---|---|\n| Banco por defecto | `tgc_readUplink_regs` | `0xA00E0000` |\n| Bancos 1 a 12 | `tgc_readUplink_regs_N` | `0xA00E0000 + N × 0x10000` |\n| Banco 10 | `tgc_readUplink_regs_10` | `0xA0180000` |\n| Captura de eventos CMB | `cmb_event_regs_0` | `0xA01B0000` |\n\nEl número de `/dev/uioN` puede cambiar con el overlay, por eso el lector busca por nombre y comprueba la base. Ojo con los nombres: `emp_lpgbt_10` es el controlador IC y `tgc_readUplink_regs_10` es un banco MMIO.\n\nEn el mapa por defecto, los offsets en bytes son: `magic +0x00`, grupos 0…8 en `+0x04…+0x24`, `data_header +0x28` y `clk_thresh +0x2C`. El valor de `clk_thresh` de la sesión solo quedó anotado.\n\nEl banco CMB apareció en la sesión. Su mapa AirHDL rev29 define el control y la memoria de eventos. Para probar esa ruta en la placa hay que ver cómo se publica un evento (estado y `event_id`) y leer su memoria con el protocolo del diseño.\n\n","html":"\u003ch2 id=\"bancos-y-mapa\">Bancos y mapa\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Bloque\u003c/th>\n\u003cth>Nombre UIO\u003c/th>\n\u003cth>Base física\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Banco por defecto\u003c/td>\n\u003ctd>\u003ccode>tgc_readUplink_regs\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0xA00E0000\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Bancos 1 a 12\u003c/td>\n\u003ctd>\u003ccode>tgc_readUplink_regs_N\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0xA00E0000 + N × 0x10000\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Banco 10\u003c/td>\n\u003ctd>\u003ccode>tgc_readUplink_regs_10\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0xA0180000\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Captura de eventos CMB\u003c/td>\n\u003ctd>\u003ccode>cmb_event_regs_0\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0xA01B0000\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>El número de \u003ccode>/dev/uioN\u003c/code> puede cambiar con el overlay, por eso el lector busca por nombre y comprueba la base. Ojo con los nombres: \u003ccode>emp_lpgbt_10\u003c/code> es el controlador IC y \u003ccode>tgc_readUplink_regs_10\u003c/code> es un banco MMIO.\u003c/p>\n\u003cp>En el mapa por defecto, los offsets en bytes son: \u003ccode>magic +0x00\u003c/code>, grupos 0…8 en \u003ccode>+0x04…+0x24\u003c/code>, \u003ccode>data_header +0x28\u003c/code> y \u003ccode>clk_thresh +0x2C\u003c/code>. El valor de \u003ccode>clk_thresh\u003c/code> de la sesión solo quedó anotado.\u003c/p>\n\u003cp>El banco CMB apareció en la sesión. Su mapa AirHDL rev29 define el control y la memoria de eventos. Para probar esa ruta en la placa hay que ver cómo se publica un evento (estado y \u003ccode>event_id\u003c/code>) y leer su memoria con el protocolo del diseño.\u003c/p>\n"},{"title":"Código y mapas","anchor":"código-y-mapas","text":"## Código y mapas\n\n| Qué necesitas | Carpeta |\n|---|---|\n| CLI `emp`, `raw.sh`, JSON y pruebas | [capture](https://github.com/fbientrigo/atlas_emc/tree/main/capture) |\n| Export AirHDL rev29 y lector de snapshot uplink | [airhdl](https://github.com/fbientrigo/atlas_emc/tree/main/airhdl) |\n| Fuentes de `tgc_readuplink_cli` y `readprbs_cli` para recompilar | [puzzledWizards/compilados](https://github.com/fbientrigo/atlas_emc/tree/main/puzzledWizards/compilados) |\n\n[Notas de firmware, reloj y herramientas](14_NOTAS_DE_TRABAJO.md) · [Prueba de recepción del front-end](00_GUIA_CAMPO.md)\n","html":"\u003ch2 id=\"código-y-mapas\">Código y mapas\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Qué necesitas\u003c/th>\n\u003cth>Carpeta\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>CLI \u003ccode>emp\u003c/code>, \u003ccode>raw.sh\u003c/code>, JSON y pruebas\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/tree/main/capture\">capture\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Export AirHDL rev29 y lector de snapshot uplink\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/tree/main/airhdl\">airhdl\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fuentes de \u003ccode>tgc_readuplink_cli\u003c/code> y \u003ccode>readprbs_cli\u003c/code> para recompilar\u003c/td>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/tree/main/puzzledWizards/compilados\">puzzledWizards/compilados\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003ca href=\"14_NOTAS_DE_TRABAJO.md\">Notas de firmware, reloj y herramientas\u003c/a> · \u003ca href=\"00_GUIA_CAMPO.md\">Prueba de recepción del front-end\u003c/a>\u003c/p>\n"}]}],"sources":[{"id":"B01","title":"CLI de payload","path":"read_all_lpgbt/tgc_readuplink_cli.cpp","origin":"backup","sha256":"03cb6c414059ab55e2fcdcb162faed1287d00c8afd0b5cac434acf1836c098d3","url":null,"excerpts":[{"start":18,"end":62,"text":"18: int main() {\n19:     try {\n20:         // Abrir por nombre de dispositivo UIO\n21:         TgcReadUplink dev(\"tgc_readUplink_regs\");\n22: \n23:         // Lecturas básicas\n24:         uint32_t magic = dev.readMagicValue();\n25:         print_hex32(\"magic:\", magic);\n26: \n27:         // data_group_0 .. data_group_8 usando punteros a método\n28:         using ReadFn = uint32_t (TgcReadUplink::*)();\n29:         const std::array\u003cReadFn, 9> groupFns = {\n30:             &TgcReadUplink::readDataGroup0Value,\n31:             &TgcReadUplink::readDataGroup1Value,\n32:             &TgcReadUplink::readDataGroup2Value,\n33:             &TgcReadUplink::readDataGroup3Value,\n34:             &TgcReadUplink::readDataGroup4Value,\n35:             &TgcReadUplink::readDataGroup5Value,\n36:             &TgcReadUplink::readDataGroup6Value,\n37:             &TgcReadUplink::readDataGroup7Value,\n38:             &TgcReadUplink::readDataGroup8Value\n39:         };\n40: \n41:         for (size_t i = 0; i \u003c groupFns.size(); ++i) {\n42:             uint32_t val = (dev.*groupFns[i])();\n43:             std::string label = \"data_group_\" + std::to_string(i) + \":\";\n44:             print_hex32(label.c_str(), val);\n45:         }\n46: \n47:         // data_header\n48:         uint32_t header = dev.readDataHeaderValue();\n49:         print_hex32(\"data_header:\", header);\n50: \n51:         // clk_thresh\n52:         uint32_t clk = dev.readClkThreshValue();\n53:         print_hex32(\"clk_thresh:\", clk);\n54: \n55: \tstd::cout \u003c\u003c clk \u003c\u003c std::endl;\n56:         // Nota: si luego quieres escribir clk_thresh:\n57:         // dev.writeClkThreshValue(0x000000AB);\n58: \n59:         return 0;\n60:     } catch (const std::exception& e) {\n61:         std::cerr \u003c\u003c \"[ERROR] \" \u003c\u003c e.what() \u003c\u003c '\\n';\n62:         return 1;"}]},{"id":"B02","title":"Getters de payload","path":"read_all_lpgbt/TgcReadUplink.cpp","origin":"backup","sha256":"0bbd3f71777adcaa7b7400dd2fca5987e1faebc1088509cf3a45a28d341db7dd","url":null,"excerpts":[{"start":25,"end":37,"text":"25: TgcReadUplink::TgcReadUplink (const std::string& uioDeviceName)\n26: {\n27:     char* c_string;\n28:     c_string = strdup(uioDeviceName.c_str());\n29:     m_uioInfo = uio_find_by_uio_name(c_string);\n30:     if (!m_uioInfo)\n31:         throw std::runtime_error(\"uio_find_by_uio_name with device name \" + uioDeviceName + \" failed.\");\n32: \n33:     std::cout \u003c\u003c \"TgcReadUplink ctr. \"\n34:               \u003c\u003c \"Found requested device with ids: \" \u003c\u003c uio_get_major(m_uioInfo) \u003c\u003c \",\" \u003c\u003c uio_get_minor(m_uioInfo) \u003c\u003c std::endl;\n35:     if (uio_open(m_uioInfo))\n36:         throw std::runtime_error(\"uio_open failed.\");\n37: }"},{"start":65,"end":79,"text":"65: uint32_t TgcReadUplink::readDataGroup0Value ()\n66: {\n67:     uint32_t value (0);\n68:     if (uio_read32 (\n69:                 m_uioInfo,\n70:                 0 /*map*/,\n71:                 4 /* address offset */,\n72:                 &value))\n73:     {\n74:         throw std::runtime_error(\"uio_read32 failed\");\n75:     };\n76:     uint32_t bitWidth = 32;\n77:     uint8_t bitOffset = 0;\n78:     return(_isolateBitsForRead(value, bitWidth, bitOffset));\n79: }"},{"start":236,"end":269,"text":"236: uint32_t TgcReadUplink::readDataHeaderValue ()\n237: {\n238:     uint32_t value (0);\n239:     if (uio_read32 (\n240:                 m_uioInfo,\n241:                 0 /*map*/,\n242:                 40 /* address offset */,\n243:                 &value))\n244:     {\n245:         throw std::runtime_error(\"uio_read32 failed\");\n246:     };\n247:     uint32_t bitWidth = 32;\n248:     uint8_t bitOffset = 0;\n249:     return(_isolateBitsForRead(value, bitWidth, bitOffset));\n250: }\n251: \n252: \n253: \n254: // at register: clk_thresh\n255: uint32_t TgcReadUplink::readClkThreshValue ()\n256: {\n257:     uint32_t value (0);\n258:     if (uio_read32 (\n259:                 m_uioInfo,\n260:                 0 /*map*/,\n261:                 44 /* address offset */,\n262:                 &value))\n263:     {\n264:         throw std::runtime_error(\"uio_read32 failed\");\n265:     };\n266:     uint32_t bitWidth = 32;\n267:     uint8_t bitOffset = 0;\n268:     return(_isolateBitsForRead(value, bitWidth, bitOffset));\n269: }"},{"start":297,"end":311,"text":"297: uint32_t TgcReadUplink::_isolateBitsForRead(uint32_t value, uint32_t bitWidth, uint8_t bitOffset) {\n298:     // Patched: safe mask generation\n299:     uint64_t bitMask = ((1ULL \u003c\u003c bitWidth) - 1ULL);\n300:     if (bitWidth >= 32) bitMask = 0xFFFFFFFFULL;\n301:     bitMask \u003c\u003c= bitOffset;\n302:     return static_cast\u003cuint32_t>((value & bitMask) >> bitOffset);\n303: }\n304: \n305: // Takes and old value and replaces the specified bits defined by value, bitWidth and bitOffset.\n306: uint32_t TgcReadUplink::_isolateBitsForWrite(uint32_t value, uint32_t bitWidth, uint8_t bitOffset, uint32_t oldValue) {\n307:     // Patched: safe mask generation\n308:     uint64_t bitMask = ((1ULL \u003c\u003c bitWidth) - 1ULL);\n309:     if (bitWidth >= 32) bitMask = 0xFFFFFFFFULL;\n310:     bitMask \u003c\u003c= bitOffset;\n311:     return static_cast\u003cuint32_t>((oldValue & ~bitMask) | ((static_cast\u003cuint64_t>(value) \u003c\u003c bitOffset) & bitMask));"}]},{"id":"B03","title":"Acceso MMIO volatile","path":"libuio/mem.c","origin":"backup","sha256":"8389dcd2dbf901b128acfaa7dd88bffc6151b45d5ce1bcb23623b3497c73099c","url":null,"excerpts":[{"start":209,"end":222,"text":"209: int uio_read32 (struct uio_info_t* info, int map_num, unsigned long offset,\n210: \t       uint32_t *val)\n211: {\n212: \tvoid *ptr;\n213: \n214: \tif (!info || !val)\n215: \t\treturn -1;\n216: \n217: \tptr = info->maps [map_num].map + info->maps [map_num].offset + offset;\n218: \n219: \t*val = *(volatile uint32_t *) ptr;\n220: \n221: \treturn 0;\n222: }"}]},{"id":"B04","title":"Lookup y mmap UIO","path":"libuio/base.c","origin":"backup","sha256":"1d0bd3d6b57d6b8a7679d7955ebe1c324af9c2a5f94219ece97101a4569fadd3","url":null,"excerpts":[{"start":246,"end":271,"text":"246: struct uio_info_t *uio_find_by_uio_name (char *uio_name)\n247: {\n248: \tstruct uio_info_t *info = NULL, **list, **uio_list;\n249: \tchar *name;\n250: \n251: \tif (!uio_name)\n252: \t\treturn NULL;\n253: \n254: \tuio_list = uio_find_devices ();\n255: \tif (!uio_list)\n256: \t\treturn NULL;\n257: \n258: \tfor (list = uio_list; *list; list++)\n259: \t{\n260: \t\tstruct uio_info_t *candidate = *list;\n261: \n262: \t\tname = uio_get_name (candidate);\n263: \n264: \t\tif (!strcmp (name, uio_name)) {\n265: \t\t\tinfo = candidate;\n266: \t\t\tbreak;\n267: \t\t}\n268: \t}\n269: \tfree (uio_list);\n270: \n271: \treturn info;"},{"start":344,"end":378,"text":"344: int uio_open_fix (struct uio_info_t* info, void *ptr)\n345: {\n346: \tint fd, i;\n347: \n348: \tif (!info)\n349: \t{\n350: \t\terrno = EINVAL;\n351: \t\tg_warning (_(\"uio_open: %s\\n\"), g_strerror (errno));\n352: \t\treturn -1;\n353: \t}\n354: \n355: \tfd = open (info->devname, O_RDWR);\n356: \tif (fd \u003c 0)\n357: \t{\n358: \t\tg_warning (_(\"open: %s\\n\"), g_strerror (errno));\n359: \t\treturn -1;\n360: \t}\n361: \n362: \tfor (i = 0; i \u003c info->maxmap; i++)\n363: \t{\n364: \t\tinfo->maps [i].map = mmap (ptr, info->maps [i].size,\n365: \t\t\t\t\t   PROT_READ | PROT_WRITE,\n366: \t\t\t\t\t   MAP_SHARED, fd, i * getpagesize());\n367: \t\tif (info->maps[i].map == MAP_FAILED) {\n368: \t\t\twhile (--i >= 0)\n369: \t\t\t\tuio_unmap (&info->maps [i]);\n370: \t\t\tg_warning (_(\"mmap: %s\\n\"), g_strerror (errno));\n371: \t\t\treturn -1;\n372: \t\t}\n373: \t\tif (ptr)\n374: \t\t\tptr += info->maps [i].size;\n375: \t}\n376: \tinfo->fd = fd;\n377: \n378: \treturn 0;"}]},{"id":"B05","title":"Tabla del monitor","path":"emp-tools/empTools/fwStatus/fwStatus.cpp","origin":"backup","sha256":"8cca295f177e0d9ada056f2c2932e5c16770e578fa51291df37d56bdfe71c3ea","url":null,"excerpts":[{"start":84,"end":115,"text":"84: std::vector\u003cstd::string> get_emp_lpgbt_data (int channel, std::vector\u003cstd::bitset\u003c32>> status) {\n85:     std::vector\u003cstd::string> line_i;\n86:     line_i.push_back(std::to_string(channel));           \n87:     line_i.push_back(status[5].test(channel) ? \"ok\" : \"-\");\n88:     line_i.push_back(status[6].test(channel) ? \"ok\" : \"-\");\n89:     line_i.push_back(status[0].test(channel) ? \"ok\" : \"-\");\n90:     line_i.push_back(status[3].test(channel) && status[4].test(channel) ? \"ok\" : \"-\");\n91:     return line_i;\n92: }\n93: \n94: std::vector\u003cstd::vector\u003cstd::string>> data_selection(ProgConfig pconfig, std::vector\u003cstd::bitset\u003c32>> status) {\n95: \n96:     std::smatch match;\n97:     std::vector\u003cstd::vector\u003cstd::string>> data;\n98:     data.push_back(std::vector\u003cstd::string>{\"emp_lpgbt\", \"RX locked\", \"TX ready\", \"TX aligned\", \"XCVR Ready\"});\n99:     if (pconfig.id == -1) {\n100:         for(int i = 0; i \u003c= 12; i++)\n101:             data.push_back(get_emp_lpgbt_data(i, status));\n102:     } else if (0 \u003c= pconfig.id && pconfig.id \u003c= 12) {  \n103:         data.push_back(get_emp_lpgbt_data(pconfig.id, status));\n104:     }\n105:     return data;\n106: }\n107: \n108: int main (int argc, char* argv[]) {\n109: \n110:     ProgConfig pconfig = parseProgramOptions(argc, argv);\n111:     FwMonitor::FwMonitorBackend sw_backend;\n112:     \n113:     printPrettyTable(data_selection(pconfig, sw_backend.fw_status()));\n114: \n115:     return 0;"}]},{"id":"B06","title":"Control IC activo","path":"LpGbtSw/LpGbtUioBackend/LpGbtUioBackend.cpp","origin":"backup","sha256":"d416be9f64a29ae2e71dc1f340d4b8d7b5c65cf209cebfc3ac67407286ef70de","url":null,"excerpts":[{"start":16,"end":28,"text":"16: LpGbtUioBackend::LpGbtUioBackend (std::string_view uioDeviceAddress):\n17: \t\t\t\t\t\t\tm_uioDeviceAddress(uioDeviceAddress),\n18: \t\t\t\t\t\t\tm_uio(LpGbtUio::initUio(m_uioDeviceAddress))\n19: {\n20: \n21: \tLOG(Log::INF) \u003c\u003c \"Initializing uio device '\" \u003c\u003c m_uioDeviceAddress \u003c\u003c \"'\";\n22: \n23: \tauto magicNumber = LpGbtUio::readMagicNumber(m_uio);\n24: \tLOG(Log::INF) \u003c\u003c \"The magic number for this uio device is: \" \u003c\u003c std::hex \u003c\u003c magicNumber;\n25: \t\n26: \tLpGbtUio::setupUio(m_uio);\n27: \tuio_write32(m_uio, 0, LpGbtUio::registerAddr, 0x00);\n28: "},{"start":38,"end":64,"text":"38: RegisterValue LpGbtUioBackend::readRegister (RegisterAddress registerId)\n39: {\n40: \n41: \tLOG(Log::DBG) \u003c\u003c \"Start readRegister with address \" \u003c\u003c (int)registerId;\n42: \n43: \tLpGbtUio::writeLpgbtRegisterAddress(m_uio, (uint32_t)registerId);\n44: \n45: \tLpGbtUio::clearIntr(m_uio, LpGbtUio::interruptClearValue, 0x1, 0x0);\n46:     LpGbtUio::enableIntr(m_uio, LpGbtUio::interruptEnableValue, 0x1, 0x0);\n47: \n48: \tLpGbtUio::writeNbytesIcRxFifo(m_uio, 0x10004);\n49: \n50: \tLpGbtUio::waitIntr(m_uio, 1); // that is in ms\n51: \tLOG(Log::TRC) \u003c\u003c \"Reply received for register \" \u003c\u003c (int)registerId;\n52: \t\n53: \t// Read IC Rx FIFO up to empty\n54: \tstd::vector\u003cuint32_t>readValues = LpGbtUio::readICRxFifo(m_uio);\n55: \n56: \tLOG(Log::TRC) \u003c\u003c \"Reply payloa ic                 Lee registro 'magic' (offset 0)\n60:   --read-status                Lee registro 'status' (offset 8)\n61:   --read-data                  Lee registro 'data_prbs' (offset 12)\n62:   --write-data \u003cVAL>           Escribe 'data_prbs' (uint32)\n63:   --write-control \u003cVAL>        Escribe 'control' (uint32)\n64:   --write-sequence \u003cFILE>      Escribe valores de archivo (uno por línea, hex o decimal)\n65:   --selftest                   Ejecuta prueba integral rápida\n66: \n67: Repetición / salida:\n68:   --repeat \u003cN>                 Repite N veces (por defecto 1)\n69:   --sleep-ms \u003cMS>              Espera MS milisegundos entre repeticiones o entre valores de secuencia\n70:   --json                       Salida en JSON (máquina)\n71:   --verbose                    Mensajes adicionales\n72:   --help                       Esta ayuda\n73: )\";\n74: }"}]},{"id":"B09","title":"Máscara corregida ReadPRBS","path":"puzzled_working/ReadPRBS.cpp","origin":"backup","sha256":"8b9c20426548a898c43e03e5324f39b36710fdc81356dd73c465e5b79e613022","url":null,"excerpts":[{"start":142,"end":159,"text":"142: static inline uint32_t make_mask(uint32_t width, uint32_t offset) {\n143:     // Cubre también width > 32 de forma defensiva\n144:     if (width >= 32) return 0xFFFFFFFFu;\n145:     // Asegura el 1 como unsigned de 32 bits y evita UB\n146:     return ((uint32_t{1} \u003c\u003c width) - 1u) \u003c\u003c offset;\n147: }\n148: \n149: uint32_t ReadPRBS::_isolateBitsForRead(uint32_t value, uint32_t bitWidth, uint8_t bitOffset) {\n150:     const uint32_t mask = make_mask(bitWidth, bitOffset);\n151:     return (value & mask) >> bitOffset;\n152: }\n153: \n154: uint32_t ReadPRBS::_isolateBitsForWrite(uint32_t value, uint32_t bitWidth, uint8_t bitOffset, uint32_t oldValue) {\n155:     const uint32_t mask = make_mask(bitWidth, bitOffset);\n156:     // Evita overflow al desplazar y recorta al mask\n157:     const uint32_t shifted = (bitOffset == 0) ? value : (value \u003c\u003c bitOffset);\n158:     return (oldValue & ~mask) | (shifted & mask);\n159: }"}]},{"id":"R01","title":"Ruta de UserData y CDC","path":"epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/new/emp_lpgbt.vhd","origin":"repo","sha256":"fbc7c32ed26b8e3c03960ca6b51b8988598979f21468a8e9090885aae2d29dc5","url":"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/new/emp_lpgbt.vhd","excerpts":[{"start":421,"end":437,"text":"421: \tlpgbtfpga_mgtrxclk_s \u003c= MGT_RXUSRCLK_i;\n422: \tlpgbtfpga_mgttxclk_s \u003c= MGT_TXUSRCLK_i;\n423: \n424: \tMGT_RXSlide_o \u003c= lpgbtfpga_mgt_rxslide;\n425: \n426: \tMGT_USRWORD_o    \u003c= downlink_mgtword_s;\n427: \tuplink_mgtword_s \u003c= MGT_USRWORD_i;\n428: \n429: \t-- lpGBT data\n430: \tlpgbtfpga_uplinkUserData_o \u003c= lpgbtfpga_uplinkUserData_s;\n431: \tlpgbtfpga_uplinkEcData_o   \u003c= lpgbtfpga_uplinkEcData_s;\n432: \tlpgbtfpga_uplinkIcData_o   \u003c= lpgbtfpga_uplinkIcData_s;\n433: \n434: \tlpgbtfpga_downlinkUserData_s \u003c= lpgbtfpga_downlinkUserData_i;\n435: \tlpgbtfpga_downlinkEcData_s   \u003c= \"11\"; \n436: \t\n437: \tuplinkReady_o                \u003c= uplinkReady_s;"},{"start":473,"end":498,"text":"473: \tcdc_rx_inst : cdc_rx\n474: \t\tgeneric map(\n475: \t\t\tg_CLOCK_A_RATIO => 8,       --! Frequency ratio between slow and fast frequencies (>4)\n476: \t\t\tg_PHASE_SIZE    => 3        --! log2(g_CLOCK_A_RATIO)\n477: \t\t)\n478: \t\tport map(\n479: \t\t\t-- Interface A (latch - from where data comes)\n480: \t\t\treset_a_i     => lpgbtfpga_uplinkrst_cdc,\n481: \t\t\tclk_a_i       => lpgbtfpga_mgtrxclk_s,\n482: \t\t\tdata_a_i      => lpgbtfpga_uplinkData_320,\n483: \t\t\tstrobe_a_i    => uplinkStrobe320,\n484: \t\t\t-- Interface B (capture_a - to where data goes) \n485: \t\t\tclk_b_i       => logicclk40,\n486: \t\t\tdata_b_o      => lpgbtfpga_uplinkData_40,\n487: \t\t\tstrobe_b_i    => '1',\n488: \t\t\tready_b_o     => cdc_
