dad sin ejecutarlo:\u003c/p>\n\u003cpre>\u003ccode>printf 'Ruta absoluta del tgc_readuplink_cli identificado: '\nread -r LECTOR\npython3 diagnostico/atlas_diagnostico.py inventario \\\n  --lector \"$LECTOR\" --salida inventario_lector_01.json\u003c/code>\u003c/pre>\n\u003cp>Si el programa original está atascado ahora, inspecciona su PID en vez de lanzar \u003ccode>capturar\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode>printf 'PID del proceso que ya está fallando: '\nread -r PID_FALLO\npython3 diagnostico/atlas_diagnostico.py inventario \\\n  --pid \"$PID_FALLO\" --salida inventario_fallo_01.json\u003c/code>\u003c/pre>\n\u003cp>Lee archivos concretos de \u003ccode>/proc\u003c/code> y metadatos de \u003ccode>/sys/class/uio\u003c/code>, del Device Tree, del FPGA manager y de los overlays. Si le das un archivo, lee su cabecera ELF y su SHA-256. Busca posibles lectores por nombre, descriptores y mapeos. No abre \u003ccode>/dev/uioN\u003c/code> ni \u003ccode>/dev/mem\u003c/code>, y no ejecuta \u003ccode>lsuio\u003c/code>, \u003ccode>ldd\u003c/code>, scripts ni binarios de hardware. No guarda todo el entorno ni contraseñas, pero los mapas, las rutas y algunas variables \u003ccode>LD_*\u003c/code> pueden tener información interna.\u003c/p>\n\u003cp>Sale un JSON con los UIO y mapas disponibles, y con los errores de permisos o atributos que no existen. Un mapa vacío o un FPGA manager sin \u003ccode>firmware\u003c/code> no es un fallo del script ni prueba que el PL esté vacío. Estos metadatos no identifican el bitstream cargado.\u003c/p>\n\u003cp>\u003ccode>possible_readers.candidates\u003c/code> es una pista: nombres cortados, permisos y carreras impiden garantizar que no haya otro lector. \u003ccode>unreadable_maps\u003c/code> dice qué no pudo mirar. El script no mata procesos de otros. Si no hay Python, usa F0 de \u003ca href=\"10_BLOQUEO_LECTURAS.md\">Lecturas congeladas\u003c/a>; no lo instales en mitad de un fallo si eso borra la evidencia.\u003c/p>\n\u003cp>Consume algo de CPU y disco, puede quedarse corto y el archivo tiene datos internos. Después: si el proceso original no terminó, guarda el inventario y estudia por dónde va. Si la CLI está identificada pero faltan mapa y permisos, sigue con S1. No saltes directo a capturar.\u003c/p>\n"},{"title":"4. S1: plan de lectura revisable","anchor":"4-s1-plan-de-lectura-revisable","text":"## 4. S1: plan de lectura revisable\n\nObjetivo: fijar qué ELF, bibliotecas y mapa se permiten en la sesión. La plantilla empieza bloqueada.\n\nNecesitas un S0 con `--lector`, un solo UIO llamado `tgc_readUplink_regs`, y un `map0` de al menos `0x30` bytes, con base alineada y offset sysfs cero. Si algo de esto falla, el perfil no se arregla probando otras direcciones.\n\n```bash\npython3 diagnostico/atlas_diagnostico.py preparar \\\n  --inventario inventario_lector_01.json --salida plan_lectura_01.json\n```\n\nCopia la identidad del lector y los mapas del inventario, sin ejecutar la CLI. Crea `validation` con cinco confirmaciones en falso y `libraries` vacío. No elige ninguna dirección antigua como buena.\n\nRevisa A2 y el punto de control antes de MMIO en la [guía de campo](00_GUIA_CAMPO.md). Averigua el intérprete y las bibliotecas que se usan de verdad, mirando el ELF, la receta de compilación y la configuración del cargador. Para cada archivo:\n\n```bash\nprintf 'Ruta absoluta de biblioteca o intérprete ya identificado: '\nread -r BIBLIOTECA\npython3 diagnostico/atlas_diagnostico.py identidad \"$BIBLIOTECA\"\n```\n\nAñade cada JSON que salga a la lista `libraries` del plan: intérprete, `libuio`, runtime de C++ y el resto de dependencias del ELF. El script comprueba esos hashes, pero no que la lista esté completa ni que el cargador use esos archivos. Si el binario es estático o no es esta variante, para y adapta el perfil después de investigar. No inventes una biblioteca para pasar la comprobación.\n\nCompleta las cinco filas de `validation`. Pon `confirmed: true` solo después de escribir la prueba concreta en `evidence`:\n\n| Clave | Qué tiene que anotar el ingeniero |\n|---|---|\n| `build_map` | Qué bitstream, DTBO y build hay, y cómo se relacionan con todos los mapas UIO del lector |\n| `binary_dependencies` | ELF, su fuente o receta, arquitectura, intérprete y bibliotecas que se usan. Que el nombre se parezca no alcanza |\n| `read_semantics` | Para esa IP, que los offsets `0x00..0x2c`, el orden y los efectos de leer son los esperados, incluso abriendo y cerrando muchas veces, y que esa CLI no escribe |\n| `exclusive_operator` | Que hay un solo lector y operador y ningún proceso de hardware atascado. Revisar `/proc` no alcanza |\n| `hardware_authorization` | Quién autorizó las lecturas, cuándo y con qué condiciones. Esta documentación no autoriza nada |\n\nAnota también en las notas de la sesión la configuración del FE y del lpGBT, que se descartaron generadores y loopback, el canal, la fibra, el e-link y qué abarcarían futuros resets. Marcar estas filas no sustituye la prueba de origen.\n\nEl resultado es un plan que un colega puede revisar. Si algo no se sabe, deja `confirmed: false` y sigue con inventario y análisis sin la placa. Una declaración equivocada puede abrir paso a accesos peligrosos. Con la validación cerrada y una autorización aparte, sigue con S2; si no, pide el dato que falta.\n\nQue hashes y mapas coincidan no prueba que encajen con el PL cargado. La comprobación frena errores conocidos; no certifica nada.\n\n","html":"\u003ch2 id=\"4-s1-plan-de-lectura-revisable\">4. S1: plan de lectura revisable\u003c/h2>\n\u003cp>Objetivo: fijar qué ELF, bibliotecas y mapa se permiten en la sesión. La plantilla empieza bloqueada.\u003c/p>\n\u003cp>Necesitas un S0 con \u003ccode>--lector\u003c/code>, un solo UIO llamado \u003ccode>tgc_readUplink_regs\u003c/code>, y un \u003ccode>map0\u003c/code> de al menos \u003ccode>0x30\u003c/code> bytes, con base alineada y offset sysfs cero. Si algo de esto falla, el perfil no se arregla probando otras direcciones.\u003c/p>\n\u003cpre>\u003ccode>python3 diagnostico/atlas_diagnostico.py preparar \\\n  --inventario inventario_lector_01.json --salida plan_lectura_01.json\u003c/code>\u003c/pre>\n\u003cp>Copia la identidad del lector y los mapas del inventario, sin ejecutar la CLI. Crea \u003ccode>validation\u003c/code> con cinco confirmaciones en falso y \u003ccode>libraries\u003c/code> vacío. No elige ninguna dirección antigua como buena.\u003c/p>\n\u003cp>Revisa A2 y el punto de control antes de MMIO en la \u003ca href=\"00_GUIA_CAMPO.md\">guía de campo\u003c/a>. Averigua el intérprete y las bibliotecas que se usan de verdad, mirando el ELF, la receta de compilación y la configuración del cargador. Para cada archivo:\u003c/p>\n\u003cpre>\u003ccode>printf 'Ruta absoluta de biblioteca o intérprete ya identificado: '\nread -r BIBLIOTECA\npython3 diagnostico/atlas_diagnostico.py identidad \"$BIBLIOTECA\"\u003c/code>\u003c/pre>\n\u003cp>Añade cada JSON que salga a la lista \u003ccode>libraries\u003c/code> del plan: intérprete, \u003ccode>libuio\u003c/code>, runtime de C++ y el resto de dependencias del ELF. El script comprueba esos hashes, pero no que la lista esté completa ni que el cargador use esos archivos. Si el binario es estático o no es esta variante, para y adapta el perfil después de investigar. No inventes una biblioteca para pasar la comprobación.\u003c/p>\n\u003cp>Completa las cinco filas de \u003ccode>validation\u003c/code>. Pon \u003ccode>confirmed: true\u003c/code> solo después de escribir la prueba concreta en \u003ccode>evidence\u003c/code>:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Clave\u003c/th>\n\u003cth>Qué tiene que anotar el ingeniero\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>build_map\u003c/code>\u003c/td>\n\u003ctd>Qué bitstream, DTBO y build hay, y cómo se relacionan con todos los mapas UIO del lector\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>binary_dependencies\u003c/code>\u003c/td>\n\u003ctd>ELF, su fuente o receta, arquitectura, intérprete y bibliotecas que se usan. Que el nombre se parezca no alcanza\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>read_semantics\u003c/code>\u003c/td>\n\u003ctd>Para esa IP, que los offsets \u003ccode>0x00..0x2c\u003c/code>, el orden y los efectos de leer son los esperados, incluso abriendo y cerrando muchas veces, y que esa CLI no escribe\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>exclusive_operator\u003c/code>\u003c/td>\n\u003ctd>Que hay un solo lector y operador y ningún proceso de hardware atascado. Revisar \u003ccode>/proc\u003c/code> no alcanza\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hardware_authorization\u003c/code>\u003c/td>\n\u003ctd>Quién autorizó las lecturas, cuándo y con qué condiciones. Esta documentación no autoriza nada\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Anota también en las notas de la sesión la configuración del FE y del lpGBT, que se descartaron generadores y loopback, el canal, la fibra, el e-link y qué abarcarían futuros resets. Marcar estas filas no sustituye la prueba de origen.\u003c/p>\n\u003cp>El resultado es un plan que un colega puede revisar. Si algo no se sabe, deja \u003ccode>confirmed: false\u003c/code> y sigue con inventario y análisis sin la placa. Una declaración equivocada puede abrir paso a accesos peligrosos. Con la validación cerrada y una autorización aparte, sigue con S2; si no, pide el dato que falta.\u003c/p>\n\u003cp>Que hashes y mapas coincidan no prueba que encajen con el PL cargado. La comprobación frena errores conocidos; no certifica nada.\u003c/p>\n"},{"title":"5. S2: primero un ensayo corto, después una observación larga","anchor":"5-s2-primero-un-ensayo-corto-después-una-observación-larga","text":"## 5. S2: primero un ensayo corto, después una observación larga\n\nObjetivo: registrar resultados completos, duraciones, errores y cambios sin perder la primera anomalía.\n\nNecesitas S1 cerrado, un lector compatible, un solo operador, ningún proceso de hardware bloqueado y ningún cambio de firmware, bibliotecas o mapa durante el ensayo. Empieza con tres muestras, no con horas de sondeo.\n\n```bash\npython3 diagnostico/atlas_diagnostico.py capturar \\\n  --plan plan_lectura_01.json --salida sesion_corta_01 \\\n  --fase caracterizacion_inicial --muestras 3 --intervalo 5 --timeout 3 \\\n  --autorizar-lecturas\n```\n\nAntes de cada ejecución revisa las declaraciones, los hashes, `LD_LIBRARY_PATH` y los mapas, y rechaza `LD_PRELOAD` o `LD_AUDIT` activos. Anota el intento y ejecuta solo `[ruta_del_lector]`, sin shell ni argumentos. La CLI abre y mapea el UIO, lee los doce registros y sale [B01/B02]. Espera cinco segundos después de cada ejecución; como también cuentan las comprobaciones y el proceso, no es un muestreo exacto a 0,2 Hz.\n\nCada muestra guarda stdout y stderr por separado, el JSON interpretado, el retorno, los tiempos y el XOR con la anterior. Las líneas del constructor y el decimal final se guardan, sin confundirlas con registros. Si cambia `magic` o `clk_thresh`, la sesión para. También para si falta un campo, hay duplicados, stderr no está vacío, el código de salida no es cero, hay timeout o demasiada salida. Nunca cambia un error por un cero.\n\nLo esperado son tres muestras completas, el supervisor devolviendo `0` y un cierre limpio. `0` significa que terminó o que llegó al límite de repeticiones; no significa que los datos del FE sean buenos. Con `2`, revisa el mensaje y la sesión. `130` suele ser que el operador interrumpió entre muestras; si interrumpe dentro del lector, queda `operator_interrupt` y la sesión devuelve `2`. Si el hijo muere por una señal, se guarda como retorno negativo, por ejemplo `-7` para SIGBUS en los Linux donde SIGBUS vale 7; ese número no es igual en todas las arquitecturas.\n\nLeer puede borrar datos, y relanzar la aplicación cada vez no es lo mismo que un proceso que corre seguido. Redirigir stdout cambia el buffering, así que una salida a medias no dice cuál fue la última lectura completa. El registro y los hashes añaden carga. No uses esto para medir rendimiento.\n\nRevisa a mano la salida y los tiempos del ensayo corto. Si están bien y el procedimiento está autorizado, alárgalo:\n\n```bash\npython3 diagnostico/atlas_diagnostico.py capturar \\\n  --plan plan_lectura_01.json --salida sesion_larga_01 \\\n  --fase observacion_continua --muestras 720 --intervalo 5 --timeout 3 \\\n  --autorizar-lecturas\n```\n\nSon 720 intentos: más o menos una hora, más el tiempo de ejecución y comprobaciones. Los límites son 3600 muestras, 64 KiB por salida, timeout de 0,1 a 30 s e intervalo mínimo de 1 s. Una sesión no puede durar en teoría más de 24 h, pero eso no vigila ni el disco ni el kernel.\n\nSi quieres, `--detener-iguales 12` para después de doce transiciones seguidas con los nueve grupos iguales (hacen falta trece muestras). Úsalo solo cuando quieras parar y mirar; viene apagado porque el FE puede mandar datos iguales de verdad. Los cambios de header se anotan aparte y no reinician ese contador.\n\n### Timeout y bloqueo preventivo\n\nSi se acaba el tiempo o hay demasiada salida, el supervisor mira a su hijo y manda SIGTERM y luego SIGKILL a su propio grupo de procesos, con esperas cortas. Guarda `alive_after_signals`. Puede quedar un proceso vivo con un acceso pendiente, y en ese caso no lanza ninguna muestra más. Nunca manda señales al programa original que inspeccionaste con `--pid`.\n\n`/tmp/atlas-tgc-diagnostico.lock` evita dos capturas a la vez del mismo script, y se queda escrito si algo falla o se cierra mal. Mientras exista, una sesión nueva no arranca. No frena herramientas ajenas ni otro equipo o contenedor, y `/tmp` puede borrarse al reiniciar. No es un bloqueo del hardware.\n\nAntes de borrar ese archivo a mano: guárdalo, identifica el supervisor, el hijo y sus sesiones, confirma que ya no hay proceso ni acceso pendiente, mira qué causó la anomalía y consigue autorización para seguir. No hay un comando automático de desbloqueo ni de reset. Borrar el lock con un proceso que lo tiene abierto rompe la exclusión.\n\n","html":"\u003ch2 id=\"5-s2-primero-un-ensayo-corto-después-una-observación-larga\">5. S2: primero un ensayo corto, después una observación larga\u003c/h2>\n\u003cp>Objetivo: registrar resultados completos, duraciones, errores y cambios sin perder la primera anomalía.\u003c/p>\n\u003cp>Necesitas S1 cerrado, un lector compatible, un solo operador, ningún proceso de hardware bloqueado y ningún cambio de firmware, bibliotecas o mapa durante el ensayo. Empieza con tres muestras, no con horas de sondeo.\u003c/p>\n\u003cpre>\u003ccode>python3 diagnostico/atlas_diagnostico.py capturar \\\n  --plan plan_lectura_01.json --salida sesion_corta_01 \\\n  --fase caracterizacion_inicial --muestras 3 --intervalo 5 --timeout 3 \\\n  --autorizar-lecturas\u003c/code>\u003c/pre>\n\u003cp>Antes de cada ejecución revisa las declaraciones, los hashes, \u003ccode>LD_LIBRARY_PATH\u003c/code> y los mapas, y rechaza \u003ccode>LD_PRELOAD\u003c/code> o \u003ccode>LD_AUDIT\u003c/code> activos. Anota el intento y ejecuta solo \u003ccode>[ruta_del_lector]\u003c/code>, sin shell ni argumentos. La CLI abre y mapea el UIO, lee los doce registros y sale [B01/B02]. Espera cinco segundos después de cada ejecución; como también cuentan las comprobaciones y el proceso, no es un muestreo exacto a 0,2 Hz.\u003c/p>\n\u003cp>Cada muestra guarda stdout y stderr por separado, el JSON interpretado, el retorno, los tiempos y el XOR con la anterior. Las líneas del constructor y el decimal final se guardan, sin confundirlas con registros. Si cambia \u003ccode>magic\u003c/code> o \u003ccode>clk_thresh\u003c/code>, la sesión para. También para si falta un campo, hay duplicados, stderr no está vacío, el código de salida no es cero, hay timeout o demasiada salida. Nunca cambia un error por un cero.\u003c/p>\n\u003cp>Lo esperado son tres muestras completas, el supervisor devolviendo \u003ccode>0\u003c/code> y un cierre limpio. \u003ccode>0\u003c/code> significa que terminó o que llegó al límite de repeticiones; no significa que los datos del FE sean buenos. Con \u003ccode>2\u003c/code>, revisa el mensaje y la sesión. \u003ccode>130\u003c/code> suele ser que el operador interrumpió entre muestras; si interrumpe dentro del lector, queda \u003ccode>operator_interrupt\u003c/code> y la sesión devuelve \u003ccode>2\u003c/code>. Si el hijo muere por una señal, se guarda como retorno negativo, por ejemplo \u003ccode>-7\u003c/code> para SIGBUS en los Linux donde SIGBUS vale 7; ese número no es igual en todas las arquitecturas.\u003c/p>\n\u003cp>Leer puede borrar datos, y relanzar la aplicación cada vez no es lo mismo que un proceso que corre seguido. Redirigir stdout cambia el buffering, así que una salida a medias no dice cuál fue la última lectura completa. El registro y los hashes añaden carga. No uses esto para medir rendimiento.\u003c/p>\n\u003cp>Revisa a mano la salida y los tiempos del ensayo corto. Si están bien y el procedimiento está autorizado, alárgalo:\u003c/p>\n\u003cpre>\u003ccode>python3 diagnostico/atlas_diagnostico.py capturar \\\n  --plan plan_lectura_01.json --salida sesion_larga_01 \\\n  --fase observacion_continua --muestras 720 --intervalo 5 --timeout 3 \\\n  --autorizar-lecturas\u003c/code>\u003c/pre>\n\u003cp>Son 720 intentos: más o menos una hora, más el tiempo de ejecución y comprobaciones. Los límites son 3600 muestras, 64 KiB por salida, timeout de 0,1 a 30 s e intervalo mínimo de 1 s. Una sesión no puede durar en teoría más de 24 h, pero eso no vigila ni el disco ni el kernel.\u003c/p>\n\u003cp>Si quieres, \u003ccode>--detener-iguales 12\u003c/code> para después de doce transiciones seguidas con los nueve grupos iguales (hacen falta trece muestras). Úsalo solo cuando quieras parar y mirar; viene apagado porque el FE puede mandar datos iguales de verdad. Los cambios de header se anotan aparte y no reinician ese contador.\u003c/p>\n\u003ch3 id=\"timeout-y-bloqueo-preventivo\">Timeout y bloqueo preventivo\u003c/h3>\n\u003cp>Si se acaba el tiempo o hay demasiada salida, el supervisor mira a su hijo y manda SIGTERM y luego SIGKILL a su propio grupo de procesos, con esperas cortas. Guarda \u003ccode>alive_after_signals\u003c/code>. Puede quedar un proceso vivo con un acceso pendiente, y en ese caso no lanza ninguna muestra más. Nunca manda señales al programa original que inspeccionaste con \u003ccode>--pid\u003c/code>.\u003c/p>\n\u003cp>\u003ccode>/tmp/atlas-tgc-diagnostico.lock\u003c/code> evita dos capturas a la vez del mismo script, y se queda escrito si algo falla o se cierra mal. Mientras exista, una sesión nueva no arranca. No frena herramientas ajenas ni otro equipo o contenedor, y \u003ccode>/tmp\u003c/code> puede borrarse al reiniciar. No es un bloqueo del hardware.\u003c/p>\n\u003cp>Antes de borrar ese archivo a mano: guárdalo, identifica el supervisor, el hijo y sus sesiones, confirma que ya no hay proceso ni acceso pendiente, mira qué causó la anomalía y consigue autorización para seguir. No hay un comando automático de desbloqueo ni de reset. Borrar el lock con un proceso que lo tiene abierto rompe la exclusión.\u003c/p>\n"},{"title":"6. S3: estímulo A/B/A y fallo antes y después","anchor":"6-s3-estímulo-aba-y-fallo-antes-y-después","text":"## 6. S3: estímulo A/B/A y fallo antes y después\n\nObjetivo: intentar descartar una fuente interna o una muestra retenida con un cambio externo conocido.\n\nNecesitas un método de estímulo del FE validado por el ingeniero y la configuración en uso documentada. Con los archivos recuperados no se puede decir cuál es ese método ni qué fuente está elegida. No escribas registros del chip desde este script para «probar opciones». La etapa D de la guía de campo cubre esto.\n\nCon una observación en marcha, desde otra terminal puedes anotar un cambio que ya hiciste:\n\n```bash\npython3 diagnostico/atlas_diagnostico.py anotar --sesion sesion_larga_01 \\\n  --texto 'FASE A: describir estado externo y evidencia de que llega físicamente al FE/e-link.'\npython3 diagnostico/atlas_diagnostico.py anotar --sesion sesion_larga_01 \\\n  --texto 'FASE B: describir estímulo externo aplicado, canal, amplitud/frecuencia y medición independiente.'\npython3 diagnostico/atlas_diagnostico.py anotar --sesion sesion_larga_01 \\\n  --texto 'FASE A2: describir retorno al estado A y observación externa.'\n```\n\nSon plantillas: cambia el texto por lo que pasó y ejecuta cada orden en su momento, no las tres seguidas. Las etiquetas no hacen nada en el hardware. La hora es la de la anotación, no necesariamente la del estímulo. Si el cambio cae mientras se está tomando una muestra, márcala como dudosa.\n\nMantén cada fase durante varias muestras, anota la latencia y la retención esperadas si están documentadas, y repite A/B/A al menos tres veces si se puede. Compara los mismos grupos y guarda los controles del enlace sacados con el procedimiento B ya autorizado, sin añadir otro lector a la vez.\n\nSi los cambios siguen al estímulo de forma repetible y vuelven a A después del tiempo de retención esperado, eso apunta a recepción externa. Un XOR distinto de cero no basta: tienen que encajar el canal, el formato y los tiempos.\n\nSi B no hace nada aunque el estímulo llegó, el problema está en el origen, el canal, la captura o en cómo se muestra. Si los cambios siguen sin importar el estímulo, puede ser un generador, otra fuente, ruido o un formato que no entendemos. Si solo funciona con loopback, el uplink de prueba anda pero el FE sigue sin probarse. Si A2 no vuelve a A, puede ser una retención documentada; sin saberlo, no lo des por fallo.\n\nSi aparece el congelamiento, anota qué se paró y guarda la sesión. Si Linux responde, haz S0 con el PID que falló. Antes de recuperar a mano con autorización, anota qué vas a reiniciar: proceso, capturador, core, MGT, PL, PS o alimentación. Después, haz un inventario nuevo y revisa el plan; no lo reutilices sin mirar. Abre otra sesión con la fase `post_recuperacion` y guarda las dos. El script no recupera ni reinicia nada.\n\nRiesgos: anotaciones equivocadas, horas tardías, varios operadores a la vez y un estímulo sin comprobar. Si `UserData` cambia pero lo que se ve por AXI no, hace falta instrumentar la captura y el rearme. Si `UserData` también se para, mira el enlace, el CDC y los relojes. Esta CLI no ve esas señales: hace falta un ILA existente o el RTL y la build.\n\n","html":"\u003ch2 id=\"6-s3-estímulo-aba-y-fallo-antes-y-después\">6. S3: estímulo A/B/A y fallo antes y después\u003c/h2>\n\u003cp>Objetivo: intentar descartar una fuente interna o una muestra retenida con un cambio externo conocido.\u003c/p>\n\u003cp>Necesitas un método de estímulo del FE validado por el ingeniero y la configuración en uso documentada. Con los archivos recuperados no se puede decir cuál es ese método ni qué fuente está elegida. No escribas registros del chip desde este script para «probar opciones». La etapa D de la guía de campo cubre esto.\u003c/p>\n\u003cp>Con una observación en marcha, desde otra terminal puedes anotar un cambio que ya hiciste:\u003c/p>\n\u003cpre>\u003ccode>python3 diagnostico/atlas_diagnostico.py anotar --sesion sesion_larga_01 \\\n  --texto 'FASE A: describir estado externo y evidencia de que llega físicamente al FE/e-link.'\npython3 diagnostico/atlas_diagnostico.py anotar --sesion sesion_larga_01 \\\n  --texto 'FASE B: describir estímulo externo aplicado, canal, amplitud/frecuencia y medición independiente.'\npython3 diagnostico/atlas_diagnostico.py anotar --sesion sesion_larga_01 \\\n  --texto 'FASE A2: describir retorno al estado A y observación externa.'\u003c/code>\u003c/pre>\n\u003cp>Son plantillas: cambia el texto por lo que pasó y ejecuta cada orden en su momento, no las tres seguidas. Las etiquetas no hacen nada en el hardware. La hora es la de la anotación, no necesariamente la del estímulo. Si el cambio cae mientras se está tomando una muestra, márcala como dudosa.\u003c/p>\n\u003cp>Mantén cada fase durante varias muestras, anota la latencia y la retención esperadas si están documentadas, y repite A/B/A al menos tres veces si se puede. Compara los mismos grupos y guarda los controles del enlace sacados con el procedimiento B ya autorizado, sin añadir otro lector a la vez.\u003c/p>\n\u003cp>Si los cambios siguen al estímulo de forma repetible y vuelven a A después del tiempo de retención esperado, eso apunta a recepción externa. Un XOR distinto de cero no basta: tienen que encajar el canal, el formato y los tiempos.\u003c/p>\n\u003cp>Si B no hace nada aunque el estímulo llegó, el problema está en el origen, el canal, la captura o en cómo se muestra. Si los cambios siguen sin importar el estímulo, puede ser un generador, otra fuente, ruido o un formato que no entendemos. Si solo funciona con loopback, el uplink de prueba anda pero el FE sigue sin probarse. Si A2 no vuelve a A, puede ser una retención documentada; sin saberlo, no lo des por fallo.\u003c/p>\n\u003cp>Si aparece el congelamiento, anota qué se paró y guarda la sesión. Si Linux responde, haz S0 con el PID que falló. Antes de recuperar a mano con autorización, anota qué vas a reiniciar: proceso, capturador, core, MGT, PL, PS o alimentación. Después, haz un inventario nuevo y revisa el plan; no lo reutilices sin mirar. Abre otra sesión con la fase \u003ccode>post_recuperacion\u003c/code> y guarda las dos. El script no recupera ni reinicia nada.\u003c/p>\n\u003cp>Riesgos: anotaciones equivocadas, horas tardías, varios operadores a la vez y un estímulo sin comprobar. Si \u003ccode>UserData\u003c/code> cambia pero lo que se ve por AXI no, hace falta instrumentar la captura y el rearme. Si \u003ccode>UserData\u003c/code> también se para, mira el enlace, el CDC y los relojes. Esta CLI no ve esas señales: hace falta un ILA existente o el RTL y la build.\u003c/p>\n"},{"title":"7. S4: informe sin conexión y paquete para el diagnóstico remoto","anchor":"7-s4-informe-sin-conexión-y-paquete-para-el-diagnóstico-remoto","text":"## 7. S4: informe sin conexión y paquete para el diagnóstico remoto\n\nObjetivo: analizar sin volver a tocar el hardware.\n\n```bash\npython3 diagnostico/atlas_diagnostico.py informe \\\n  --sesion sesion_larga_01 --salida informe_larga_01.md\n```\n\nResume intentos, resultados, tiempos, repeticiones y cambios en bits altos que el byte bajo no muestra, e incluye las notas del operador. Avisa si hay líneas incompletas o intentos sin resultado, sin inventar lecturas que no pasaron. No decide la causa.\n\nSale un informe Markdown y los originales quedan intactos. Para comparar A y B en la web, carga los `muestra_00000.out` que correspondan; no cargues el JSONL entero en el comparador. Elige muestras de fases comprobadas, no la primera y la última sin más.\n\nPara el análisis remoto, manda la carpeta de la sesión completa, el informe, el inventario previo y las pruebas de build, configuración y estímulo. Revisa rutas e identificadores internos antes de compartir. El script no comprime ni manda nada. Los `.out` y `.err` son texto UTF-8 con los bytes inválidos reemplazados, no una copia binaria exacta; la CLI recuperada imprime ASCII.\n\nSi un archivo ya existe, elige otro nombre en vez de pisar evidencia. Si el informe no tiene muestras completas, analiza la interrupción o los errores; no lo leas como nueve grupos en cero. Cuidado con tratar las notas a mano como mediciones o con comparar sesiones de distinta configuración. Después, clasifica H1–H7 con [Lecturas congeladas](10_BLOQUEO_LECTURAS.md) y pide la observación que falte.\n\n","html":"\u003ch2 id=\"7-s4-informe-sin-conexión-y-paquete-para-el-diagnóstico-remoto\">7. S4: informe sin conexión y paquete para el diagnóstico remoto\u003c/h2>\n\u003cp>Objetivo: analizar sin volver a tocar el hardware.\u003c/p>\n\u003cpre>\u003ccode>python3 diagnostico/atlas_diagnostico.py informe \\\n  --sesion sesion_larga_01 --salida informe_larga_01.md\u003c/code>\u003c/pre>\n\u003cp>Resume intentos, resultados, tiempos, repeticiones y cambios en bits altos que el byte bajo no muestra, e incluye las notas del operador. Avisa si hay líneas incompletas o intentos sin resultado, sin inventar lecturas que no pasaron. No decide la causa.\u003c/p>\n\u003cp>Sale un informe Markdown y los originales quedan intactos. Para comparar A y B en la web, carga los \u003ccode>muestra_00000.out\u003c/code> que correspondan; no cargues el JSONL entero en el comparador. Elige muestras de fases comprobadas, no la primera y la última sin más.\u003c/p>\n\u003cp>Para el análisis remoto, manda la carpeta de la sesión completa, el informe, el inventario previo y las pruebas de build, configuración y estímulo. Revisa rutas e identificadores internos antes de compartir. El script no comprime ni manda nada. Los \u003ccode>.out\u003c/code> y \u003ccode>.err\u003c/code> son texto UTF-8 con los bytes inválidos reemplazados, no una copia binaria exacta; la CLI recuperada imprime ASCII.\u003c/p>\n\u003cp>Si un archivo ya existe, elige otro nombre en vez de pisar evidencia. Si el informe no tiene muestras completas, analiza la interrupción o los errores; no lo leas como nueve grupos en cero. Cuidado con tratar las notas a mano como mediciones o con comparar sesiones de distinta configuración. Después, clasifica H1–H7 con \u003ca href=\"10_BLOQUEO_LECTURAS.md\">Lecturas congeladas\u003c/a> y pide la observación que falte.\u003c/p>\n"},{"title":"8. Pruebas, límites y lo que falta","anchor":"8-pruebas-límites-y-lo-que-falta","text":"## 8. Pruebas, límites y lo que falta\n\nLo nuevo es un envoltorio que observa, escrito porque el usuario pidió un script. No cambia la CLI, `libuio`, `LpGbtSw`, el firmware ni el protocolo de acceso original.\n\nSe diseñó a partir del [catálogo](02_CATALOGO.md), las [incompatibilidades](11_COMPATIBILIDAD.md), B01/B02 (CLI y wrapper), B10 (esperas IC) y B11 (máscara de byte). Los extractos con líneas y hashes están en `evidencias.json` y en la web. B10 explica por qué no se usa `lpGbtRegister` como lector pasivo, no por qué falla la CLI de payload.\n\nPruebas locales, sin hardware:\n\n```bash\npython3 -m unittest discover -s diagnostico -p 'test_*.py' -v\n```\n\nUsan ejecutables falsos en carpetas temporales para probar retorno, stderr, señales, timeout, exceso de salida y la parada tras el primer error. También prueban el parser del formato recuperado, las 32 posiciones de bit, el rechazo de duplicados e incompletos, un UIO ambiguo, validaciones pendientes, un hash distinto, el lock, un diario interrumpido y que el inventario no lance procesos. Los ejemplos falsos no son datos de ATLAS.\n\nFalta: correr el inventario en la Trenz, ver qué Python tiene, validar ELF, mapa y lectura, hacer el ensayo corto autorizado y ver qué pasa cuando AXI deja de responder de verdad. No se probó un proceso del kernel no interrumpible ni una caída completa del PS, y que el timeout funcione en local no garantiza que el hardware se recupere.\n\nSi el supervisor muere con SIGKILL o se corta la luz, el hijo y la evidencia pueden quedar a medias. SIGTERM y SIGHUP se tratan como interrupciones cuando Python puede procesarlas, pero no se garantiza que reaccione durante un bloqueo del kernel. El lock y el intento guardado sirven para detectar cierres sucios, no para evitarlos.\n\nNo se añadió un contador de frescura, captura coherente de frames ni monitor del MGT. Hacerlo sin saber cómo se comporta el hardware cargado convertiría hipótesis en instrumentos que engañan. El siguiente paso útil es correr S0 y cerrar el plan de S1, no automatizar más accesos.\n","html":"\u003ch2 id=\"8-pruebas-límites-y-lo-que-falta\">8. Pruebas, límites y lo que falta\u003c/h2>\n\u003cp>Lo nuevo es un envoltorio que observa, escrito porque el usuario pidió un script. No cambia la CLI, \u003ccode>libuio\u003c/code>, \u003ccode>LpGbtSw\u003c/code>, el firmware ni el protocolo de acceso original.\u003c/p>\n\u003cp>Se diseñó a partir del \u003ca href=\"02_CATALOGO.md\">catálogo\u003c/a>, las \u003ca href=\"11_COMPATIBILIDAD.md\">incompatibilidades\u003c/a>, B01/B02 (CLI y wrapper), B10 (esperas IC) y B11 (máscara de byte). Los extractos con líneas y hashes están en \u003ccode>evidencias.json\u003c/code> y en la web. B10 explica por qué no se usa \u003ccode>lpGbtRegister\u003c/code> como lector pasivo, no por qué falla la CLI de payload.\u003c/p>\n\u003cp>Pruebas locales, sin hardware:\u003c/p>\n\u003cpre>\u003ccode>python3 -m unittest discover -s diagnostico -p 'test_*.py' -v\u003c/code>\u003c/pre>\n\u003cp>Usan ejecutables falsos en carpetas temporales para probar retorno, stderr, señales, timeout, exceso de salida y la parada tras el primer error. También prueban el parser del formato recuperado, las 32 posiciones de bit, el rechazo de duplicados e incompletos, un UIO ambiguo, validaciones pendientes, un hash distinto, el lock, un diario interrumpido y que el inventario no lance procesos. Los ejemplos falsos no son datos de ATLAS.\u003c/p>\n\u003cp>Falta: correr el inventario en la Trenz, ver qué Python tiene, validar ELF, mapa y lectura, hacer el ensayo corto autorizado y ver qué pasa cuando AXI deja de responder de verdad. No se probó un proceso del kernel no interrumpible ni una caída completa del PS, y que el timeout funcione en local no garantiza que el hardware se recupere.\u003c/p>\n\u003cp>Si el supervisor muere con SIGKILL o se corta la luz, el hijo y la evidencia pueden quedar a medias. SIGTERM y SIGHUP se tratan como interrupciones cuando Python puede procesarlas, pero no se garantiza que reaccione durante un bloqueo del kernel. El lock y el intento guardado sirven para detectar cierres sucios, no para evitarlos.\u003c/p>\n\u003cp>No se añadió un contador de frescura, captura coherente de frames ni monitor del MGT. Hacerlo sin saber cómo se comporta el hardware cargado convertiría hipótesis en instrumentos que engañan. El siguiente paso útil es correr S0 y cerrar el plan de S1, no automatizar más accesos.\u003c/p>\n"}]},{"id":"13_GUIA_RAPIDA","file":"13_GUIA_RAPIDA.md","title":"EMP / lpGBT · guía de trabajo","sections":[{"title":"Antes de comenzar","anchor":"","text":"# EMP / lpGBT · guía de trabajo\n\nLa Trenz muestra los registros del EMP, y el enlace IC 10 respondió en la sesión del 19-11-2026. Para saber de dónde viene el payload falta la prueba con un estímulo conocido del front-end.\n\n","html":"\u003ch1 id=\"emp--lpgbt--guía-de-trabajo\">EMP / lpGBT · guía de trabajo\u003c/h1>\n\u003cp>La Trenz muestra los registros del EMP, y el enlace IC 10 respondió en la sesión del 19-11-2026. Para saber de dónde viene el payload falta la prueba con un estímulo conocido del front-end.\u003c/p>\n"},{"title":"Leer datos","anchor":"leer-datos","text":"## Leer datos\n\nPara diagnosticar, leer y guardar el CSV, usa la [guía de operación con emp](15_OPERAR_EMP.md). La [prueba A/B/A del front-end](00_GUIA_CAMPO.md#etapa-d-prueba-externa-aba) y el [procedimiento con la CLI anterior](00_GUIA_CAMPO.md#etapa-c-leer-los-datos-expuestos-por-la-fpga) están en la guía de campo.\n\n","html":"\u003ch2 id=\"leer-datos\">Leer datos\u003c/h2>\n\u003cp>Para diagnosticar, leer y guardar el CSV, usa la \u003ca href=\"15_OPERAR_EMP.md\">guía de operación con emp\u003c/a>. La \u003ca href=\"00_GUIA_CAMPO.md#etapa-d-prueba-externa-aba\">prueba A/B/A del front-end\u003c/a> y el \u003ca href=\"00_GUIA_CAMPO.md#etapa-c-leer-los-datos-expuestos-por-la-fpga\">procedimiento con la CLI anterior\u003c/a> están en la guía de campo.\u003c/p>\n"},{"title":"Arquitectura","anchor":"arquitectura","text":"## Arquitectura\n\nEl camino RX dentro del wrapper está comprobado en el código recuperado. No sabemos qué fuente está seleccionada hoy ni cómo se conecta el capturador de nueve grupos. Las flechas discontinuas son conexiones sin confirmar.\n\n```mermaid\nflowchart TD\n FE[\"Front-end / e-links\"] -. \"configuración pendiente\" .-> CHIP[\"lpGBT\"]\n CHIP -. \"enlace físico actual por verificar\" .-> MGT[\"MGT / palabras RX\"]\n MGT --> CORE[\"Gearbox / FEC / descrambler\"]\n CORE --> CDC[\"CDC / UserData 230 bits\"]\n CDC -. \"integración ausente en la evidencia\" .-> CAP[\"Capturador de nueve grupos\"]\n CAP -. \"RTL por obtener\" .-> AXI[\"Registros AXI\"]\n AXI --> SW[\"UIO / C++ / terminal\"]\n```\n\nLa clase C++ dice qué registros espera el software. Que la build cargada los tenga es otra cuestión. [Mapa con fuentes](01_MAPA_TECNICO.md).\n\n","html":"\u003ch2 id=\"arquitectura\">Arquitectura\u003c/h2>\n\u003cp>El camino RX dentro del wrapper está comprobado en el código recuperado. No sabemos qué fuente está seleccionada hoy ni cómo se conecta el capturador de nueve grupos. Las flechas discontinuas son conexiones sin confirmar.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TD\n FE[\"Front-end / e-links\"] -. \"configuración pendiente\" .-&gt; CHIP[\"lpGBT\"]\n CHIP -. \"enlace físico actual por verificar\" .-&gt; MGT[\"MGT / palabras RX\"]\n MGT --&gt; CORE[\"Gearbox / FEC / descrambler\"]\n CORE --&gt; CDC[\"CDC / UserData 230 bits\"]\n CDC -. \"integración ausente en la evidencia\" .-&gt; CAP[\"Capturador de nueve grupos\"]\n CAP -. \"RTL por obtener\" .-&gt; AXI[\"Registros AXI\"]\n AXI --&gt; SW[\"UIO / C++ / terminal\"]\u003c/pre>\u003cp>La clase C++ dice qué registros espera el software. Que la build cargada los tenga es otra cuestión. \u003ca href=\"01_MAPA_TECNICO.md\">Mapa con fuentes\u003c/a>.\u003c/p>\n"},{"title":"Dominios de reloj","anchor":"dominios-de-reloj","text":"## Dominios de reloj\n\nEl gearbox trabaja con un enable dentro del dominio RX. Después, el CDC pasa 234 bits, y el wrapper los separa en 230 bits de usuario, EC e IC. `ready` no cuenta eventos.\n\n```mermaid\nflowchart TD\n subgraph RX[\"Dominio RX / fuente RTL\"]\n M[\"MGT_USRWORD_i\"] --> G[\"Gearbox 32 a 256 bits\"]\n G --> D[\"Decodificación / 234 bits\"]\n end\n D --> C[\"cdc_rx / relojes relacionados\"]\n subgraph PS[\"Dominio logicclk40\"]\n C --> U[\"UserData 229:0 + EC + IC\"]\n U -. \"captura por reconstruir\" .-> R[\"Registros visibles al PS\"]\n end\n```\n\nWrapper, core y CDC están comprobados en el código. El reloj y el protocolo del capturador cargado son desconocidos. Este CDC no es una FIFO asíncrona cualquiera. [Detalles y límites](10_BLOQUEO_LECTURAS.md#3-hallazgos-nuevos-en-rtl-y-software).\n\n","html":"\u003ch2 id=\"dominios-de-reloj\">Dominios de reloj\u003c/h2>\n\u003cp>El gearbox trabaja con un enable dentro del dominio RX. Después, el CDC pasa 234 bits, y el wrapper los separa en 230 bits de usuario, EC e IC. \u003ccode>ready\u003c/code> no cuenta eventos.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TD\n subgraph RX[\"Dominio RX / fuente RTL\"]\n M[\"MGT_USRWORD_i\"] --&gt; G[\"Gearbox 32 a 256 bits\"]\n G --&gt; D[\"Decodificación / 234 bits\"]\n end\n D --&gt; C[\"cdc_rx / relojes relacionados\"]\n subgraph PS[\"Dominio logicclk40\"]\n C --&gt; U[\"UserData 229:0 + EC + IC\"]\n U -. \"captura por reconstruir\" .-&gt; R[\"Registros visibles al PS\"]\n end\u003c/pre>\u003cp>Wrapper, core y CDC están comprobados en el código. El reloj y el protocolo del capturador cargado son desconocidos. Este CDC no es una FIFO asíncrona cualquiera. \u003ca href=\"10_BLOQUEO_LECTURAS.md#3-hallazgos-nuevos-en-rtl-y-software\">Detalles y límites\u003c/a>.\u003c/p>\n"},{"title":"De un comando a una lectura","anchor":"de-un-comando-a-una-lectura","text":"## De un comando a una lectura\n\nLa CLI recuperada no lee argumentos, así que incluso `--help` accede al hardware. Hace doce lecturas independientes (extractos B01–B04).\n\n```mermaid\nsequenceDiagram\n participant CLI as main()\n participant CPP as TgcReadUplink\n participant UIO as libuio\n participant MEM as MMIO\n CLI->>CPP: constructor por nombre tgc_readUplink_regs\n CPP->>UIO: uio_find_by_uio_name / uio_open\n UIO->>UIO: open + mmap\n CLI->>CPP: readDataGroup0Value()\n CPP->>UIO: uio_read32(map 0, offset 4)\n UIO->>MEM: lectura volatile de 32 bits\n MEM-->>CLI: valor e impresión hexadecimal\n```\n\nLa flecha de vuelta resume el retorno por las funciones. Que `open` y `mmap` funcionen no garantiza que AXI responda. [Recorrido completo](01_MAPA_TECNICO.md).\n\n","html":"\u003ch2 id=\"de-un-comando-a-una-lectura\">De un comando a una lectura\u003c/h2>\n\u003cp>La CLI recuperada no lee argumentos, así que incluso \u003ccode>--help\u003c/code> accede al hardware. Hace doce lecturas independientes (extractos B01–B04).\u003c/p>\n\u003cpre class=\"mermaid\">sequenceDiagram\n participant CLI as main()\n participant CPP as TgcReadUplink\n participant UIO as libuio\n participant MEM as MMIO\n CLI-&gt;&gt;CPP: constructor por nombre tgc_readUplink_regs\n CPP-&gt;&gt;UIO: uio_find_by_uio_name / uio_open\n UIO-&gt;&gt;UIO: open + mmap\n CLI-&gt;&gt;CPP: readDataGroup0Value()\n CPP-&gt;&gt;UIO: uio_read32(map 0, offset 4)\n UIO-&gt;&gt;MEM: lectura volatile de 32 bits\n MEM--&gt;&gt;CLI: valor e impresión hexadecimal\u003c/pre>\u003cp>La flecha de vuelta resume el retorno por las funciones. Que \u003ccode>open\u003c/code> y \u003ccode>mmap\u003c/code> funcionen no garantiza que AXI responda. \u003ca href=\"01_MAPA_TECNICO.md\">Recorrido completo\u003c/a>.\u003c/p>\n"},{"title":"Registros del lector","anchor":"registros-del-lector","text":"## Registros del lector\n\nEsta tabla sale de la clase C++ recuperada. Falta comprobarla en el hardware actual, así que no la uses para explorar otra build.\n\n| Registro | Offset | Qué sabemos |\n|---|---|---|\n| `magic` | `0x00` | Identificador que espera la clase. No conocemos su valor actual. |\n| `data_group_0..8` | `0x04..0x24`, paso 4 | Nueve palabras de 32 bits. No sabemos el packing, el frame ni el canal. |\n| `data_header` | `0x28` | Falta el RTL. No lo trates como contador de eventos. |\n| `clk_thresh` | `0x2c` | Ajuste de temporización según las notas. No lo barras para diagnosticar. |\n\nLas nueve palabras juntas son 288 bits. No las pegues como si fueran los 230 bits del payload. [Catálogo y variantes](02_CATALOGO.md).\n\n","html":"\u003ch2 id=\"registros-del-lector\">Registros del lector\u003c/h2>\n\u003cp>Esta tabla sale de la clase C++ recuperada. Falta comprobarla en el hardware actual, así que no la uses para explorar otra build.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Registro\u003c/th>\n\u003cth>Offset\u003c/th>\n\u003cth>Qué sabemos\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>magic\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x00\u003c/code>\u003c/td>\n\u003ctd>Identificador que espera la clase. No conocemos su valor actual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>data_group_0..8\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x04..0x24\u003c/code>, paso 4\u003c/td>\n\u003ctd>Nueve palabras de 32 bits. No sabemos el packing, el frame ni el canal.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>data_header\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x28\u003c/code>\u003c/td>\n\u003ctd>Falta el RTL. No lo trates como contador de eventos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>clk_thresh\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0x2c\u003c/code>\u003c/td>\n\u003ctd>Ajuste de temporización según las notas. No lo barras para diagnosticar.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Las nueve palabras juntas son 288 bits. No las pegues como si fueran los 230 bits del payload. \u003ca href=\"02_CATALOGO.md\">Catálogo y variantes\u003c/a>.\u003c/p>\n"},{"title":"Control del chip y payload","anchor":"control-del-chip-y-payload","text":"## Control del chip y payload\n\nSon dos caminos distintos. `lpGbtRegister -r` toca el controlador IC y vacía su FIFO, así que no es una lectura inocente del payload.\n\n```mermaid\nflowchart TD\n L[\"Linux\"] --> P[\"tgc_readuplink_cli\"]\n L --> I[\"lpGbtRegister / LpGbtSw\"]\n P --> R[\"Registros del capturador\"]\n I --> C[\"Control / IRQ / FIFO IC\"]\n C --> CHIP[\"Registro remoto del lpGBT\"]\n R --> DATA[\"Palabras expuestas por la FPGA\"]\n```\n\nComprobado en el código recuperado (B01–B03, B06, B10). En cada build hay que confirmar cómo está integrado en el hardware. [Herramientas](02_CATALOGO.md).\n\n","html":"\u003ch2 id=\"control-del-chip-y-payload\">Control del chip y payload\u003c/h2>\n\u003cp>Son dos caminos distintos. \u003ccode>lpGbtRegister -r\u003c/code> toca el controlador IC y vacía su FIFO, así que no es una lectura inocente del payload.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TD\n L[\"Linux\"] --&gt; P[\"tgc_readuplink_cli\"]\n L --&gt; I[\"lpGbtRegister / LpGbtSw\"]\n P --&gt; R[\"Registros del capturador\"]\n I --&gt; C[\"Control / IRQ / FIFO IC\"]\n C --&gt; CHIP[\"Registro remoto del lpGBT\"]\n R --&gt; DATA[\"Palabras expuestas por la FPGA\"]\u003c/pre>\u003cp>Comprobado en el código recuperado (B01–B03, B06, B10). En cada build hay que confirmar cómo está integrado en el hardware. \u003ca href=\"02_CATALOGO.md\">Herramientas\u003c/a>.\u003c/p>\n"},{"title":"Cuando los valores se pegan","anchor":"cuando-los-valores-se-pegan","text":"## Cuando los valores se pegan\n\nLo primero: ¿el comando vuelve al prompt? Que un reset lo arreglara no dice qué pieza fallaba.\n\n```mermaid\nflowchart TD\n Q{\"¿Termina el comando?\"} -->|\"No\"| P[\"Conservar PID / stderr / estado Linux\"]\n Q -->|\"Sí\"| B{\"¿Cambian palabras completas?\"}\n B -->|\"Sí, pero no el byte bajo\"| S[\"Revisar script o representación\"]\n B -->|\"No\"| E{\"¿Hay estímulo externo demostrado?\"}\n E -->|\"No\"| U[\"Resultado inconcluso\"]\n E -->|\"Sí\"| C[\"Observar progreso UserData y captura\"]\n P --> X[\"Separar bucle IC, espera y acceso AXI\"]\n```\n\nSi la CLI termina pero repite la misma muestra, lo más probable es que haya que mirar la captura, el rearme y la fuente. La causa original sigue sin conocerse. [Hipótesis H1–H7](10_BLOQUEO_LECTURAS.md) y [script S0–S4](12_SCRIPT_DIAGNOSTICO.md).\n\n","html":"\u003ch2 id=\"cuando-los-valores-se-pegan\">Cuando los valores se pegan\u003c/h2>\n\u003cp>Lo primero: ¿el comando vuelve al prompt? Que un reset lo arreglara no dice qué pieza fallaba.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TD\n Q{\"¿Termina el comando?\"} --&gt;|\"No\"| P[\"Conservar PID / stderr / estado Linux\"]\n Q --&gt;|\"Sí\"| B{\"¿Cambian palabras completas?\"}\n B --&gt;|\"Sí, pero no el byte bajo\"| S[\"Revisar script o representación\"]\n B --&gt;|\"No\"| E{\"¿Hay estímulo externo demostrado?\"}\n E --&gt;|\"No\"| U[\"Resultado inconcluso\"]\n E --&gt;|\"Sí\"| C[\"Observar progreso UserData y captura\"]\n P --&gt; X[\"Separar bucle IC, espera y acceso AXI\"]\u003c/pre>\u003cp>Si la CLI termina pero repite la misma muestra, lo más probable es que haya que mirar la captura, el rearme y la fuente. La causa original sigue sin conocerse. \u003ca href=\"10_BLOQUEO_LECTURAS.md\">Hipótesis H1–H7\u003c/a> y \u003ca href=\"12_SCRIPT_DIAGNOSTICO.md\">script S0–S4\u003c/a>.\u003c/p>\n"},{"title":"Qué mide cada indicador","anchor":"qué-mide-cada-indicador","text":"## Qué mide cada indicador\n\n| Observación | Qué te dice | Qué no te dice |\n|---|---|---|\n| Aparece el UIO | Linux registró el dispositivo | Si la IP es compatible o si AXI responde |\n| `RX locked` | La FPGA encontró la cabecera (debughub) | De dónde viene el dato, si está íntegro o si es nuevo |\n| `XCVR Ready` | AND de ready TX y RX del MGT | Si llegan eventos nuevos |\n| El payload cambia | Hay diferencia entre dos lecturas | Si es un frame coherente o viene de fuera |\n| El payload se repite | Los valores leídos son iguales | Si el capturador está detenido |\n\n```mermaid\nflowchart TD\n S[\"Niveles de estado / fwMonitor\"] --> A[\"Enlace y alineación, según build\"]\n P[\"Contador o strobe observado\"] --> B[\"Progreso, si su semántica se conoce\"]\n D[\"Estímulo FE y respuesta A/B/A\"] --> C[\"Evidencia de origen externo\"]\n A --> V[\"Combinar evidencias; ninguna basta sola\"]\n B --> V\n C --> V\n```\n\nLa CLI recuperada no muestra contadores ni strobes. La figura describe la prueba que querríamos hacer, con instrumentos que todavía no hay. [Diagnóstico de enlace](00_GUIA_CAMPO.md#etapa-b-diagnosticar-el-enlace).\n\n","html":"\u003ch2 id=\"qué-mide-cada-indicador\">Qué mide cada indicador\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Observación\u003c/th>\n\u003cth>Qué te dice\u003c/th>\n\u003cth>Qué no te dice\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aparece el UIO\u003c/td>\n\u003ctd>Linux registró el dispositivo\u003c/td>\n\u003ctd>Si la IP es compatible o si AXI responde\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>RX locked\u003c/code>\u003c/td>\n\u003ctd>La FPGA encontró la cabecera (debughub)\u003c/td>\n\u003ctd>De dónde viene el dato, si está íntegro o si es nuevo\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>XCVR Ready\u003c/code>\u003c/td>\n\u003ctd>AND de ready TX y RX del MGT\u003c/td>\n\u003ctd>Si llegan eventos nuevos\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>El payload cambia\u003c/td>\n\u003ctd>Hay diferencia entre dos lecturas\u003c/td>\n\u003ctd>Si es un frame coherente o viene de fuera\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>El payload se repite\u003c/td>\n\u003ctd>Los valores leídos son iguales\u003c/td>\n\u003ctd>Si el capturador está detenido\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cpre class=\"mermaid\">flowchart TD\n S[\"Niveles de estado / fwMonitor\"] --&gt; A[\"Enlace y alineación, según build\"]\n P[\"Contador o strobe observado\"] --&gt; B[\"Progreso, si su semántica se conoce\"]\n D[\"Estímulo FE y respuesta A/B/A\"] --&gt; C[\"Evidencia de origen externo\"]\n A --&gt; V[\"Combinar evidencias; ninguna basta sola\"]\n B --&gt; V\n C --&gt; V\u003c/pre>\u003cp>La CLI recuperada no muestra contadores ni strobes. La figura describe la prueba que querríamos hacer, con instrumentos que todavía no hay. \u003ca href=\"00_GUIA_CAMPO.md#etapa-b-diagnosticar-el-enlace\">Diagnóstico de enlace\u003c/a>.\u003c/p>\n"},{"title":"Prueba externa A/B/A","anchor":"prueba-externa-aba","text":"## Prueba externa A/B/A\n\nAntes de hacerla hay que confirmar el reloj del FE, el cableado, la fuente seleccionada, el estímulo y cuánto retiene la captura. El script solo anota los cambios; no los hace.\n\n```mermaid\nsequenceDiagram\n participant OP as Ingeniero\n participant FE as Front-end\n participant LOG as Capturas Linux\n OP->>FE: fijar estado A y comprobarlo físicamente\n OP->>LOG: conservar varias muestras A\n OP->>FE: aplicar estímulo B conocido\n OP->>LOG: anotar instante y conservar muestras B\n OP->>FE: volver a A\n OP->>LOG: conservar A2 y comparar tras la latencia esperada\n```\n\nSi los cambios siguen al estímulo y se repiten, eso apunta a recepción externa. Si solo aparecen con loopback, el FE sigue sin probarse. Repite la prueba y guarda la configuración. [Condiciones y qué la invalida](00_GUIA_CAMPO.md#etapa-d-prueba-externa-aba).\n\n","html":"\u003ch2 id=\"prueba-externa-aba\">Prueba externa A/B/A\u003c/h2>\n\u003cp>Antes de hacerla hay que confirmar el reloj del FE, el cableado, la fuente seleccionada, el estímulo y cuánto retiene la captura. El script solo anota los cambios; no los hace.\u003c/p>\n\u003cpre class=\"mermaid\">sequenceDiagram\n participant OP as Ingeniero\n participant FE as Front-end\n participant LOG as Capturas Linux\n OP-&gt;&gt;FE: fijar estado A y comprobarlo físicamente\n OP-&gt;&gt;LOG: conservar varias muestras A\n OP-&gt;&gt;FE: aplicar estímulo B conocido\n OP-&gt;&gt;LOG: anotar instante y conservar muestras B\n OP-&gt;&gt;FE: volver a A\n OP-&gt;&gt;LOG: conservar A2 y comparar tras la latencia esperada\u003c/pre>\u003cp>Si los cambios siguen al estímulo y se repiten, eso apunta a recepción externa. Si solo aparecen con loopback, el FE sigue sin probarse. Repite la prueba y guarda la configuración. \u003ca href=\"00_GUIA_CAMPO.md#etapa-d-prueba-externa-aba\">Condiciones y qué la invalida\u003c/a>.\u003c/p>\n"},{"title":"Incompatibilidades que importan","anchor":"incompatibilidades-que-importan","text":"## Incompatibilidades que importan\n\n```mermaid\nflowchart TD\n B[\"Build / bitstream identificado\"] --> R[\"RTL y mapa de esa build\"]\n R --> T[\"Device Tree / mapas UIO\"]\n T --> C[\"Contrato de registros\"]\n C --> E[\"ELF + bibliotecas correspondientes\"]\n S[\"Scripts históricos A00D / A00E\"] -. \"no trasladar direcciones\" .-> T\n```\n\nEn el BD recuperado, `0xA00D0000` y `0xA00E0000` son interrupt controllers, pero algunos scripts los usan como generador y lector. Son versiones distintas que se contradicen. Esto no prueba que la dirección actual esté mal. [Tabla de compatibilidad](11_COMPATIBILIDAD.md).\n\n","html":"\u003ch2 id=\"incompatibilidades-que-importan\">Incompatibilidades que importan\u003c/h2>\n\u003cpre class=\"mermaid\">flowchart TD\n B[\"Build / bitstream identificado\"] --&gt; R[\"RTL y mapa de esa build\"]\n R --&gt; T[\"Device Tree / mapas UIO\"]\n T --&gt; C[\"Contrato de registros\"]\n C --&gt; E[\"ELF + bibliotecas correspondientes\"]\n S[\"Scripts históricos A00D / A00E\"] -. \"no trasladar direcciones\" .-&gt; T\u003c/pre>\u003cp>En el BD recuperado, \u003ccode>0xA00D0000\u003c/code> y \u003ccode>0xA00E0000\u003c/code> son interrupt controllers, pero algunos scripts los usan como generador y lector. Son versiones distintas que se contradicen. Esto no prueba que la dirección actual esté mal. \u003ca href=\"11_COMPATIBILIDAD.md\">Tabla de compatibilidad\u003c/a>.\u003c/p>\n"},{"title":"Qué falta para cerrar la recuperación","anchor":"qué-falta-para-cerrar-la-recuperación","text":"## Qué falta para cerrar la recuperación\n\n- Qué build está cargada y el RTL del capturador de nueve grupos.\n- Packing de los grupos, significado del header, trigger, rearme y coherencia.\n- Configuración real del FE y del lpGBT, fuente seleccionada y un estímulo externo repetible.\n- Captura del fallo antes del reset y qué se reinicia exactamente.\n\n[Incertidumbres](04_INCERTIDUMBRES.md) · [Historia](03_HISTORIA.md) · [Auditoría](07_AUDITORIA.md) · [Fuentes](08_FUENTES.md). Todo esto sale del código y de las notas; esta investigación no operó el hardware.\n","html":"\u003ch2 id=\"qué-falta-para-cerrar-la-recuperación\">Qué falta para cerrar la recuperación\u003c/h2>\n\u003cul>\n\u003cli>Qué build está cargada y el RTL del capturador de nueve grupos.\u003c/li>\n\u003cli>Packing de los grupos, significado del header, trigger, rearme y coherencia.\u003c/li>\n\u003cli>Configuración real del FE y del lpGBT, fuente seleccionada y un estímulo externo repetible.\u003c/li>\n\u003cli>Captura del fallo antes del reset y qué se reinicia exactamente.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca href=\"04_INCERTIDUMBRES.md\">Incertidumbres\u003c/a> · \u003ca href=\"03_HISTORIA.md\">Historia\u003c/a> · \u003ca href=\"07_AUDITORIA.md\">Auditoría\u003c/a> · \u003ca href=\"08_FUENTES.md\">Fuentes\u003c/a>. Todo esto sale del código y de las notas; esta investigación no operó el hardware.\u003c/p>\n"}]},{"id":"14_NOTAS_DE_TRABAJO","file":"14_NOTAS_DE_TRABAJO.md","title":"Retomar la lectura del front-end","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Retomar la lectura del front-end\n\nHerramientas, rutas y notas para volver a trabajar con la Trenz. `~` es el home de la placa, por ejemplo `~/read_all_lpgbt/`. Las rutas `atlas_emc/...` son del repositorio. Si una carpeta se movió, ajusta esa parte.\n\nPara operar la Trenz con el mapa de noviembre, empieza por [emp y la captura CSV](15_OPERAR_EMP.md). Aquí quedan las rutas de firmware, reloj y herramientas de los ensayos anteriores.\n\n","html":"\u003ch1 id=\"retomar-la-lectura-del-front-end\">Retomar la lectura del front-end\u003c/h1>\n\u003cp>Herramientas, rutas y notas para volver a trabajar con la Trenz. \u003ccode>~\u003c/code> es el home de la placa, por ejemplo \u003ccode>~/read_all_lpgbt/\u003c/code>. Las rutas \u003ccode>atlas_emc/...\u003c/code> son del repositorio. Si una carpeta se movió, ajusta esa parte.\u003c/p>\n\u003cp>Para operar la Trenz con el mapa de noviembre, empieza por \u003ca href=\"15_OPERAR_EMP.md\">emp y la captura CSV\u003c/a>. Aquí quedan las rutas de firmware, reloj y herramientas de los ensayos anteriores.\u003c/p>\n"},{"title":"Orden de trabajo","anchor":"orden-de-trabajo","text":"## Orden de trabajo\n\nSi algo ya funciona, anótalo primero. No hace falta recargar todo.\n\n| Paso | Qué hacer | Programa / archivo |\n|---|---|---|\n| 1. Firmware | Con la placa operativa, revisa el mapa con `emp doctor`. `reading_1006.dtbo` es de los ensayos de octubre. | `~/capture/emp`, `~/epos/etools/loadFirmare.sh -l` |\n| 2. Reloj | Mira si el servicio de arranque programó el Si5345. Confirma la variante y el bus I²C antes de repetir una configuración. | `/usr/bin/clkProgrammer`, `systemd-programclock.service` |\n| 3. lpGBT | Confirma canal, tasas y fuente del serializer en PiGBT o en el `.cnf`. | PiGBT o `~/LpGbtSw/build/Demonstrators/LpGbtConfiguration/lpGbtConfiguration` |\n| 4. Enlace | En noviembre, `emp doctor --probe 10` confirmó respuesta IC. Usa `fwMonitor --id N` para ver los estados del pipeline elegido. | `~/capture/emp`, `fwMonitor` |\n| 5. Lectura | Guarda las palabras crudas del banco validado. | [`emp read`, `watch` y `start`](15_OPERAR_EMP.md) |\n| 6. Comparación | Aplica un patrón conocido y vuelve al estado anterior. Guarda las tres lecturas. | [Comparador de capturas](#comparar), [prueba A/B/A](00_GUIA_CAMPO.md#etapa-d-prueba-externa-aba) |\n\nPara empezar, estas órdenes solo miran archivos y metadatos:\n\n```bash\nuname -a\ncat /etc/os-release\nbash ~/epos/etools/loadFirmare.sh -l\nls /lib/firmware/\nsystemctl cat systemd-programclock.service\nfor u in /sys/class/uio/uio*; do\n  [ -d \"$u\" ] || continue\n  printf '%s\\n' \"$u\"\n  cat \"$u/name\" \"$u\"/maps/map0/{addr,size,offset}\ndone\n```\n\nEjemplos de carga y configuración. Están comentados a propósito porque cambian el equipo. Elige antes los archivos correctos:\n\n```bash\n# sudo ~/epos/etools/loadFirmare.sh FIRMWARE_ELEGIDO.dtbo\n# cd ~/LpGbtSw/build/Demonstrators/LpGbtConfiguration\n# sudo ./lpGbtConfiguration -a lpgbt-uio://emp_lpgbt_10 -w CONFIG.cnf\n```\n\nNotas relacionadas en `atlas_emc/ChargeMonitoringSystem_obsidian/30_Notes/`: `1002-Programa de envios.md`, `1028-Pruebas de envio de constante.md`, `0922-Conectando a LPGBT.md` y `1028-1031-Testing.md`. Son de ensayos anteriores; no dicen qué está cargado hoy.\n\n","html":"\u003ch2 id=\"orden-de-trabajo\">Orden de trabajo\u003c/h2>\n\u003cp>Si algo ya funciona, anótalo primero. No hace falta recargar todo.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Paso\u003c/th>\n\u003cth>Qué hacer\u003c/th>\n\u003cth>Programa / archivo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1. Firmware\u003c/td>\n\u003ctd>Con la placa operativa, revisa el mapa con \u003ccode>emp doctor\u003c/code>. \u003ccode>reading_1006.dtbo\u003c/code> es de los ensayos de octubre.\u003c/td>\n\u003ctd>\u003ccode>~/capture/emp\u003c/code>, \u003ccode>~/epos/etools/loadFirmare.sh -l\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2. Reloj\u003c/td>\n\u003ctd>Mira si el servicio de arranque programó el Si5345. Confirma la variante y el bus I²C antes de repetir una configuración.\u003c/td>\n\u003ctd>\u003ccode>/usr/bin/clkProgrammer\u003c/code>, \u003ccode>systemd-programclock.service\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3. lpGBT\u003c/td>\n\u003ctd>Confirma canal, tasas y fuente del serializer en PiGBT o en el \u003ccode>.cnf\u003c/code>.\u003c/td>\n\u003ctd>PiGBT o \u003ccode>~/LpGbtSw/build/Demonstrators/LpGbtConfiguration/lpGbtConfiguration\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4. Enlace\u003c/td>\n\u003ctd>En noviembre, \u003ccode>emp doctor --probe 10\u003c/code> confirmó respuesta IC. Usa \u003ccode>fwMonitor --id N\u003c/code> para ver los estados del pipeline elegido.\u003c/td>\n\u003ctd>\u003ccode>~/capture/emp\u003c/code>, \u003ccode>fwMonitor\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5. Lectura\u003c/td>\n\u003ctd>Guarda las palabras crudas del banco validado.\u003c/td>\n\u003ctd>\u003ca href=\"15_OPERAR_EMP.md\">\u003ccode>emp read\u003c/code>, \u003ccode>watch\u003c/code> y \u003ccode>start\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6. Comparación\u003c/td>\n\u003ctd>Aplica un patrón conocido y vuelve al estado anterior. Guarda las tres lecturas.\u003c/td>\n\u003ctd>\u003ca href=\"#comparar\">Comparador de capturas\u003c/a>, \u003ca href=\"00_GUIA_CAMPO.md#etapa-d-prueba-externa-aba\">prueba A/B/A\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Para empezar, estas órdenes solo miran archivos y metadatos:\u003c/p>\n\u003cpre>\u003ccode>uname -a\ncat /etc/os-release\nbash ~/epos/etools/loadFirmare.sh -l\nls /lib/firmware/\nsystemctl cat systemd-programclock.service\nfor u in /sys/class/uio/uio*; do\n  [ -d \"$u\" ] || continue\n  printf '%s\\n' \"$u\"\n  cat \"$u/name\" \"$u\"/maps/map0/{addr,size,offset}\ndone\u003c/code>\u003c/pre>\n\u003cp>Ejemplos de carga y configuración. Están comentados a propósito porque cambian el equipo. Elige antes los archivos correctos:\u003c/p>\n\u003cpre>\u003ccode># sudo ~/epos/etools/loadFirmare.sh FIRMWARE_ELEGIDO.dtbo\n# cd ~/LpGbtSw/build/Demonstrators/LpGbtConfiguration\n# sudo ./lpGbtConfiguration -a lpgbt-uio://emp_lpgbt_10 -w CONFIG.cnf\u003c/code>\u003c/pre>\n\u003cp>Notas relacionadas en \u003ccode>atlas_emc/ChargeMonitoringSystem_obsidian/30_Notes/\u003c/code>: \u003ccode>1002-Programa de envios.md\u003c/code>, \u003ccode>1028-Pruebas de envio de constante.md\u003c/code>, \u003ccode>0922-Conectando a LPGBT.md\u003c/code> y \u003ccode>1028-1031-Testing.md\u003c/code>. Son de ensayos anteriores; no dicen qué está cargado hoy.\u003c/p>\n"},{"title":"Tabla de herramientas","anchor":"tabla-de-herramientas","text":"## Tabla de herramientas\n\n| Quiero revisar | Programa | Qué devuelve | Dónde está |\n|---|---|---|---|\n| Leer, vigilar o guardar CSV | [`emp` y `raw.sh`](15_OPERAR_EMP.md) | Sondeos de registros y diagnóstico | `~/capture/` |\n| Palabras del capturador (CLI anterior) | `tgc_readuplink_cli` | magic, nueve grupos, header y threshold | `~/read_all_lpgbt/` |\n| Un registro por nombre y offset | `readuio` / `libuio` | Palabras de 32 bits | `~/test_uio/`; `~/libuio/` |\n| Estado del enlace | `fwMonitor` | RX locked, TX ready/aligned y XCVR Ready | `~/EMPToolsArtifacts/bin_TRENZ/` |\n| Patrón de prueba | `readprbs_cli` | Lecturas o escrituras del bloque PRBS | `~/puzzled_working/` |\n| Registro interno del chip | `lpGbtRegister` | Un byte del lpGBT por IC | `~/LpGbtSw/build/Demonstrators/LpGbtRegister/` |\n| Configuración, ADC o GPIO | Familia `LpGbtSw` | Configuración y periféricos del chip | `~/LpGbtSw/build/Demonstrators/` |\n| Reloj Si5345 | `clkProgrammer` | Estado o programación por I2C | `~/EMPToolsArtifacts/bin_TRENZ/`; antes también en `/usr/bin/` |\n| Firmware y pruebas antiguas | `loadFirmare.sh`, scripts `devmem` | Carga de overlay o accesos físicos | `~/epos/etools/`; scripts en `~` |\n| Guardar la sesión | `atlas_diagnostico.py` | Inventario, captura supervisada e informe | `atlas_emc/docs/recuperacion/diagnostico/` |\n\n","html":"\u003ch2 id=\"tabla-de-herramientas\">Tabla de herramientas\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Quiero revisar\u003c/th>\n\u003cth>Programa\u003c/th>\n\u003cth>Qué devuelve\u003c/th>\n\u003cth>Dónde está\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Leer, vigilar o guardar CSV\u003c/td>\n\u003ctd>\u003ca href=\"15_OPERAR_EMP.md\">\u003ccode>emp\u003c/code> y \u003ccode>raw.sh\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>Sondeos de registros y diagnóstico\u003c/td>\n\u003ctd>\u003ccode>~/capture/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Palabras del capturador (CLI anterior)\u003c/td>\n\u003ctd>\u003ccode>tgc_readuplink_cli\u003c/code>\u003c/td>\n\u003ctd>magic, nueve grupos, header y threshold\u003c/td>\n\u003ctd>\u003ccode>~/read_all_lpgbt/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Un registro por nombre y offset\u003c/td>\n\u003ctd>\u003ccode>readuio\u003c/code> / \u003ccode>libuio\u003c/code>\u003c/td>\n\u003ctd>Palabras de 32 bits\u003c/td>\n\u003ctd>\u003ccode>~/test_uio/\u003c/code>; \u003ccode>~/libuio/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Estado del enlace\u003c/td>\n\u003ctd>\u003ccode>fwMonitor\u003c/code>\u003c/td>\n\u003ctd>RX locked, TX ready/aligned y XCVR Ready\u003c/td>\n\u003ctd>\u003ccode>~/EMPToolsArtifacts/bin_TRENZ/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Patrón de prueba\u003c/td>\n\u003ctd>\u003ccode>readprbs_cli\u003c/code>\u003c/td>\n\u003ctd>Lecturas o escrituras del bloque PRBS\u003c/td>\n\u003ctd>\u003ccode>~/puzzled_working/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Registro interno del chip\u003c/td>\n\u003ctd>\u003ccode>lpGbtRegister\u003c/code>\u003c/td>\n\u003ctd>Un byte del lpGBT por IC\u003c/td>\n\u003ctd>\u003ccode>~/LpGbtSw/build/Demonstrators/LpGbtRegister/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Configuración, ADC o GPIO\u003c/td>\n\u003ctd>Familia \u003ccode>LpGbtSw\u003c/code>\u003c/td>\n\u003ctd>Configuración y periféricos del chip\u003c/td>\n\u003ctd>\u003ccode>~/LpGbtSw/build/Demonstrators/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reloj Si5345\u003c/td>\n\u003ctd>\u003ccode>clkProgrammer\u003c/code>\u003c/td>\n\u003ctd>Estado o programación por I2C\u003c/td>\n\u003ctd>\u003ccode>~/EMPToolsArtifacts/bin_TRENZ/\u003c/code>; antes también en \u003ccode>/usr/bin/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Firmware y pruebas antiguas\u003c/td>\n\u003ctd>\u003ccode>loadFirmare.sh\u003c/code>, scripts \u003ccode>devmem\u003c/code>\u003c/td>\n\u003ctd>Carga de overlay o accesos físicos\u003c/td>\n\u003ctd>\u003ccode>~/epos/etools/\u003c/code>; scripts en \u003ccode>~\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Guardar la sesión\u003c/td>\n\u003ctd>\u003ccode>atlas_diagnostico.py\u003c/code>\u003c/td>\n\u003ctd>Inventario, captura supervisada e informe\u003c/td>\n\u003ctd>\u003ccode>atlas_emc/docs/recuperacion/diagnostico/\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"tgc_readuplink_cli","anchor":"tgc_readuplink_cli","text":"## tgc_readuplink_cli\n\nEs el lector de los nueve grupos TGC. No permite elegir canal: abre siempre el UIO llamado `tgc_readUplink_regs`. Como `main()` no lee argumentos, `--help` también lee el hardware.\n\nFuentes: `~/read_all_lpgbt/tgc_readuplink_cli.cpp` y `TgcReadUplink.cpp`. La función que al final lee memoria es `uio_read32()`, en `~/libuio/mem.c:209–221`.\n\nCon el firmware, el mapa y los efectos de la lectura confirmados, una ejecución se guarda así:\n\n```bash\n~/read_all_lpgbt/tgc_readuplink_cli > tgc_01.out 2> tgc_01.err\nRC=$?\nprintf '%s\\n' \"$RC\" > tgc_01.rc\n```\n\nLa salida tiene doce registros: `magic`, `data_group_0…8`, `data_header` y `clk_thresh`. La línea decimal del final repite el threshold. El mensaje del constructor no es payload.\n\nCada registro se lee por separado. Falta confirmar el packing y si las palabras son del mismo evento. Un valor legible puede ser simplemente el último que quedó guardado. Para repetir lecturas, usa el supervisor con el plan revisado.\n\n","html":"\u003ch2 id=\"tgc_readuplink_cli\">tgc_readuplink_cli\u003c/h2>\n\u003cp>Es el lector de los nueve grupos TGC. No permite elegir canal: abre siempre el UIO llamado \u003ccode>tgc_readUplink_regs\u003c/code>. Como \u003ccode>main()\u003c/code> no lee argumentos, \u003ccode>--help\u003c/code> también lee el hardware.\u003c/p>\n\u003cp>Fuentes: \u003ccode>~/read_all_lpgbt/tgc_readuplink_cli.cpp\u003c/code> y \u003ccode>TgcReadUplink.cpp\u003c/code>. La función que al final lee memoria es \u003ccode>uio_read32()\u003c/code>, en \u003ccode>~/libuio/mem.c:209–221\u003c/code>.\u003c/p>\n\u003cp>Con el firmware, el mapa y los efectos de la lectura confirmados, una ejecución se guarda así:\u003c/p>\n\u003cpre>\u003ccode>~/read_all_lpgbt/tgc_readuplink_cli &gt; tgc_01.out 2&gt; tgc_01.err\nRC=$?\nprintf '%s\\n' \"$RC\" &gt; tgc_01.rc\u003c/code>\u003c/pre>\n\u003cp>La salida tiene doce registros: \u003ccode>magic\u003c/code>, \u003ccode>data_group_0…8\u003c/code>, \u003ccode>data_header\u003c/code> y \u003ccode>clk_thresh\u003c/code>. La línea decimal del final repite el threshold. El mensaje del constructor no es payload.\u003c/p>\n\u003cp>Cada registro se lee por separado. Falta confirmar el packing y si las palabras son del mismo evento. Un valor legible puede ser simplemente el último que quedó guardado. Para repetir lecturas, usa el supervisor con el plan revisado.\u003c/p>\n"},{"title":"readuio y libuio","anchor":"readuio-y-libuio","text":"## readuio y libuio\n\n`libuio` es una biblioteca. Busca el UIO, abre y mapea el dispositivo y hace las lecturas de memoria. Archivos: `~/libuio/libuio.so`, `base.c` y `mem.c`.\n\nLa utilidad que nos sirve es `~/test_uio/readuio` (fuente: `~/test_uio/readuio.c`). Recibe el nombre UIO y offsets en bytes. Úsala solo con el mapa TGC ya confirmado:\n\n```bash\n~/test_uio/readuio tgc_readUplink_regs 0x0 0x4 0x18 \\\n  > readuio_01.out 2> readuio_01.err\n```\n\nEn ese mapa, `0x0` es magic, `0x4` es el grupo 0 y `0x18` (24 bytes) es el grupo 5. Son bytes, no índices de un array.\n\n`test_uio/readuio` imprime en hexadecimal y `~/libuio/readuio.c` en decimal; cuidado al comparar. `uio_read32()` no comprueba límites, así que confirma rango y alineación antes de leer. Un `read()` sobre `/dev/uioN` espera una IRQ; para el payload hace falta el mmap.\n\n`uio_peek` y `test_open` tienen números UIO antiguos escritos en el código. Para el inventario usa sysfs; `lsuio` además libera mal la memoria.\n\n","html":"\u003ch2 id=\"readuio-y-libuio\">readuio y libuio\u003c/h2>\n\u003cp>\u003ccode>libuio\u003c/code> es una biblioteca. Busca el UIO, abre y mapea el dispositivo y hace las lecturas de memoria. Archivos: \u003ccode>~/libuio/libuio.so\u003c/code>, \u003ccode>base.c\u003c/code> y \u003ccode>mem.c\u003c/code>.\u003c/p>\n\u003cp>La utilidad que nos sirve es \u003ccode>~/test_uio/readuio\u003c/code> (fuente: \u003ccode>~/test_uio/readuio.c\u003c/code>). Recibe el nombre UIO y offsets en bytes. Úsala solo con el mapa TGC ya confirmado:\u003c/p>\n\u003cpre>\u003ccode>~/test_uio/readuio tgc_readUplink_regs 0x0 0x4 0x18 \\\n  &gt; readuio_01.out 2&gt; readuio_01.err\u003c/code>\u003c/pre>\n\u003cp>En ese mapa, \u003ccode>0x0\u003c/code> es magic, \u003ccode>0x4\u003c/code> es el grupo 0 y \u003ccode>0x18\u003c/code> (24 bytes) es el grupo 5. Son bytes, no índices de un array.\u003c/p>\n\u003cp>\u003ccode>test_uio/readuio\u003c/code> imprime en hexadecimal y \u003ccode>~/libuio/readuio.c\u003c/code> en decimal; cuidado al comparar. \u003ccode>uio_read32()\u003c/code> no comprueba límites, así que confirma rango y alineación antes de leer. Un \u003ccode>read()\u003c/code> sobre \u003ccode>/dev/uioN\u003c/code> espera una IRQ; para el payload hace falta el mmap.\u003c/p>\n\u003cp>\u003ccode>uio_peek\u003c/code> y \u003ccode>test_open\u003c/code> tienen números UIO antiguos escritos en el código. Para el inventario usa sysfs; \u003ccode>lsuio\u003c/code> además libera mal la memoria.\u003c/p>\n"},{"title":"fwMonitor","anchor":"fwmonitor","text":"## fwMonitor\n\nConsulta el debughub de la FPGA. El índice es el pipeline `emp_lpgbt`. No es el número de `/dev/uioN`, y tampoco tiene por qué coincidir con el e-link del FE.\n\nEjecutable: `~/EMPToolsArtifacts/bin_TRENZ/fwMonitor`. Fuente de la CLI: `~/emp-tools/empTools/fwStatus/fwStatus.cpp`; backend: `~/emp-tools/src/fwMonitor/fwMonitor.cpp`.\n\nHay otras copias en `bin_EMP` y en `~/clk_files/EMPToolsArtifacts/`, y los cuatro ELF son distintos. Confirma cuál corresponde al equipo y a sus bibliotecas. Con el mapa del debughub validado:\n\n```bash\nprintf 'Pipeline confirmado para esta conexión: '\nread -r CANAL\n~/EMPToolsArtifacts/bin_TRENZ/fwMonitor --id \"$CANAL\" \\\n  > enlace_01.out 2> enlace_01.err\nprintf '%s\\n' \"$?\" > enlace_01.rc\n```\n\n| Campo | Cómo leerlo |\n|---|---|\n| RX locked | La cabecera está alineada, según el RTL revisado. No dice si hay datos nuevos. |\n| TX ready / TX aligned | TX disponible y alineado en esa implementación. |\n| XCVR Ready | AND de los ready del transceptor. |\n\nSin `--id` recorre los canales 0…12. La tabla no muestra qué build hay ni todos los campos de reloj que lee el backend. Si falla al abrir el UIO o se cae, revisa el acceso antes de culpar a la fibra.\n\n","html":"\u003ch2 id=\"fwmonitor\">fwMonitor\u003c/h2>\n\u003cp>Consulta el debughub de la FPGA. El índice es el pipeline \u003ccode>emp_lpgbt\u003c/code>. No es el número de \u003ccode>/dev/uioN\u003c/code>, y tampoco tiene por qué coincidir con el e-link del FE.\u003c/p>\n\u003cp>Ejecutable: \u003ccode>~/EMPToolsArtifacts/bin_TRENZ/fwMonitor\u003c/code>. Fuente de la CLI: \u003ccode>~/emp-tools/empTools/fwStatus/fwStatus.cpp\u003c/code>; backend: \u003ccode>~/emp-tools/src/fwMonitor/fwMonitor.cpp\u003c/code>.\u003c/p>\n\u003cp>Hay otras copias en \u003ccode>bin_EMP\u003c/code> y en \u003ccode>~/clk_files/EMPToolsArtifacts/\u003c/code>, y los cuatro ELF son distintos. Confirma cuál corresponde al equipo y a sus bibliotecas. Con el mapa del debughub validado:\u003c/p>\n\u003cpre>\u003ccode>printf 'Pipeline confirmado para esta conexión: '\nread -r CANAL\n~/EMPToolsArtifacts/bin_TRENZ/fwMonitor --id \"$CANAL\" \\\n  &gt; enlace_01.out 2&gt; enlace_01.err\nprintf '%s\\n' \"$?\" &gt; enlace_01.rc\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Campo\u003c/th>\n\u003cth>Cómo leerlo\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>RX locked\u003c/td>\n\u003ctd>La cabecera está alineada, según el RTL revisado. No dice si hay datos nuevos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TX ready / TX aligned\u003c/td>\n\u003ctd>TX disponible y alineado en esa implementación.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>XCVR Ready\u003c/td>\n\u003ctd>AND de los ready del transceptor.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Sin \u003ccode>--id\u003c/code> recorre los canales 0…12. La tabla no muestra qué build hay ni todos los campos de reloj que lee el backend. Si falla al abrir el UIO o se cae, revisa el acceso antes de culpar a la fibra.\u003c/p>\n"},{"title":"readprbs_cli","anchor":"readprbs_cli","text":"## readprbs_cli\n\nControla un bloque de prueba con su propio mapa: magic `+0`, control `+4`, status `+8`, data_prbs `+0xC`. El mapa TGC es otro.\n\nEjecutable y fuentes: `~/puzzled_working/{readprbs_cli,readprbs_cli.cpp,ReadPRBS.cpp}`. En `~/puzzled_writePRBS/` hay otra copia: las fuentes de la CLI son idénticas, pero los ejecutables no.\n\nPara leer, solo con ese bloque y sus efectos confirmados:\n\n```bash\nprintf 'Nombre UIO del bloque PRBS confirmado: '\nread -r UIO_PRBS\n~/puzzled_working/readprbs_cli --by-name \"$UIO_PRBS\" \\\n  --read-magic --read-status --read-data \\\n  > prbs_01.out 2> prbs_01.err\n```\n\n| Opción | Uso |\n|---|---|\n| `--repeat N`, `--sleep-ms MS` | Repite las acciones, con una pausa entre cada vuelta. |\n| `--selftest` | Lee magic y status, y cinco veces data. Imprime OK sin comparar nada. Sola no escribe. |\n| `--json` | Líneas JSON, con el mensaje del constructor delante. El conjunto no es un JSON válido. |\n| `--write-data VAL`, `--write-control VAL` | Escriben. Confirma qué significa el valor y qué efecto tiene. |\n| `--write-sequence FILE` | Escribe los valores del archivo, uno por línea. |\n\nEn los overlays aparece el nombre `Read_PRBS_regs`; revisa sysfs antes de darlo por hecho. Pide siempre una acción: si eliges dispositivo y no das acción, la CLI corre selftest.\n\nEjemplo de escritura, comentado hasta elegir el patrón y confirmar la IP:\n\n```bash\n# ~/puzzled_working/readprbs_cli --by-name Read_PRBS_regs --write-data 0xEECCCC11\n```\n\n","html":"\u003ch2 id=\"readprbs_cli\">readprbs_cli\u003c/h2>\n\u003cp>Controla un bloque de prueba con su propio mapa: magic \u003ccode>+0\u003c/code>, control \u003ccode>+4\u003c/code>, status \u003ccode>+8\u003c/code>, data_prbs \u003ccode>+0xC\u003c/code>. El mapa TGC es otro.\u003c/p>\n\u003cp>Ejecutable y fuentes: \u003ccode>~/puzzled_working/{readprbs_cli,readprbs_cli.cpp,ReadPRBS.cpp}\u003c/code>. En \u003ccode>~/puzzled_writePRBS/\u003c/code> hay otra copia: las fuentes de la CLI son idénticas, pero los ejecutables no.\u003c/p>\n\u003cp>Para leer, solo con ese bloque y sus efectos confirmados:\u003c/p>\n\u003cpre>\u003ccode>printf 'Nombre UIO del bloque PRBS confirmado: '\nread -r UIO_PRBS\n~/puzzled_working/readprbs_cli --by-name \"$UIO_PRBS\" \\\n  --read-magic --read-status --read-data \\\n  &gt; prbs_01.out 2&gt; prbs_01.err\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Opción\u003c/th>\n\u003cth>Uso\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>--repeat N\u003c/code>, \u003ccode>--sleep-ms MS\u003c/code>\u003c/td>\n\u003ctd>Repite las acciones, con una pausa entre cada vuelta.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--selftest\u003c/code>\u003c/td>\n\u003ctd>Lee magic y status, y cinco veces data. Imprime OK sin comparar nada. Sola no escribe.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--json\u003c/code>\u003c/td>\n\u003ctd>Líneas JSON, con el mensaje del constructor delante. El conjunto no es un JSON válido.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--write-data VAL\u003c/code>, \u003ccode>--write-control VAL\u003c/code>\u003c/td>\n\u003ctd>Escriben. Confirma qué significa el valor y qué efecto tiene.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--write-sequence FILE\u003c/code>\u003c/td>\n\u003ctd>Escribe los valores del archivo, uno por línea.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>En los overlays aparece el nombre \u003ccode>Read_PRBS_regs\u003c/code>; revisa sysfs antes de darlo por hecho. Pide siempre una acción: si eliges dispositivo y no das acción, la CLI corre selftest.\u003c/p>\n\u003cp>Ejemplo de escritura, comentado hasta elegir el patrón y confirmar la IP:\u003c/p>\n\u003cpre>\u003ccode># ~/puzzled_working/readprbs_cli --by-name Read_PRBS_regs --write-data 0xEECCCC11\u003c/code>\u003c/pre>\n"},{"title":"lpGbtRegister","anchor":"lpgbtregister","text":"## lpGbtRegister\n\nLee o escribe registros internos del lpGBT por IC. Incluso `--read` escribe en el controlador de la FPGA para mandar la transacción. Devuelve registros del chip, nunca el payload TGC.\n\nEjecutable: `~/LpGbtSw/build/Demonstrators/LpGbtRegister/lpGbtRegister`. Fuente: `~/LpGbtSw/Demonstrators/LpGbtRegister/lpGbtRegister.cpp`.\n\nSintaxis según el gitingest adjunto: `--address URI`, `--read REG`, `--write REG:VAL`. Compárala con la fuente y el ELF del equipo, y pasa siempre el canal, porque el de por defecto no es el nuestro.\n\n```bash\nprintf 'URI IC confirmada, lpgbt-uio://emp_lpgbt_N: '\nread -r URI\nprintf 'Registro del chip elegido, en hexadecimal: '\nread -r REG\n~/LpGbtSw/build/Demonstrators/LpGbtRegister/lpGbtRegister \\\n  --address \"$URI\" --read \"$REG\" > registro_01.out 2> registro_01.err\n```\n\nImprime la dirección y el byte en hexadecimal. Un registro del chip y un offset AXI son espacios distintos: no sumes la dirección de un registro lpGBT a A00E0000.\n\nEjemplo con el simulador, sin chip real:\n\n```bash\n~/LpGbtSw/build/Demonstrators/LpGbtRegister/lpGbtRegister \\\n  --address lpgbt-simulator://emp_lpgbt_9 --read 0x000\n```\n\nEl backend tiene bucles sin límite en clearIntr y al vaciar la FIFO, y el timeout de IRQ no los corta. La build guardada usa mapas V1; confirma qué versión de chip hay.\n\n","html":"\u003ch2 id=\"lpgbtregister\">lpGbtRegister\u003c/h2>\n\u003cp>Lee o escribe registros internos del lpGBT por IC. Incluso \u003ccode>--read\u003c/code> escribe en el co
