uración del chip. UserData no se leyó.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0929-PRBS Signal para lpgbt\u003c/code>\u003c/td>\n\u003ctd>Crear un generador y ver el orden de los grupos\u003c/td>\n\u003ctd>Reempaquetado de IP, patrón \u003ccode>EEEEAAAA\u003c/code>, mención de un strobe y un bloque de código vacío\u003c/td>\n\u003ctd>Se intentó, pero la nota no trae el generador completo.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0930-LibUIO Implementation\u003c/code>\u003c/td>\n\u003ctd>Acceder al uplink con herramientas Linux\u003c/td>\n\u003ctd>\u003ccode>lsuio -v\u003c/code> lista los dispositivos IC y termina con \u003ccode>free(): invalid pointer\u003c/code>\u003c/td>\n\u003ctd>Falla el programa al enumerar. No dice nada del payload ni de que la placa esté rota.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1001-creando un uio\u003c/code>\u003c/td>\n\u003ctd>Crear registros AirHDL y wrappers PuzzledWizard\u003c/td>\n\u003ctd>Se cambia \u003ccode>compatible\u003c/code> a \u003ccode>generic-uio\u003c/code>; el periférico aparece pero da \u003ccode>Bus error\u003c/code>; luego se anotan escrituras de constantes\u003c/td>\n\u003ctd>Que Linux vea el dispositivo no significa que AXI funcione. No hay una causa ni un arreglo que se pueda reusar a ciegas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1002-Codigo de recepción\u003c/code>\u003c/td>\n\u003ctd>Exponer el uplink como grupos AXI\u003c/td>\n\u003ctd>AirHDL, \u003ccode>magic\u003c/code>, \u003ccode>data_group_x\u003c/code>; nota de que Vivado no aceptaba un array\u003c/td>\n\u003ctd>Es el diseño del lector, sin el RTL de captura en esta revisión.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1006-Tenemos lectura\u003c/code>\u003c/td>\n\u003ctd>Ver datos en los registros\u003c/td>\n\u003ctd>Dice que usó loopback y que probó offsets\u003c/td>\n\u003ctd>Una cadena de prueba que funcionó, sin recepción externa del FE.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1007-multipleLPGBT\u003c/code>\u003c/td>\n\u003ctd>Multiplicar los lectores\u003c/td>\n\u003ctd>Trece bases \u003ccode>0xA00E..0xA01A\u003c/code> cambiadas en el BD y el Address Editor\u003c/td>\n\u003ctd>Es otra build. Son instancias, no grupos de un frame.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1010-elink\u003c/code>, \u003ccode>1013-GettingData elinks\u003c/code>\u003c/td>\n\u003ctd>Conectar el FE y recibir por el uplink\u003c/td>\n\u003ctd>Pruebas de pares y cables, objetivo Simplex Transmitter, un ejemplo enviado y recibido que no coincide\u003c/td>\n\u003ctd>No hay pinout final aprobado ni configuración completa que se pueda repetir.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1021-Loopback real\u003c/code>\u003c/td>\n\u003ctd>Mandar PRBS7 y hacer loopback\u003c/td>\n\u003ctd>Nota muy corta, sin resultado de éxito\u003c/td>\n\u003ctd>«Real» en el título no significa FE real.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2025-10-24, \u003ccode>1024-lpgbt outs official repo\u003c/code> y backup \u003ccode>1024\u003c/code>\u003c/td>\n\u003ctd>Ver cómo se reparten los patrones\u003c/td>\n\u003ctd>Dos patrones distintos dan casi la misma salida; los scripts escriben threshold y generador\u003c/td>\n\u003ctd>Algo raro pasa con la sensibilidad o el mapeo. No se sabe dónde se pierde la diferencia.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1028-Pruebas de envio de constante\u003c/code>\u003c/td>\n\u003ctd>Leer constantes con loopback interno y después físico\u003c/td>\n\u003ctd>\u003ccode>AAAABBBB\u003c/code> aparece solo en ciertas ventanas de threshold; el cable físico da discrepancias; más tarde se anota un cable dañado o un pin a tierra\u003c/td>\n\u003ctd>La recuperación interna funcionó en su momento. El cable dañado está anotado, pero no explica todos los fallos anteriores ni prueba que la reparación final funcionara.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1028-1031-Testing\u003c/code>, sección FE\u003c/td>\n\u003ctd>Llevar una señal desde el FE con un cable modificado y el reloj del lpGBT\u003c/td>\n\u003ctd>Ensayo de \u003ccode>0x03\u003c/code> con valores como \u003ccode>0xEE6EEEEE\u003c/code>, resultados variables y un capturador que a veces se queda detenido\u003c/td>\n\u003ctd>Hubo ensayos con el FE. Faltan A/B/A, mapeo y actualización para decir que el dato llegó intacto. Tampoco se puede decir que nunca se probó el FE ni que quedó funcionando.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Enero y febrero 2026, commits posteriores\u003c/td>\n\u003ctd>Recordar direcciones y rehacer el setup\u003c/td>\n\u003ctd>\u003ccode>Memory Directions\u003c/code>, notas nuevas de setup y mapas conceptuales reescritos\u003c/td>\n\u003ctd>Son revisiones posteriores; hay que contrastarlas con el código, y no confirman lo que se concluyó antes.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Cronología Git comprobada","anchor":"cronología-git-comprobada","text":"## Cronología Git comprobada\n\nEl 24-10-2026 el repositorio devolvió `main=c02a33b645dc70fb4076add25b78c5246589676e`, el mismo baseline del ZIP, sin revisiones posteriores en `main`. Las demás ramas eran de migración de imágenes y no se usaron como evidencia de firmware.\n\n| Commit | Fecha de autor UTC | Qué se comprobó |\n|---|---|---|\n| [`fdd3be8`](https://github.com/fbientrigo/atlas_emc/commit/fdd3be86865ccfb7fdeeb502d5c5a34613ea86dd) | 2025-10-01 | Historia de la carpeta de notas: material hasta el 1 de octubre de 2025. Es la fecha del commit, no de todos los ensayos. |\n| [`71acc42`](https://github.com/fbientrigo/atlas_emc/commit/71acc42e906078effa8ee07a1d48edcd19f2fc6b) | 2025-11-07 | Primer commit de `1028-1031-Testing`, con un mensaje de actualización de octubre y noviembre. |\n| [`4d2a9a5`](https://github.com/fbientrigo/atlas_emc/commit/4d2a9a5cce8c25c1d2133c3ed66e7374e7cb9aa6) | 2025-11-07 | Otra revisión de esa nota durante la migración de imágenes. No es una prueba FE nueva. |\n| [`6bfe4d1`](https://github.com/fbientrigo/atlas_emc/commit/6bfe4d11172c8fa0469eeca3a7c54ce0fe54109b) | 2025-11-12 | Llegan `epos-firmware` y `puzzledWizards` («epos y puzzled»). No identifica el bitstream cargado. |\n| [`d3e252c`](https://github.com/fbientrigo/atlas_emc/commit/d3e252c210bef5cac281ea588853f3ec603c1856) | 2026-01-13 | Añade `quick_guides/Memory Directions.md`, posterior a los ensayos de octubre. Su mapa sigue sin encajar con el lector de nueve grupos. |\n| [`8b1c674`](https://github.com/fbientrigo/atlas_emc/commit/8b1c674db1ecdc0112edd7e905bc8d9ca2c446de) | 2026-02-23 | Cambia mucho `0915c-Mapa de conexion` y `0916-mapa MGT`, así que esas notas ya no son el texto de septiembre de 2025. |\n| [`c02a33b`](https://github.com/fbientrigo/atlas_emc/commit/c02a33b645dc70fb4076add25b78c5246589676e) | 2026-02-23 | Añade notas de SSH y setup y una imagen, y actualiza el encendido. La nota `1210` es solo una imagen, sin procedimiento FE escrito. |\n\nSe revisó el historial por rutas y los archivos cambiados en los commits posteriores que importaban. No se auditó cada commit ni todas las imágenes y PDFs. No apareció ningún texto posterior que cierre por sí solo la validación del FE.\n\n","html":"\u003ch2 id=\"cronología-git-comprobada\">Cronología Git comprobada\u003c/h2>\n\u003cp>El 24-10-2026 el repositorio devolvió \u003ccode>main=c02a33b645dc70fb4076add25b78c5246589676e\u003c/code>, el mismo baseline del ZIP, sin revisiones posteriores en \u003ccode>main\u003c/code>. Las demás ramas eran de migración de imágenes y no se usaron como evidencia de firmware.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Commit\u003c/th>\n\u003cth>Fecha de autor UTC\u003c/th>\n\u003cth>Qué se comprobó\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/fdd3be86865ccfb7fdeeb502d5c5a34613ea86dd\">\u003ccode>fdd3be8\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2025-10-01\u003c/td>\n\u003ctd>Historia de la carpeta de notas: material hasta el 1 de octubre de 2025. Es la fecha del commit, no de todos los ensayos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/71acc42e906078effa8ee07a1d48edcd19f2fc6b\">\u003ccode>71acc42\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2025-11-07\u003c/td>\n\u003ctd>Primer commit de \u003ccode>1028-1031-Testing\u003c/code>, con un mensaje de actualización de octubre y noviembre.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/4d2a9a5cce8c25c1d2133c3ed66e7374e7cb9aa6\">\u003ccode>4d2a9a5\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2025-11-07\u003c/td>\n\u003ctd>Otra revisión de esa nota durante la migración de imágenes. No es una prueba FE nueva.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/6bfe4d11172c8fa0469eeca3a7c54ce0fe54109b\">\u003ccode>6bfe4d1\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2025-11-12\u003c/td>\n\u003ctd>Llegan \u003ccode>epos-firmware\u003c/code> y \u003ccode>puzzledWizards\u003c/code> («epos y puzzled»). No identifica el bitstream cargado.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/d3e252c210bef5cac281ea588853f3ec603c1856\">\u003ccode>d3e252c\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2026-01-13\u003c/td>\n\u003ctd>Añade \u003ccode>quick_guides/Memory Directions.md\u003c/code>, posterior a los ensayos de octubre. Su mapa sigue sin encajar con el lector de nueve grupos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/8b1c674db1ecdc0112edd7e905bc8d9ca2c446de\">\u003ccode>8b1c674\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2026-02-23\u003c/td>\n\u003ctd>Cambia mucho \u003ccode>0915c-Mapa de conexion\u003c/code> y \u003ccode>0916-mapa MGT\u003c/code>, así que esas notas ya no son el texto de septiembre de 2025.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"https://github.com/fbientrigo/atlas_emc/commit/c02a33b645dc70fb4076add25b78c5246589676e\">\u003ccode>c02a33b\u003c/code>\u003c/a>\u003c/td>\n\u003ctd>2026-02-23\u003c/td>\n\u003ctd>Añade notas de SSH y setup y una imagen, y actualiza el encendido. La nota \u003ccode>1210\u003c/code> es solo una imagen, sin procedimiento FE escrito.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Se revisó el historial por rutas y los archivos cambiados en los commits posteriores que importaban. No se auditó cada commit ni todas las imágenes y PDFs. No apareció ningún texto posterior que cierre por sí solo la validación del FE.\u003c/p>\n"},{"title":"Máscaras de registros y generación de código","anchor":"máscaras-de-registros-y-generación-de-código","text":"## Máscaras de registros y generación de código\n\nLa plantilla `puzzledWizards/templates/airhdl_to_cppbody.jinja:110–121` mantiene `(1 \u003c\u003c bitWidth) -1`. Para un campo de 32 bits con `int` de 32 bits, desplazar 1 en 32 posiciones es comportamiento indefinido. Así que un cero después del wrapper puede ser un fallo de la máscara y no una lectura física de cero. Un `SIGBUS`, en cambio, no se explica con ese error de cálculo sin más pruebas.\n\n| Variante | Qué hace | Alcance |\n|---|---|---|\n| Plantilla Jinja | Desplaza un `int` y escribe sin recortar el dato a la máscara | Si se regenera, vuelve el error. No se tocó. |\n| `puzzled_working/ReadPRBS.cpp:142–158` | `make_mask` trata width>=32 antes de desplazar y recorta la escritura | Arregla los campos reales de 32 bits con offset 0. No sirve para campos arbitrarios de más de 32 bits. |\n| `puzzled_writePRBS/ReadPRBS.cpp:149–162` y `patch_bits.py` | Usa `1ULL` y fija la máscara si width>=32 | Bien para los campos 32/0 usados, no para cualquier width/offset. Si width llega al ancho de ULL, el desplazamiento se calcula antes del if. |\n| `read_all_lpgbt/TgcReadUplink.cpp:297–311` | Mismo estilo, con ULL | Aquí no está el `1 \u003c\u003c 32`. Eso no dice qué wrapper lleva el ELF instalado. |\n\nEl parche de la máscara no arregló el bus, el cable, la sincronización ni la recepción del FE: son problemas de otras capas.\n\n","html":"\u003ch2 id=\"máscaras-de-registros-y-generación-de-código\">Máscaras de registros y generación de código\u003c/h2>\n\u003cp>La plantilla \u003ccode>puzzledWizards/templates/airhdl_to_cppbody.jinja:110–121\u003c/code> mantiene \u003ccode>(1 &lt;&lt; bitWidth) -1\u003c/code>. Para un campo de 32 bits con \u003ccode>int\u003c/code> de 32 bits, desplazar 1 en 32 posiciones es comportamiento indefinido. Así que un cero después del wrapper puede ser un fallo de la máscara y no una lectura física de cero. Un \u003ccode>SIGBUS\u003c/code>, en cambio, no se explica con ese error de cálculo sin más pruebas.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Variante\u003c/th>\n\u003cth>Qué hace\u003c/th>\n\u003cth>Alcance\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Plantilla Jinja\u003c/td>\n\u003ctd>Desplaza un \u003ccode>int\u003c/code> y escribe sin recortar el dato a la máscara\u003c/td>\n\u003ctd>Si se regenera, vuelve el error. No se tocó.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>puzzled_working/ReadPRBS.cpp:142–158\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>make_mask\u003c/code> trata width&gt;=32 antes de desplazar y recorta la escritura\u003c/td>\n\u003ctd>Arregla los campos reales de 32 bits con offset 0. No sirve para campos arbitrarios de más de 32 bits.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>puzzled_writePRBS/ReadPRBS.cpp:149–162\u003c/code> y \u003ccode>patch_bits.py\u003c/code>\u003c/td>\n\u003ctd>Usa \u003ccode>1ULL\u003c/code> y fija la máscara si width&gt;=32\u003c/td>\n\u003ctd>Bien para los campos 32/0 usados, no para cualquier width/offset. Si width llega al ancho de ULL, el desplazamiento se calcula antes del if.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>read_all_lpgbt/TgcReadUplink.cpp:297–311\u003c/code>\u003c/td>\n\u003ctd>Mismo estilo, con ULL\u003c/td>\n\u003ctd>Aquí no está el \u003ccode>1 &lt;&lt; 32\u003c/code>. Eso no dice qué wrapper lleva el ELF instalado.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>El parche de la máscara no arregló el bus, el cable, la sincronización ni la recepción del FE: son problemas de otras capas.\u003c/p>\n"},{"title":"Tres contradicciones que siguen abiertas","anchor":"tres-contradicciones-que-siguen-abiertas","text":"## Tres contradicciones que siguen abiertas\n\n1. Direcciones. El BD original pone `axi_intc_1/2` en A00D/A00E, y los scripts ponen ahí el generador y el lector. Se resuelve sabiendo qué build hay, no eligiendo la nota más nueva.\n2. Mapa de registros. El JSON de nueve grupos y el backup chocan con el mapa de un grupo de `output_tgc_readuplink_1002` y con los nombres control/status de la nota de enero. No hay un mapa único.\n3. Tiempos. Las notas hablan de un threshold tras el envío y de problemas de captura, pero falta el RTL que diga cómo se actualiza con el FE solo. Puede haber un patrón óptico válido que esa lógica experimental no capture.\n","html":"\u003ch2 id=\"tres-contradicciones-que-siguen-abiertas\">Tres contradicciones que siguen abiertas\u003c/h2>\n\u003col>\n\u003cli>Direcciones. El BD original pone \u003ccode>axi_intc_1/2\u003c/code> en A00D/A00E, y los scripts ponen ahí el generador y el lector. Se resuelve sabiendo qué build hay, no eligiendo la nota más nueva.\u003c/li>\n\u003cli>Mapa de registros. El JSON de nueve grupos y el backup chocan con el mapa de un grupo de \u003ccode>output_tgc_readuplink_1002\u003c/code> y con los nombres control/status de la nota de enero. No hay un mapa único.\u003c/li>\n\u003cli>Tiempos. Las notas hablan de un threshold tras el envío y de problemas de captura, pero falta el RTL que diga cómo se actualiza con el FE solo. Puede haber un patrón óptico válido que esa lógica experimental no capture.\u003c/li>\n\u003c/ol>\n"}]},{"id":"04_INCERTIDUMBRES","file":"04_INCERTIDUMBRES.md","title":"Lo que no sabemos y cómo cerrarlo","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Lo que no sabemos y cómo cerrarlo\n\nEsta investigación no vio el estado actual del hardware. La tabla convierte cada hueco en un dato que pedir o una prueba que hacer. Para pedírselo al ingeniero, manda los siete conjuntos de datos de [P0, etapa E](00_GUIA_CAMPO.md#etapa-e-diagnóstico-remoto).\n\n| ID y qué bloquea | Pregunta | Qué falta | Cuándo se da por cerrada |\n|---|---|---|---|\n| U1, bloquea MMIO | ¿Qué firmware está cargado? | DTBO y bitstream, hashes, cómo se cargó, exportación de la build | Se puede seguir el artefacto hasta el diseño y el mapa cargado coincide. Listar archivos no alcanza. |\n| U2, bloquea el lector | ¿Qué RTL implementa `tgc_readUplink_regs`? | VHDL, pkg, BD y Address Editor de la build de lectura | Se sabe qué parte de UserData va a cada campo, qué hace leer, la firma y el tamaño. |\n| U3, bloquea la fuente FE | ¿Qué fuente usan el Serializer y cada grupo? | Versión del chip, configuración en uso y bitfields de esa versión | Modo normal, e-link habilitado, tasas y FEC coherentes, sin generador ni retorno. El comando exacto queda documentado antes de cambiar nada. |\n| U4, bloquea elegir canal | ¿Qué FE o e-link llega a qué instancia de Linux? | Pinout aprobado, placa y chip, fibra y MGT, BD, sysfs | Cadena completa FE → canal e-link → chip → pipeline → capturador → UIO, sin usar `uioN` como canal. |\n| U5, bloquea ejecutar con confianza | ¿Qué binario y qué bibliotecas se van a ejecutar? | ELF, hashes, Build ID, dependencias y fuente o receta | Arquitectura compatible, dependencias resueltas, API y mapa coincidentes, y una razón para elegir esa variante. |\n| U6, bloquea saber cuándo se capturó | ¿La captura se actualiza con el FE solo? | Trigger, enable, timestamp o contador si existe, retención y CDC del capturador | Una prueba documentada de que cambia con un estímulo del FE sin patrón interno. Capturas iguales repetidas no prueban que se actualice. |\n| U7, bloquea dar el experimento por bueno | ¿El patrón del FE llega intacto y de forma repetible? | Método FE, datos eléctricos medidos y A/B/A con mapeo previo | P→Q→P repetido, en los bits previstos, con transporte estable y fuentes internas descartadas. |\n| U8, bloquea la integridad de eventos | ¿Las nueve palabras son un frame coherente? | RTL de snapshot o handshake, contador o buffer, qué pasa con el overflow | Snapshot estable o un protocolo de lectura coherente demostrado. Repetir el header no sustituye a un contador. |\n| U9, limita el diagnóstico | ¿Qué errores de FEC y de reloj se pueden ver? Se sabe en parte | Build del debughub y acceso a sus señales y contadores | Tabla de las señales conectadas de verdad y salidas de herramientas probadas. No inventar BER ni contadores que no existen. |\n| U10, compatibilidad | ¿Hay 12 o 13 pipelines? Las fuentes se contradicen | BD cargado y rutas del canal 12 | Contar instancias y conexiones en esa build. Un campo de 13 bits en el software no prueba 13 canales. |\n\n","html":"\u003ch1 id=\"lo-que-no-sabemos-y-cómo-cerrarlo\">Lo que no sabemos y cómo cerrarlo\u003c/h1>\n\u003cp>Esta investigación no vio el estado actual del hardware. La tabla convierte cada hueco en un dato que pedir o una prueba que hacer. Para pedírselo al ingeniero, manda los siete conjuntos de datos de \u003ca href=\"00_GUIA_CAMPO.md#etapa-e-diagn%C3%B3stico-remoto\">P0, etapa E\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID y qué bloquea\u003c/th>\n\u003cth>Pregunta\u003c/th>\n\u003cth>Qué falta\u003c/th>\n\u003cth>Cuándo se da por cerrada\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>U1, bloquea MMIO\u003c/td>\n\u003ctd>¿Qué firmware está cargado?\u003c/td>\n\u003ctd>DTBO y bitstream, hashes, cómo se cargó, exportación de la build\u003c/td>\n\u003ctd>Se puede seguir el artefacto hasta el diseño y el mapa cargado coincide. Listar archivos no alcanza.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U2, bloquea el lector\u003c/td>\n\u003ctd>¿Qué RTL implementa \u003ccode>tgc_readUplink_regs\u003c/code>?\u003c/td>\n\u003ctd>VHDL, pkg, BD y Address Editor de la build de lectura\u003c/td>\n\u003ctd>Se sabe qué parte de UserData va a cada campo, qué hace leer, la firma y el tamaño.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U3, bloquea la fuente FE\u003c/td>\n\u003ctd>¿Qué fuente usan el Serializer y cada grupo?\u003c/td>\n\u003ctd>Versión del chip, configuración en uso y bitfields de esa versión\u003c/td>\n\u003ctd>Modo normal, e-link habilitado, tasas y FEC coherentes, sin generador ni retorno. El comando exacto queda documentado antes de cambiar nada.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U4, bloquea elegir canal\u003c/td>\n\u003ctd>¿Qué FE o e-link llega a qué instancia de Linux?\u003c/td>\n\u003ctd>Pinout aprobado, placa y chip, fibra y MGT, BD, sysfs\u003c/td>\n\u003ctd>Cadena completa FE → canal e-link → chip → pipeline → capturador → UIO, sin usar \u003ccode>uioN\u003c/code> como canal.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U5, bloquea ejecutar con confianza\u003c/td>\n\u003ctd>¿Qué binario y qué bibliotecas se van a ejecutar?\u003c/td>\n\u003ctd>ELF, hashes, Build ID, dependencias y fuente o receta\u003c/td>\n\u003ctd>Arquitectura compatible, dependencias resueltas, API y mapa coincidentes, y una razón para elegir esa variante.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U6, bloquea saber cuándo se capturó\u003c/td>\n\u003ctd>¿La captura se actualiza con el FE solo?\u003c/td>\n\u003ctd>Trigger, enable, timestamp o contador si existe, retención y CDC del capturador\u003c/td>\n\u003ctd>Una prueba documentada de que cambia con un estímulo del FE sin patrón interno. Capturas iguales repetidas no prueban que se actualice.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U7, bloquea dar el experimento por bueno\u003c/td>\n\u003ctd>¿El patrón del FE llega intacto y de forma repetible?\u003c/td>\n\u003ctd>Método FE, datos eléctricos medidos y A/B/A con mapeo previo\u003c/td>\n\u003ctd>P→Q→P repetido, en los bits previstos, con transporte estable y fuentes internas descartadas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U8, bloquea la integridad de eventos\u003c/td>\n\u003ctd>¿Las nueve palabras son un frame coherente?\u003c/td>\n\u003ctd>RTL de snapshot o handshake, contador o buffer, qué pasa con el overflow\u003c/td>\n\u003ctd>Snapshot estable o un protocolo de lectura coherente demostrado. Repetir el header no sustituye a un contador.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U9, limita el diagnóstico\u003c/td>\n\u003ctd>¿Qué errores de FEC y de reloj se pueden ver? Se sabe en parte\u003c/td>\n\u003ctd>Build del debughub y acceso a sus señales y contadores\u003c/td>\n\u003ctd>Tabla de las señales conectadas de verdad y salidas de herramientas probadas. No inventar BER ni contadores que no existen.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U10, compatibilidad\u003c/td>\n\u003ctd>¿Hay 12 o 13 pipelines? Las fuentes se contradicen\u003c/td>\n\u003ctd>BD cargado y rutas del canal 12\u003c/td>\n\u003ctd>Contar instancias y conexiones en esa build. Un campo de 13 bits en el software no prueba 13 canales.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Lo que ya se puede dar por cerrado","anchor":"lo-que-ya-se-puede-dar-por-cerrado","text":"## Lo que ya se puede dar por cerrado\n\n- La CLI del backup no tiene parser, no escribe el threshold desde `main()` y no espera eventos.\n- El monitor lee estados de la FPGA y no dice de dónde viene el dato.\n- El control IC y el payload son periféricos distintos y funcionan distinto.\n- La nota del 6 de octubre usó loopback. La del 31 de octubre sí tiene ensayos con el FE, pero no confirma que el patrón llegara intacto.\n- El BD recuperado y los scripts antiguos de captura no forman un solo mapa.\n\n","html":"\u003ch2 id=\"lo-que-ya-se-puede-dar-por-cerrado\">Lo que ya se puede dar por cerrado\u003c/h2>\n\u003cul>\n\u003cli>La CLI del backup no tiene parser, no escribe el threshold desde \u003ccode>main()\u003c/code> y no espera eventos.\u003c/li>\n\u003cli>El monitor lee estados de la FPGA y no dice de dónde viene el dato.\u003c/li>\n\u003cli>El control IC y el payload son periféricos distintos y funcionan distinto.\u003c/li>\n\u003cli>La nota del 6 de octubre usó loopback. La del 31 de octubre sí tiene ensayos con el FE, pero no confirma que el patrón llegara intacto.\u003c/li>\n\u003cli>El BD recuperado y los scripts antiguos de captura no forman un solo mapa.\u003c/li>\n\u003c/ul>\n"},{"title":"Qué conseguir antes de pensar en software nuevo","anchor":"qué-conseguir-antes-de-pensar-en-software-nuevo","text":"## Qué conseguir antes de pensar en software nuevo\n\nLo primero es la exportación antigua de Vivado y los binarios del lector que funcionaban en las pruebas de loopback. Para cerrar U2 no hace falta el disco entero: basta con el top y el BD, las fuentes del capturador, sus parámetros, el Address Editor y la relación con el bitstream. Para U3 hace falta la configuración en uso, no una captura de otra sesión ni el nombre de un modo suelto.\n\nSi el lector solo captura cuando lo dispara la lógica de envío interna, mira primero si hay otra build o una `eLink_Interface` ya integrada. Solo cuando ninguna sirva tiene sentido desarrollar algo nuevo.\n\n","html":"\u003ch2 id=\"qué-conseguir-antes-de-pensar-en-software-nuevo\">Qué conseguir antes de pensar en software nuevo\u003c/h2>\n\u003cp>Lo primero es la exportación antigua de Vivado y los binarios del lector que funcionaban en las pruebas de loopback. Para cerrar U2 no hace falta el disco entero: basta con el top y el BD, las fuentes del capturador, sus parámetros, el Address Editor y la relación con el bitstream. Para U3 hace falta la configuración en uso, no una captura de otra sesión ni el nombre de un modo suelto.\u003c/p>\n\u003cp>Si el lector solo captura cuando lo dispara la lógica de envío interna, mira primero si hay otra build o una \u003ccode>eLink_Interface\u003c/code> ya integrada. Solo cuando ninguna sirva tiene sentido desarrollar algo nuevo.\u003c/p>\n"},{"title":"Bloqueo intermitente: preguntas adicionales","anchor":"bloqueo-intermitente-preguntas-adicionales","text":"## Bloqueo intermitente: preguntas adicionales\n\n- U11: qué ejecutable era, si volvía al prompt y qué se reiniciaba. Se cierra con logs de antes y después, el PID y la acción que lo recuperó.\n- U12: trigger y rearme del capturador cargado. Se cierra con el RTL ligado a la build y pruebas de que UserData avanza hasta los registros.\n- U13: ¿está integrada `eLink_Interface_v1` o la FSM IC single? Se cierra con la jerarquía de síntesis y la configuración en uso. Sus defectos no se aplican a otra interfaz.\n\nVer [hipótesis y pruebas para distinguirlas](10_BLOQUEO_LECTURAS.md).\n","html":"\u003ch2 id=\"bloqueo-intermitente-preguntas-adicionales\">Bloqueo intermitente: preguntas adicionales\u003c/h2>\n\u003cul>\n\u003cli>U11: qué ejecutable era, si volvía al prompt y qué se reiniciaba. Se cierra con logs de antes y después, el PID y la acción que lo recuperó.\u003c/li>\n\u003cli>U12: trigger y rearme del capturador cargado. Se cierra con el RTL ligado a la build y pruebas de que UserData avanza hasta los registros.\u003c/li>\n\u003cli>U13: ¿está integrada \u003ccode>eLink_Interface_v1\u003c/code> o la FSM IC single? Se cierra con la jerarquía de síntesis y la configuración en uso. Sus defectos no se aplican a otra interfaz.\u003c/li>\n\u003c/ul>\n\u003cp>Ver \u003ca href=\"10_BLOQUEO_LECTURAS.md\">hipótesis y pruebas para distinguirlas\u003c/a>.\u003c/p>\n"}]},{"id":"05_EVOLUCION_FUTURA","file":"05_EVOLUCION_FUTURA.md","title":"Evolución futura","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Evolución futura\n\nCosas que se podrían mejorar más adelante. No se cambió nada en el software de hardware, el firmware ni las fuentes originales, y nada de esto reemplaza terminar P0.\n\n| Orden | Problema o riesgo | Cambio mínimo a evaluar | Cómo saber que sirvió |\n|---|---|---|---|\n| 1 | No se puede relacionar cada artefacto con su origen, y mapas distintos usan las mismas direcciones | Un manifiesto por release con SHA de fuentes, BD, DTBO, bitstream y binarios | Poder identificar una instalación sin depender de la memoria ni probar MMIO. |\n| 2 | Falta el RTL del capturador y no está definido cuándo una muestra es nueva o atómica | Recuperar la fuente y documentar snapshot y trigger; si no aparece, ver qué señal de actualización mínima haría falta | Mostrar coherencia, o su límite exacto, con un estímulo externo. |\n| 3 | La CLI de payload ignora los argumentos y tiene el nombre fijo | Solo si el `readuio` existente no alcanza: permitir elegir el dispositivo y dar una ayuda que no toque el hardware | Leer el canal correcto y ver la ayuda sin MMIO. |\n| 4 | La plantilla genera una máscara con desplazamiento indefinido para 32 bits | Corregir la plantilla y limitar widths y offsets; regenerar solo comparando el mapa | Probar campos de 1, 31 y 32 bits sin tocar bits vecinos ni cambiar mapas por accidente. |\n| 5 | `lsuio` libera un puntero desplazado y los backends siguen tras un fallo | Arreglar recursos y errores en una rama de mantenimiento aparte | La enumeración termina bien y, sin UIO, se aborta antes de cualquier acceso. |\n| 6 | `readValues[6]` sin comprobar, espera de IRQ corta y bucles sin límite | Validar trama, longitud y errores, y limitar las esperas antes de dar un byte por bueno | Una respuesta corta, una IRQ que no llega o una FIFO inválida dan errores claros. |\n| 7 | Los scripts tiran stderr, confunden error con cero, se saltan el grupo 5 y pisan logs | Unificar la captura solo cuando se sepa qué hace el lector y haga falta de verdad | Cada ensayo guarda identidad, configuración, retornos y datos completos. |\n| 8 | Builds duplicadas que dependen del entorno; `build.sh` borra `build` | Receta reproducible aislada, dependencias identificadas y comparación de binarios | Rehacer una herramienta sin perder artefactos anteriores. |\n| 9 | `eLink_Interface` existe pero no está conectada en el BD recuperado | Ver si alguna build que funcionó ya la integra antes de crear otra interfaz | Pruebas de que está montada y captura con el FE real. Tener el VHDL no alcanza. |\n\nNo migres frameworks, cambies de distribución, rehagas la adquisición ni juntes repositorios hasta saber qué herramientas se usan y qué problema resuelve el cambio.\n\n","html":"\u003ch1 id=\"evolución-futura\">Evolución futura\u003c/h1>\n\u003cp>Cosas que se podrían mejorar más adelante. No se cambió nada en el software de hardware, el firmware ni las fuentes originales, y nada de esto reemplaza terminar P0.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Orden\u003c/th>\n\u003cth>Problema o riesgo\u003c/th>\n\u003cth>Cambio mínimo a evaluar\u003c/th>\n\u003cth>Cómo saber que sirvió\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>No se puede relacionar cada artefacto con su origen, y mapas distintos usan las mismas direcciones\u003c/td>\n\u003ctd>Un manifiesto por release con SHA de fuentes, BD, DTBO, bitstream y binarios\u003c/td>\n\u003ctd>Poder identificar una instalación sin depender de la memoria ni probar MMIO.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Falta el RTL del capturador y no está definido cuándo una muestra es nueva o atómica\u003c/td>\n\u003ctd>Recuperar la fuente y documentar snapshot y trigger; si no aparece, ver qué señal de actualización mínima haría falta\u003c/td>\n\u003ctd>Mostrar coherencia, o su límite exacto, con un estímulo externo.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>La CLI de payload ignora los argumentos y tiene el nombre fijo\u003c/td>\n\u003ctd>Solo si el \u003ccode>readuio\u003c/code> existente no alcanza: permitir elegir el dispositivo y dar una ayuda que no toque el hardware\u003c/td>\n\u003ctd>Leer el canal correcto y ver la ayuda sin MMIO.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>La plantilla genera una máscara con desplazamiento indefinido para 32 bits\u003c/td>\n\u003ctd>Corregir la plantilla y limitar widths y offsets; regenerar solo comparando el mapa\u003c/td>\n\u003ctd>Probar campos de 1, 31 y 32 bits sin tocar bits vecinos ni cambiar mapas por accidente.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>\u003ccode>lsuio\u003c/code> libera un puntero desplazado y los backends siguen tras un fallo\u003c/td>\n\u003ctd>Arreglar recursos y errores en una rama de mantenimiento aparte\u003c/td>\n\u003ctd>La enumeración termina bien y, sin UIO, se aborta antes de cualquier acceso.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>\u003ccode>readValues[6]\u003c/code> sin comprobar, espera de IRQ corta y bucles sin límite\u003c/td>\n\u003ctd>Validar trama, longitud y errores, y limitar las esperas antes de dar un byte por bueno\u003c/td>\n\u003ctd>Una respuesta corta, una IRQ que no llega o una FIFO inválida dan errores claros.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Los scripts tiran stderr, confunden error con cero, se saltan el grupo 5 y pisan logs\u003c/td>\n\u003ctd>Unificar la captura solo cuando se sepa qué hace el lector y haga falta de verdad\u003c/td>\n\u003ctd>Cada ensayo guarda identidad, configuración, retornos y datos completos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>Builds duplicadas que dependen del entorno; \u003ccode>build.sh\u003c/code> borra \u003ccode>build\u003c/code>\u003c/td>\n\u003ctd>Receta reproducible aislada, dependencias identificadas y comparación de binarios\u003c/td>\n\u003ctd>Rehacer una herramienta sin perder artefactos anteriores.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>\u003ccode>eLink_Interface\u003c/code> existe pero no está conectada en el BD recuperado\u003c/td>\n\u003ctd>Ver si alguna build que funcionó ya la integra antes de crear otra interfaz\u003c/td>\n\u003ctd>Pruebas de que está montada y captura con el FE real. Tener el VHDL no alcanza.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>No migres frameworks, cambies de distribución, rehagas la adquisición ni juntes repositorios hasta saber qué herramientas se usan y qué problema resuelve el cambio.\u003c/p>\n"},{"title":"Lo que salió de la revisión del bloqueo","anchor":"lo-que-salió-de-la-revisión-del-bloqueo","text":"## Lo que salió de la revisión del bloqueo\n\nSolo en las versiones que se confirme que están montadas, por este orden: timeout global y límite a la respuesta IC; comprobar `readValues[6]`; reset explícito de la FSM; un watchdog que no dependa de las ramas prioritarias; validar el payload sin usar «distinto de cero»; contador de capturas y snapshot. No se implementó nada. Detalles y límites en [el análisis](10_BLOQUEO_LECTURAS.md).\n","html":"\u003ch2 id=\"lo-que-salió-de-la-revisión-del-bloqueo\">Lo que salió de la revisión del bloqueo\u003c/h2>\n\u003cp>Solo en las versiones que se confirme que están montadas, por este orden: timeout global y límite a la respuesta IC; comprobar \u003ccode>readValues[6]\u003c/code>; reset explícito de la FSM; un watchdog que no dependa de las ramas prioritarias; validar el payload sin usar «distinto de cero»; contador de capturas y snapshot. No se implementó nada. Detalles y límites en \u003ca href=\"10_BLOQUEO_LECTURAS.md\">el análisis\u003c/a>.\u003c/p>\n"}]},{"id":"06_APRENDER","file":"06_APRENDER.md","title":"Aprender siguiendo una lectura real","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Aprender siguiendo una lectura real\n\nEsto es para después de la sesión urgente de [operación](00_GUIA_CAMPO.md). Cada tema termina con una pregunta que se responde en el código o con una medición.\n\n","html":"\u003ch1 id=\"aprender-siguiendo-una-lectura-real\">Aprender siguiendo una lectura real\u003c/h1>\n\u003cp>Esto es para después de la sesión urgente de \u003ca href=\"00_GUIA_CAMPO.md\">operación\u003c/a>. Cada tema termina con una pregunta que se responde en el código o con una medición.\u003c/p>\n"},{"title":"1. Separar tres espacios de direcciones","anchor":"1-separar-tres-espacios-de-direcciones","text":"## 1. Separar tres espacios de direcciones\n\nUna base física AXI señala un periférico del PL. Un offset señala un registro dentro de ese periférico. Una dirección de registro del lpGBT señala algo dentro del chip remoto, y se llega a ella por el protocolo IC. Los números pueden coincidir y significar cosas distintas.\n\nEjemplo comprobado: el wrapper de payload usa el offset `0x04` para `data_group_0`, y el controlador IC lo usa para `control`. En V1, `ULDATASOURCE0=0x128` es una dirección del chip, no un offset del capturador. Míralo en `AxiRegisterDefinitions.h`, `TgcReadUplink.cpp` y `LpgbtRegisterMapV1.h`.\n\nPregunta: ¿por qué leer `emp_lpgbt_10 + 0x0C` no da el mismo tipo de dato que `tgc_readUplink_regs + 0x0C`?\n\n","html":"\u003ch2 id=\"1-separar-tres-espacios-de-direcciones\">1. Separar tres espacios de direcciones\u003c/h2>\n\u003cp>Una base física AXI señala un periférico del PL. Un offset señala un registro dentro de ese periférico. Una dirección de registro del lpGBT señala algo dentro del chip remoto, y se llega a ella por el protocolo IC. Los números pueden coincidir y significar cosas distintas.\u003c/p>\n\u003cp>Ejemplo comprobado: el wrapper de payload usa el offset \u003ccode>0x04\u003c/code> para \u003ccode>data_group_0\u003c/code>, y el controlador IC lo usa para \u003ccode>control\u003c/code>. En V1, \u003ccode>ULDATASOURCE0=0x128\u003c/code> es una dirección del chip, no un offset del capturador. Míralo en \u003ccode>AxiRegisterDefinitions.h\u003c/code>, \u003ccode>TgcReadUplink.cpp\u003c/code> y \u003ccode>LpgbtRegisterMapV1.h\u003c/code>.\u003c/p>\n\u003cp>Pregunta: ¿por qué leer \u003ccode>emp_lpgbt_10 + 0x0C\u003c/code> no da el mismo tipo de dato que \u003ccode>tgc_readUplink_regs + 0x0C\u003c/code>?\u003c/p>\n"},{"title":"2. Seguir bits antes de asignarles significado","anchor":"2-seguir-bits-antes-de-asignarles-significado","text":"## 2. Seguir bits antes de asignarles significado\n\nEl core recibe palabras de 32 bits, busca la cabecera y rearma los frames. Después deshace el interleaving, corrige con FEC y deshace el scrambling. Con eso se recupera el protocolo del lpGBT, pero todavía no hay canales ni eventos del FE.\n\nCon FEC5/10G24, el core entrega 230 bits de UserData, dos de EC y dos de IC. La nota que habla de 224 bits de e-link conectados no explica cómo se reparten en nueve registros AXI. Ese packing está en el capturador que falta; no se deduce de 9×32.\n\nPregunta: en `lpgbtfpga_uplink.vhd:492–524`, ¿qué cambia con FEC12 y por qué el puerto puede seguir siendo de 230 bits?\n\n","html":"\u003ch2 id=\"2-seguir-bits-antes-de-asignarles-significado\">2. Seguir bits antes de asignarles significado\u003c/h2>\n\u003cp>El core recibe palabras de 32 bits, busca la cabecera y rearma los frames. Después deshace el interleaving, corrige con FEC y deshace el scrambling. Con eso se recupera el protocolo del lpGBT, pero todavía no hay canales ni eventos del FE.\u003c/p>\n\u003cp>Con FEC5/10G24, el core entrega 230 bits de UserData, dos de EC y dos de IC. La nota que habla de 224 bits de e-link conectados no explica cómo se reparten en nueve registros AXI. Ese packing está en el capturador que falta; no se deduce de 9×32.\u003c/p>\n\u003cp>Pregunta: en \u003ccode>lpgbtfpga_uplink.vhd:492–524\u003c/code>, ¿qué cambia con FEC12 y por qué el puerto puede seguir siendo de 230 bits?\u003c/p>\n"},{"title":"3. Distinguir gearbox, enable y cruce de reloj","anchor":"3-distinguir-gearbox-enable-y-cruce-de-reloj","text":"## 3. Distinguir gearbox, enable y cruce de reloj\n\nEl gearbox cambia cómo se agrupan los bits. Un enable marca cuándo un frame es válido dentro de un reloj más rápido. El CDC pasa la señal a otro dominio de reloj. Son tres operaciones distintas.\n\nEn este core, los dos relojes del gearbox van a `uplinkClk_i`. El CDC que viene después entra con el reloj RX y sale en `logicclk40`. `cdc_rx` usa registros, strobes y fase, y no guarda los eventos para Linux.\n\nPregunta: sigue `uplinkStrobe320`, `lpgbtfpga_uplinkrst_cdc` y `cdc_rx_ready` en `emp_lpgbt.vhd:473–498`. ¿Por qué `uplinkReady_o` y `RX locked` son señales distintas?\n\n","html":"\u003ch2 id=\"3-distinguir-gearbox-enable-y-cruce-de-reloj\">3. Distinguir gearbox, enable y cruce de reloj\u003c/h2>\n\u003cp>El gearbox cambia cómo se agrupan los bits. Un enable marca cuándo un frame es válido dentro de un reloj más rápido. El CDC pasa la señal a otro dominio de reloj. Son tres operaciones distintas.\u003c/p>\n\u003cp>En este core, los dos relojes del gearbox van a \u003ccode>uplinkClk_i\u003c/code>. El CDC que viene después entra con el reloj RX y sale en \u003ccode>logicclk40\u003c/code>. \u003ccode>cdc_rx\u003c/code> usa registros, strobes y fase, y no guarda los eventos para Linux.\u003c/p>\n\u003cp>Pregunta: sigue \u003ccode>uplinkStrobe320\u003c/code>, \u003ccode>lpgbtfpga_uplinkrst_cdc\u003c/code> y \u003ccode>cdc_rx_ready\u003c/code> en \u003ccode>emp_lpgbt.vhd:473–498\u003c/code>. ¿Por qué \u003ccode>uplinkReady_o\u003c/code> y \u003ccode>RX locked\u003c/code> son señales distintas?\u003c/p>\n"},{"title":"4. Entender dónde Linux hace la transacción","anchor":"4-entender-dónde-linux-hace-la-transacción","text":"## 4. Entender dónde Linux hace la transacción\n\n`mmap` da una dirección virtual que apunta al dispositivo. El puntero volatile de `uio_read32` pide una lectura de una palabra al periférico; la CPU no está leyendo una copia en RAM. Si el slave no responde, el sistema puede fallar o quedarse esperando, aunque sysfs muestre un mapa correcto.\n\nPregunta: sigue `main → getter → uio_read32 → volatile` en [el mapa técnico](01_MAPA_TECNICO.md) y separa la dirección virtual, la base física y el offset del registro.\n\n","html":"\u003ch2 id=\"4-entender-dónde-linux-hace-la-transacción\">4. Entender dónde Linux hace la transacción\u003c/h2>\n\u003cp>\u003ccode>mmap\u003c/code> da una dirección virtual que apunta al dispositivo. El puntero volatile de \u003ccode>uio_read32\u003c/code> pide una lectura de una palabra al periférico; la CPU no está leyendo una copia en RAM. Si el slave no responde, el sistema puede fallar o quedarse esperando, aunque sysfs muestre un mapa correcto.\u003c/p>\n\u003cp>Pregunta: sigue \u003ccode>main → getter → uio_read32 → volatile\u003c/code> en \u003ca href=\"01_MAPA_TECNICO.md\">el mapa técnico\u003c/a> y separa la dirección virtual, la base física y el offset del registro.\u003c/p>\n"},{"title":"5. Aprender a no sobreinterpretar una captura","anchor":"5-aprender-a-no-sobreinterpretar-una-captura","text":"## 5. Aprender a no sobreinterpretar una captura\n\nUna lectura distinta de cero solo dice que el programa vio ese valor, si el acceso y la máscara están bien. No dice de dónde viene, si es nuevo, a qué frame o canal pertenece ni si está íntegro. Una lista de getters no es un snapshot.\n\nCon un patrón sostenido se reduce la duda sobre el momento en una primera prueba. Con eventos sueltos hace falta un contrato de captura, un buffer o un handshake. Leer `header` antes y después no garantiza atomicidad si el mismo header se repite en muchos frames.\n\nPregunta: escribe la predicción P→Q→P antes de mirar las salidas. ¿Qué resultado tumbaría la hipótesis del FE? ¿Y qué seguirías sin saber aunque la correlación funcione?\n\n","html":"\u003ch2 id=\"5-aprender-a-no-sobreinterpretar-una-captura\">5. Aprender a no sobreinterpretar una captura\u003c/h2>\n\u003cp>Una lectura distinta de cero solo dice que el programa vio ese valor, si el acceso y la máscara están bien. No dice de dónde viene, si es nuevo, a qué frame o canal pertenece ni si está íntegro. Una lista de getters no es un snapshot.\u003c/p>\n\u003cp>Con un patrón sostenido se reduce la duda sobre el momento en una primera prueba. Con eventos sueltos hace falta un contrato de captura, un buffer o un handshake. Leer \u003ccode>header\u003c/code> antes y después no garantiza atomicidad si el mismo header se repite en muchos frames.\u003c/p>\n\u003cp>Pregunta: escribe la predicción P→Q→P antes de mirar las salidas. ¿Qué resultado tumbaría la hipótesis del FE? ¿Y qué seguirías sin saber aunque la correlación funcione?\u003c/p>\n"},{"title":"6. Leer la historia como evidencia experimental","anchor":"6-leer-la-historia-como-evidencia-experimental","text":"## 6. Leer la historia como evidencia experimental\n\nUna nota puede mezclar en un mismo párrafo comandos ejecutados, resultados, sospechas y planes. «Parece ruido» o «debería ser sincronización» son hipótesis. «Se usó loopback» limita lo que prueba la nota, aunque el título diga «tenemos lectura».\n\nPregunta: compara `1006`, `1028` y `1028-1031`. Separa la constante interna que sí se recuperó, el cable dañado que se anotó y la prueba del FE que no confirma que el dato llegara intacto. [Historia reconstruida](03_HISTORIA.md).\n","html":"\u003ch2 id=\"6-leer-la-historia-como-evidencia-experimental\">6. Leer la historia como evidencia experimental\u003c/h2>\n\u003cp>Una nota puede mezclar en un mismo párrafo comandos ejecutados, resultados, sospechas y planes. «Parece ruido» o «debería ser sincronización» son hipótesis. «Se usó loopback» limita lo que prueba la nota, aunque el título diga «tenemos lectura».\u003c/p>\n\u003cp>Pregunta: compara \u003ccode>1006\u003c/code>, \u003ccode>1028\u003c/code> y \u003ccode>1028-1031\u003c/code>. Separa la constante interna que sí se recuperó, el cable dañado que se anotó y la prueba del FE que no confirma que el dato llegara intacto. \u003ca href=\"03_HISTORIA.md\">Historia reconstruida\u003c/a>.\u003c/p>\n"}]},{"id":"07_AUDITORIA","file":"07_AUDITORIA.md","title":"Auditoría: qué se revisó y qué quedó pendiente","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Auditoría: qué se revisó y qué quedó pendiente\n\n","html":"\u003ch1 id=\"auditoría-qué-se-revisó-y-qué-quedó-pendiente\">Auditoría: qué se revisó y qué quedó pendiente\u003c/h1>\n"},{"title":"Supuestos que se pusieron a prueba","anchor":"supuestos-que-se-pusieron-a-prueba","text":"## Supuestos que se pusieron a prueba\n\n| Supuesto | Qué se encontró | Qué hace la guía |\n|---|---|---|\n| Las direcciones antiguas se pueden reusar | El BD pone A00D y A00E en interrupt controllers | Avisa antes de cualquier MMIO y no usa escrituras antiguas como procedimiento. |\n| Si hay UIO, el periférico funciona | Una nota tiene un UIO visible con `Bus error`, otra tiene CPU stalls | Separa inventario y lectura, y para ante un fallo en vez de barrer direcciones. |\n| `--help` siempre es inofensivo | La CLI de payload no lee argumentos | No recomienda pedirle ayuda a esa CLI. |\n| La ayuda del cargador lista opciones que funcionan | `getopts` rechaza las opciones largas antes | Solo usa `-l` y `-h`. El parser se probó aislado, sin correr el cargador. |\n| Leer el chip no cambia nada | `lpGbtRegister -r` escribe el controlador y vacía la FIFO | Lo deja fuera del inventario, con condiciones y autorización local. |\n| Nueve palabras son un frame | El software no tiene snapshot ni contador | Guarda la captura cruda sin afirmar coherencia ni eventos nuevos. |\n| El header valida el payload | El JSON promete un checker, falta el RTL y la CLI solo imprime | Lo marca DESCONOCIDO y no inventa un criterio. |\n| «Tenemos lectura» prueba el FE | La nota 1006 usó loopback | Lo trata como prueba de loopback. |\n| Nunca se probó el FE | La nota 1028–1031 sí tiene ensayos | Reconoce los ensayos y sus resultados dispares, sin declarar éxito. |\n| La nota más nueva corrige el mapa | `Memory Directions`, de enero de 2026, mezcla offsets que no encajan | Deja la contradicción abierta hasta saber la build. |\n| «Trenz» identifica la FPGA | El BD declara XCZU4EG/TE0807 y hay otros modelos en juego | Deja el modelo actual por confirmar. |\n| Si existe `eLink_Interface`, ya recibe el FE | La fuente está, pero no está en el BD recuperado | La deja como pista a investigar. |\n| Se analizó todo el respaldo | Solo el ZIP curado y dos gitingest | Lo dice así y no afirma haber visto el TAR ni los binarios. |\n\nNo se cambiaron fuentes originales, no se cargó firmware, no se escribieron registros y no se tocó el hardware. Solo se añadieron documentos, extractos y la web en la rama indicada.\n\n","html":"\u003ch2 id=\"supuestos-que-se-pusieron-a-prueba\">Supuestos que se pusieron a prueba\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Supuesto\u003c/th>\n\u003cth>Qué se encontró\u003c/th>\n\u003cth>Qué hace la guía\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Las direcciones antiguas se pueden reusar\u003c/td>\n\u003ctd>El BD pone A00D y A00E en interrupt controllers\u003c/td>\n\u003ctd>Avisa antes de cualquier MMIO y no usa escrituras antiguas como procedimiento.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Si hay UIO, el periférico funciona\u003c/td>\n\u003ctd>Una nota tiene un UIO visible con \u003ccode>Bus error\u003c/code>, otra tiene CPU stalls\u003c/td>\n\u003ctd>Separa inventario y lectura, y para ante un fallo en vez de barrer direcciones.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>--help\u003c/code> siempre es inofensivo\u003c/td>\n\u003ctd>La CLI de payload no lee argumentos\u003c/td>\n\u003ctd>No recomienda pedirle ayuda a esa CLI.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>La ayuda del cargador lista opciones que funcionan\u003c/td>\n\u003ctd>\u003ccode>getopts\u003c/code> rechaza las opciones largas antes\u003c/td>\n\u003ctd>Solo usa \u003ccode>-l\u003c/code> y \u003ccode>-h\u003c/code>. El parser se probó aislado, sin correr el cargador.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leer el chip no cambia nada\u003c/td>\n\u003ctd>\u003ccode>lpGbtRegister -r\u003c/code> escribe el controlador y vacía la FIFO\u003c/td>\n\u003ctd>Lo deja fuera del inventario, con condiciones y autorización local.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nueve palabras son un frame\u003c/td>\n\u003ctd>El software no tiene snapshot ni contador\u003c/td>\n\u003ctd>Guarda la captura cruda sin afirmar coherencia ni eventos nuevos.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>El header valida el payload\u003c/td>\n\u003ctd>El JSON promete un checker, falta el RTL y la CLI solo imprime\u003c/td>\n\u003ctd>Lo marca DESCONOCIDO y no inventa un criterio.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>«Tenemos lectura» prueba el FE\u003c/td>\n\u003ctd>La nota 1006 usó loopback\u003c/td>\n\u003ctd>Lo trata como prueba de loopback.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nunca se probó el FE\u003c/td>\n\u003ctd>La nota 1028–1031 sí tiene ensayos\u003c/td>\n\u003ctd>Reconoce los ensayos y sus resultados dispares, sin declarar éxito.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>La nota más nueva corrige el mapa\u003c/td>\n\u003ctd>\u003ccode>Memory Directions\u003c/code>, de enero de 2026, mezcla offsets que no encajan\u003c/td>\n\u003ctd>Deja la contradicción abierta hasta saber la build.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>«Trenz» identifica la FPGA\u003c/td>\n\u003ctd>El BD declara XCZU4EG/TE0807 y hay otros modelos en juego\u003c/td>\n\u003ctd>Deja el modelo actual por confirmar.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Si existe \u003ccode>eLink_Interface\u003c/code>, ya recibe el FE\u003c/td>\n\u003ctd>La fuente está, pero no está en el BD recuperado\u003c/td>\n\u003ctd>La deja como pista a investigar.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Se analizó todo el respaldo\u003c/td>\n\u003ctd>Solo el ZIP curado y dos gitingest\u003c/td>\n\u003ctd>Lo dice así y no afirma haber visto el TAR ni los binarios.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>No se cambiaron fuentes originales, no se cargó firmware, no se escribieron registros y no se tocó el hardware. Solo se añadieron documentos, extractos y la web en la rama indicada.\u003c/p>\n"},{"title":"Comprobaciones de integridad","anchor":"comprobaciones-de-integridad","text":"## Comprobaciones de integridad\n\n- Los 77 archivos curados coinciden con los SHA-256 del MANIFEST.\n- Se comprobó el baseline de `main` con el árbol completo, y que las fuentes del capturador no aparecen por nombre. Se analizaron componentes, nets y segmentos del BD.\n- Se compararon el JSON de nueve grupos, la clase del backup y la variante de un grupo.\n- Se revisó el historial por rutas y los archivos cambiados en las revisiones que podían cambiar la lectura.\n- Se compararon cuatro archivos de los gitingest con las copias del backup. Coinciden, pero eso no se extiende al repositorio completo.\n- Cada extracto de la web lleva ruta, líneas y hash del archivo completo. No se copiaron historiales, credenciales ni notas de acceso.\n\n","html":"\u003ch2 id=\"comprobaciones-de-integridad\">Comprobaciones de integridad\u003c/h2>\n\u003cul>\n\u003cli>Los 77 archivos curados coinciden con los SHA-256 del MANIFEST.\u003c/li>\n\u003cli>Se comprobó el baseline de \u003ccode>main\u003c/code> con el árbol completo, y que las fuentes del capturador no aparecen por nombre. Se analizaron componentes, nets y segmentos del BD.\u003c/li>\n\u003cli>Se compararon el JSON de nueve grupos, la clase del backup y la variante de un grupo.\u003c/li>\n\u003cli>Se revisó el historial por rutas y los archivos cambiados en las revisiones que podían cambiar la lectura.\u003c/li>\n\u003cli>Se compararon cuatro archivos de los gitingest con las copias del backup. Coinciden, pero eso no se extiende al repositorio completo.\u003c/li>\n\u003cli>Cada extracto de la web lleva ruta, líneas y hash del archivo completo. No se copiaron historiales, credenciales ni notas de acceso.\u003c/li>\n\u003c/ul>\n"},{"title":"Primera verificación de la web","anchor":"primera-verificación-de-la-web","text":"## Primera verificación de la web\n\n`node verificar_base.mjs --static` sobre el HTML generado dio OK: 10 documentos, 15 fuentes, 8 enlaces Markdown internos, 4 secciones, 11 nodos, 6 tareas y 5 búsquedas técnicas. La prueba compila el JavaScript y ejecuta rutas y vistas con un DOM mínimo en Node; no es una prueba en navegador. También comprueba los enlaces con tildes, los destinos de las tareas y que el HTML no carga nada remoto. Aparte, se revisaron los 19 enlaces locales de todos los Markdown, incluido el README, y los 15 extractos coinciden con sus líneas y hashes.\n\nDurante esa revisión se corrigieron escapes de expresiones regulares y las anclas con tildes.\n\nFaltó probarla en un navegador real: había Playwright pero no Chromium, y la descarga no dio un archivo válido. Por eso no se dan por probados el aspecto visual, el móvil, el foco, los lectores de pantalla ni `file://` en cada navegador. La guía en Markdown sigue disponible si la web falla.\n\nLa web no ejecuta comandos, no carga firmware y no envía datos a ningún sistema.\n\n","html":"\u003ch2 id=\"primera-verificación-de-la-web\">Primera verificación de la web\u003c/h2>\n\u003cp>\u003ccode>node verificar_base.mjs --static\u003c/code> sobre el HTML generado dio OK: 10 documentos, 15 fuentes, 8 enlaces Markdown internos, 4 secciones, 11 nodos, 6 tareas y 5 búsquedas técnicas. La prueba compila el JavaScript y ejecuta rutas y vistas con un DOM mínimo en Node; no es una prueba en navegador. También comprueba los enlaces con tildes, los destinos de las tareas y que el HTML no carga nada remoto. Aparte, se revisaron los 19 enlaces locales de todos los Markdown, incluido el README, y los 15 extractos coinciden con sus líneas y hashes.\u003c/p>\n\u003cp>Durante esa revisión se corrigieron escapes de expresiones regulares y las anclas con tildes.\u003c/p>\n\u003cp>Faltó probarla en un navegador real: había Playwright pero no Chromium, y la descarga no dio un archivo válido. Por eso no se dan por probados el aspecto visual, el móvil, el foco, los lectores de pantalla ni \u003ccode>file://\u003c/code> en cada navegador. La guía en Markdown sigue disponible si la web falla.\u003c/p>\n\u003cp>La web no ejecuta comandos, no carga firmware y no envía datos a ningún sistema.\u003c/p>\n"},{"title":"Lo que una auditoría sin hardware no puede cerrar","anchor":"lo-que-una-auditoría-sin-hardware-no-puede-cerrar","text":"## Lo que una auditoría sin hardware no puede cerrar\n\nNo se probó el acceso AXI, la parte eléctrica, la fuente del Serializer, el lock actual, la compatibilidad del ELF, el empaquetado de los grupos, el disparo de la captura ni que los datos del FE lleguen intactos. La prueba A/B/A está propuesta, no hecha. Tampoco hay prueba de adquisición sin pérdidas, aunque una prueba futura con constantes sostenidas salga bien.\n\nP1 se limita a las fuentes recuperadas: falta unir UserData con el capturador, y faltan los PDF, los detalles del FE y la build cargada. P2 da acceso a lo que se sabe; no simula ni certifica el sistema. La revisión P3 no aprueba ningún procedimiento para un firmware desconocido.\n\n","html":"\u003ch2 id=\"lo-que-una-auditoría-sin-hardware-no-puede-cerrar\">Lo que una auditoría sin hardware no puede cerrar\u003c/h2>\n\u003cp>No se probó el acceso AXI, la parte eléctrica, la fuente del Serializer, el lock actual, la compatibilidad del ELF, el empaquetado de los grupos, el disparo de la captura ni que los datos del FE lleguen intactos. La prueba A/B/A está propuesta, no hecha. Tampoco hay prueba de adquisición sin pérdidas, aunque una prueba futura con constantes sostenidas salga bien.\u003c/p>\n\u003cp>P1 se limita a las fuentes recuperadas: falta unir UserData con el capturador, y faltan los PDF, los detalles del FE y la build cargada. P2 da acceso a lo que se sabe; no simula ni certifica el sistema. La revisión P3 no aprueba ningún procedimiento para un firmware desconocido.\u003c/p>\n"},{"title":"Segunda revisión: web y bloqueo intermitente","anchor":"segunda-revisión-web-y-bloqueo-intermitente","text":"## Segunda revisión: web y bloqueo intermitente\n\nEsta sección pone al día lo que se probó en el navegador después de la primera versión.\n\n### Qué se probó\n\n- Revisión visual de la portada y del mapa en Chrome remoto, con la vista previa local.\n- Clic en nodos del mapa, búsqueda de `clearIntr` y apertura del extracto B10 con sus líneas.\n- Dos ramas del diagnóstico: un proceso IC que no termina y un lector de payload que termina repitiendo valores. Las recomendaciones son distintas y se presentan como hipótesis.\n- Exportación Markdown con observaciones, fecha y límites, con el texto seleccionable por si fallan la descarga o la copia.\n- Pruebas en Node: sintaxis del JavaScript, enlaces y anclas, 28 extractos y once componentes. Parser completo y parcial, duplicados, hexadecimales inválidos, límites de tamaño, grupos ausentes y XOR en las 32 posiciones de bit. El diagnóstico separa las rutas IC, payload y script, y no culpa a la CLI de payload de los bucles IC.\n- Cinco contraejemplos reducidos en Python. No simulan el diseño ni se ejecutaron en hardware.\n\n### Qué no se pudo probar\n\nLa descarga con Blob no dio un archivo comprobable en el navegador remoto, y la copia automática tampoco funcionó; sí funcionó seleccionar el texto. Por eso se añadió la ventana para copiar el informe a mano.\n\nUna interrupción cerró la pestaña y la vista previa, y al volver el navegador no pudo tomar la pestaña de error por su política de URL. No se intentó saltar esa restricción. Quedan sin probar en el navegador el comparador completo, la persistencia al recargar y el móvil; su lógica y estructura se revisaron sobre el código.\n\n### Hipótesis del fallo que no se sostienen\n\n- `ready` retenido: el reset que viene del core puede borrarlo, así que no toda pérdida de enlace es un ready pegado.\n- FSM eLink: puede salir por una escritura downlink, y falta probar que esté en la build. El fallo no es inevitable.\n- Watchdog IC: `0x10004` no elige la ruta single afectada, así que ese defecto no explica la CLI de payload.\n- FIFO IC: se vacía al empezar cada transacción, así que la idea de que se llena entre consultas correctas no se sostiene.\n- Script callado: el byte bajo puede quedarse quieto aunque cambie el resto. Que no imprima no prueba un bloqueo.\n- Reiniciar lo arregla: sin saber qué se reinició, el estado anterior y si se repite, no dice qué pieza fallaba.\n\nNo se tocaron fuentes, no se ejecutaron binarios de adquisición, no se abrió MMIO y no se cargó firmware. La causa sigue abierta; lo que hay es una investigación con fuentes y un procedimiento para encontrarla.\n\n","html":"\u003ch2 id=\"segunda-revisión-web-y-bloqueo-intermitente\">Segunda revisión: web y bloqueo intermitente\u003c/h2>\n\u003cp>Esta sección pone al día lo que se probó en el navegador después de la primera versión.\u003c/p>\n\u003ch3 id=\"qué-se-probó\">Qué se probó\u003c/h3>\n\u003cul>\n\u003cli>Revisión visual de la portada y del mapa en Chrome remoto, con la vista previa local.\u003c/li>\n\u003cli>Clic en nodos del mapa, búsqueda de \u003ccode>clearIntr\u003c/code> y apertura del extracto B10 con sus líneas.\u003c/li>\n\u003cli>Dos ramas del diagnóstico: un proceso IC que no termina y un lector de payload que termina repitiendo valores. Las recomendaciones son distintas y se presentan como hipótesis.\u003c/li>\n\u003cli>Exportación Markdown con observaciones, fecha y límites, con el texto seleccionable por si fallan la descarga o la copia.\u003c/li>\n\u003cli>Pruebas en Node: sintaxis del JavaScript, enlaces y anclas, 28 extractos y once componentes. Parser completo y parcial, duplicados, hexadecimales inválidos, límites de tamaño, grupos ausentes y XOR en las 32 posiciones de bit. El diagnóstico separa las rutas IC, payload y script, y no culpa a la CLI de payload de los bucles IC.\u003c/li>\n\u003cli>Cinco contraejemplos reducidos en Python. No simulan el diseño ni se ejecutaron en hardware.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"qué-no-se-pudo-probar\">Qué no se pudo probar\u003c/h3>\n\u003cp>La descarga con Blob no dio un archivo comprobable en el navegador remoto, y la copia automática tampoco funcionó; sí funcionó seleccionar el texto. Por eso se añadió la ventana para copiar el informe a mano.\u003c/p>\n\u003cp>Una interrupción cerró la pestaña y la vista previa, y al volver el navegador no pudo tomar la pestaña de error por su política de URL. No se intentó saltar esa restricción. Quedan sin probar en el navegador el comparador completo, la persistencia al recargar y el móvil; su lógica y estructura se revisaron sobre el código.\u003c/p>\n\u003ch3 id=\"hipótesis-del-fallo-que-no-se-sostienen\">Hipótesis del fallo que no se sostienen\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>ready\u003c/code> retenido: el reset que viene del core puede borrarlo, así que no toda pérdida de enlace es un ready pegado.\u003c/li>\n\u003cli>FSM eLink: puede salir por una escritura downlink, y falta probar que esté en la build. El fallo no es inevitable.\u003c/li>\n\u003cli>Watchdog IC: \u003ccode>0x10004\u003c/code> no elige la ruta single afectada, así que ese defecto no explica la CLI de payload.\u003c/li>\n\u003cli>FIFO IC: se vacía al empezar cada transacción, así que la idea de que se llena entre consultas correctas no se sostiene.\u003c/li>\n\u003cli>Script callado: el byte bajo puede quedarse quieto aunque cambie el resto. Que no imprima no prueba un bloqueo.\u003c/li>\n\u003cli>Reiniciar lo arregla: sin saber qué se reinició, el estado anterior y si se repite, no dice qué pieza fallaba.\u003c/li>\n\u003c/ul>\n\u003cp>No se tocaron fuentes, no se ejecutaron binarios de adquisición, no se abrió MMIO y no se cargó firmware. La causa sigue abierta; lo que hay es una investigación con fuentes y un procedimiento para encontrarla.\u003c/p>\n"},{"title":"Ampliación del 25-10-2026: script de diagnóstico","anchor":"ampliación-del-25-10-2026-script-de-diagnóstico","text":"## Ampliación del 25-10-2026: script de diagnóstico\n\nSe añadieron `diagnostico/atlas_diagnostico.py` y la [sesión S0–S4](12_SCRIPT_DIAGNOSTICO.md), sin tocar las herramientas originales. Es un supervisor de la CLI existente; no es un driver ni arregla el bloqueo. `inventario` solo lee archivos de Linux. `capturar` exige un plan revisado y una opción explícita para autorizar las lecturas. Ese modo no se ejecutó sobre hardware.\n\nPasan 18 pruebas automáticas: 32 posiciones de bit, datos incompletos, hash distinto, UIO ambiguo, timeout, SIGBUS simulado, salida demasiado grande, lock entre sesiones, parada tras el primer error e informe con el diario a medias. Un proceso falso que no termina comprueba que el supervisor no se queda esperando para siempre; no reproduce un bloqueo AXI real. Una sesión falsa correcta comprueba los archivos de salida, los cambios en bits altos y que el lock se libera.\n\nLímites que se tuvieron en cuenta: el plan no prueba qué build está cargada; la lista de bibliotecas no se resuelve sola; `/proc` no garantiza exclusividad; lanzar el programa cada vez puede esconder fallos de una aplicación que corre seguido; timeout y SIGKILL no garantizan que termine o se corte el MMIO; que dos muestras sean iguales no dice que sean viejas; y el XOR no prueba origen ni coherencia. No hay barrido de direcciones, control IC, monitor de otra IP ni recuperación automática.\n\nEn la web, el documento aparece en la búsqueda y en la documentación, con enlaces desde OPERAR e INVESTIGAR. Las pruebas estáticas se repitieron con 13 documentos; la cobertura en navegador no cambió. Los `.out` del script se pueden cargar en el comparador; las sesiones JSONL completas no.\n\nFalta: S0 en la Trenz, identificar build, ELF y dependencias, saber qué hace la lectura del capturador, el estímulo FE y la autorización para el ensayo corto. La causa sigue abierta.\n\n","html":"\u003ch2 id=\"ampliación-del-25-10-2026-script-de-diagnóstico\">Ampliación del 25-10-2026: script de diagnóstico\u003c/h2>\n\u003cp>Se añadieron \u003ccode>diagnostico/atlas_diagnostico.py\u003c/code> y la \u003ca href=\"12_SCRIPT_DIAGNOSTICO.md\">sesión S0–S4\u003c/a>, sin tocar las herramientas originales. Es un supervisor de la CLI existente; no es un driver ni arregla el bloqueo. \u003ccode>inventario\u003c/code> solo lee archivos de Linux. \u003ccode>capturar\u003c/code> exige un plan revisado y una opción explícita para autorizar las lecturas. Ese modo no se ejecutó sobre hardware.\u003c/p>\n\u003cp>Pasan 18 pruebas automáticas: 32 posiciones de bit, datos incompletos, hash distinto, UIO ambiguo, timeout, SIGBUS simulado, salida demasiado grande, lock entre sesiones, parada tras el primer error e informe con el diario a medias. Un proceso falso que no termina comprueba que el supervisor no se queda esperando para siempre; no reproduce un bloqueo AXI real. Una sesión falsa correcta comprueba los archivos de salida, los cambios en bits altos y que el lock se libera.\u003c/p>\n\u003cp>Límites que se tuvieron en cuenta: el plan no prueba qué build está cargada; la lista de bibliotecas no se resuelve sola; \u003ccode>/proc\u003c/code> no garantiza exclusividad; lanzar el programa cada vez puede esconder fallos de una aplicación que corre seguido; timeout y SIGKILL no garantizan que termine o se corte el MMIO; que dos muestras sean iguales no dice que sean viejas; y el XOR no prueba origen ni coherencia. No hay barrido de direcciones, control IC, monitor de otra IP ni recuperación automática.\u003c/p>\n\u003cp>En la web, el documento aparece en la búsqueda y en la documentación, con enlaces desde OPERAR e INVESTIGAR. Las pruebas estáticas se repitieron con 13 documentos; la cobertura en navegador no cambió. Los \u003ccode>.out\u003c/code> del script se pueden cargar en el comparador; las sesiones JSONL completas no.\u003c/p>\n\u003cp>Falta: S0 en la Trenz, identificar build, ELF y dependencias, saber qué hace la lectura del capturador, el estímulo FE y la autorización para el ensayo corto. La causa sigue abierta.\u003c/p>\n"},{"title":"Ampliación del 26-10-2026: guía breve y Pages","anchor":"ampliación-del-26-10-2026-guía-breve-y-pages","text":"## Ampliación del 26-10-2026: guía breve y Pages\n\n- Interfaz más simple al estilo WIRED / OBSERVATORY: fondo blanco, letra monoespaciada, líneas finas y azul para la selección. Portada por tareas y catálogo en filas desplegables, sin perder la documentación larga.\n- Guía resumida nueva con ocho diagramas Mermaid, más dos del mapa técnico. Mermaid va empaquetado en local, sin CDN.\n- Los diez diagramas pasan el parser de Mermaid con JSDOM. En el navegador se vio la arquitectura y, al abrir la guía, los ocho diagramas nuevos. Portada y navegación se revisaron a ojo, no en todos los tamaños de pantalla.\n- Enlaces y lógica comprobados sobre 14 documentos, 28 fuentes y 39 enlaces Markdown internos. Siguen los mismos límites de hardware y descarga; publicar no valida instrumentos ni datos del FE.\n- El workflow construye y prueba antes de publicar. Solo se sube `_site`, sin fuentes originales ni respaldo. El estado final y la URL los da GitHub Actions.\n- El HTML necesita `assets/mermaid.js` para los diagramas, y la carpeta completa funciona sin red. Ya no es un HTML único autosuficiente; ver [uso local](09_USO_LOCAL.md).\n","html":"\u003ch2 id=\"ampliación-del-26-10-2026-guía-breve-y-pages\">Ampliación del 26-10-2026: guía breve y Pages\u003c/h2>\n\u003cul>\n\u003cli>Interfaz más simple al estilo WIRED / OBSERVATORY: fondo blanco, letra monoespaciada, líneas finas y azul para la selección. Portada por tareas y catálogo en filas desplegables, sin perder la documentación larga.\u003c/li>\n\u003cli>Guía resumida nueva con ocho diagramas Mermaid, más dos del mapa técnico. Mermaid va empaquetado en local, sin CDN.\u003c/li>\n\u003cli>Los diez diagramas pasan el parser de Mermaid con JSDOM. En el navegador se vio la arquitectura y, al abrir la guía, los ocho diagramas nuevos. Portada y navegación se revisaron a ojo, no en todos los tamaños de pantalla.\u003c/li>\n\u003cli>Enlaces y lógica comprobados sobre 14 documentos, 28 fuentes y 39 enlaces Markdown internos. Siguen los mismos límites de hardware y descarga; publicar no valida instrumentos ni datos del FE.\u003c/li>\n\u003cli>El workflow construye y prueba antes de publicar. Solo se sube \u003ccode>_site\u003c/code>, sin fuentes originales ni respaldo. El estado final y la URL los da GitHub Actions.\u003c/li>\n\u003cli>El HTML necesita \u003ccode>assets/mermaid.js\u003c/code> para los diagramas, y la carpeta completa funciona sin red. Ya no es un HTML único autosuficiente; ver \u003ca href=\"09_USO_LOCAL.md\">uso local\u003c/a>.\u003c/li>\n\u003c/ul>\n"}]},{"id":"08_FUENTES","file":"08_FUENTES.md","title":"Registro de fuentes y cobertura","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Registro de fuentes y cobertura\n\nBaseline GitHub: `c02a33b645dc70fb4076add25b78c5246589676e`. Consulta del 24-10-2026. [Repositorio](https://github.com/fbientrigo/atlas_emc).\n\n","html":"\u003ch1 id=\"registro-de-fuentes-y-cobertura\">Registro de fuentes y cobertura\u003c/h1>\n\u003cp>Baseline GitHub: \u003ccode>c02a33b645dc70fb4076add25b78c5246589676e\u003c/code>. Consulta del 24-10-2026. \u003ca href=\"https://github.com/fbientrigo/atlas_emc\">Repositorio\u003c/a>.\u003c/p>\n"},{"title":"Procedencia y límites","anchor":"procedencia-y-límites","text":"## Procedencia y límites\n\nEl ZIP adjunto se analizó desde la copia local. El respaldo completo `.tar.gz` no estaba disponible en esta sesión, así que esto no es una revisión del disco entero. Los SHA-256 de los 77 archivos coinciden con el MANIFEST del ZIP. No se ejecutó ningún binario ni script del respaldo.\n\nLos gitingest adjuntos sirven para comparar código, pero no dicen de qué commit ni de qué fecha son. `libuio/base.c`, `mem.c`, `LpGbtUioBackend.cpp` y `lpGbtRegister.cpp` coinciden con el backup salvo líneas vacías al final. Eso no prueba que los repositorios completos o los binarios sean iguales.\n\n| Archivo de entrada | SHA-256 |\n|---|---|\n| `Trenz_EMP_lpGBT_Work_P0_curado.zip` | `41ad3aefcf684279639665983fb8644dbdf112e8aadf694d115c279de5f17f33` |\n| `01-libuio_gitingest.txt` | `fe77fac9b5f2d387222d9581409d02e4d0607f18a0b1a83b82d5dfabf09fc6d6` |\n| `02-lpgbtsw_gitingest.txt` | `0b593e9c3b1cdce3159f9a531f5f7057b45cff27a7fa1eebaaefbb4fff679640` |\n\n","html":"\u003ch2 id=\"procedencia-y-límites\">Procedencia y límites\u003c/h2>\n\u003cp>El ZIP adjunto se analizó desde la copia local. El respaldo completo \u003ccode>.tar.gz\u003c/code> no estaba disponible en esta sesión, así que esto no es una revisión del disco entero. Los SHA-256 de los 77 archivos coinciden con el MANIFEST del ZIP. No se ejecutó ningún binario ni script del respaldo.\u003c/p>\n\u003cp>Los gitingest adjuntos sirven para comparar código, pero no dicen de qué commit ni de qué fecha son. \u003ccode>libuio/base.c\u003c/code>, \u003ccode>mem.c\u003c/code>, \u003ccode>LpGbtUioBackend.cpp\u003c/code> y \u003ccode>lpGbtRegister.cpp\u003c/code> coinciden con el backup salvo líneas vacías al final. Eso no prueba que los repositorios completos o los binarios sean iguales.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Archivo de entrada\u003c/th>\n\u003cth>SHA-256\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Trenz_EMP_lpGBT_Work_P0_curado.zip\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>41ad3aefcf684279639665983fb8644dbdf112e8aadf694d115c279de5f17f33\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>01-libuio_gitingest.txt\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>fe77fac9b5f2d387222d9581409d02e4d0607f18a0b1a83b82d5dfabf09fc6d6\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>02-lpgbtsw_gitingest.txt\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>0b593e9c3b1cdce3159f9a531f5f7057b45cff27a7fa1eebaaefbb4fff679640\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Extractos navegables","anchor":"extractos-navegables","text":"## Extractos navegables\n\nLos extractos de `evidencias.json` mantienen los números de línea del archivo completo y su hash. Son trozos para consultar, no fuentes para compilar. No incluyen historiales, credenciales, SSH ni logs personales, y los archivos originales no se tocaron.\n\n| ID | Tema | Ruta original |\n|---|---|---|\n| B01 | CLI de payload | `read_all_lpgbt/tgc_readuplink_cli.cpp` |\n| B02 | Getters de payload | `read_all_lpgbt/TgcReadUplink.cpp` |\n| B03 | Acceso MMIO volatile | `libuio/mem.c` |\n| B04 | Lookup y mmap UIO | `libuio/base.c` |\n| B05 | Tabla del monitor | `emp-tools/empTools/fwStatus/fwStatus.cpp` |\n| B06 | Control IC activo | `LpGbtSw/LpGbtUioBackend/LpGbtUioBackend.cpp` |\n| B07 | Offsets del controlador IC | `LpGbtSw/include/LpGbtUioBackend/AxiRegisterDefinitions.h` |\n| B08 | Ayuda y acciones ReadPRBS | `puzzled_working/readprbs_cli.cpp` |\n| B09 | Máscara corregida ReadPRBS | `puzzled_working/ReadPRBS.cpp` |\n| R01 | Ruta de UserData y CDC | `epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/new/emp_lpgbt.vhd` |\n| R02 | Core uplink: cabecera y campos | `epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/imports/lpgbt-fpga/lpgbtfpga_uplink.vhd` |\n| R03 | Conexiones de estado | `epos-firmware/empfw_debughub/src/empfw_debughub.vhd` |\n| R04 | Plantilla de máscaras | `puzzledWizards/templates/airhdl_to_cppbody.jinja` |\n| R05 | Variante antigua de un grupo | `puzzledWizards/output_tgc_readuplink_1002/TgcReadUplink.cpp` |\n| R06 | CDC de recepción | `epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/imports/cdc_user/cdc_rx.vhd` |\n\n","html":"\u003ch2 id=\"extractos-navegables\">Extractos navegables\u003c/h2>\n\u003cp>Los extractos de \u003ccode>evidencias.json\u003c/code> mantienen los números de línea del archivo completo y su hash. Son trozos para consultar, no fuentes para compilar. No incluyen historiales, credenciales, SSH ni logs personales, y los archivos originales no se tocaron.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ct 7c7e115ea82f21dcc\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>test_saturation.sh\u003c/code>\u003c/td>\n\u003ctd>65\u003c/td>\n\u003ctd>\u003ccode>241ed6fae270ebb6edd3ca06725e42150c015268aa5df382908fe6dd35b5f315\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1024/send_and_read.sh\u003c/code>\u003c/td>\n\u003ctd>54\u003c/td>\n\u003ctd>\u003ccode>a46cce2af26b058ea45a8a9fbdb004ac850c320a232978a1af0317be8d575c5f\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1024/typical_out/0xAAAAAAAA.txt\u003c/code>\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>\u003ccode>005eb9eb14e2aca5f778d515d3bbbc3352effbc25146396aa87568da3c582632\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>clk_sweep_results.log\u003c/code>\u003c/td>\n\u003ctd>64\u003c/td>\n\u003ctd>\u003ccode>556a5dec3a502227004549c40b03739fdba61666a91bd16c53e5f6937c07ba5e\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Búsquedas negativas y sus límites","anchor":"búsquedas-negativas-y-sus-límites","text":"## Búsquedas negativas y sus límites\n\n- El árbol completo del baseline tiene 2526 entradas y vino entero. Se usó para encontrar rutas, no para leerlo todo.\n- No hay `AGENTS.md` en ese árbol.\n- No aparece ninguna fuente `.vhd/.v/.sv` llamada `tgc_readUplink`, `Read_PRBS` o parecido, y el BD tampoco tiene esas instancias. Podría existir con otro nombre, en otro repositorio, dentro de un binario o fuera del backup curado.\n- El BD sí asigna A00D y A00E a interrupt controllers, así que el choque con los scripts antiguos es real y no solo falta de archivos.\n- Las fichas TDR, Interaction y Elink están vacías y enlazan PDFs que no se leyeron.\n- Las imágenes de las notas no se tomaron como prueba de conexión actual. No se revisaron a fondo los estados posteriores del hardware ni las otras ramas.\n\n","html":"\u003ch2 id=\"búsquedas-negativas-y-sus-límites\">Búsquedas negativas y sus límites\u003c/h2>\n\u003cul>\n\u003cli>El árbol completo del baseline tiene 2526 entradas y vino entero. Se usó para encontrar rutas, no para leerlo todo.\u003c/li>\n\u003cli>No hay \u003ccode>AGENTS.md\u003c/code> en ese árbol.\u003c/li>\n\u003cli>No aparece ninguna fuente \u003ccode>.vhd/.v/.sv\u003c/code> llamada \u003ccode>tgc_readUplink\u003c/code>, \u003ccode>Read_PRBS\u003c/code> o parecido, y el BD tampoco tiene esas instancias. Podría existir con otro nombre, en otro repositorio, dentro de un binario o fuera del backup curado.\u003c/li>\n\u003cli>El BD sí asigna A00D y A00E a interrupt controllers, así que el choque con los scripts antiguos es real y no solo falta de archivos.\u003c/li>\n\u003cli>Las fichas TDR, Interaction y Elink están vacías y enlazan PDFs que no se leyeron.\u003c/li>\n\u003cli>Las imágenes de las notas no se tomaron como prueba de conexión actual. No se revisaron a fondo los estados posteriores del hardware ni las otras ramas.\u003c/li>\n\u003c/ul>\n"},{"title":"Ampliación del 24-10-2026: bloqueo intermitente","anchor":"ampliación-del-24-10-2026-bloqueo-intermitente","text":"## Ampliación del 24-10-2026: bloqueo intermitente\n\nAhora hay 28 extractos, incluidos R07–R15 y B10–B13, con sus rutas, rangos y SHA-256 en `evidencias.json`. También se revisaron `ic_top.vhd`, `ic_rx.vhd`, `ic_rx_fifo.vhd` y el package del controlador IC en el mismo baseline c02a33b. Los hashes son de los archivos locales revisados y los enlaces apuntan a ese commit. Que el sistema volviera a funcionar al reiniciar lo contó el usuario el 24-10-2026; es un testimonio, no una prueba actual.\n\nLa documentación de Linux UIO, /proc y GNU timeout solo respalda conceptos del sistema operativo, no el firmware. Los enlaces están en el documento 10. No se revisó hardware real ni se compiló o simuló el diseño completo.\n","html":"\u003ch2 id=\"ampliación-del-24-10-2026-bloqueo-intermitente\">Ampliación del 24-10-2026: bloqueo intermitente\u003c/h2>\n\u003cp>Ahora hay 28 extractos, incluidos R07–R15 y B10–B13, con
