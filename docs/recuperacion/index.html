>MANIFEST.json\u003c/code> del ZIP.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>F1, backup:\u003c/strong> \u003ccode>read_all_lpgbt/tgc_readuplink_cli.cpp:18–62\u003c/code>; \u003ccode>TgcReadUplink.cpp:25–37,45–311\u003c/code>. CLI SHA-256 \u003ccode>03cb6c414059ab55e2fcdcb162faed1287d00c8afd0b5cac434acf1836c098d3\u003c/code>; clase \u003ccode>0bbd3f71777adcaa7b7400dd2fca5987e1faebc1088509cf3a45a28d341db7dd\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>F2, backup:\u003c/strong> \u003ccode>libuio/base.c:246–271,344–388\u003c/code>; \u003ccode>mem.c:209–221\u003c/code>; \u003ccode>lsuio.c:77–149,153–169\u003c/code>. Búsqueda, permisos de mmap, acceso volatile y el error de limpieza.\u003c/li>\n\u003cli>\u003cstrong>F3, backup:\u003c/strong> \u003ccode>emp-tools/empTools/fwStatus/fwStatus.cpp:17–50,84–115\u003c/code>; su \u003ccode>CMakeLists.txt:1–6\u003c/code>; \u003ccode>include/fwMonitor/fwMonitor.hpp:15\u003c/code>; \u003ccode>src/fwMonitor/fwMonitor.cpp:35–45\u003c/code>; \u003ccode>src/axiBackend/uioFunctions.cpp:17–40,93–176\u003c/code>; \u003ccode>include/axiBackend/axiRegisterMap.hpp:8–68\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>F4, backup:\u003c/strong> \u003ccode>LpGbtSw/Demonstrators/LpGbtRegister/lpGbtRegister.cpp:28–128\u003c/code>; \u003ccode>LpGbtUioBackend/LpGbtUioBackend.cpp:16–63\u003c/code>; \u003ccode>LpGbtUioFunctions.cpp:60–70,99–126,140–155,172–230\u003c/code>; \u003ccode>include/LpGbt/LpgbtRegisterMapV1.h:317–330\u003c/code>. Faltan bitfields para elegir la fuente del FE.\u003c/li>\n\u003cli>\u003cstrong>F5, notas:\u003c/strong> \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1028-1031-Testing.md#physical-reading-and-fe-tests\">1028-1031-Testing\u003c/a>, secciones loopback, FE y 1031; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1013-GettingData%20elinks.md\">1013-GettingData elinks\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1007-multipleLPGBT.md\">1007-multipleLPGBT\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>F6, código y mapa:\u003c/strong> \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/puzzledWizards/tgc_readUplink_regs.json\">JSON de nueve grupos, revisión 27\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/puzzledWizards/output_tgc_readuplink_1002/TgcReadUplink.cpp#L64\">variante de un grupo\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>F7, RTL y BD recuperados:\u003c/strong> \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/new/emp_lpgbt.vhd#L473\">emp_lpgbt.vhd, CDC y división de campos\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/epos-firmware/emp_lpgbt/emp_lpgbt.srcs/sources_1/new/emp_lpgbt.vhd#L590\">estados y FEC\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/epos-firmware/emp-firmware-2023.2/emp-firmware-2023.2.srcs/sources_1/bd/emp_fw_TE0807/emp_fw_TE0807.bd\">Block Design\u003c/a>, sin el lector ni el generador de las notas.\u003c/li>\n\u003cli>\u003cstrong>F8, debughub:\u003c/strong> \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/epos-firmware/empfw_debughub/src/empfw_debughub.vhd#L212\">empfw_debughub.vhd:212–246\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1006-UnderstandSignal_UplinkReady.md\">nota antigua sobre \u003ccode>uplinkReady\u003c/code>\u003c/a>, comparada con el RTL.\u003c/li>\n\u003cli>\u003cstrong>F9, fallos antiguos:\u003c/strong> \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1001-creando%20un%20uio.md\">1001-creando un uio\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/0930-LibUIO%20Implementation.md\">0930-LibUIO Implementation\u003c/a>.\u003c/li>\n\u003cli>\u003cstrong>F10, carga y estado:\u003c/strong> backup \u003ccode>epos/etools/loadFirmare.sh:19–63,79–115\u003c/code>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/0923-Testing%20Master%20branch%20firmware.md\">0923-Testing Master branch firmware\u003c/a>, salidas del 2025-09-23.\u003c/li>\n\u003cli>\u003cstrong>F11, significado y contradicciones:\u003c/strong> \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/quick_guides/Memory%20Directions.md\">Memory Directions\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1028-Pruebas%20de%20envio%20de%20constante.md\">pruebas de constantes\u003c/a>; \u003ca href=\"https://github.com/fbientrigo/atlas_emc/blob/c02a33b645dc70fb4076add25b78c5246589676e/ChargeMonitoringSystem_obsidian/30_Notes/1006-Tenemos%20lectura.md\">1006-Tenemos lectura\u003c/a>, que dice que usó loopback.\u003c/li>\n\u003cli>\u003cstrong>F12, scripts y variantes backup:\u003c/strong> \u003ccode>test_uio/readuio.c:6–35\u003c/code>; \u003ccode>test_uio/uio_peek.c:6–10\u003c/code>; \u003ccode>read_lpgbt10.sh:1–17\u003c/code>; \u003ccode>watch_devmem.sh\u003c/code>; \u003ccode>sweep_clock.sh\u003c/code>; \u003ccode>test_saturation.sh\u003c/code>; \u003ccode>1024/send_and_read.sh\u003c/code>. Compáralos con \u003ccode>libuio/readuio.c\u003c/code> antes de correr un binario llamado \u003ccode>readuio\u003c/code>.\u003c/li>\n\u003c/ul>\n"},{"title":"Criterio para cerrar esta sesión de campo","anchor":"criterio-para-cerrar-esta-sesión-de-campo","text":"## Criterio para cerrar esta sesión de campo\n\nEl inventario se puede terminar ya. La lectura MMIO solo procede cuando el diseño y el lector estén identificados. Solo se puede decir que llegan datos del FE para una configuración que pase una prueba externa repetible con las fuentes internas descartadas. Si falta alguna de esas pruebas, lo útil es dejar anotado dónde se bloqueó y guardar la evidencia.\n","html":"\u003ch2 id=\"criterio-para-cerrar-esta-sesión-de-campo\">Criterio para cerrar esta sesión de campo\u003c/h2>\n\u003cp>El inventario se puede terminar ya. La lectura MMIO solo procede cuando el diseño y el lector estén identificados. Solo se puede decir que llegan datos del FE para una configuración que pase una prueba externa repetible con las fuentes internas descartadas. Si falta alguna de esas pruebas, lo útil es dejar anotado dónde se bloqueó y guardar la evidencia.\u003c/p>\n"}]},{"id":"01_MAPA_TECNICO","file":"01_MAPA_TECNICO.md","title":"Mapa técnico: hasta dónde llega lo que sabemos","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Mapa técnico: hasta dónde llega lo que sabemos\n\nPara trabajar en la placa, empieza por la [guía de campo](00_GUIA_CAMPO.md); las referencias F1–F12 están al final de esa guía. Cada afirmación tiene su origen en el [registro de fuentes](08_FUENTES.md).\n\n","html":"\u003ch1 id=\"mapa-técnico-hasta-dónde-llega-lo-que-sabemos\">Mapa técnico: hasta dónde llega lo que sabemos\u003c/h1>\n\u003cp>Para trabajar en la placa, empieza por la \u003ca href=\"00_GUIA_CAMPO.md\">guía de campo\u003c/a>; las referencias F1–F12 están al final de esa guía. Cada afirmación tiene su origen en el \u003ca href=\"08_FUENTES.md\">registro de fuentes\u003c/a>.\u003c/p>\n"},{"title":"Cuatro capas de certeza","anchor":"cuatro-capas-de-certeza","text":"## Cuatro capas de certeza\n\n| Capa | Lo que sabemos | Lo que no se puede concluir |\n|---|---|---|\n| Arquitectura diseñada | FE, lpGBT, óptica y EMP; payload y control IC van por caminos separados | Que toda esa ruta esté montada. |\n| Código implementado | Core uplink, CDC, registros IC, debughub, accesos UIO y CLI de lectura | Que esas fuentes se compilaran juntas o estén en el bitstream cargado. |\n| Pruebas anteriores | Loopback interno con patrones recuperados; pruebas de cable y FE con resultados que no cuadran | Que se haya adquirido el FE completo y sin pérdidas. |\n| Hardware actual | DESCONOCIDO; falta el inventario y la prueba en la placa | Nada sobre firmware, lock, fuente o funcionamiento actual. |\n\n","html":"\u003ch2 id=\"cuatro-capas-de-certeza\">Cuatro capas de certeza\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Capa\u003c/th>\n\u003cth>Lo que sabemos\u003c/th>\n\u003cth>Lo que no se puede concluir\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Arquitectura diseñada\u003c/td>\n\u003ctd>FE, lpGBT, óptica y EMP; payload y control IC van por caminos separados\u003c/td>\n\u003ctd>Que toda esa ruta esté montada.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Código implementado\u003c/td>\n\u003ctd>Core uplink, CDC, registros IC, debughub, accesos UIO y CLI de lectura\u003c/td>\n\u003ctd>Que esas fuentes se compilaran juntas o estén en el bitstream cargado.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pruebas anteriores\u003c/td>\n\u003ctd>Loopback interno con patrones recuperados; pruebas de cable y FE con resultados que no cuadran\u003c/td>\n\u003ctd>Que se haya adquirido el FE completo y sin pérdidas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hardware actual\u003c/td>\n\u003ctd>DESCONOCIDO; falta el inventario y la prueba en la placa\u003c/td>\n\u003ctd>Nada sobre firmware, lock, fuente o funcionamiento actual.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"Hardware y camino diseñado","anchor":"hardware-y-camino-diseñado","text":"## Hardware y camino diseñado\n\nLa idea: el lpGBT junta las señales eléctricas del FE en un enlace óptico. El EMP recupera esos bits, rehace el protocolo y entrega buses internos a la lógica. Para que Linux pueda leer ese bus hace falta un periférico más, el capturador. El controlador IC no hace ese trabajo.\n\n```mermaid\nflowchart TD\n  FE[\"Front-end y e-link físico\"] -. \"configuración/pinout pendientes\" .-> CHIP[\"lpGBT: entrada y Serializer\"]\n  CHIP -. \"uplink óptico previsto\" .-> MGT[\"MGT del EMP\"]\n  MGT --> CORE[\"Core uplink y CDC\"]\n  CORE --> USER[\"UserData: bus de 230 bits\"]\n  USER -. \"capturador no recuperado\" .-> CAP[\"tgc_readUplink_regs\"]\n  CAP -. \"mapa implementado pendiente\" .-> PS[\"AXI / UIO / TgcReadUplink\"]\n```\n\nLas flechas continuas son conexiones que aparecen en el RTL, no mediciones. Las discontinuas son tramos sin confirmar en la build de lectura. El tramo físico sale del diseño y de las notas; el cableado actual no se revisó. F5/F7.\n\n**Modelo de FPGA.** El BD `emp_fw_TE0807.bd` declara `xczu4eg-fbvb900-1-e`, Vivado 2023.2 y el PS `zynq_ultra_ps_e_0`. Eso no apunta a una Zynq-7000 TE0715. «Trenz» abarca varias plataformas, así que confirma la placa. Faltan los modelos del FE y del EMCI y el pinout del cable. [BD, `design.design_info`, F7]\n\n**Velocidades.** Según las notas, el downlink óptico va a 2.56 Gb/s con 64 bits por frame, y el uplink a 10.24 Gb/s. `lpgbtFpga_10g24` selecciona `DATARATE_10G24` y `emp_lpgbt.vhd` fija FEC5. Eso es lo que dice el código de esa variante, no la configuración del chip ni las tasas de los e-links de hoy. Las etiquetas 320/640/1280 de las pruebas son de los e-links, no de la óptica. F5/F7.\n\n","html":"\u003ch2 id=\"hardware-y-camino-diseñado\">Hardware y camino diseñado\u003c/h2>\n\u003cp>La idea: el lpGBT junta las señales eléctricas del FE en un enlace óptico. El EMP recupera esos bits, rehace el protocolo y entrega buses internos a la lógica. Para que Linux pueda leer ese bus hace falta un periférico más, el capturador. El controlador IC no hace ese trabajo.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TD\n  FE[\"Front-end y e-link físico\"] -. \"configuración/pinout pendientes\" .-&gt; CHIP[\"lpGBT: entrada y Serializer\"]\n  CHIP -. \"uplink óptico previsto\" .-&gt; MGT[\"MGT del EMP\"]\n  MGT --&gt; CORE[\"Core uplink y CDC\"]\n  CORE --&gt; USER[\"UserData: bus de 230 bits\"]\n  USER -. \"capturador no recuperado\" .-&gt; CAP[\"tgc_readUplink_regs\"]\n  CAP -. \"mapa implementado pendiente\" .-&gt; PS[\"AXI / UIO / TgcReadUplink\"]\u003c/pre>\u003cp>Las flechas continuas son conexiones que aparecen en el RTL, no mediciones. Las discontinuas son tramos sin confirmar en la build de lectura. El tramo físico sale del diseño y de las notas; el cableado actual no se revisó. F5/F7.\u003c/p>\n\u003cp>\u003cstrong>Modelo de FPGA.\u003c/strong> El BD \u003ccode>emp_fw_TE0807.bd\u003c/code> declara \u003ccode>xczu4eg-fbvb900-1-e\u003c/code>, Vivado 2023.2 y el PS \u003ccode>zynq_ultra_ps_e_0\u003c/code>. Eso no apunta a una Zynq-7000 TE0715. «Trenz» abarca varias plataformas, así que confirma la placa. Faltan los modelos del FE y del EMCI y el pinout del cable. [BD, \u003ccode>design.design_info\u003c/code>, F7]\u003c/p>\n\u003cp>\u003cstrong>Velocidades.\u003c/strong> Según las notas, el downlink óptico va a 2.56 Gb/s con 64 bits por frame, y el uplink a 10.24 Gb/s. \u003ccode>lpgbtFpga_10g24\u003c/code> selecciona \u003ccode>DATARATE_10G24\u003c/code> y \u003ccode>emp_lpgbt.vhd\u003c/code> fija FEC5. Eso es lo que dice el código de esa variante, no la configuración del chip ni las tasas de los e-links de hoy. Las etiquetas 320/640/1280 de las pruebas son de los e-links, no de la óptica. F5/F7.\u003c/p>\n"},{"title":"Un dato, desde FE hasta C++","anchor":"un-dato-desde-fe-hasta-c","text":"## Un dato, desde FE hasta C++\n\n| Tramo | Señales u operación | Reloj o almacenamiento | Fuente y límite |\n|---|---|---|---|\n| FE → lpGBT | Pares diferenciales de datos con el FE y reloj hacia el FE | Tasa, fase y habilitación del e-link por confirmar | Diseño descrito en `1013`. No se recuperaron el pinout ni el firmware del FE. DESCONOCIDO hoy. |\n| lpGBT → óptica | Serializer en modo normal, con fuentes externas habilitadas | Uplink según el modo del chip | Las notas también usan el Serializer en loopback. No sabemos qué está seleccionado. |\n| MGT → wrapper | `CH10_MGT_USRWORD_o` → `emp_lpgbt_10/MGT_USRWORD_i`; `CH10_MGT_RXUSRCLK_o` → `MGT_RXUSRCLK_i` | Palabras de 32 bits en el dominio RX del MGT | Nets del BD. El canal 10 es solo el ejemplo que se siguió. |\n| Wrapper → core | `uplink_mgtword_s` → `lpgbtFpga_top_inst/uplink_mgtword_i` | Dominio `lpgbtfpga_mgtrxclk_s` | `emp_lpgbt.vhd:421–427,573–610`. |\n| Alineación | `mgt_word_i(1 downto 0)` al frame aligner, patrón `01`; `mgt_bitslipCtrl_o` vuelve al MGT | Mismo reloj RX, strobes en los bordes de frame | `lpgbtfpga_uplink.vhd:263–298`. Mira dos bits de cabecera, no «un bit de validación» como dice la nota `0916`. |\n| Reagrupación | `mgt_word_i` → rxGearbox → frame de 256 bits | Entrada y salida del gearbox con `uplinkClk_i`; salida válida por enable | `lpgbtfpga_uplink.vhd:300–325`. Aquí el gearbox no cambia el reloj a 40 MHz. |\n| Recuperar el protocolo | `frame_pipelined_s` → deinterleaver → decoder FEC → descrambler | Core con enable de frame | `lpgbtfpga_uplink.vhd:404–470`. Reordena, corrige y desaleatoriza. El protocolo del FE se decodifica en otro sitio. |\n| Campos | FEC5/10G24: usuario `[229:0]`, EC `[231:230]`, IC `[233:232]` | `uplinkData320`, 234 bits con EC e IC | `lpgbtfpga_uplink.vhd:492–524`; `lpgbtfpga_10g24.vhd:232–250`. Que el bus tenga 230 bits no significa que haya 230 bits del FE conectados. |\n| Cruce de reloj | `lpgbtfpga_uplinkData_320` → `cdc_rx` → `lpgbtfpga_uplinkData_40` | RX MGT → `logicclk40`, razón 8, registros de fase y captura | `emp_lpgbt.vhd:473–498`; `cdc_rx.vhd:130–218`. No guarda una cola de eventos para Linux. |\n| Salida de usuario | `lpgbtfpga_uplinkUserData_s` → `lpgbtfpga_uplinkUserData_o` | Bus de 230 bits a 40 MHz en esta variante | `emp_lpgbt.vhd:430–437,495–498`. |\n| Captura AXI | UserData → `data_group_0..8`, header y threshold | Falta el RTL: packing, trigger, retención, CDC a AXI y atomicidad, todo desconocido | Hay JSON y getters, pero el BD recuperado no incluye este lector. Este tramo no se puede completar. |\n| Registro → variable | `readDataGroup0Value()` → `uio_read32(map0,4,&value)` | La CPU lee una palabra por MMIO | Backup `TgcReadUplink.cpp:65–79`; `libuio/mem.c:209–221`. |\n| Variable → terminal | `val` → `print_hex32()` → `std::cout` | Una lectura por getter, en orden | Backup CLI `:11–15,41–49`. Sin hora de adquisición ni contador de frame. |\n\nHay sitios donde se puede perder información. El FE puede mandar eventos que un muestreo de registros no ve; el capturador puede pisar datos antes de que Linux los lea; y registros leídos en momentos distintos pueden mezclarse. Son riesgos por resolver, no fallos medidos. Además, en el core recuperado la salida se fuerza a cero mientras `rdy_1_s='0'`, así que un cero no distingue entre «no hay transporte» y «el payload vale cero».\n\n","html":"\u003ch2 id=\"un-dato-desde-fe-hasta-c\">Un dato, desde FE hasta C++\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tramo\u003c/th>\n\u003cth>Señales u operación\u003c/th>\n\u003cth>Reloj o almacenamiento\u003c/th>\n\u003cth>Fuente y límite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>FE → lpGBT\u003c/td>\n\u003ctd>Pares diferenciales de datos con el FE y reloj hacia el FE\u003c/td>\n\u003ctd>Tasa, fase y habilitación del e-link por confirmar\u003c/td>\n\u003ctd>Diseño descrito en \u003ccode>1013\u003c/code>. No se recuperaron el pinout ni el firmware del FE. DESCONOCIDO hoy.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lpGBT → óptica\u003c/td>\n\u003ctd>Serializer en modo normal, con fuentes externas habilitadas\u003c/td>\n\u003ctd>Uplink según el modo del chip\u003c/td>\n\u003ctd>Las notas también usan el Serializer en loopback. No sabemos qué está seleccionado.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MGT → wrapper\u003c/td>\n\u003ctd>\u003ccode>CH10_MGT_USRWORD_o\u003c/code> → \u003ccode>emp_lpgbt_10/MGT_USRWORD_i\u003c/code>; \u003ccode>CH10_MGT_RXUSRCLK_o\u003c/code> → \u003ccode>MGT_RXUSRCLK_i\u003c/code>\u003c/td>\n\u003ctd>Palabras de 32 bits en el dominio RX del MGT\u003c/td>\n\u003ctd>Nets del BD. El canal 10 es solo el ejemplo que se siguió.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Wrapper → core\u003c/td>\n\u003ctd>\u003ccode>uplink_mgtword_s\u003c/code> → \u003ccode>lpgbtFpga_top_inst/uplink_mgtword_i\u003c/code>\u003c/td>\n\u003ctd>Dominio \u003ccode>lpgbtfpga_mgtrxclk_s\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>emp_lpgbt.vhd:421–427,573–610\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Alineación\u003c/td>\n\u003ctd>\u003ccode>mgt_word_i(1 downto 0)\u003c/code> al frame aligner, patrón \u003ccode>01\u003c/code>; \u003ccode>mgt_bitslipCtrl_o\u003c/code> vuelve al MGT\u003c/td>\n\u003ctd>Mismo reloj RX, strobes en los bordes de frame\u003c/td>\n\u003ctd>\u003ccode>lpgbtfpga_uplink.vhd:263–298\u003c/code>. Mira dos bits de cabecera, no «un bit de validación» como dice la nota \u003ccode>0916\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reagrupación\u003c/td>\n\u003ctd>\u003ccode>mgt_word_i\u003c/code> → rxGearbox → frame de 256 bits\u003c/td>\n\u003ctd>Entrada y salida del gearbox con \u003ccode>uplinkClk_i\u003c/code>; salida válida por enable\u003c/td>\n\u003ctd>\u003ccode>lpgbtfpga_uplink.vhd:300–325\u003c/code>. Aquí el gearbox no cambia el reloj a 40 MHz.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recuperar el protocolo\u003c/td>\n\u003ctd>\u003ccode>frame_pipelined_s\u003c/code> → deinterleaver → decoder FEC → descrambler\u003c/td>\n\u003ctd>Core con enable de frame\u003c/td>\n\u003ctd>\u003ccode>lpgbtfpga_uplink.vhd:404–470\u003c/code>. Reordena, corrige y desaleatoriza. El protocolo del FE se decodifica en otro sitio.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Campos\u003c/td>\n\u003ctd>FEC5/10G24: usuario \u003ccode>[229:0]\u003c/code>, EC \u003ccode>[231:230]\u003c/code>, IC \u003ccode>[233:232]\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>uplinkData320\u003c/code>, 234 bits con EC e IC\u003c/td>\n\u003ctd>\u003ccode>lpgbtfpga_uplink.vhd:492–524\u003c/code>; \u003ccode>lpgbtfpga_10g24.vhd:232–250\u003c/code>. Que el bus tenga 230 bits no significa que haya 230 bits del FE conectados.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cruce de reloj\u003c/td>\n\u003ctd>\u003ccode>lpgbtfpga_uplinkData_320\u003c/code> → \u003ccode>cdc_rx\u003c/code> → \u003ccode>lpgbtfpga_uplinkData_40\u003c/code>\u003c/td>\n\u003ctd>RX MGT → \u003ccode>logicclk40\u003c/code>, razón 8, registros de fase y captura\u003c/td>\n\u003ctd>\u003ccode>emp_lpgbt.vhd:473–498\u003c/code>; \u003ccode>cdc_rx.vhd:130–218\u003c/code>. No guarda una cola de eventos para Linux.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Salida de usuario\u003c/td>\n\u003ctd>\u003ccode>lpgbtfpga_uplinkUserData_s\u003c/code> → \u003ccode>lpgbtfpga_uplinkUserData_o\u003c/code>\u003c/td>\n\u003ctd>Bus de 230 bits a 40 MHz en esta variante\u003c/td>\n\u003ctd>\u003ccode>emp_lpgbt.vhd:430–437,495–498\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Captura AXI\u003c/td>\n\u003ctd>UserData → \u003ccode>data_group_0..8\u003c/code>, header y threshold\u003c/td>\n\u003ctd>Falta el RTL: packing, trigger, retención, CDC a AXI y atomicidad, todo desconocido\u003c/td>\n\u003ctd>Hay JSON y getters, pero el BD recuperado no incluye este lector. Este tramo no se puede completar.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Registro → variable\u003c/td>\n\u003ctd>\u003ccode>readDataGroup0Value()\u003c/code> → \u003ccode>uio_read32(map0,4,&amp;value)\u003c/code>\u003c/td>\n\u003ctd>La CPU lee una palabra por MMIO\u003c/td>\n\u003ctd>Backup \u003ccode>TgcReadUplink.cpp:65–79\u003c/code>; \u003ccode>libuio/mem.c:209–221\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Variable → terminal\u003c/td>\n\u003ctd>\u003ccode>val\u003c/code> → \u003ccode>print_hex32()\u003c/code> → \u003ccode>std::cout\u003c/code>\u003c/td>\n\u003ctd>Una lectura por getter, en orden\u003c/td>\n\u003ctd>Backup CLI \u003ccode>:11–15,41–49\u003c/code>. Sin hora de adquisición ni contador de frame.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Hay sitios donde se puede perder información. El FE puede mandar eventos que un muestreo de registros no ve; el capturador puede pisar datos antes de que Linux los lea; y registros leídos en momentos distintos pueden mezclarse. Son riesgos por resolver, no fallos medidos. Además, en el core recuperado la salida se fuerza a cero mientras \u003ccode>rdy_1_s=&#39;0&#39;\u003c/code>, así que un cero no distingue entre «no hay transporte» y «el payload vale cero».\u003c/p>\n"},{"title":"Qué ofrece la FPGA antes del lector experimental","anchor":"qué-ofrece-la-fpga-antes-del-lector-experimental","text":"## Qué ofrece la FPGA antes del lector experimental\n\nEl BD consultado tiene `emp_lpgbt_0..11` y un debughub. El software del monitor y el RTL del debughub llegan hasta el canal 12. Por esa diferencia no se puede dar por hecho que haya trece canales en ese BD.\n\n| Dirección en el BD recuperado | Instancia | Rango | Comparación con las notas |\n|---|---|---|---|\n| `0xA0000000 + N*0x10000`, N=0..11 | `emp_lpgbt_N` | 16 KiB | Control IC; N=10 está en `0xA00A0000`. |\n| `0xA00C0000` | `axi_intc_0` | 64 KiB | No es un lector de payload. |\n| `0xA00D0000` | `axi_intc_1` | 64 KiB | En los scripts de otro diseño es el generador `Read_PRBS_regs`. Las versiones se contradicen. |\n| `0xA00E0000` | `axi_intc_2` | 64 KiB | En los scripts de otro diseño es el lector. Las versiones se contradicen. |\n| `0xA00F0000` | `axi_intc_3` | 64 KiB | En las notas de trece lectores sería la instancia 1. |\n| `0xB0000000` | `empfw_debughub_0` | 16 KiB | Desmiente la idea de que 0xB no sirve en esta plataforma. |\n\nFuente: `design.addressing./zynq_ultra_ps_e_0.address_spaces.Data.segments` del BD. Estas direcciones sirven para comparar archivos. No son instrucciones para leer el hardware actual.\n\nHay otra interfaz, `eLink_Interface_v1/src/eLink_Interface.vhd`, con `user_data_in(229:0)`, `user_data_out(31:0)`, FIFO TX y RX y su propio mapa. Captura los 224 bits bajos y la FIFO RX tiene `rd_en => '1'`. No es `TgcReadUplink`, no está en este BD y no prueba que el lector de nueve palabras esté montado. La escritura en RX depende de `dlFIFO_full_s`, cosa que habría que revisar, aunque no hay pruebas de que explique los fallos antiguos. Queda como pista, sin tocar código.\n\n","html":"\u003ch2 id=\"qué-ofrece-la-fpga-antes-del-lector-experimental\">Qué ofrece la FPGA antes del lector experimental\u003c/h2>\n\u003cp>El BD consultado tiene \u003ccode>emp_lpgbt_0..11\u003c/code> y un debughub. El software del monitor y el RTL del debughub llegan hasta el canal 12. Por esa diferencia no se puede dar por hecho que haya trece canales en ese BD.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Dirección en el BD recuperado\u003c/th>\n\u003cth>Instancia\u003c/th>\n\u003cth>Rango\u003c/th>\n\u003cth>Comparación con las notas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>0xA0000000 + N*0x10000\u003c/code>, N=0..11\u003c/td>\n\u003ctd>\u003ccode>emp_lpgbt_N\u003c/code>\u003c/td>\n\u003ctd>16 KiB\u003c/td>\n\u003ctd>Control IC; N=10 está en \u003ccode>0xA00A0000\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0xA00C0000\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>axi_intc_0\u003c/code>\u003c/td>\n\u003ctd>64 KiB\u003c/td>\n\u003ctd>No es un lector de payload.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0xA00D0000\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>axi_intc_1\u003c/code>\u003c/td>\n\u003ctd>64 KiB\u003c/td>\n\u003ctd>En los scripts de otro diseño es el generador \u003ccode>Read_PRBS_regs\u003c/code>. Las versiones se contradicen.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0xA00E0000\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>axi_intc_2\u003c/code>\u003c/td>\n\u003ctd>64 KiB\u003c/td>\n\u003ctd>En los scripts de otro diseño es el lector. Las versiones se contradicen.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0xA00F0000\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>axi_intc_3\u003c/code>\u003c/td>\n\u003ctd>64 KiB\u003c/td>\n\u003ctd>En las notas de trece lectores sería la instancia 1.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0xB0000000\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>empfw_debughub_0\u003c/code>\u003c/td>\n\u003ctd>16 KiB\u003c/td>\n\u003ctd>Desmiente la idea de que 0xB no sirve en esta plataforma.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Fuente: \u003ccode>design.addressing./zynq_ultra_ps_e_0.address_spaces.Data.segments\u003c/code> del BD. Estas direcciones sirven para comparar archivos. No son instrucciones para leer el hardware actual.\u003c/p>\n\u003cp>Hay otra interfaz, \u003ccode>eLink_Interface_v1/src/eLink_Interface.vhd\u003c/code>, con \u003ccode>user_data_in(229:0)\u003c/code>, \u003ccode>user_data_out(31:0)\u003c/code>, FIFO TX y RX y su propio mapa. Captura los 224 bits bajos y la FIFO RX tiene \u003ccode>rd_en =&gt; &#39;1&#39;\u003c/code>. No es \u003ccode>TgcReadUplink\u003c/code>, no está en este BD y no prueba que el lector de nueve palabras esté montado. La escritura en RX depende de \u003ccode>dlFIFO_full_s\u003c/code>, cosa que habría que revisar, aunque no hay pruebas de que explique los fallos antiguos. Queda como pista, sin tocar código.\u003c/p>\n"},{"title":"Un comando de payload, desde `main()` hasta MMIO","anchor":"un-comando-de-payload-desde-main-hasta-mmio","text":"## Un comando de payload, desde `main()` hasta MMIO\n\nEjemplo: correr el `tgc_readuplink_cli` del respaldo, solo después del punto de control de P0.\n\n1. `main()` crea `TgcReadUplink(\"tgc_readUplink_regs\")`. El nombre está fijo en el código.\n2. El constructor llama a `uio_find_by_uio_name()`. `libuio` recorre `/sys/class/uio`, lee los nombres y devuelve la primera coincidencia. No elige por canal del FE.\n3. `uio_open()` llama a `uio_open_fix()`, que abre `/dev/uioN` con `O_RDWR` y mapea cada región con `PROT_READ|PROT_WRITE`, `MAP_SHARED` y offset `i*getpagesize()`.\n4. `readDataGroup0Value()` pide map0 con un offset de 4 bytes. La API no divide ese offset por cuatro.\n5. `uio_read32()` calcula `map + maps[0].offset + 4` y ejecuta `*val = *(volatile uint32_t *) ptr`. Esa es la línea de C que toca el hardware. La instrucción ARM concreta depende del binario; no se desensambló ningún ELF del sistema.\n6. `_isolateBitsForRead(value,32,0)` usa en esta copia una máscara de 64 bits y devuelve los 32 bits leídos.\n7. `print_hex32()` imprime `val` en hexadecimal. El destructor cierra y desmapea el UIO. En todo el recorrido no se espera ninguna IRQ.\n\nReferencias: F1/F2. `uio_read32` solo comprueba los punteros `info` y `val`; no valida índice, tamaño ni alineación. Que devuelva 0 no garantiza que el bus o el frame estén bien, y una excepción de hardware puede impedir que devuelva algo. El `mmap` no hace la transacción con el slave; la hace la lectura del puntero.\n\n","html":"\u003ch2 id=\"un-comando-de-payload-desde-main-hasta-mmio\">Un comando de payload, desde \u003ccode>main()\u003c/code> hasta MMIO\u003c/h2>\n\u003cp>Ejemplo: correr el \u003ccode>tgc_readuplink_cli\u003c/code> del respaldo, solo después del punto de control de P0.\u003c/p>\n\u003col>\n\u003cli>\u003ccode>main()\u003c/code> crea \u003ccode>TgcReadUplink(&quot;tgc_readUplink_regs&quot;)\u003c/code>. El nombre está fijo en el código.\u003c/li>\n\u003cli>El constructor llama a \u003ccode>uio_find_by_uio_name()\u003c/code>. \u003ccode>libuio\u003c/code> recorre \u003ccode>/sys/class/uio\u003c/code>, lee los nombres y devuelve la primera coincidencia. No elige por canal del FE.\u003c/li>\n\u003cli>\u003ccode>uio_open()\u003c/code> llama a \u003ccode>uio_open_fix()\u003c/code>, que abre \u003ccode>/dev/uioN\u003c/code> con \u003ccode>O_RDWR\u003c/code> y mapea cada región con \u003ccode>PROT_READ|PROT_WRITE\u003c/code>, \u003ccode>MAP_SHARED\u003c/code> y offset \u003ccode>i*getpagesize()\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>readDataGroup0Value()\u003c/code> pide map0 con un offset de 4 bytes. La API no divide ese offset por cuatro.\u003c/li>\n\u003cli>\u003ccode>uio_read32()\u003c/code> calcula \u003ccode>map + maps[0].offset + 4\u003c/code> y ejecuta \u003ccode>*val = *(volatile uint32_t *) ptr\u003c/code>. Esa es la línea de C que toca el hardware. La instrucción ARM concreta depende del binario; no se desensambló ningún ELF del sistema.\u003c/li>\n\u003cli>\u003ccode>_isolateBitsForRead(value,32,0)\u003c/code> usa en esta copia una máscara de 64 bits y devuelve los 32 bits leídos.\u003c/li>\n\u003cli>\u003ccode>print_hex32()\u003c/code> imprime \u003ccode>val\u003c/code> en hexadecimal. El destructor cierra y desmapea el UIO. En todo el recorrido no se espera ninguna IRQ.\u003c/li>\n\u003c/ol>\n\u003cp>Referencias: F1/F2. \u003ccode>uio_read32\u003c/code> solo comprueba los punteros \u003ccode>info\u003c/code> y \u003ccode>val\u003c/code>; no valida índice, tamaño ni alineación. Que devuelva 0 no garantiza que el bus o el frame estén bien, y una excepción de hardware puede impedir que devuelva algo. El \u003ccode>mmap\u003c/code> no hace la transacción con el slave; la hace la lectura del puntero.\u003c/p>\n"},{"title":"Un comando IC, por qué `-r` modifica el controlador","anchor":"un-comando-ic-por-qué--r-modifica-el-controlador","text":"## Un comando IC, por qué `-r` modifica el controlador\n\nSintaxis existente, que no forma parte del inventario: `lpGbtRegister -a lpgbt-uio://emp_lpgbt_N -r REG`.\n\n```mermaid\nflowchart TD\n  CLI[\"lpGbtRegister: main\"] --> FACT[\"RegisterClerkFactory\"]\n  FACT --> BACK[\"LpGbtUioBackend\"]\n  BACK --> SET[\"Dirección, control e IRQ AXI\"]\n  SET --> IC[\"ic_top: solicitud IC al chip\"]\n  IC --> FIFO[\"Respuesta IC: FIFO e interrupción\"]\n  FIFO --> OUT[\"readValues[6] y terminal\"]\n```\n\nEl parser acepta `-a/--address`, `-r/--read` y `-w/--write`. Por defecto usa `emp_lpgbt_9`, así que pasa siempre `-a`. La factory separa en `://`; con `HAVE_UIO` elige `LpGbtUioBackend`, y también hay un backend `lpgbt-simulator`. Lo que devuelva el simulador no dice nada del hardware.\n\nAl crear el backend se lee `magic`, se escribe la configuración inicial de dirección y se fija la dirección de chip `0x70` en el controlador. Para leer un registro, escribe su dirección, limpia y habilita la IRQ, manda `0x10004` al control, espera la IRQ 1 ms, vacía la FIFO con escrituras de avance y deshabilita la IRQ. Al final devuelve `readValues[6]` sin comprobar que haya siete elementos. Ojo: el índice empieza en cero, aunque el comentario diga «posición 7».\n\n| Offset en `emp_lpgbt_N` (copia software) | Papel en la transacción |\n|---|---|\n| `0x00` | `magic`; en el RTL recuperado vale `0x656D7049` y es la firma del controlador IC, no del lector de payload. |\n| `0x04` | `control`: arranca y avanza operaciones, y lleva el número de bytes según el protocolo. |\n| `0x08` | `status`, con los estados ready y FIFO. |\n| `0x0C` / `0x10` | `data_rx` / `data_tx` de IC; no son datos de eventos del FE. |\n| `0x14` / `0x18` | `register_addr` / `lpGBT_addr`. |\n| `0x1C` / `0x20` / `0x24` | `interrupt_enable` / `interrupt_flags` / `interrupt_clear`. |\n\nLos offsets salen de `AxiRegisterDefinitions.h:7–23`. El mismo offset en otro periférico puede hacer algo completamente distinto. La dirección de un registro dentro del chip, por ejemplo `ULDATASOURCE0` en V1, es otra capa de direcciones y no es un offset AXI.\n\n","html":"\u003ch2 id=\"un-comando-ic-por-qué--r-modifica-el-controlador\">Un comando IC, por qué \u003ccode>-r\u003c/code> modifica el controlador\u003c/h2>\n\u003cp>Sintaxis existente, que no forma parte del inventario: \u003ccode>lpGbtRegister -a lpgbt-uio://emp_lpgbt_N -r REG\u003c/code>.\u003c/p>\n\u003cpre class=\"mermaid\">flowchart TD\n  CLI[\"lpGbtRegister: main\"] --&gt; FACT[\"RegisterClerkFactory\"]\n  FACT --&gt; BACK[\"LpGbtUioBackend\"]\n  BACK --&gt; SET[\"Dirección, control e IRQ AXI\"]\n  SET --&gt; IC[\"ic_top: solicitud IC al chip\"]\n  IC --&gt; FIFO[\"Respuesta IC: FIFO e interrupción\"]\n  FIFO --&gt; OUT[\"readValues[6] y terminal\"]\u003c/pre>\u003cp>El parser acepta \u003ccode>-a/--address\u003c/code>, \u003ccode>-r/--read\u003c/code> y \u003ccode>-w/--write\u003c/code>. Por defecto usa \u003ccode>emp_lpgbt_9\u003c/code>, así que pasa siempre \u003ccode>-a\u003c/code>. La factory separa en \u003ccode>://\u003c/code>; con \u003ccode>HAVE_UIO\u003c/code> elige \u003ccode>LpGbtUioBackend\u003c/code>, y también hay un backend \u003ccode>lpgbt-simulator\u003c/code>. Lo que devuelva el simulador no dice nada del hardware.\u003c/p>\n\u003cp>Al crear el backend se lee \u003ccode>magic\u003c/code>, se escribe la configuración inicial de dirección y se fija la dirección de chip \u003ccode>0x70\u003c/code> en el controlador. Para leer un registro, escribe su dirección, limpia y habilita la IRQ, manda \u003ccode>0x10004\u003c/code> al control, espera la IRQ 1 ms, vacía la FIFO con escrituras de avance y deshabilita la IRQ. Al final devuelve \u003ccode>readValues[6]\u003c/code> sin comprobar que haya siete elementos. Ojo: el índice empieza en cero, aunque el comentario diga «posición 7».\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Offset en \u003ccode>emp_lpgbt_N\u003c/code> (copia software)\u003c/th>\n\u003cth>Papel en la transacción\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>0x00\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>magic\u003c/code>; en el RTL recuperado vale \u003ccode>0x656D7049\u003c/code> y es la firma del controlador IC, no del lector de payload.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0x04\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>control\u003c/code>: arranca y avanza operaciones, y lleva el número de bytes según el protocolo.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0x08\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>status\u003c/code>, con los estados ready y FIFO.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0x0C\u003c/code> / \u003ccode>0x10\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>data_rx\u003c/code> / \u003ccode>data_tx\u003c/code> de IC; no son datos de eventos del FE.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0x14\u003c/code> / \u003ccode>0x18\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>register_addr\u003c/code> / \u003ccode>lpGBT_addr\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0x1C\u003c/code> / \u003ccode>0x20\u003c/code> / \u003ccode>0x24\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>interrupt_enable\u003c/code> / \u003ccode>interrupt_flags\u003c/code> / \u003ccode>interrupt_clear\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Los offsets salen de \u003ccode>AxiRegisterDefinitions.h:7–23\u003c/code>. El mismo offset en otro periférico puede hacer algo completamente distinto. La dirección de un registro dentro del chip, por ejemplo \u003ccode>ULDATASOURCE0\u003c/code> en V1, es otra capa de direcciones y no es un offset AXI.\u003c/p>\n"},{"title":"AXI, Device Tree y UIO: intuición para depurar","anchor":"axi-device-tree-y-uio-intuición-para-depurar","text":"## AXI, Device Tree y UIO: intuición para depurar\n\nEl Device Tree es el catálogo que Linux recibe del hardware; no mide nada eléctrico. UIO convierte una entrada de ese catálogo en un nodo y un mmap. AXI lleva la transacción de la CPU al periférico en el PL. Para que la transacción termine, el slave tiene que existir, responder y tener bien el reloj y el reset.\n\nEn el BD, `M_AXI_HPM0_FPD` alimenta `axi_interconnect_0`, que incluye `emp_lpgbt_10/s_axi` por M10. `M_AXI_HPM1_FPD` alimenta `axi_interconnect_1` y el debughub. Eso confirma cómo accede el PS al PL en esa exportación, no que hoy se pueda acceder. En AXI4-Lite, dirección y datos de escritura, respuesta, dirección de lectura y respuesta de lectura son canales separados. Que una dirección figure en el Address Editor no garantiza que la lectura complete el handshake.\n\nCambiar `compatible` a `generic-uio`, como cuenta `1001`, cambia el binding de Linux. No arregla un diseño que no responde. Para depurar, recorre DT ↔ build ↔ Address Editor ↔ slave, reloj y reset antes de probar direcciones con `/dev/mem`.\n\n","html":"\u003ch2 id=\"axi-device-tree-y-uio-intuición-para-depurar\">AXI, Device Tree y UIO: intuición para depurar\u003c/h2>\n\u003cp>El Device Tree es el catálogo que Linux recibe del hardware; no mide nada eléctrico. UIO convierte una entrada de ese catálogo en un nodo y un mmap. AXI lleva la transacción de la CPU al periférico en el PL. Para que la transacción termine, el slave tiene que existir, responder y tener bien el reloj y el reset.\u003c/p>\n\u003cp>En el BD, \u003ccode>M_AXI_HPM0_FPD\u003c/code> alimenta \u003ccode>axi_interconnect_0\u003c/code>, que incluye \u003ccode>emp_lpgbt_10/s_axi\u003c/code> por M10. \u003ccode>M_AXI_HPM1_FPD\u003c/code> alimenta \u003ccode>axi_interconnect_1\u003c/code> y el debughub. Eso confirma cómo accede el PS al PL en esa exportación, no que hoy se pueda acceder. En AXI4-Lite, dirección y datos de escritura, respuesta, dirección de lectura y respuesta de lectura son canales separados. Que una dirección figure en el Address Editor no garantiza que la lectura complete el handshake.\u003c/p>\n\u003cp>Cambiar \u003ccode>compatible\u003c/code> a \u003ccode>generic-uio\u003c/code>, como cuenta \u003ccode>1001\u003c/code>, cambia el binding de Linux. No arregla un diseño que no responde. Para depurar, recorre DT ↔ build ↔ Address Editor ↔ slave, reloj y reset antes de probar direcciones con \u003ccode>/dev/mem\u003c/code>.\u003c/p>\n"},{"title":"Dónde faltan piezas","anchor":"dónde-faltan-piezas","text":"## Dónde faltan piezas\n\nCon el código se llega hasta `lpgbtfpga_uplinkUserData_o`, y desde `data_group_N` hasta una variable C++. Esas dos mitades no se han podido unir: falta el RTL del capturador y cómo se integraba en la build antigua o en la cargada. Hasta tenerlo, no se puede saber el empaquetado de los grupos, qué significa el header, en qué unidad va `clk_thresh`, cuándo se actualiza, cómo cruza a AXI ni si es atómico.\n\nLos `.md` de `20_Documents` sobre Interaction, Elink y TDR son fichas `to_read` vacías con enlaces a PDFs que no se leyeron, así que no se les atribuye ninguna conclusión. La electrónica analógica y el protocolo de eventos del FE siguen sin reconstruir.\n","html":"\u003ch2 id=\"dónde-faltan-piezas\">Dónde faltan piezas\u003c/h2>\n\u003cp>Con el código se llega hasta \u003ccode>lpgbtfpga_uplinkUserData_o\u003c/code>, y desde \u003ccode>data_group_N\u003c/code> hasta una variable C++. Esas dos mitades no se han podido unir: falta el RTL del capturador y cómo se integraba en la build antigua o en la cargada. Hasta tenerlo, no se puede saber el empaquetado de los grupos, qué significa el header, en qué unidad va \u003ccode>clk_thresh\u003c/code>, cuándo se actualiza, cómo cruza a AXI ni si es atómico.\u003c/p>\n\u003cp>Los \u003ccode>.md\u003c/code> de \u003ccode>20_Documents\u003c/code> sobre Interaction, Elink y TDR son fichas \u003ccode>to_read\u003c/code> vacías con enlaces a PDFs que no se leyeron, así que no se les atribuye ninguna conclusión. La electrónica analógica y el protocolo de eventos del FE siguen sin reconstruir.\u003c/p>\n"}]},{"id":"02_CATALOGO","file":"02_CATALOGO.md","title":"Catálogo de las herramientas que ya existen","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Catálogo de las herramientas que ya existen\n\nPara leer y capturar con el montaje de noviembre, usa [emp y raw.sh](15_OPERAR_EMP.md). Para las herramientas anteriores, lee primero [las condiciones y comandos de la guía de campo](00_GUIA_CAMPO.md). Este catálogo describe el código; no dice qué está instalado hoy. Las rutas son las del entorno antiguo, y el ZIP curado no trae ningún ELF.\n\n","html":"\u003ch1 id=\"catálogo-de-las-herramientas-que-ya-existen\">Catálogo de las herramientas que ya existen\u003c/h1>\n\u003cp>Para leer y capturar con el montaje de noviembre, usa \u003ca href=\"15_OPERAR_EMP.md\">emp y raw.sh\u003c/a>. Para las herramientas anteriores, lee primero \u003ca href=\"00_GUIA_CAMPO.md\">las condiciones y comandos de la guía de campo\u003c/a>. Este catálogo describe el código; no dice qué está instalado hoy. Las rutas son las del entorno antiguo, y el ZIP curado no trae ningún ELF.\u003c/p>\n"},{"title":"Elegir por tarea","anchor":"elegir-por-tarea","text":"## Elegir por tarea\n\n| Necesitas | Herramienta | Comprueba antes |\n|---|---|---|\n| Identificar dispositivos | sysfs; si acaso `lsuio -v` | A1, sin `-a`; el `lsuio` recuperado libera mal la memoria. |\n| Ver qué firmware hay disponible | `loadFirmare.sh -l` | Lee antes la copia local y no le pases un nombre de firmware. |\n| Diagnosticar el transporte | `fwMonitor --id N` | Que exista `empfw_debughub` y su mapa. |\n| Ver los grupos de payload | [`emp read`](15_OPERAR_EMP.md#leer-en-la-trenz) o `tgc_readuplink_cli` | Nombre UIO y mapa confirmados. |\n| Leer otro UIO con offsets a mano | `readuio` | Cuál de las dos variantes es; ambas usan `NOMBRE OFFSET...`. |\n| Ver la configuración del chip | `lpGbtRegister` o una exportación de PiGBT | Es una operación IC activa; queda fuera del inventario. |\n| Generar patrones en la FPGA | `readprbs_cli`, scripts `devmem` | Son pruebas internas que escriben. No sirven para P0. |\n\n","html":"\u003ch2 id=\"elegir-por-tarea\">Elegir por tarea\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Necesitas\u003c/th>\n\u003cth>Herramienta\u003c/th>\n\u003cth>Comprueba antes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Identificar dispositivos\u003c/td>\n\u003ctd>sysfs; si acaso \u003ccode>lsuio -v\u003c/code>\u003c/td>\n\u003ctd>A1, sin \u003ccode>-a\u003c/code>; el \u003ccode>lsuio\u003c/code> recuperado libera mal la memoria.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ver qué firmware hay disponible\u003c/td>\n\u003ctd>\u003ccode>loadFirmare.sh -l\u003c/code>\u003c/td>\n\u003ctd>Lee antes la copia local y no le pases un nombre de firmware.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Diagnosticar el transporte\u003c/td>\n\u003ctd>\u003ccode>fwMonitor --id N\u003c/code>\u003c/td>\n\u003ctd>Que exista \u003ccode>empfw_debughub\u003c/code> y su mapa.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ver los grupos de payload\u003c/td>\n\u003ctd>\u003ca href=\"15_OPERAR_EMP.md#leer-en-la-trenz\">\u003ccode>emp read\u003c/code>\u003c/a> o \u003ccode>tgc_readuplink_cli\u003c/code>\u003c/td>\n\u003ctd>Nombre UIO y mapa confirmados.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Leer otro UIO con offsets a mano\u003c/td>\n\u003ctd>\u003ccode>readuio\u003c/code>\u003c/td>\n\u003ctd>Cuál de las dos variantes es; ambas usan \u003ccode>NOMBRE OFFSET...\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ver la configuración del chip\u003c/td>\n\u003ctd>\u003ccode>lpGbtRegister\u003c/code> o una exportación de PiGBT\u003c/td>\n\u003ctd>Es una operación IC activa; queda fuera del inventario.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Generar patrones en la FPGA\u003c/td>\n\u003ctd>\u003ccode>readprbs_cli\u003c/code>, scripts \u003ccode>devmem\u003c/code>\u003c/td>\n\u003ctd>Son pruebas internas que escriben. No sirven para P0.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"title":"`tgc_readuplink_cli` y `TgcReadUplink`","anchor":"tgc_readuplink_cli-y-tgcreaduplink","text":"## `tgc_readuplink_cli` y `TgcReadUplink`\n\nFuente: backup `read_all_lpgbt/{tgc_readuplink_cli.cpp,TgcReadUplink.cpp,TgcReadUplink.hpp}`. Otro script menciona `puzzled_getData/tgc_readuplink_cli`, pero nada indica que sean el mismo binario.\n\n- Parámetros: ninguno; `main()` ignora `argv`. `--help`, `--id` o `--by-name` no cambian nada y la lectura se hace igual.\n- Bibliotecas: `libuio` y el runtime de C++. Sin el ELF ni la receta de enlace no se sabe la lista exacta, y puede estar enlazado de distintas formas.\n- Dispositivo y mapa: nombre fijo `tgc_readUplink_regs`, map0, offsets 0, 4, …, 44. La clase también acepta un número de UIO, pero la CLI no lo usa.\n- Qué hace: abre y mapea en lectura y escritura; lee `magic`, los nueve grupos, header y threshold, e imprime el threshold dos veces. Este `main()` no escribe el threshold.\n- Salida: valores crudos, sin hora de captura, eventos, formato del FE ni validación del header.\n- Errores: no encuentra el nombre, `uio_open failed`, error de runtime o `SIGBUS`. Los últimos no siempre pasan por el `catch(std::exception)`.\n- Compatibilidad: los offsets coinciden con el JSON de nueve grupos, revisión 27, pero eso no comprueba ni el RTL ni el bitstream. La clase de `puzzledWizards/output_tgc_readuplink_1002` tiene un solo registro `data_groups` con setter: es otra versión.\n\nVale la pena reutilizarlo si el periférico coincide. Si solo cambia el nombre, mira primero el `readuio` instalado antes de compilar o adaptar nada.\n\n","html":"\u003ch2 id=\"tgc_readuplink_cli-y-tgcreaduplink\">\u003ccode>tgc_readuplink_cli\u003c/code> y \u003ccode>TgcReadUplink\u003c/code>\u003c/h2>\n\u003cp>Fuente: backup \u003ccode>read_all_lpgbt/{tgc_readuplink_cli.cpp,TgcReadUplink.cpp,TgcReadUplink.hpp}\u003c/code>. Otro script menciona \u003ccode>puzzled_getData/tgc_readuplink_cli\u003c/code>, pero nada indica que sean el mismo binario.\u003c/p>\n\u003cul>\n\u003cli>Parámetros: ninguno; \u003ccode>main()\u003c/code> ignora \u003ccode>argv\u003c/code>. \u003ccode>--help\u003c/code>, \u003ccode>--id\u003c/code> o \u003ccode>--by-name\u003c/code> no cambian nada y la lectura se hace igual.\u003c/li>\n\u003cli>Bibliotecas: \u003ccode>libuio\u003c/code> y el runtime de C++. Sin el ELF ni la receta de enlace no se sabe la lista exacta, y puede estar enlazado de distintas formas.\u003c/li>\n\u003cli>Dispositivo y mapa: nombre fijo \u003ccode>tgc_readUplink_regs\u003c/code>, map0, offsets 0, 4, …, 44. La clase también acepta un número de UIO, pero la CLI no lo usa.\u003c/li>\n\u003cli>Qué hace: abre y mapea en lectura y escritura; lee \u003ccode>magic\u003c/code>, los nueve grupos, header y threshold, e imprime el threshold dos veces. Este \u003ccode>main()\u003c/code> no escribe el threshold.\u003c/li>\n\u003cli>Salida: valores crudos, sin hora de captura, eventos, formato del FE ni validación del header.\u003c/li>\n\u003cli>Errores: no encuentra el nombre, \u003ccode>uio_open failed\u003c/code>, error de runtime o \u003ccode>SIGBUS\u003c/code>. Los últimos no siempre pasan por el \u003ccode>catch(std::exception)\u003c/code>.\u003c/li>\n\u003cli>Compatibilidad: los offsets coinciden con el JSON de nueve grupos, revisión 27, pero eso no comprueba ni el RTL ni el bitstream. La clase de \u003ccode>puzzledWizards/output_tgc_readuplink_1002\u003c/code> tiene un solo registro \u003ccode>data_groups\u003c/code> con setter: es otra versión.\u003c/li>\n\u003c/ul>\n\u003cp>Vale la pena reutilizarlo si el periférico coincide. Si solo cambia el nombre, mira primero el \u003ccode>readuio\u003c/code> instalado antes de compilar o adaptar nada.\u003c/p>\n"},{"title":"`readuio`: dos fuentes con la misma sintaxis","anchor":"readuio-dos-fuentes-con-la-misma-sintaxis","text":"## `readuio`: dos fuentes con la misma sintaxis\n\nFuentes backup: `test_uio/readuio.c:6–35` y `libuio/readuio.c:50–100`.\n\nLas dos aceptan `readuio NOMBRE_UIO OFFSET [OFFSET...]`, convierten los offsets con `strtoul(...,0)` y leen palabras de 32 bits en map0, usando `libuio`. La de `libuio` además usa macros e internacionalización del proyecto. La diferencia que importa: `test_uio` imprime en hexadecimal y `libuio` en decimal con `%d`, así que un valor con el bit alto puede salir negativo. Mira cuál es antes de comparar logs.\n\nEjemplo, con la variante y el nombre ya confirmados, para leer la firma y el grupo 0 de un lector con el mapa de F1:\n\n```bash\n: \"${READUIO:?Ruta absoluta de la variante identificada}\"\n: \"${UIO_PAYLOAD:?Nombre unico de un lector cuyo mapa fue validado}\"\n\"$READUIO\" \"$UIO_PAYLOAD\" 0x00 0x04\n```\n\nNo lo uses con un periférico de otro mapa. No comprueba offsets, rango ni alineación antes de llamar a `uio_read32`. Que salga bien no significa que la captura sea nueva, y no hace snapshots.\n\n`test_uio/uio_peek.c` tiene fijos `/dev/uio4`, longitud `0x4000` y offset 0, y no comprueba `open` ni `mmap`. `test_open.c` tiene fijo uio0. No sirven fuera de esa máquina.\n\n","html":"\u003ch2 id=\"readuio-dos-fuentes-con-la-misma-sintaxis\">\u003ccode>readuio\u003c/code>: dos fuentes con la misma sintaxis\u003c/h2>\n\u003cp>Fuentes backup: \u003ccode>test_uio/readuio.c:6–35\u003c/code> y \u003ccode>libuio/readuio.c:50–100\u003c/code>.\u003c/p>\n\u003cp>Las dos aceptan \u003ccode>readuio NOMBRE_UIO OFFSET [OFFSET...]\u003c/code>, convierten los offsets con \u003ccode>strtoul(...,0)\u003c/code> y leen palabras de 32 bits en map0, usando \u003ccode>libuio\u003c/code>. La de \u003ccode>libuio\u003c/code> además usa macros e internacionalización del proyecto. La diferencia que importa: \u003ccode>test_uio\u003c/code> imprime en hexadecimal y \u003ccode>libuio\u003c/code> en decimal con \u003ccode>%d\u003c/code>, así que un valor con el bit alto puede salir negativo. Mira cuál es antes de comparar logs.\u003c/p>\n\u003cp>Ejemplo, con la variante y el nombre ya confirmados, para leer la firma y el grupo 0 de un lector con el mapa de F1:\u003c/p>\n\u003cpre>\u003ccode>: \"${READUIO:?Ruta absoluta de la variante identificada}\"\n: \"${UIO_PAYLOAD:?Nombre unico de un lector cuyo mapa fue validado}\"\n\"$READUIO\" \"$UIO_PAYLOAD\" 0x00 0x04\u003c/code>\u003c/pre>\n\u003cp>No lo uses con un periférico de otro mapa. No comprueba offsets, rango ni alineación antes de llamar a \u003ccode>uio_read32\u003c/code>. Que salga bien no significa que la captura sea nueva, y no hace snapshots.\u003c/p>\n\u003cp>\u003ccode>test_uio/uio_peek.c\u003c/code> tiene fijos \u003ccode>/dev/uio4\u003c/code>, longitud \u003ccode>0x4000\u003c/code> y offset 0, y no comprueba \u003ccode>open\u003c/code> ni \u003ccode>mmap\u003c/code>. \u003ccode>test_open.c\u003c/code> tiene fijo uio0. No sirven fuera de esa máquina.\u003c/p>\n"},{"title":"`fwMonitor`: el ejecutable sale de `fwStatus.cpp`","anchor":"fwmonitor-el-ejecutable-sale-de-fwstatuscpp","text":"## `fwMonitor`: el ejecutable sale de `fwStatus.cpp`\n\nFuentes backup: `emp-tools/empTools/fwStatus/`, `src/fwMonitor/`, `src/axiBackend/`, `include/axiBackend/`.\n\n| Elemento | Qué hace |\n|---|---|\n| Parámetros | `-h/--help` y `--id N` (por defecto -1, que muestra la tabla 0..12). Usa `--id`: el alias corto está declarado con espacios. |\n| Construcción | `add_executable(fwMonitor fwStatus.cpp ...)`; sale en `bin_${BUILD_FOR}`. |\n| Dependencias | Boost, pthread, objetos LogIt/fwMonitorSw y `libuio` si hay `HAVE_UIO`. Las dependencias finales las dice el ELF. |\n| UIO | `empfw_debughub`, fijo en el constructor. Esta copia no permite elegir dirección. |\n| Lecturas | Tres registros de estado y siete getters. También lee campos de reloj que no muestra. |\n| Escrituras | Ninguna en este `main()`. El backend tiene métodos de reset, pero aquí no se llaman. |\n| Salida | Tabla con `RX locked`, `TX ready`, `TX aligned` y `XCVR Ready`. No devuelve payload. |\n| Errores | Sin UIO, fallo al abrir, runtime o SIGBUS. `initUio()` anota el error y sigue, y la limpieza puede fallar con un puntero nulo. Si aborta, no culpes al enlace. |\n\nXCVR es el AND de TXREADY y RXREADY, sin separarlos. La ayuda devuelve 1 antes de tocar el hardware. Un `--id` fuera de rango puede imprimir solo la cabecera, sin avisar de que el canal no existe.\n\n","html":"\u003ch2 id=\"fwmonitor-el-ejecutable-sale-de-fwstatuscpp\">\u003ccode>fwMonitor\u003c/code>: el ejecutable sale de \u003ccode>fwStatus.cpp\u003c/code>\u003c/h2>\n\u003cp>Fuentes backup: \u003ccode>emp-tools/empTools/fwStatus/\u003c/code>, \u003ccode>src/fwMonitor/\u003c/code>, \u003ccode>src/axiBackend/\u003c/code>, \u003ccode>include/axiBackend/\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Elemento\u003c/th>\n\u003cth>Qué hace\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Parámetros\u003c/td>\n\u003ctd>\u003ccode>-h/--help\u003c/code> y \u003ccode>--id N\u003c/code> (por defecto -1, que muestra la tabla 0..12). Usa \u003ccode>--id\u003c/code>: el alias corto está declarado con espacios.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Construcción\u003c/td>\n\u003ctd>\u003ccode>add_executable(fwMonitor fwStatus.cpp ...)\u003c/code>; sale en \u003ccode>bin_${BUILD_FOR}\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dependencias\u003c/td>\n\u003ctd>Boost, pthread, objetos LogIt/fwMonitorSw y \u003ccode>libuio\u003c/code> si hay \u003ccode>HAVE_UIO\u003c/code>. Las dependencias finales las dice el ELF.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>UIO\u003c/td>\n\u003ctd>\u003ccode>empfw_debughub\u003c/code>, fijo en el constructor. Esta copia no permite elegir dirección.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lecturas\u003c/td>\n\u003ctd>Tres registros de estado y siete getters. También lee campos de reloj que no muestra.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Escrituras\u003c/td>\n\u003ctd>Ninguna en este \u003ccode>main()\u003c/code>. El backend tiene métodos de reset, pero aquí no se llaman.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Salida\u003c/td>\n\u003ctd>Tabla con \u003ccode>RX locked\u003c/code>, \u003ccode>TX ready\u003c/code>, \u003ccode>TX aligned\u003c/code> y \u003ccode>XCVR Ready\u003c/code>. No devuelve payload.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Errores\u003c/td>\n\u003ctd>Sin UIO, fallo al abrir, runtime o SIGBUS. \u003ccode>initUio()\u003c/code> anota el error y sigue, y la limpieza puede fallar con un puntero nulo. Si aborta, no culpes al enlace.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>XCVR es el AND de TXREADY y RXREADY, sin separarlos. La ayuda devuelve 1 antes de tocar el hardware. Un \u003ccode>--id\u003c/code> fuera de rango puede imprimir solo la cabecera, sin avisar de que el canal no existe.\u003c/p>\n"},{"title":"`lsuio` y `libuio`","anchor":"lsuio-y-libuio","text":"## `lsuio` y `libuio`\n\nFuente backup: `libuio/lsuio.c`, `base.c`, `helper.c`, `mem.c`, `irq.c`, `CMakeLists.txt`.\n\n`lsuio -v` lista atributos y mapas; `-a/--access` además intenta `uio_open/uio_close`. Sin `-a` no hay lecturas MMIO, pero tiene un error: avanza `uio_list` mientras recorre y al final libera el puntero ya movido. La nota `0930` registra justo ese `free(): invalid pointer`. Fuente y nota encajan, aunque eso no prueba que aquel ELF saliera de esta copia.\n\nEn estas fuentes `libuio` usa GLib. El gitingest de `missinglinkelectronics-libuio` coincide en `base.c` y `mem.c`, salvo líneas vacías al final. El respaldo usa CMake y el gitingest Autotools, así que no supongas el mismo build ni un commit upstream concreto.\n\n`uio_read32()` lee memoria volatile sin comprobar límites. `uio_irqwait_timeout()` es para el control IC, no para la CLI de payload. Abrir el UIO no deja lista toda la cadena experimental.\n\n","html":"\u003ch2 id=\"lsuio-y-libuio\">\u003ccode>lsuio\u003c/code> y \u003ccode>libuio\u003c/code>\u003c/h2>\n\u003cp>Fuente backup: \u003ccode>libuio/lsuio.c\u003c/code>, \u003ccode>base.c\u003c/code>, \u003ccode>helper.c\u003c/code>, \u003ccode>mem.c\u003c/code>, \u003ccode>irq.c\u003c/code>, \u003ccode>CMakeLists.txt\u003c/code>.\u003c/p>\n\u003cp>\u003ccode>lsuio -v\u003c/code> lista atributos y mapas; \u003ccode>-a/--access\u003c/code> además intenta \u003ccode>uio_open/uio_close\u003c/code>. Sin \u003ccode>-a\u003c/code> no hay lecturas MMIO, pero tiene un error: avanza \u003ccode>uio_list\u003c/code> mientras recorre y al final libera el puntero ya movido. La nota \u003ccode>0930\u003c/code> registra justo ese \u003ccode>free(): invalid pointer\u003c/code>. Fuente y nota encajan, aunque eso no prueba que aquel ELF saliera de esta copia.\u003c/p>\n\u003cp>En estas fuentes \u003ccode>libuio\u003c/code> usa GLib. El gitingest de \u003ccode>missinglinkelectronics-libuio\u003c/code> coincide en \u003ccode>base.c\u003c/code> y \u003ccode>mem.c\u003c/code>, salvo líneas vacías al final. El respaldo usa CMake y el gitingest Autotools, así que no supongas el mismo build ni un commit upstream concreto.\u003c/p>\n\u003cp>\u003ccode>uio_read32()\u003c/code> lee memoria volatile sin comprobar límites. \u003ccode>uio_irqwait_timeout()\u003c/code> es para el control IC, no para la CLI de payload. Abrir el UIO no deja lista toda la cadena experimental.\u003c/p>\n"},{"title":"`loadFirmare.sh`","anchor":"loadfirmaresh","text":"## `loadFirmare.sh`\n\nSe llama `loadFirmare`, sin la segunda «w» de Firmware. Fuente backup: `epos/etools/loadFirmare.sh`; también hay `atlas_epos/etools/loadFirmare.sh` en GitHub.\n\n`-l` lista los `.dtbo` de `/lib/firmware` y `-h` imprime el uso. La ayuda anuncia `--list/--help`, pero el `getopts \":lh\"` las rechaza antes; se comprobó con un trozo aislado del parser, sin correr el cargador. La copia del backup añade la fecha con `stat`, `cut` y `sort`, con el comentario `251210`: se editó después de varias pruebas, pero eso no dice cuándo se desplegó. La copia de GitHub lista distinto; no las intercambies sin saber cuál es cuál.\n\nCon un archivo de firmware, comprueba extensión y lectura, crea y monta configfs si hace falta, quita el overlay `emp-firmware`, crea otro y escribe su `path`. Usa Bash y utilidades del sistema y necesita permisos. El mensaje final solo dice que se escribió `path` sin error; no prueba que funcione ni permite volver atrás. Si la carga falla después de quitar el overlay, el sistema se queda sin el anterior. Este modo queda fuera de P0.\n\n","html":"\u003ch2 id=\"loadfirmaresh\">\u003ccode>loadFirmare.sh\u003c/code>\u003c/h2>\n\u003cp>Se llama \u003ccode>loadFirmare\u003c/code>, sin la segunda «w» de Firmware. Fuente backup: \u003ccode>epos/etools/loadFirmare.sh\u003c/code>; también hay \u003ccode>atlas_epos/etools/loadFirmare.sh\u003c/code> en GitHub.\u003c/p>\n\u003cp>\u003ccode>-l\u003c/code> lista los \u003ccode>.dtbo\u003c/code> de \u003ccode>/lib/firmware\u003c/code> y \u003ccode>-h\u003c/code> imprime el uso. La ayuda anuncia \u003ccode>--list/--help\u003c/code>, pero el \u003ccode>getopts &quot;:lh&quot;\u003c/code> las rechaza antes; se comprobó con un trozo aislado del parser, sin correr el cargador. La copia del backup añade la fecha con \u003ccode>stat\u003c/code>, \u003ccode>cut\u003c/code> y \u003ccode>sort\u003c/code>, con el comentario \u003ccode>251210\u003c/code>: se editó después de varias pruebas, pero eso no dice cuándo se desplegó. La copia de GitHub lista distinto; no las intercambies sin saber cuál es cuál.\u003c/p>\n\u003cp>Con un archivo de firmware, comprueba extensión y lectura, crea y monta configfs si hace falta, quita el overlay \u003ccode>emp-firmware\u003c/code>, crea otro y escribe su \u003ccode>path\u003c/code>. Usa Bash y utilidades del sistema y necesita permisos. El mensaje final solo dice que se escribió \u003ccode>path\u003c/code> sin error; no prueba que funcione ni permite volver atrás. Si la carga falla después de quitar el overlay, el sistema se queda sin el anterior. Este modo queda fuera de P0.\u003c/p>\n"},{"title":"`lpGbtRegister`, `LpGbtSw` y `lpGbtConfiguration`","anchor":"lpgbtregister-lpgbtsw-y-lpgbtconfiguration","text":"## `lpGbtRegister`, `LpGbtSw` y `lpGbtConfiguration`\n\nFuentes backup: `LpGbtSw/Demonstrators/`, `LpGbtUioBackend/` e `include/`.\n\n| Programa | Opciones en la fuente | Qué devuelve | Qué cambia en el hardware |\n|---|---|---|---|\n| `lpGbtRegister` | `-a DIRECCION`, `-r REG`, `-w REG:VAL`, `-h` | Un byte de un registro del chip, o lo escribe | Incluso `-r` inicializa el controlador, mueve dirección, control e IRQ y vacía la FIFO. `-w` además escribe en el chip. |\n| `lpGbtConfiguration` | `-a DIRECCION`, `-r`, `-w ARCHIVO`, `-h`, `-v` | Lectura completa y exportación `.cnf`, o aplica una configuración | `-r` hace transacciones IC; `-w` programa muchos registros. Pasa siempre la acción: `isRead` no arranca en un modo seguro. |\n| `LpGbtSw` | Biblioteca de clases, no un comando | Backend UIO o simulador según la URI | Depende del método y del constructor. |\n\nCMake enlaza Boost, pthread, objetos de LpGbtSw y LogIt, y `libuio` con `HAVE_UIO`. `build.sh` borra `build` y configura V1 (`USE_LPGBT_V0=OFF`) y UIO. No lo corras para inspeccionar una instalación: borraría lo que haya en esa carpeta. Las fuentes curadas tampoco garantizan un proyecto que compile.\n\nEl gitingest `fbientrigo-lpgbtsw` trae además `Demonstrators/TrigoLpGbt/test.cpp`, registros, configuraciones y más dependencias. Que esté ahí no prueba que se instalara ni que leyera el FE. En las dos fuentes comparadas, `LpGbtUioBackend.cpp` y `lpGbtRegister.cpp` coinciden salvo líneas vacías al final. Ese gitingest no trae commit ni fecha.\n\nEl mapa V0 o V1 se elige al compilar. Las direcciones simbólicas V1 de `ULDATASOURCE*` y `EPRXPRBS*` no dicen qué bits habilitan el FE. No apliques una configuración V1 sin saber la revisión del chip.\n\n","html":"\u003ch2 id=\"lpgbtregister-lpgbtsw-y-lpgbtconfiguration\">\u003ccode>lpGbtRegister\u003c/code>, \u003ccode>LpGbtSw\u003c/code> y \u003ccode>lpGbtConfiguration\u003c/code>\u003c/h2>\n\u003cp>Fuentes backup: \u003ccode>LpGbtSw/Demonstrators/\u003c/code>, \u003ccode>LpGbtUioBackend/\u003c/code> e \u003ccode>include/\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Programa\u003c/th>\n\u003cth>Opciones en la fuente\u003c/th>\n\u003cth>Qué devuelve\u003c/th>\n\u003cth>Qué cambia en el hardware\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>lpGbtRegister\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-a DIRECCION\u003c/code>, \u003ccode>-r REG\u003c/code>, \u003ccode>-w REG:VAL\u003c/code>, \u003ccode>-h\u003c/code>\u003c/td>\n\u003ctd>Un byte de un registro del chip, o lo escribe\u003c/td>\n\u003ctd>Incluso \u003ccode>-r\u003c/code> inicializa el controlador, mueve dirección, control e IRQ y vacía la FIFO. \u003ccode>-w\u003c/code> además escribe en el chip.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>lpGbtConfiguration\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-a DIRECCION\u003c/code>, \u003ccode>-r\u003c/code>, \u003ccode>-w ARCHIVO\u003c/code>, \u003ccode>-h\u003c/code>, \u003ccode>-v\u003c/code>\u003c/td>\n\u003ctd>Lectura completa y exportación \u003ccode>.cnf\u003c/code>, o aplica una configuración\u003c/td>\n\u003ctd>\u003ccode>-r\u003c/code> hace transacciones IC; \u003ccode>-w\u003c/code> programa muchos registros. Pasa siempre la acción: \u003ccode>isRead\u003c/code> no arranca en un modo seguro.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>LpGbtSw\u003c/code>\u003c/td>\n\u003ctd>Biblioteca de clases, no un comando\u003c/td>\n\u003ctd>Backend UIO o simulador según la URI\u003c/td>\n\u003ctd>Depende del método y del constructor.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>CMake enlaza Boost, pthread, objetos de LpGbtSw y LogIt, y \u003ccode>libuio\u003c/code> con \u003ccode>HAVE_UIO\u003c/code>. \u003ccode>build.sh\u003c/code> borra \u003ccode>build\u003c/code> y configura V1 (\u003ccode>USE_LPGBT_V0=OFF\u003c/code>) y UIO. No lo corras para inspeccionar una instalación: borraría lo que haya en esa carpeta. Las fuentes curadas tampoco garantizan un proyecto que compile.\u003c/p>\n\u003cp>El gitingest \u003ccode>fbientrigo-lpgbtsw\u003c/code> trae además \u003ccode>Demonstrators/TrigoLpGbt/test.cpp\u003c/code>, registros, configuraciones y más dependencias. Que esté ahí no prueba que se instalara ni que leyera el FE. En las dos fuentes comparadas, \u003ccode>LpGbtUioBackend.cpp\u003c/code> y \u003ccode>lpGbtRegister.cpp\u003c/code> coinciden salvo líneas vacías al final. Ese gitingest no trae commit ni fecha.\u003c/p>\n\u003cp>El mapa V0 o V1 se elige al compilar. Las direcciones simbólicas V1 de \u003ccode>ULDATASOURCE*\u003c/code> y \u003ccode>EPRXPRBS*\u003c/code> no dicen qué bits habilitan el FE. No apliques una configuración V1 sin saber la revisión del chip.\u003c/p>\n"},{"title":"`readprbs_cli` y variantes PuzzledWizard","anchor":"readprbs_cli-y-variantes-puzzledwizard","text":"## `readprbs_cli` y variantes PuzzledWizard\n\nFuentes backup: `puzzled_working/{readprbs_cli.cpp,readprbs_cli_minimal.cpp,ReadPRBS.cpp,Read_PRBS.c,Makefile}`; `puzzled_writePRBS/{readprbs_cli.cpp,ReadPRBS.cpp,patch_bits.py}`.\n\nLa CLI completa tiene `--by-name`, `--by-num`, `--read-magic`, `--read-status`, `--read-data`, `--write-data`, `--write-control`, `--write-sequence`, `--selftest`, `--repeat`, `--sleep-ms`, `--json`, `--verbose` y ayuda. Su mapa es `magic +0`, `control +4`, `status +8`, `data_prbs +0xC`, distinto del de payload.\n\nEl Makefile genera bibliotecas C/C++ compartidas y estáticas, y enlaza la CLI con `libReadPRBS.a` y `libuio`. Por eso no necesita `libReadPRBS.so` al ejecutarse, aunque sí las demás dependencias de su ELF. Esto no se aplica a `TgcReadUplink` sin ver su build.\n\nIdentifica cada variante (minimal, writePRBS) antes de usar opciones. En las dos CLI completas revisadas, `--selftest` lee magic y status y cinco veces data, e imprime OK sin comparar nada. Las secuencias de escritura y los setters sí cambian el bloque. Pide la ayuda solo si sabes que el parser sale antes de abrir el dispositivo; eso no vale para todas las CLI.\n\n","html":"\u003ch2 id=\"readprbs_cli-y-variantes-puzzledwizard\">\u003ccode>readprbs_cli\u003c/code> y variantes PuzzledWizard\u003c/h2>\n\u003cp>Fuentes backup: \u003ccode>puzzled_working/{readprbs_cli.cpp,readprbs_cli_minimal.cpp,ReadPRBS.cpp,Read_PRBS.c,Makefile}\u003c/code>; \u003ccode>puzzled_writePRBS/{readprbs_cli.cpp,ReadPRBS.cpp,patch_bits.py}\u003c/code>.\u003c/p>\n\u003cp>La CLI completa tiene \u003ccode>--by-name\u003c/code>, \u003ccode>--by-num\u003c/code>, \u003ccode>--read-magic\u003c/code>, \u003ccode>--read-status\u003c/code>, \u003ccode>--read-data\u003c/code>, \u003ccode>--write-data\u003c/code>, \u003ccode>--write-control\u003c/code>, \u003ccode>--write-sequence\u003c/code>, \u003ccode>--selftest\u003c/code>, \u003ccode>--repeat\u003c/code>, \u003ccode>--sleep-ms\u003c/code>, \u003ccode>--json\u003c/code>, \u003ccode>--verbose\u003c/code> y ayuda. Su mapa es \u003ccode>magic +0\u003c/code>, \u003ccode>control +4\u003c/code>, \u003ccode>status +8\u003c/code>, \u003ccode>data_prbs +0xC\u003c/code>, distinto del de payload.\u003c/p>\n\u003cp>El Makefile genera bibliotecas C/C++ compartidas y estáticas, y enlaza la CLI con \u003ccode>libReadPRBS.a\u003c/code> y \u003ccode>libuio\u003c/code>. Por eso no necesita \u003ccode>libReadPRBS.so\u003c/code> al ejecutarse, aunque sí las demás dependencias de su ELF. Esto no se aplica a \u003ccode>TgcReadUplink\u003c/code> sin ver su build.\u003c/p>\n\u003cp>Identifica cada variante (minimal, writePRBS) antes de usar opciones. En las dos CLI completas revisadas, \u003ccode>--selftest\u003c/code> lee magic y status y cinco veces data, e imprime OK sin comparar nada. Las secuencias de escritura y los setters sí cambian el bloque. Pide la ayuda solo si sabes que el parser sale antes de abrir el dispositivo; eso no vale para todas las CLI.\u003c/p>\n"},{"title":"Scripts antiguos y qué valen sus resultados","anchor":"scripts-antiguos-y-qué-valen-sus-resultados","text":"## Scripts antiguos y qué valen sus resultados\n\n| Archivo | Qué hace | Problemas que se ven en el código |\n|---|---|---|\n| `sweep_clock.sh` | Escribe `0xA00E002C`, lee `0xA00E0004` y guarda un log | `READER` no se usa; `devmem` sin ancho; una salida vacía se guarda como cero; borra el log anterior. Un error y un cero quedan iguales. |\n| `test_saturation.sh VAL` | Escribe `0xA00D000C` y lee el offset 4 de trece bases | No mide saturación, throughput ni coherencia. Al menos registra si la lectura falló. |\n| `1024/send_and_read.sh VAL` | Escribe threshold `0xE` y un patrón, y lee una lista de offsets | Se salta `+0x18` e incluye `+0x28`, así que nueve líneas no son nueve grupos. El `[OK]` final no valida las lecturas. |\n| `watch_devmem.sh [INTERVAL]` | Repite la lectura de esa misma lista | `sleep` comentado, stderr oculto, sin fin y sin comprobar el firmware. |\n| `read_lpgbt10.sh` | Lee el byte bajo del lector 0 y espera a que cambie | El «10» del nombre no elige la instancia 10. Junta observaciones distintas sin framing. |\n\nEstos scripts muestran qué se intentaba, pero sus logs no prueban eventos del FE completos. Ninguno sustituye la prueba externa de P0.\n","html":"\u003ch2 id=\"scripts-antiguos-y-qué-valen-sus-resultados\">Scripts antiguos y qué valen sus resultados\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Archivo\u003c/th>\n\u003cth>Qué hace\u003c/th>\n\u003cth>Problemas que se ven en el código\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>sweep_clock.sh\u003c/code>\u003c/td>\n\u003ctd>Escribe \u003ccode>0xA00E002C\u003c/code>, lee \u003ccode>0xA00E0004\u003c/code> y guarda un log\u003c/td>\n\u003ctd>\u003ccode>READER\u003c/code> no se usa; \u003ccode>devmem\u003c/code> sin ancho; una salida vacía se guarda como cero; borra el log anterior. Un error y un cero quedan iguales.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>test_saturation.sh VAL\u003c/code>\u003c/td>\n\u003ctd>Escribe \u003ccode>0xA00D000C\u003c/code> y lee el offset 4 de trece bases\u003c/td>\n\u003ctd>No mide saturación, throughput ni coherencia. Al menos registra si la lectura falló.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1024/send_and_read.sh VAL\u003c/code>\u003c/td>\n\u003ctd>Escribe threshold \u003ccode>0xE\u003c/code> y un patrón, y lee una lista de offsets\u003c/td>\n\u003ctd>Se salta \u003ccode>+0x18\u003c/code> e incluye \u003ccode>+0x28\u003c/code>, así que nueve líneas no son nueve grupos. El \u003ccode>[OK]\u003c/code> final no valida las lecturas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>watch_devmem.sh [INTERVAL]\u003c/code>\u003c/td>\n\u003ctd>Repite la lectura de esa misma lista\u003c/td>\n\u003ctd>\u003ccode>sleep\u003c/code> comentado, stderr oculto, sin fin y sin comprobar el firmware.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>read_lpgbt10.sh\u003c/code>\u003c/td>\n\u003ctd>Lee el byte bajo del lector 0 y espera a que cambie\u003c/td>\n\u003ctd>El «10» del nombre no elige la instancia 10. Junta observaciones distintas sin framing.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Estos scripts muestran qué se intentaba, pero sus logs no prueban eventos del FE completos. Ninguno sustituye la prueba externa de P0.\u003c/p>\n"}]},{"id":"03_HISTORIA","file":"03_HISTORIA.md","title":"Historia reconstruida y contradicciones","sections":[{"title":"Antes de comenzar","anchor":"","text":"# Historia reconstruida y contradicciones\n\nAquí se separan tres fechas: la del ensayo, la de la nota y la del commit. Un nombre como `0916` o una carpeta de imágenes `2024` no basta para fechar un experimento, porque las notas se editan después sin cambiar de nombre.\n\n","html":"\u003ch1 id=\"historia-reconstruida-y-contradicciones\">Historia reconstruida y contradicciones\u003c/h1>\n\u003cp>Aquí se separan tres fechas: la del ensayo, la de la nota y la del commit. Un nombre como \u003ccode>0916\u003c/code> o una carpeta de imágenes \u003ccode>2024\u003c/code> no basta para fechar un experimento, porque las notas se editan después sin cambiar de nombre.\u003c/p>\n"},{"title":"Secuencia de trabajo recuperada","anchor":"secuencia-de-trabajo-recuperada","text":"## Secuencia de trabajo recuperada\n\n| Periodo o fuente | Qué se intentaba | Qué quedó registrado | Qué se puede concluir |\n|---|---|---|---|\n| Nota `0918-AXI Addressing` | Leer el bloque del lpGBT desde el PS | `devmem2` y un lector en C; logs de CPU stalls al acceder a `0xA0000000` | Hubo accesos que dejaron el sistema sin respuesta. Reloj, reset e interconexión siguen siendo hipótesis, y una captura de Vivado no prueba la respuesta actual. |\n| 2025-09-23, logs fechados en `0923` | Comparar el firmware de master con el tag v0.2 y sus herramientas | En master faltan los UIO del monitor y del IC. En v0.2 el controlador imprime magic `656d7049`; un canal devuelve 0 y otro espera la IRQ y falla | El firmware y la conexión cambian el resultado. La nota culpa a la conexión, sin un diagnóstico del payload FE. |\n| `0924-getting data out` | Inyectar el downlink con una constante y leer registros | Se añade una constante de downlink; bucles de `lpGbtRegister` sobre `0x00` y `0x12e` | Son pruebas de control y configuración del chip. UserData no se leyó. |\n| `0929-PRBS Signal para lpgbt` | Crear un generador y ver el orden de los grupos | Reempaquetado de IP, patrón `EEEEAAAA`, mención de un strobe y un bloque de código vacío | Se intentó, pero la nota no trae el generador completo. |\n| `0930-LibUIO Implementation` | Acceder al uplink con herramientas Linux | `lsuio -v` lista los dispositivos IC y termina con `free(): invalid pointer` | Falla el programa al enumerar. No dice nada del payload ni de que la placa esté rota. |\n| `1001-creando un uio` | Crear registros AirHDL y wrappers PuzzledWizard | Se cambia `compatible` a `generic-uio`; el periférico aparece pero da `Bus error`; luego se anotan escrituras de constantes | Que Linux vea el dispositivo no significa que AXI funcione. No hay una causa ni un arreglo que se pueda reusar a ciegas. |\n| `1002-Codigo de recepción` | Exponer el uplink como grupos AXI | AirHDL, `magic`, `data_group_x`; nota de que Vivado no aceptaba un array | Es el diseño del lector, sin el RTL de captura en esta revisión. |\n| `1006-Tenemos lectura` | Ver datos en los registros | Dice que usó loopback y que probó offsets | Una cadena de prueba que funcionó, sin recepción externa del FE. |\n| `1007-multipleLPGBT` | Multiplicar los lectores | Trece bases `0xA00E..0xA01A` cambiadas en el BD y el Address Editor | Es otra build. Son instancias, no grupos de un frame. |\n| `1010-elink`, `1013-GettingData elinks` | Conectar el FE y recibir por el uplink | Pruebas de pares y cables, objetivo Simplex Transmitter, un ejemplo enviado y recibido que no coincide | No hay pinout final aprobado ni configuración completa que se pueda repetir. |\n| `1021-Loopback real` | Mandar PRBS7 y hacer loopback | Nota muy corta, sin resultado de éxito | «Real» en el título no significa FE real. |\n| 2025-10-24, `1024-lpgbt outs official repo` y backup `1024` | Ver cómo se reparten los patrones | Dos patrones distintos dan casi la misma salida; los scripts escriben threshold y generador | Algo raro pasa con la sensibilidad o el mapeo. No se sabe dónde se pierde la diferencia. |\n| `1028-Pruebas de envio de constante` | Leer constantes con loopback interno y después físico | `AAAABBBB` aparece solo en ciertas ventanas de threshold; el cable físico da discrepancias; más tarde se anota un cable dañado o un pin a tierra | La recuperación interna funcionó en su momento. El cable dañado está anotado, pero no explica todos los fallos anteriores ni prueba que la reparación final funcionara. |\n| `1028-1031-Testing`, sección FE | Llevar una señal desde el FE con un cable modificado y el reloj del lpGBT | Ensayo de `0x03` con valores como `0xEE6EEEEE`, resultados variables y un capturador que a veces se queda detenido | Hubo ensayos con el FE. Faltan A/B/A, mapeo y actualización para decir que el dato llegó intacto. Tampoco se puede decir que nunca se probó el FE ni que quedó funcionando. |\n| Enero y febrero 2026, commits posteriores | Recordar direcciones y rehacer el setup | `Memory Directions`, notas nuevas de setup y mapas conceptuales reescritos | Son revisiones posteriores; hay que contrastarlas con el código, y no confirman lo que se concluyó antes. |\n\n","html":"\u003ch2 id=\"secuencia-de-trabajo-recuperada\">Secuencia de trabajo recuperada\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Periodo o fuente\u003c/th>\n\u003cth>Qué se intentaba\u003c/th>\n\u003cth>Qué quedó registrado\u003c/th>\n\u003cth>Qué se puede concluir\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Nota \u003ccode>0918-AXI Addressing\u003c/code>\u003c/td>\n\u003ctd>Leer el bloque del lpGBT desde el PS\u003c/td>\n\u003ctd>\u003ccode>devmem2\u003c/code> y un lector en C; logs de CPU stalls al acceder a \u003ccode>0xA0000000\u003c/code>\u003c/td>\n\u003ctd>Hubo accesos que dejaron el sistema sin respuesta. Reloj, reset e interconexión siguen siendo hipótesis, y una captura de Vivado no prueba la respuesta actual.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2025-09-23, logs fechados en \u003ccode>0923\u003c/code>\u003c/td>\n\u003ctd>Comparar el firmware de master con el tag v0.2 y sus herramientas\u003c/td>\n\u003ctd>En master faltan los UIO del monitor y del IC. En v0.2 el controlador imprime magic \u003ccode>656d7049\u003c/code>; un canal devuelve 0 y otro espera la IRQ y falla\u003c/td>\n\u003ctd>El firmware y la conexión cambian el resultado. La nota culpa a la conexión, sin un diagnóstico del payload FE.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0924-getting data out\u003c/code>\u003c/td>\n\u003ctd>Inyectar el downlink con una constante y leer registros\u003c/td>\n\u003ctd>Se añade una constante de downlink; bucles de \u003ccode>lpGbtRegister\u003c/code> sobre \u003ccode>0x00\u003c/code> y \u003ccode>0x12e\u003c/code>\u003c/td>\n\u003ctd>Son pruebas de control y config
